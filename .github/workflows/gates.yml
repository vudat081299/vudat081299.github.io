name: Cổng chất lượng

# Chạy cổng của MỌI project (tools/check.sh ở gốc và mọi */tools/check.sh), không chỉ project vừa sửa,
# rồi các bài chạy thật trong trình duyệt. deploy.yml chỉ chạy khi workflow này xanh.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Cổng
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Cài deps cho cashy
        working-directory: cashy
        run: pnpm install --frozen-lockfile
      - name: Mọi tools/check.sh
        run: |
          FAIL=0
          for c in tools/check.sh $(git ls-files '*/tools/check.sh'); do
            echo "::group::$c"
            sh "$c" || { echo "::error::$c không qua"; FAIL=1; }
            echo "::endgroup::"
          done
          exit $FAIL

  smoke:
    name: Chạy thật trong trình duyệt (shop/, trang chủ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cài Chromium
        run: |
          npm install --no-save playwright-core@1
          npx --yes playwright@1 install --with-deps chromium
      - name: Chạy smoke
        run: |
          python3 -m http.server 8347 >/dev/null 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8347/shop/ && break
            sleep 0.25
          done
          node shop/tools/smoke.js http://127.0.0.1:8347/shop/
          node tools/smoke-index.js http://127.0.0.1:8347/index.html
