name: Deploy site (build Cashy)

# Đưa cả site lên GitHub Pages, chỉ sau khi "Cổng chất lượng" xanh trên một lần push vào main.
# Trang tĩnh chép nguyên; cashy/ là app Vite nên được build rồi đặt ở /cashy/ (thư viện component ở /cashy-wb/).
# Các dòng --exclude có cổng giữ: tools/lint-collection.py (trang WITHHELD phải có, trang UNLISTED không được có)
# và shop/tools/lint-shop.py (shop/docs phải lên web). Đừng thêm hay bớt dòng nào mà không hỏi chủ trang.
# Cài một lần: Settings → Pages → Source = "GitHub Actions".

on:
  workflow_run:
    workflows: ["Cổng chất lượng"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Chỉ deploy khi cổng xanh cho một lần push lên main (không phải PR), hoặc khi bấm tay.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Đúng commit mà cổng vừa kiểm, không phải đầu main lúc workflow này bắt đầu.
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Chỉ deploy commit đang là đầu main
        run: |
          git fetch -q --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "::error::Commit này không còn là đầu main (có thể là chạy lại một lần cổng cũ) — không deploy."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cashy/pnpm-lock.yaml

      - name: Install Cashy deps
        working-directory: cashy
        run: pnpm install --frozen-lockfile

      - name: Build Cashy
        working-directory: cashy
        run: pnpm build

      - name: Build component gallery
        working-directory: cashy
        run: pnpm build:wb

      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude '_site' \
            --exclude 'cashy' \
            --exclude 'stuff' \
            --exclude '.DS_Store' \
            --exclude 'masters-degree/data-science-roadmap/LEARNING-LOG.md' \
            --exclude 'pages/family-insurance-benefits.html' \
            ./ _site/
          mkdir -p _site/cashy
          cp -r cashy/dist/. _site/cashy/
          # Component gallery → /cashy-wb/ ; rename its entry so the bare
          # directory URL resolves without /wb.html.
          mkdir -p _site/cashy-wb
          cp -r cashy/dist-wb/. _site/cashy-wb/
          mv _site/cashy-wb/wb.html _site/cashy-wb/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
