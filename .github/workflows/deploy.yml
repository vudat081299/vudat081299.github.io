name: Deploy site (build Cashy)

# Publishes the whole user-site to GitHub Pages. Static projects are copied
# as-is; Cashy is a Vite app, so it is built and its output is served at /cashy/.
# The web-builder component gallery is a second standalone Vite build, served at
# /cashy-wb/ (separate from the app).
#
# `stuff/` is the attic (dead templates + retired experiments) — kept in git,
# never published. `cashy/` is excluded from the rsync because it is built
# separately, which also keeps its dev docs (docs/, features/) off the web.
#
# `shop/docs` and `shop/*.md` WERE excluded here until 2026-09-21. They are no longer:
# the site owner wants to read that documentation on the web and considers it planning
# rather than secrets. The two `--exclude` lines are gone on purpose.
#
# `shop/tools/lint-shop.py` still guards this, but in the opposite direction now — it
# fails the build if either exclude comes BACK. Same shape as `UNLISTED` in
# `tools/lint-collection.py`: declaring that something must live at a direct URL means a
# later session cannot quietly re-hide it. Without that, an agent reading
# `docs/04-NEGOTIATION.md` would "helpfully" re-add the exclude and the owner's decision
# would vanish without a trace.
#
# He was told plainly what goes public before deciding: `docs/01-CONTEXT-AND-OPPORTUNITY.md`
# opens with "do not show this document to her", and `docs/04-NEGOTIATION.md` has a
# "signs you should walk away" section. Reversing this is his call, not a later session's.
#
# Two pages under `pages/` are excluded as well. They stay in the repo for the site
# owner to read; they just do not go on the web. Delisting them from the homepage was
# not enough on its own — rsync copies the whole tree, so the files kept resolving at
# their direct URLs. `tools/lint-collection.py` holds the list and fails the build if
# either `--exclude` disappears, and also blocks the pages from being put back on the
# homepage. Do not drop a line without asking the site owner.
#
# Careful with the opposite case: a page can be off the homepage and still belong on the
# web. Those are declared in `UNLISTED` in the same linter, and it fails the build if an
# `--exclude` shows up for one of them. So do not "tidy up" by excluding a page just
# because the homepage no longer links to it — check which of the two lists it is in.
#
# One-time setup: repo Settings → Pages → Build and deployment → Source =
# "GitHub Actions" (instead of "Deploy from a branch").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cashy/pnpm-lock.yaml

      - name: Install Cashy deps
        working-directory: cashy
        run: pnpm install --frozen-lockfile

      - name: Build Cashy
        working-directory: cashy
        run: pnpm build

      - name: Build component gallery
        working-directory: cashy
        run: pnpm build:wb

      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude '_site' \
            --exclude 'cashy' \
            --exclude 'stuff' \
            --exclude '.DS_Store' \
            --exclude 'masters-degree/data-science-roadmap/LEARNING-LOG.md' \
            --exclude 'pages/family-insurance-benefits.html' \
            --exclude 'pages/wealth-roadmap.html' \
            ./ _site/
          mkdir -p _site/cashy
          cp -r cashy/dist/. _site/cashy/
          # Component gallery → /cashy-wb/ ; rename its entry so the bare
          # directory URL resolves without /wb.html.
          mkdir -p _site/cashy-wb
          cp -r cashy/dist-wb/. _site/cashy-wb/
          mv _site/cashy-wb/wb.html _site/cashy-wb/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
