  <h2>3 · <code>src/history.py</code> — feature cần lịch sử</h2>
  <p>Nhóm feature mạnh nhất cho bài gian lận, và cũng là nhóm dễ rò rỉ nhất. Mọi cửa sổ phải dừng <b>trước</b> giao dịch đang xét.</p>
  <div class="ds-code"><i>"""Feature cần LỊCH SỬ của cùng một thẻ.

Đây là nhóm feature mạnh nhất cho bài gian lận và cũng là nhóm dễ rò rỉ nhất:
mọi cửa sổ đều phải dừng TRƯỚC giao dịch đang xét, không được nuốt chính nó.

Chạy lúc train trên cả bảng. Lúc serve, sáu cột này được tra ra từ kho trạng
thái (Redis/CSDL) — xem serve.py.
"""</i>
<b>import</b> pandas <b>as</b> pd

<b>from</b> .config <b>import</b> HISTORY_COLS

WINDOWS = {"n_tx_1h": "1h", "n_tx_24h": "24h"}


<b>def</b> add_history(df: pd.DataFrame) -&gt; pd.DataFrame:
    <i>"""Sinh HISTORY_COLS. Trả về bảng đã sắp lại theo thời gian."""</i>
    d = (df.sort_values(["card_id", "timestamp"], kind="mergesort")
           .reset_index(drop=<b>True</b>))
    d["timestamp"] = pd.to_datetime(d["timestamp"])
    g = d.groupby("card_id", sort=<b>False</b>)

    d["secs_since_last"] = g["timestamp"].diff().dt.total_seconds()
    <i># shift(1) = KHÔNG tính giao dịch hiện tại → giao dịch đầu của mỗi thẻ là NaN</i>
    d["hist_mean"] = g["amount"].transform(<b>lambda</b> s: s.shift(1).expanding().mean())
    d["hist_std"] = g["amount"].transform(<b>lambda</b> s: s.shift(1).expanding().std())
    d["hist_n"] = g.cumcount().astype("float64")

    <i># Đếm theo cửa sổ thời gian. closed="left" = khoảng [t−w, t), loại chính t</i>
    <i># VÀ loại mọi giao dịch trùng đúng mốc t.</i>
    <i># min_periods=0 là bắt buộc: mặc định là 1, nên cửa sổ RỖNG trả về NaN chứ</i>
    <i># không phải 0 — và "thẻ này chưa quẹt lần nào trong 1h qua" là một giá trị</i>
    <i># có thật, không phải dữ liệu thiếu. Bỏ sót chỗ này thì mọi giao dịch đầu</i>
    <i># tiên đi vào nhánh imputer và mang giá trị median của người khác.</i>
    idx = d.set_index("timestamp")
    <b>for</b> col, win <b>in</b> WINDOWS.items():
        counts = (idx.groupby("card_id", sort=<b>False</b>)["amount"]
                     .rolling(win, closed="left", min_periods=0).count())
        <i># d đã sắp theo (card_id, timestamp) và groupby(sort=False) giữ nguyên thứ</i>
        <i># tự xuất hiện → thứ tự hai bên khớp nhau. Lấy theo vị trí, KHÔNG theo</i>
        <i># nhãn index: timestamp lặp lại được nên gán theo nhãn sẽ nổ.</i>
        <b>assert</b> len(counts) == len(d)
        d[col] = counts.to_numpy()

    check_no_leak(d)
    <b>return</b> d.sort_values("timestamp", kind="mergesort").reset_index(drop=<b>True</b>)


<b>def</b> check_no_leak(d: pd.DataFrame) -&gt; <b>None</b>:
    <i>"""Ba bất biến. Chạy mỗi lần sinh feature, không phải chỉ trong test."""</i>
    first = d.groupby("card_id", sort=<b>False</b>).head(1)
    <b>assert</b> first["hist_mean"].isna().all(), "giao dịch đầu của thẻ không được có lịch sử"
    <b>assert</b> first["secs_since_last"].isna().all(), "giao dịch đầu không có khoảng cách"
    <b>assert</b> (first[list(WINDOWS)] == 0).all().all(), "giao dịch đầu phải đếm được 0"
    <b>assert</b> (d["hist_n"] &gt;= 0).all()


<b>def</b> state_from_history(d: pd.DataFrame) -&gt; dict:
    <i>"""Trạng thái SAU giao dịch cuối của mỗi thẻ — tức lịch sử mà giao dịch KẾ
    TIẾP của thẻ đó sẽ nhìn thấy. Đây là thứ serve cần, và nó KHÁC dòng cuối của
    add_history().

    Bẫy tinh vi mà bản đầu mắc phải: các cột hist_* ở add_history tính leak-free
    (shift(1)/closed="left"), nên mô tả lịch sử TRƯỚC dòng đó. Lấy nguyên dòng
    cuối làm "trạng thái mới nhất" là lệch đúng một nhịp — thiếu chính giao dịch
    cuối. Nên ở đây GỘP giao dịch cuối vào:
      · hist_n / hist_mean / hist_std: tính trên TOÀN BỘ giao dịch của thẻ (kể cả
        cái cuối) — giá trị giao dịch kế tiếp sẽ thấy, không phụ thuộc mốc thời gian.
      · last_ts + recent_ts: n_tx_1h / n_tx_24h và secs_since_last KHÔNG gộp sẵn
        được — chúng phụ thuộc mốc t của giao dịch kế tiếp. Kho trạng thái phải
        giữ vài mốc gần đây để serve còn đếm [t − w, t) và tính t − last_ts. Một
        dòng số đơn lẻ KHÔNG đủ — đó là chỗ "kho trạng thái" khó hơn vẻ ngoài.
    """</i>
    win = max(pd.Timedelta(w) <b>for</b> w <b>in</b> WINDOWS.values())    <i># cửa sổ lớn nhất (24h)</i>
    out: dict = {}
    <b>for</b> card, sub <b>in</b> (d.sort_values("timestamp", kind="mergesort")
                        .groupby("card_id", sort=<b>False</b>)):
        amt = sub["amount"].astype("float64")
        ts = pd.to_datetime(sub["timestamp"])
        last_ts = ts.iloc[-1]
        recent = ts[ts &gt; last_ts - win]                   <i># đủ cho mọi cửa sổ</i>
        out[card] = {
            "hist_n": <b>float</b>(len(sub)),                    <i># = hist_n dòng cuối + 1</i>
            "hist_mean": <b>float</b>(amt.mean()),               <i># gộp cả giao dịch cuối</i>
            "hist_std": <b>float</b>(amt.std(ddof=1)) <b>if</b> len(sub) &gt; 1 <b>else</b> <b>float</b>("nan"),
            "last_ts": last_ts.isoformat(),
            "recent_ts": [t.isoformat() <b>for</b> t <b>in</b> recent],
        }
    <b>return</b> out</div>

  <h2>4 · <code>src/split.py</code> — ba cách chia, ba câu hỏi khác nhau</h2>
  <p>Đây là chỗ quyết định con số trong luận văn nhiều hơn cả việc chọn mô hình. Ba cách chia trả lời <b>ba câu hỏi tổng quát hoá khác nhau</b>, và gộp chúng lại là cách phổ biến nhất để báo cáo một con số không ai dùng được.</p>
  <div class="ds-code"><i>"""Chia tập — và nói rõ mỗi cách trả lời CÂU HỎI TỔNG QUÁT HOÁ NÀO.

Ba câu hỏi khác nhau, ba cách chia khác nhau, và trộn chúng là cách phổ biến
nhất để báo cáo một con số không ai dùng được:

  1. GIAO DỊCH MỚI của khách cũ, trong cùng giai đoạn
     → chia theo thời gian.  Đây là câu hỏi mặc định của hệ thống chống gian
       lận: khách hàng đã biết, chỉ có giao dịch là mới.
  2. KHÁCH MỚI chưa từng thấy
     → chia theo nhóm (card_id không được nằm hai bên).  Trả lời câu "mô hình
       có học thuộc thói quen của từng thẻ không".
  3. GIAI ĐOẠN TƯƠNG LAI xa hơn, có cả khách mới
     → chia theo thời gian VÀ theo nhóm.  Khắc nghiệt nhất, gần production
       nhất sau vài tháng chạy.  Con số ở đây luôn thấp hơn (1) — thấp hơn là
       ĐÚNG, không phải là hỏng.

Luận văn nên báo cáo (1) làm kết quả chính và (3) làm kiểm tra độ bền.
"""</i>
<b>import</b> pandas <b>as</b> pd

<b>from</b> .config <b>import</b> EMBARGO_DAYS, GROUP_COL, SPLIT_RATIOS, TARGET, TS_COL


<b>def</b> _cut_points(df, ratios):
    ts = df[TS_COL].sort_values(kind="mergesort")
    <b>return</b> ts.iloc[int(len(ts) * ratios[0])], ts.iloc[int(len(ts) * ratios[1])]


<b>def</b> split_time(df, ratios=SPLIT_RATIOS, embargo_days=EMBARGO_DAYS):
    <i>"""(1) Giao dịch mới. Có embargo: bỏ trống vài ngày trước mỗi mốc cắt.

    Vì sao cần embargo, và đây là lý do THẬT chứ không phải nghi thức: nhãn
    gian lận đến muộn. Khiếu nại/chargeback về trung bình 30 ngày sau giao
    dịch, nên tại thời điểm bạn huấn luyện, những ngày gần nhất CHƯA có nhãn
    đáng tin. Huấn luyện sát mốc cắt là giả vờ mình có thứ ngoài đời chưa có.

    Đặt `EMBARGO_DAYS` bằng đúng độ trễ nhãn của hệ thống bạn — 30 ngày cho
    chargeback thật, nhỏ hơn cho bộ mô phỏng chỉ trải 180 ngày.
    """</i>
    df = df.sort_values(TS_COL, kind="mergesort")
    c1, c2 = _cut_points(df, ratios)
    gap = pd.Timedelta(days=embargo_days)
    train = df[df[TS_COL] &lt; c1 - gap]
    valid = df[(df[TS_COL] &gt;= c1) &amp; (df[TS_COL] &lt; c2 - gap)]
    test = df[df[TS_COL] &gt;= c2]
    <b>return</b> train, valid, test


<b>def</b> split_group(df, ratios=SPLIT_RATIOS, seed=42):
    <i>"""(2) Khách mới: mỗi card_id chỉ thuộc đúng một tập."""</i>
    cards = pd.Series(sorted(df[GROUP_COL].unique()))
    cards = cards.sample(frac=1.0, random_state=seed).reset_index(drop=<b>True</b>)
    a, b = int(len(cards) * ratios[0]), int(len(cards) * ratios[1])
    tr, va, te = set(cards[:a]), set(cards[a:b]), set(cards[b:])
    <b>return</b> (df[df[GROUP_COL].isin(tr)],
            df[df[GROUP_COL].isin(va)],
            df[df[GROUP_COL].isin(te)])


<b>def</b> split_time_group(df, ratios=SPLIT_RATIOS, embargo_days=EMBARGO_DAYS):
    <i>"""(3) Giai đoạn tương lai + khách mới: cắt theo thời gian, rồi loại dần
    để mỗi thẻ chỉ nằm ở đúng một tập.

    Chú ý thứ tự loại: phải trừ luỹ tiến (train → train∪valid), không phải chỉ
    trừ train khỏi cả hai — nếu không, một thẻ mới xuất hiện ở valid vẫn có thể
    quay lại ở test, và bạn lại đang đo "khách cũ" mà tưởng là "khách mới".
    """</i>
    train, valid, test = split_time(df, ratios, embargo_days)
    seen = set(train[GROUP_COL])
    valid = valid[~valid[GROUP_COL].isin(seen)]
    seen |= set(valid[GROUP_COL])
    <b>return</b> train, valid, test[~test[GROUP_COL].isin(seen)]


SPLITTERS = {"time": split_time, "group": split_group, "time_group": split_time_group}


<b>def</b> describe(train, valid, test) -&gt; "pd.DataFrame":
    <i>"""Bảng kích thước + số dòng dương của ba tập. In nó ra SAU MỖI lần chia.

    Với kind="time_group" bảng này thường gây bất ngờ: valid/test co lại còn
    vài trăm dòng và có khi không còn dòng dương nào. Đó không phải lỗi — đó là
    câu trả lời: bộ dữ liệu của bạn KHÔNG đủ khách mới để trả lời câu hỏi đó
    một cách đáng tin. Viết đúng câu đó vào luận văn còn giá trị hơn báo cáo
    một PR-AUC tính trên 3 dòng dương.
    """</i>
    rows = []
    <b>for</b> name, d <b>in</b> (("train", train), ("valid", valid), ("test", test)):
        rows.append({"tập": name, "dòng": len(d), "dương": int(d[TARGET].sum()),
                     "tỉ lệ": round(float(d[TARGET].mean()), 5) <b>if</b> len(d) <b>else</b> 0.0,
                     "thẻ": d[GROUP_COL].nunique(),
                     "từ": str(d[TS_COL].min()) <b>if</b> len(d) <b>else</b> "",
                     "đến": str(d[TS_COL].max()) <b>if</b> len(d) <b>else</b> ""})
    <b>return</b> pd.DataFrame(rows)


<b>def</b> assert_split_ok(train, valid, test, kind="time", require_positives=<b>True</b>):
    <i>"""Bốn dòng chạy sau MỌI lần chia. Rẻ, và bắt được lỗi đắt nhất của cả dự án."""</i>
    <b>assert</b> len(train) <b>and</b> len(valid) <b>and</b> len(test), (
        f"có tập rỗng (train={len(train)}, valid={len(valid)}, test={len(test)}). "
        "Với kind='time_group' điều này nghĩa là dữ liệu của bạn KHÔNG có thẻ nào "
        "xuất hiện lần đầu ở giai đoạn cuối — câu hỏi 'khách mới ở tương lai' "
        "không trả lời được trên bộ này, và đó cũng là một kết luận đáng viết.")
    ids = [set(d["tx_id"]) <b>for</b> d <b>in</b> (train, valid, test)]
    <b>assert</b> <b>not</b> (ids[0] &amp; ids[1] <b>or</b> ids[1] &amp; ids[2] <b>or</b> ids[0] &amp; ids[2]), "giao dịch nằm ở hai tập"
    <b>if</b> kind <b>in</b> ("time", "time_group"):
        <b>assert</b> train[TS_COL].max() &lt; valid[TS_COL].min(), "train chờm sang valid"
        <b>assert</b> valid[TS_COL].max() &lt; test[TS_COL].min(), "valid chờm sang test"
    <b>if</b> kind <b>in</b> ("group", "time_group"):
        g = [set(d[GROUP_COL]) <b>for</b> d <b>in</b> (train, valid, test)]
        <b>assert</b> <b>not</b> (g[0] &amp; g[1] <b>or</b> g[1] &amp; g[2] <b>or</b> g[0] &amp; g[2]), "thẻ nằm ở hai tập"
    <b>if</b> require_positives:
        <b>for</b> name, d <b>in</b> (("train", train), ("valid", valid), ("test", test)):
            <b>assert</b> d[TARGET].sum() &gt; 0, (
                f"{name} không có dòng gian lận nào — mọi chỉ số trên tập này vô nghĩa. "
                "Cần nhiều dữ liệu hơn, hoặc câu hỏi tổng quát hoá này không trả lời "
                "được trên bộ hiện có.")</div>

  <h2>5 · <code>src/pipeline.py</code></h2>
  <div class="ds-code"><i>"""Một đối tượng đi từ DataFrame THÔ tới predict_proba.

Vì sao mọi thứ phải nằm trong Pipeline chứ không rải ra notebook: chỉ khi
đó `pipe.fit(train)` mới bảo đảm scaler/one-hot chỉ nhìn thấy tập train, và
chỉ khi đó file .joblib mới là một hiện vật tự đủ — serve.py không phải lặp
lại một dòng tiền xử lý nào.
"""</i>
<b>from</b> sklearn.compose <b>import</b> ColumnTransformer
<b>from</b> sklearn.impute <b>import</b> SimpleImputer
<b>from</b> sklearn.pipeline <b>import</b> Pipeline
<b>from</b> sklearn.preprocessing <b>import</b> FunctionTransformer, OneHotEncoder, StandardScaler

<b>from</b> .config <b>import</b> CAT_FEATURES, MODEL_KIND, NUM_FEATURES, SEED
<b>from</b> .features <b>import</b> add_derived

<i># Để riêng, không viết thẳng vào lời gọi: ngày bạn chạy 5 seed và gọi</i>
<i># build_pipeline(random_state=43), Python sẽ báo "got multiple values for</i>
<i># keyword argument". Gộp bằng {**DEFAULTS, **kw} thì tham số truyền vào thắng.</i>
LGBM_DEFAULTS = dict(
    n_estimators=400, learning_rate=0.05, num_leaves=31, min_child_samples=100,
    subsample=0.8, subsample_freq=1, colsample_bytree=0.8, reg_lambda=1.0,
    random_state=SEED, n_jobs=-1, verbose=-1,
    <i># KHÔNG đặt class_weight="balanced" làm mặc định. Đó là phản xạ phổ biến</i>
    <i># nhất khi thấy dữ liệu lệch, và trên bộ này nó làm PR-AUC TỆ ĐI (0,026 →</i>
    <i># 0,029 khi bỏ) đồng thời phá hỏng hiệu chỉnh xác suất. Cây boosting xếp</i>
    <i># hạng tốt mà không cần nó. Ablation nằm ở bài "Dữ liệu lệch"; muốn thử</i>
    <i># thì build_pipeline(class_weight="balanced").</i>
)
HGB_DEFAULTS = dict(
    max_iter=400, learning_rate=0.05, max_leaf_nodes=31, min_samples_leaf=100,
    l2_regularization=1.0, random_state=SEED,
)


<b>def</b> build_model(kind=MODEL_KIND, **kw):
    <i>"""LightGBM là mặc định. "hgb" là bản chỉ cần scikit-learn — dùng khi máy
    bạn chưa có libomp (lỗi rất hay gặp trên macOS) hoặc khi CI không muốn
    thêm phụ thuộc nhị phân."""</i>
    <b>if</b> kind == "lgbm":
        <b>from</b> lightgbm <b>import</b> LGBMClassifier
        <b>return</b> LGBMClassifier(**{**LGBM_DEFAULTS, **kw})
    <b>if</b> kind == "hgb":
        <b>from</b> sklearn.ensemble <b>import</b> HistGradientBoostingClassifier
        <b>return</b> HistGradientBoostingClassifier(**{**HGB_DEFAULTS, **kw})
    <b>raise</b> ValueError(f"MODEL_KIND lạ: {kind}")


<b>def</b> build_pipeline(model_kind=MODEL_KIND, **model_kw) -&gt; Pipeline:
    num = Pipeline([
        ("imp", SimpleImputer(strategy="median", add_indicator=<b>True</b>)),
        ("sc", StandardScaler()),
    ])
    cat = Pipeline([
        ("imp", SimpleImputer(strategy="constant", fill_value="__NA__")),
        ("oh", OneHotEncoder(handle_unknown="infrequent_if_exist",
                             min_frequency=0.01, sparse_output=<b>False</b>)),
    ])
    prep = ColumnTransformer(
        [("num", num, NUM_FEATURES), ("cat", cat, CAT_FEATURES)],
        remainder="drop", verbose_feature_names_out=<b>False</b>,
    <i># Ép ra DataFrame ở CẢ fit lẫn predict. Bỏ dòng này thì sklearn cảnh báo</i>
    <i># "X does not have valid feature names" ở mỗi lần predict, và — quan trọng</i>
    <i># hơn — hình SHAP của bạn sẽ ghi Column_0…Column_37 thay vì tên feature.</i>
    ).set_output(transform="pandas")
    <b>return</b> Pipeline([
        ("derive", FunctionTransformer(add_derived, validate=<b>False</b>, feature_names_out=<b>None</b>)),
        ("prep", prep),
        ("model", build_model(model_kind, **model_kw)),
    ])</div>

    <p class="wb-alert__title">Hai quyết định trong file này đáng một đoạn trong luận văn</p>
    <p class="wb-alert__msg"><b>Tách <code>DEFAULTS</code> ra:</b> nếu viết <code>LGBMClassifier(..., random_state=SEED, **kw)</code> thì ngày bạn chạy 5 seed và gọi <code>build_pipeline(random_state=43)</code>, Python báo <code>TypeError: got multiple values for keyword argument</code>. Gộp bằng <code>{**DEFAULTS, **kw}</code> thì tham số truyền vào luôn thắng — bạn sẽ cần đúng tính năng đó ở bài <b>Kết quả có ý nghĩa thống kê không</b>.<br>
    <b>Không đặt <code>class_weight="balanced"</code>:</b> đây là phản xạ số một khi thấy dữ liệu lệch. Trên bộ này nó làm PR-AUC <i>tệ đi</i> (0,029 → 0,026) <b>và</b> phá hỏng hiệu chỉnh xác suất — điểm Brier nhảy từ 0,0021 lên 0,019 trong khi tỉ lệ nền chỉ 0,0021. Hệ quả thật: ngưỡng bạn chọn không còn đọc được như xác suất, nên bạn mất luôn khả năng đối chiếu nó với ngưỡng hoà vốn tính từ ma trận chi phí. Cây boosting xếp hạng tốt mà không cần nó.</p>

  <p>Quy tắc tuyệt đối của file này: <b>nó không đọc tập test.</b> Mọi con số nó in ra đều là validation, và ô <code>test_metrics</code> trong artifact để trống cho tới khi bạn chạy <code>src.final_eval</code>.</p>
  <div class="ds-code"><i>"""Huấn luyện + chọn ngưỡng. CHẠY BAO NHIÊU LẦN CŨNG ĐƯỢC.

    python -m src.train --split time

Quy tắc tuyệt đối của file này: **nó không đọc tập test.** Mọi con số in ra
đều là validation. Tập test nằm im cho tới khi bạn chạy src.final_eval đúng

Đó không phải sự cầu kỳ. Mỗi lần bạn nhìn điểm test rồi đổi một thứ gì đó,

<b>import</b> argparse
<b>import</b> json

<b>import</b> joblib

<b>from</b> sklearn.metrics <b>import</b> average_precision_score, brier_score_loss, roc_auc_score

<b>from</b> . <b>import</b> config <b>as</b> C
<b>from</b> .pipeline <b>import</b> build_pipeline

<b>def</b> valid_metrics(y, p) -&gt; dict:
    <b>return</b> {
        "pr_auc": float(average_precision_score(y, p)),
        "roc_auc": float(roc_auc_score(y, p)),
        "brier": float(brier_score_loss(y, p)),
        "base_rate": float(y.mean()),
        "n": int(len(y)),
    }


<b>def</b> main(argv=<b>None</b>):
    ap = argparse.ArgumentParser()
    ap.add_argument("--split", choices=sorted(SPLITTERS), default="time")
    ap.add_argument("--model", choices=["lgbm", "hgb"], default=C.MODEL_KIND)
    ap.add_argument("--seed", type=int, default=C.SEED)
    ap.add_argument("--tag", default="")
    a = ap.parse_args(argv)

    df = pd.read_parquet(C.PROC_FILE)
    train, valid, test = SPLITTERS[a.split](df)
    assert_split_ok(train, valid, test, kind=a.split)
    print(f"train {len(train):,} | valid {len(valid):,} | test {len(test):,} "
          f"(test KHÔNG được chạm ở file này)")

    pipe = build_pipeline(model_kind=a.model, random_state=a.seed)
    pipe.fit(train, train[C.TARGET])

    p_va = pipe.predict_proba(valid)[:, 1]
    y_va = valid[C.TARGET].to_numpy()

    metrics = valid_metrics(y_va, p_va)
    th = pick_thresholds(y_va, p_va)                 <i># ← chọn trên VALIDATION</i>
    report = decision_report(y_va, p_va, th["review"], th["block"])

    version = f"fraud-{datetime.now(timezone.utc):%Y%m%d-%H%M%S}{a.tag and '-' + a.tag}"
    meta = {
        "model_version": version,
        "schema_version": C.SCHEMA_VERSION,
        "trained_at": datetime.now(timezone.utc).isoformat(),
        "split": a.split, "model_kind": a.model, "seed": a.seed,
        "thresholds": {"review": th["review"], "block": th["block"]},
        "threshold_selection": {**th, "selected_on": "validation",
                                "breakeven_closed_form": breakeven()},
        "costs": {k: getattr(C, k) <b>for</b> k <b>in</b>
                  ("COST_FN", "COST_REVIEW", "COST_FP_BLOCK", "REVIEW_CATCH", "REVIEW_CAPACITY")},
        "valid_metrics": metrics,
        "valid_decisions": report,
        "features": {"num": C.NUM_FEATURES, "cat": C.CAT_FEATURES},
        "windows": {"train": [str(train[C.TS_COL].min()), str(train[C.TS_COL].max())],
                    "valid": [str(valid[C.TS_COL].min()), str(valid[C.TS_COL].max())]},
        "env": {"python": platform.python_version(), "sklearn": sklearn.__version__,
                "pandas": pd.__version__},
        "test_metrics": <b>None</b>,        <i># ← chỉ src.final_eval được điền ô này</i>
    }

    C.MODEL_DIR.mkdir(parents=<b>True</b>, exist_ok=<b>True</b>)
    art = C.MODEL_DIR / f"{version}.joblib"
    joblib.dump({"pipeline": pipe, "meta": meta}, art)
    (C.MODEL_DIR / f"{version}.meta.json").write_text(
        json.dumps(meta, indent=2, ensure_ascii=<b>False</b>))
    (C.MODEL_DIR / "current.json").write_text(
        json.dumps({"model_version": version, "artifact": art.name}, indent=2))

    print(json.dumps({"valid": metrics, "thresholds": meta["thresholds"],
                      "review_rate": report["review_rate"],
                      "recall_effective": report["recall_effective"],
                      "cost_per_tx": report["cost_per_tx"],
                      "cost_saved_vs_do_nothing_pct": report["cost_saved_pct"],
                      "breakeven_closed_form": breakeven()},
                     indent=2, ensure_ascii=<b>False</b>))
    print(f"\n→ {art}")
    <b>return</b> meta


<b>if</b> __name__ == "__main__":
    main()</div>

  <h2>1 · <code>src/thresholds.py</code> — ma trận chi phí và quyết định</h2>
  <p>Hệ thống thật không có hai hành động mà có <b>ba</b>: cho qua, đẩy sang người xác minh, chặn thẳng. Ba hành động × hai sự thật = <b>sáu ô chi phí</b>, không phải bốn.</p>
  <div class="wb-table-scroll"><table>
    <thead><tr><th></th><th>ALLOW (cho qua)</th><th>REVIEW (xác minh)</th><th>BLOCK (chặn)</th></tr></thead>
    <tbody>
      <tr><th>Thật sự gian lận</th><td>mất <b>3.000.000 ₫</b></td><td>40.000 ₫ + 10% × 3.000.000 ₫<br><span class="wb-help">nhân viên bắt được 90% số ca</span></td><td><b>0 ₫</b></td></tr>
      <tr><th>Thật sự hợp lệ</th><td><b>0 ₫</b></td><td>40.000 ₫<br><span class="wb-help">công nhân viên gọi xác minh</span></td><td>150.000 ₫<br><span class="wb-help">mất đơn + mất lòng tin</span></td></tr>
    </tbody>
  </table></div>
  <p>Cộng thêm một ràng buộc mà bài tập hay bỏ qua nhưng hệ thống thật luôn có: <b>đội xác minh có sức chứa hữu hạn</b>. Ở đây đặt 0,5% tổng lưu lượng. Không có ràng buộc này, nghiệm “tối ưu” thường đẩy 8% giao dịch sang REVIEW — một con số đúng về toán và vô dụng về vận hành.</p>
  <div class="ds-code"><i>"""Ngưỡng và quyết định — MỘT nguồn sự thật cho cả offline lẫn API.

train.py chọn ngưỡng trên VALIDATION và ghi vào artifact.
serve.py đọc ngưỡng TỪ artifact.
Cả hai đều gọi decide() ở file này, nên không có đường nào để hai bên lệch
nhau. tests/test_serve.py chứng minh điều đó bằng dữ liệu thật.
"""</i>
<b>import</b> numpy <b>as</b> np

<b>from</b> .config <b>import</b> (COST_FN, COST_FP_BLOCK, COST_REVIEW, REVIEW_CAPACITY,
                     REVIEW_CATCH)

ALLOW, REVIEW, BLOCK = "ALLOW", "REVIEW", "BLOCK"


<b>def</b> decide(prob, t_review: float, t_block: float):
    <i>"""Điểm rủi ro → hành động. Dùng cho cả một số lẫn cả một mảng."""</i>
    <b>if</b> t_review &gt; t_block:
        <b>raise</b> ValueError("t_review phải ≤ t_block")
    p = np.asarray(prob, dtype=float)
    out = np.where(p &gt;= t_block, BLOCK, np.where(p &gt;= t_review, REVIEW, ALLOW))
    <b>return</b> out <b>if</b> out.ndim <b>else</b> out.item()


<b>def</b> cost_matrix() -&gt; dict:
    <i>"""Ma trận chi phí, viết ra thành bảng để dán thẳng vào luận văn.

    Đơn vị: đồng cho mỗi giao dịch.  Hàng = sự thật, cột = hành động.
    """</i>
    residual = (1 - REVIEW_CATCH) * COST_FN
    <b>return</b> {
        ("fraud", ALLOW): COST_FN,
        ("fraud", REVIEW): COST_REVIEW + residual,
        ("fraud", BLOCK): 0.0,
        ("legit", ALLOW): 0.0,
        ("legit", REVIEW): COST_REVIEW,
        ("legit", BLOCK): COST_FP_BLOCK,
    }


<b>def</b> breakeven() -&gt; dict:
    <i>"""Ngưỡng hoà vốn tính THẲNG TỪ MA TRẬN CHI PHÍ, không cần dữ liệu.

    Hệ có BA hành động, nên hai biên là hai điểm HOÀ chi phí giữa các hành động
    CẠNH NHAU — KHÔNG phải BLOCK so với ALLOW:

      ALLOW → REVIEW hoà khi  p·COST_FN = COST_REVIEW + p·(1−REVIEW_CATCH)·COST_FN
                          →   p = COST_REVIEW / (REVIEW_CATCH · COST_FN)
      REVIEW → BLOCK hoà khi  COST_REVIEW + p·(1−REVIEW_CATCH)·COST_FN = (1−p)·COST_FP_BLOCK
                          →   p = (COST_FP_BLOCK − COST_REVIEW)
                                  / (COST_FP_BLOCK + (1−REVIEW_CATCH)·COST_FN)

    Bẫy hay gặp: lấy thẳng COST_FP_BLOCK/(COST_FN+COST_FP_BLOCK) làm biên BLOCK.
    Đó là biên của bài toán HAI hành động — nó bỏ qua REVIEW, cho con số thấp hơn
    hẳn (ở đây ≈0,048 thay vì ≈0,244). Với REVIEW trong bảng, chặn tại 0,048 là
    bỏ tiền: ở p=0,10 một lần xác minh (~70k) rẻ hơn chặn nhầm (~135k).

    So hai con số này với ngưỡng mà pick_thresholds tìm ra trên validation là
    một bài kiểm tra tỉnh táo rất rẻ. Nếu mô hình có hiệu chỉnh tốt, hai bên
    phải cùng cỡ. Lệch nhiều thì hoặc xác suất chưa hiệu chỉnh (hay gặp khi
    dùng class_weight="balanced"), hoặc ràng buộc sức chứa đang cắn.
    """</i>
    review = COST_REVIEW / (REVIEW_CATCH * COST_FN)
    block = ((COST_FP_BLOCK - COST_REVIEW)
             / (COST_FP_BLOCK + (1 - REVIEW_CATCH) * COST_FN))
    <b>if</b> block &lt;= review:
        <i># REVIEW bị trội hoàn toàn (một lần xác minh đắt hơn cả chặn nhầm): KHÔNG</i>
        <i># có dải p nào mà REVIEW rẻ nhất. Hệ suy về hai hành động — biên BLOCK quay</i>
        <i># lại điểm hoà ALLOW/BLOCK, và dải REVIEW để RỖNG (review = block) nhằm giữ</i>
        <i># đúng bất biến t_review ≤ t_block của decide(). Giữ nguyên review cũ (lớn</i>
        <i># hơn block) sẽ trả về cặp ngưỡng mà chính decide() từ chối.</i>
        block = COST_FP_BLOCK / (COST_FN + COST_FP_BLOCK)
        <b>return</b> {"review": block, "block": block, "review_used": <b>False</b>}
    <b>return</b> {"review": review, "block": block, "review_used": <b>True</b>}


<b>def</b> total_cost(y_true, prob, t_review, t_block):
    <i>"""Tổng thiệt hại kỳ vọng của một cặp ngưỡng, trên đúng tập được đưa vào."""</i>
    y = np.asarray(y_true).astype(int)
    act = decide(prob, t_review, t_block)
    m = cost_matrix()
    cost = 0.0
    <b>for</b> label, name <b>in</b> ((1, "fraud"), (0, "legit")):
        <b>for</b> a <b>in</b> (ALLOW, REVIEW, BLOCK):
            cost += m[(name, a)] * int(((y == label) &amp; (act == a)).sum())
    <b>return</b> cost


<b>def</b> pick_thresholds(y_true, prob, grid=<b>None</b>, capacity=REVIEW_CAPACITY):
    <i>"""Quét lưới cặp (t_review, t_block) và chọn cặp rẻ nhất.

    CHỈ ĐƯỢC GỌI TRÊN VALIDATION. Gọi trên test là đã tinh chỉnh trên test,
    và mọi con số test sau đó không còn là ước lượng không chệch nữa.

    Ràng buộc `capacity` là thứ phân biệt bài tập với hệ thống thật: đội xác
    minh có sức chứa hữu hạn, nên nghiệm tối ưu không ràng buộc thường vô
    dụng (nó đẩy 8% lưu lượng sang REVIEW).
    """</i>
    y = np.asarray(y_true).astype(int)
    p = np.asarray(prob, dtype=float)
    <b>if</b> grid <b>is</b> <b>None</b>:
        <i># lưới theo phân vị của chính điểm số: dày ở đúng vùng có dữ liệu</i>
        grid = np.unique(np.quantile(p, np.linspace(0.50, 0.99995, 200)))
    grid = np.clip(np.asarray(grid, dtype=float), 1e-9, 1.0)

    <i># Đếm luỹ tiến: n_lt[k] = số dòng có điểm &lt; grid[k]. searchsorted làm việc</i>
    <i># này trong O(n log G) nên cả lưới 200×200 chạy xong trong tích tắc — không</i>
    <i># cần vòng lặp Python nào chạm vào n dòng dữ liệu.</i>
    fs, ls = np.sort(p[y == 1]), np.sort(p[y == 0])
    n_f, n_l = len(fs), len(ls)
    F = np.searchsorted(fs, grid, side="left").astype(float)
    L = np.searchsorted(ls, grid, side="left").astype(float)

    m = cost_matrix()
    <i># cost(tr, tb) tách được thành g(tr) + h(tb) + hằng số — xem README</i>
    g = F * (m[("fraud", ALLOW)] - m[("fraud", REVIEW)]) + \
        L * (m[("legit", ALLOW)] - m[("legit", REVIEW)])
    h = F * (m[("fraud", REVIEW)] - m[("fraud", BLOCK)]) + \
        L * (m[("legit", REVIEW)] - m[("legit", BLOCK)])
    const = n_f * m[("fraud", BLOCK)] + n_l * m[("legit", BLOCK)]

    cost = g[:, <b>None</b>] + h[<b>None</b>, :] + const                    <i># [tr, tb]</i>
    n_review = (F + L)[<b>None</b>, :] - (F + L)[:, <b>None</b>]
    ok = (grid[:, <b>None</b>] &lt;= grid[<b>None</b>, :]) &amp; (n_review &lt;= capacity * len(p))
    <b>if</b> <b>not</b> ok.any():
        tb = float(np.quantile(p, 1 - capacity))
        <b>return</b> {"review": tb, "block": tb, "cost": float(total_cost(y, p, tb, tb)),
                "review_rate": 0.0, "capacity_binding": <b>True</b>, "n_grid": len(grid)}

    cost = np.where(ok, cost, np.inf)
    i, j = np.unravel_index(np.argmin(cost), cost.shape)
    used = float(n_review[i, j])
    <b>return</b> {"review": float(grid[i]), "block": float(grid[j]),
            "cost": float(cost[i, j]), "review_rate": used / len(p),
            "capacity_binding": used &gt;= capacity * len(p) - 1,
            "n_grid": len(grid)}


<b>def</b> decision_report(y_true, prob, t_review, t_block) -&gt; dict:
    <i>"""Bảng ba hành động — thứ đưa vào luận văn thay cho một ma trận nhầm lẫn 2×2."""</i>
    y = np.asarray(y_true).astype(int)
    act = decide(prob, t_review, t_block)
    rep = {"n": int(len(y)), "n_fraud": int(y.sum()),
           "t_review": float(t_review), "t_block": float(t_block)}
    <b>for</b> a <b>in</b> (ALLOW, REVIEW, BLOCK):
        sel = act == a
        rep[f"{a.lower()}_n"] = int(sel.sum())
        rep[f"{a.lower()}_fraud"] = int(y[sel].sum())
    caught = rep["block_fraud"] + REVIEW_CATCH * rep["review_fraud"]
    rep["recall_effective"] = caught / max(rep["n_fraud"], 1)
    rep["review_rate"] = rep["review_n"] / max(rep["n"], 1)
    rep["cost"] = float(total_cost(y, prob, t_review, t_block))
    rep["cost_per_tx"] = rep["cost"] / max(rep["n"], 1)

    <i># Baseline BẮT BUỘC: không có nó thì con số "6.246 đồng/giao dịch" không đọc</i>
    <i># được. Đây là chi phí khi KHÔNG có mô hình nào cả — cho qua tất.</i>
    rep["cost_do_nothing"] = float(rep["n_fraud"] * cost_matrix()[("fraud", ALLOW)])
    rep["cost_saved_pct"] = (1 - rep["cost"] / rep["cost_do_nothing"]) * 100 \
        <b>if</b> rep["cost_do_nothing"] <b>else</b> 0.0
    <b>return</b> rep</div>

    <p class="wb-alert__title">Vì sao quét lưới 200×200 không cần vòng lặp nào chạm vào 57 nghìn dòng</p>
    <p class="wb-alert__msg">Tổng chi phí <b>tách được</b> thành <code>g(t_review) + h(t_block) + hằng số</code>, trong đó <code>g</code> và <code>h</code> chỉ phụ thuộc số dòng có điểm nhỏ hơn ngưỡng. Đếm luỹ tiến bằng <code>searchsorted</code> rồi cộng hai vector là xong — 40.000 cặp ngưỡng tính trong mili giây. Viết ngây thơ hai vòng <code>for</code> lồng nhau thì cùng việc đó mất vài phút. Có một test so kết quả vector hoá với cách đếm thẳng, vì loại tối ưu này rất dễ đúng-mà-sai.</p>

  <h2>2 · Ngưỡng chọn được có khớp với lý thuyết không</h2>
  <p>Đây là bài kiểm tra tỉnh táo rẻ nhất trong cả dự án. Hệ có <b>ba</b> hành động nên có <b>hai</b> biên hoà vốn, mỗi biên là điểm hoà chi phí giữa hai hành động <i>cạnh nhau</i> — tính <b>thẳng từ ma trận chi phí</b>, không cần dữ liệu:</p>
  <div class="ds-code">ALLOW → REVIEW hoà khi   40.000 = p·0,9·3.000.000                 →  p &gt; 40.000/2.700.000 = <b>0,0148</b>
REVIEW → BLOCK hoà khi   40.000 + p·0,1·3.000.000 = (1−p)·150.000   →  p &gt; 110.000/450.000 = <b>0,2444</b></div>
  <p>Bẫy hay gặp: lấy thẳng <code>150.000/(3.000.000+150.000) = 0,0476</code> làm biên BLOCK. Đó là biên của bài toán <b>hai</b> hành động — chỉ so ALLOW với BLOCK — nên nó bỏ qua REVIEW và cho con số thấp hơn hẳn biên REVIEW→BLOCK thật (0,2444). Con số 0,0476 <i>vẫn</i> có vai trò, nhưng ở chỗ khác: xem hàng BLOCK bên dưới.</p>
  <div class="wb-table-scroll"><table>
    <thead><tr><th>Ngưỡng</th><th>Hoà vốn (sức chứa vô hạn)</th><th>Tìm được trên validation</th><th>Đọc thế nào</th></tr></thead>
    <tbody>
      <tr><td>REVIEW</td><td>0,0148</td><td><b>0,0411</b></td><td>Cao hơn rõ rệt — vì <b>ràng buộc sức chứa đang cắn</b>: hoà vốn (sức chứa vô hạn) đòi xác minh cả dải 0,0148–0,2444, tức ~8% lưu lượng, nhưng đội chỉ nuốt nổi 0,5%. Nên phải nâng sàn xác minh lên, chỉ giữ lại phần rủi ro nhất</td></tr>
      <tr><td>BLOCK</td><td>0,2444</td><td><b>0,0806</b></td><td><b>Thấp hơn</b> biên lý thuyết 0,2444 — cũng vì sức chứa. Khi ngân sách xác minh đã cạn, một giao dịch không lọt được vào REVIEW chỉ còn hai lựa chọn ALLOW hay BLOCK, mà biên của <i>cặp đó</i> chính là 0,0476. Validation 0,0806 nằm <b>cùng cỡ với 0,0476</b> chứ không phải với 0,2444 — đúng như dự đoán khi sức chứa cắn</td></tr>
    </tbody>
  </table></div>
  <p>So với biên <b>phù hợp</b> — 0,2444 khi đội xác minh còn dư sức, 0,0476 khi đã cạn — mà validation vẫn lệch <i>hàng chục lần</i> thì gần như chắc chắn xác suất của bạn chưa được hiệu chỉnh, hay gặp nhất là do <code>class_weight="balanced"</code>. Đó là lý do bài trước bỏ nó đi.</p>

  <h2>3 · <code>src/evaluate.py</code> — khoảng tin cậy đúng loại</h2>
  <p>Bootstrap theo dòng (lấy lại ngẫu nhiên từng dòng) chỉ đúng khi các dòng <b>độc lập</b>. Dữ liệu giao dịch vi phạm giả định đó theo hai chiều cùng lúc.</p>
  <div class="wb-table-scroll"><table>
    <thead><tr><th>Kiểu bootstrap</th><th>Lấy lại cái gì</th><th>Dùng khi câu hỏi là…</th></tr></thead>
    <tbody>
      <tr><td><b>cluster</b> (mặc định)</td><td>Các <b>thẻ</b></td><td>“Nếu tôi gặp một tập <i>khách hàng</i> khác thì sao?” Mỗi thẻ là một quan sát độc lập, không phải mỗi dòng. Đây là mặc định đúng cho dữ liệu giao dịch</td></tr>
      <tr><td><b>block</b></td><td>Các <b>khối thời gian</b> liền nhau</td><td>“Nếu tôi gặp một <i>tuần</i> khác thì sao?” Dùng khi có mùa vụ hoặc có đợt tấn công theo chiến dịch — tức là khi các dòng gần nhau <i>trong thời gian</i> phụ thuộc nhau</td></tr>
      <tr><td><b>row</b></td><td>Từng dòng</td><td>Chỉ khi các dòng thật sự độc lập. Ở bài này thì <b>không</b> — để lại trong code để bạn chạy cả ba và tự thấy khác biệt</td></tr>
    </tbody>
  </table></div>
  <div class="ds-code"><i>"""Khoảng tin cậy, hình vẽ, ablation — TẤT CẢ trên validation/CV.

Điểm quan trọng nhất của file này là hàm bootstrap. Bootstrap theo dòng
(lấy lại ngẫu nhiên từng dòng) chỉ đúng khi các dòng ĐỘC LẬP. Dữ liệu giao
dịch không độc lập theo hai chiều cùng lúc:

  · nhiều giao dịch cùng một thẻ  → cluster bootstrap (lấy lại theo THẺ)
  · phụ thuộc theo thời gian      → block bootstrap (lấy lại theo KHỐI ngày)

Dùng nhầm bootstrap theo dòng ở đây cho ra khoảng tin cậy hẹp hơn thực tế —
nghĩa là bạn sẽ tuyên bố "cải thiện có ý nghĩa" cho một chênh lệch chỉ là
nhiễu. Đây đúng là loại lỗi hội đồng hỏi tới.
"""</i>
<b>import</b> numpy <b>as</b> np
<b>import</b> pandas <b>as</b> pd
<b>from</b> sklearn.metrics <b>import</b> average_precision_score, precision_recall_curve

<b>from</b> .config <b>import</b> REPORT_DIR


<b>def</b> _ap(y, p):
    y = np.asarray(y)
    <b>return</b> np.nan <b>if</b> y.sum() == 0 <b>else</b> average_precision_score(y, p)


<b>def</b> _unit_indices(keys):
    <i>"""Gom chỉ số các dòng theo khoá, trả về danh sách mảng. Thuần numpy nên
    chạy được với khoá là chuỗi (card_id) lẫn mốc thời gian (khối ngày)."""</i>
    keys = np.asarray(keys)
    order = np.argsort(keys, kind="mergesort")
    k = keys[order]
    starts = np.flatnonzero(np.r_[<b>True</b>, k[1:] != k[:-1]])
    <b>return</b> np.split(order, starts[1:])


<b>def</b> bootstrap_ci(y, p, groups=<b>None</b>, times=<b>None</b>, kind="cluster",
                 n=400, seed=42, block="1D", alpha=0.05):
    <i>"""Khoảng tin cậy phần trăm cho PR-AUC.

    kind="cluster" — lấy lại các THẺ (mặc định cho dữ liệu giao dịch). Dùng khi
        cùng một thực thể xuất hiện nhiều lần: mỗi thẻ đóng góp một "quan sát
        độc lập", không phải mỗi dòng.
    kind="block"   — lấy lại các KHỐI THỜI GIAN liền nhau (mặc định 1 ngày).
        Chọn khối đủ dài để nuốt trọn phụ thuộc trong ngày, nhưng đủ nhiều khối
        (≥ 20) để bootstrap có nghĩa — 5 khối thì khoảng tin cậy tự nó là nhiễu.
        Dùng khi cái bạn muốn khái quát hoá là "một tuần khác", ví dụ khi có
        mùa vụ hoặc có đợt tấn công theo chiến dịch.
    kind="row"     — bootstrap theo dòng. Chỉ hợp lệ khi các dòng thật sự độc
        lập. Để ở đây để bạn chạy cả ba và tự thấy khoảng nào rộng hơn.
    """</i>
    y = np.asarray(y)
    p = np.asarray(p, dtype=float)
    rng = np.random.default_rng(seed)

    <b>if</b> kind == "row":
        units = [np.array([i]) <b>for</b> i <b>in</b> range(len(y))]
    <b>elif</b> kind == "cluster":
        <b>if</b> groups <b>is</b> <b>None</b>:
            <b>raise</b> ValueError("cluster bootstrap cần groups=card_id")
        units = _unit_indices(np.asarray(groups))
    <b>elif</b> kind == "block":
        <b>if</b> times <b>is</b> <b>None</b>:
            <b>raise</b> ValueError("block bootstrap cần times=timestamp")
        units = _unit_indices(pd.to_datetime(pd.Series(np.asarray(times)))
                              .dt.floor(block).to_numpy())
    <b>else</b>:
        <b>raise</b> ValueError(f"kind lạ: {kind}")

    scores = []
    <b>for</b> _ <b>in</b> range(n):
        pick = rng.integers(0, len(units), len(units))
        idx = np.concatenate([units[k] <b>for</b> k <b>in</b> pick])
        v = _ap(y[idx], p[idx])
        <b>if</b> <b>not</b> np.isnan(v):
            scores.append(v)
    lo, hi = np.percentile(scores, [100 * alpha / 2, 100 * (1 - alpha / 2)])
    <b>return</b> {"point": float(_ap(y, p)), "lo": float(lo), "hi": float(hi),
            "kind": kind, "n_units": len(units), "n_boot": len(scores),
            "width": float(hi - lo)}


<b>def</b> plot_pr(y, p, path=<b>None</b>, label="mô hình"):
    <i>"""Hình PR cho luận văn. Đường đứt = mức đoán bừa = tỉ lệ nền."""</i>
    <b>import</b> matplotlib
    matplotlib.use("Agg")
    <b>import</b> matplotlib.pyplot <b>as</b> plt

    path = path <b>or</b> (REPORT_DIR / "figures" / "pr_curve.png")
    path.parent.mkdir(parents=<b>True</b>, exist_ok=<b>True</b>)
    prec, rec, _ = precision_recall_curve(y, p)
    base = float(np.mean(y))
    fig, ax = plt.subplots(figsize=(5, 4))
    ax.plot(rec, prec, lw=2, label=f"{label} (PR-AUC={_ap(y, p):.3f})")
    ax.axhline(base, ls="--", lw=1, color="gray", label=f"đoán bừa ({base:.4f})")
    ax.set_xlabel("Recall")
    ax.set_ylabel("Precision")
    ax.set_ylim(0, 1)
    ax.legend()
    fig.tight_layout()
    fig.savefig(path, dpi=200)
    plt.close(fig)
    <b>return</b> path


<b>def</b> cost_curve(y, p, t_block_grid=<b>None</b>):
    <i>"""Bảng tổng chi phí theo ngưỡng chặn, với t_review cố định = t_block
    (tức là bỏ hẳn hàng REVIEW). Dùng để vẽ hình "chi phí theo ngưỡng"."""</i>
    <b>from</b> .thresholds <b>import</b> total_cost
    <b>if</b> t_block_grid <b>is</b> <b>None</b>:
        t_block_grid = np.quantile(p, np.linspace(0.90, 0.9999, 60))
    <b>return</b> pd.DataFrame({"t_block": t_block_grid,
                         "cost": [total_cost(y, p, t, t) <b>for</b> t <b>in</b> t_block_grid]})</div>

  <h2>4 · <code>src/final_eval.py</code> — mở tập test đúng một lần</h2>
  <p>“Chỉ chạm một lần” mà chỉ là lời hứa trong đầu thì không phải một quy trình. Ở đây nó là ba cái khoá thật:</p>
  <ul>
    <li>Phải truyền <code>--confirm-freeze</code> — không ai lỡ tay chạy được.</li>
    <li>Từ chối ghi đè báo cáo đã tồn tại cho cùng một <code>model_version</code>.</li>
    <li>Lưu <b>hash của cấu hình</b> (hằng số + mã sinh feature). Sửa bất kỳ thứ gì rồi chạy lại thì hash đổi, và bạn <i>thấy</i> mình vừa mở tập test lần thứ hai.</li>
  </ul>
  <div class="ds-code"><i>"""ĐÁNH GIÁ CUỐI CÙNG — chạm vào tập test đúng MỘT lần.

    python -m src.final_eval --confirm-freeze

File này tách khỏi train.py là có chủ ý, và cơ chế khoá bên dưới cũng vậy:

  · phải truyền --confirm-freeze, nên không ai lỡ tay chạy nó;
  · nó từ chối ghi đè một báo cáo đã tồn tại cho cùng một model_version;
  · nó lưu hash của cấu hình, nên nếu bạn sửa config/feature rồi chạy lại,
    file sẽ mang một hash khác và bạn thấy ngay là mình đã mở tập test lần hai.

Nếu bạn thật sự phải chạy lại (ví dụ tìm ra một bug thật), cứ chạy — nhưng
**ghi vào luận văn rằng tập test đã được mở n lần và vì sao**. Cái làm hỏng
một luận văn không phải việc mở lại tập test, mà việc mở lại rồi không kể.
"""</i>
<b>import</b> argparse
<b>import</b> hashlib
<b>import</b> inspect
<b>import</b> json
<b>from</b> datetime <b>import</b> datetime, timezone

<b>import</b> joblib
<b>import</b> pandas <b>as</b> pd

<b>from</b> . <b>import</b> config <b>as</b> C
<b>from</b> . <b>import</b> features, history, pipeline, split
<b>from</b> .evaluate <b>import</b> bootstrap_ci
<b>from</b> .split <b>import</b> SPLITTERS, assert_split_ok
<b>from</b> .thresholds <b>import</b> decision_report


<b>def</b> freeze_hash() -&gt; str:
    <i>"""Vân tay của mọi thứ quyết định con số cuối: hằng số + mã sinh feature."""</i>
    src = "".join(inspect.getsource(m) <b>for</b> m <b>in</b> (features, history, pipeline, split))
    consts = json.dumps({k: v <b>for</b> k, v <b>in</b> vars(C).items()
                         <b>if</b> k.isupper() <b>and</b> isinstance(v, (int, float, str, list, dict, tuple))},
                        sort_keys=<b>True</b>, default=str)
    <b>return</b> hashlib.sha256((src + consts).encode()).hexdigest()[:16]


<b>def</b> main(argv=<b>None</b>):
    ap = argparse.ArgumentParser()
    ap.add_argument("--confirm-freeze", action="store_true",
                    help="xác nhận cấu hình đã đóng băng, không tinh chỉnh gì nữa")
    ap.add_argument("--artifact", default=<b>None</b>)
    ap.add_argument("--allow-rerun", action="store_true")
    a = ap.parse_args(argv)

    <b>if</b> <b>not</b> a.confirm_freeze:
        <b>raise</b> SystemExit(
            "Từ chối chạy. Tập test chỉ được mở sau khi bạn đã chốt xong mọi lựa "
            "chọn trên validation.\nNếu đã chốt: python -m src.final_eval --confirm-freeze")

    name = a.artifact <b>or</b> json.loads((C.MODEL_DIR / "current.json").read_text())["artifact"]
    bundle = joblib.load(C.MODEL_DIR / name)
    pipe, meta = bundle["pipeline"], bundle["meta"]
    version, th = meta["model_version"], meta["thresholds"]

    out_path = C.REPORT_DIR / f"final_eval_{version}.json"
    <b>if</b> out_path.exists() <b>and</b> <b>not</b> a.allow_rerun:
        <b>raise</b> SystemExit(f"Đã có {out_path.name} — tập test đã được mở cho bản này rồi.\n"
                         "Huấn luyện lại (đổi model_version), hoặc thêm --allow-rerun "
                         "và ghi lại việc đó trong luận văn.")

    df = pd.read_parquet(C.PROC_FILE)
    train, valid, test = SPLITTERS[meta["split"]](df)
    assert_split_ok(train, valid, test, kind=meta["split"])

    y = test[C.TARGET].to_numpy()
    p = pipe.predict_proba(test)[:, 1]

    result = {
        "model_version": version,
        "freeze_hash": freeze_hash(),
        "evaluated_at": datetime.now(timezone.utc).isoformat(),
        "thresholds_from_artifact": th,          <i># KHÔNG chọn lại trên test</i>
        "test_window": [str(test[C.TS_COL].min()), str(test[C.TS_COL].max())],
        "pr_auc_cluster_ci": bootstrap_ci(y, p, groups=test[C.GROUP_COL], kind="cluster"),
        "pr_auc_block_ci": bootstrap_ci(y, p, times=test[C.TS_COL], kind="block"),
        "pr_auc_row_ci_DO_NOT_REPORT": bootstrap_ci(y, p, kind="row"),
        "decisions": decision_report(y, p, th["review"], th["block"]),
    }
    C.REPORT_DIR.mkdir(parents=<b>True</b>, exist_ok=<b>True</b>)
    out_path.write_text(json.dumps(result, indent=2, ensure_ascii=<b>False</b>))

    meta["test_metrics"] = result
    (C.MODEL_DIR / f"{version}.meta.json").write_text(
        json.dumps(meta, indent=2, ensure_ascii=<b>False</b>))

    print(json.dumps(result, indent=2, ensure_ascii=<b>False</b>))
    print(f"\n→ {out_path}")
    <b>return</b> result


<b>if</b> __name__ == "__main__":
    main()</div>

<b>def</b> test_windows_match_bruteforce(raw):
    d = add_history(raw)
    sub = d[d["card_id"].isin(sorted(d["card_id"].unique())[:12])]
    <b>for</b> card, g <b>in</b> sub.groupby("card_id"):
        t = g["timestamp"].to_numpy()
        want = [int(((t &gt;= ti - np.timedelta64(1, "h")) &amp; (t &lt; ti)).sum()) <b>for</b> ti <b>in</b> t]
        <b>assert</b> list(g["n_tx_1h"].astype(int)) == want, f"lệch ở thẻ {card}"


<b>def</b> test_history_uses_only_the_past(raw):
    <i>"""Đổi số tiền của giao dịch CUỐI không được làm đổi feature của giao dịch
    nào trước nó. Đây là định nghĩa thao tác được của 'không nhìn tương lai'."""</i>
    a = add_history(raw)
    tampered = raw.copy()
    last = tampered.index[-1]
    tampered.loc[last, "amount"] = tampered.loc[last, "amount"] * 1000
    b = add_history(tampered)
    cols = ["hist_mean", "hist_std", "n_tx_1h", "n_tx_24h", "secs_since_last"]
    pd.testing.assert_frame_equal(a.iloc[:-1][cols], b.iloc[:-1][cols])

    ts = pd.Timestamp("2025-01-01T10:00:00")
    df = pd.DataFrame({
        "tx_id": ["a", "b", "c"], "timestamp": [ts, ts, ts + pd.Timedelta("30min")],
        "card_id": ["C1", "C1", "C1"], "amount": [1.0, 2.0, 3.0],

    add_history — dòng đó leak-free nên còn thiếu chính giao dịch cuối. Test cũ
    khẳng định snapshot == dòng cuối, vô tình đóng băng lỗi lệch-một-nhịp."""</i>

    <b>assert</b> np.isclose(st[card]["hist_mean"], sub["amount"].mean())
    <i># mốc cuối được giữ để serve tính secs_since_last = t_mới − last_ts</i>
    <b>assert</b> pd.Timestamp(st[card]["last_ts"]) == sub["timestamp"].iloc[-1]

  <div class="ds-code"><i>"""Chia tập và chọn ngưỡng — hai chỗ quyết định con số trong luận văn."""</i>
<b>import</b> numpy <b>as</b> np
<b>import</b> pytest

<b>from</b> src.config <b>import</b> (COST_FN, COST_FP_BLOCK, COST_REVIEW, REVIEW_CAPACITY,

                            decision_report, pick_thresholds, total_cost)


<b>def</b> test_breakeven_block_is_the_review_block_boundary():
    <i>"""Biên BLOCK phải là điểm REVIEW/BLOCK hoà chi phí, KHÔNG phải biên hai
    hành động COST_FP_BLOCK/(COST_FN+COST_FP_BLOCK) — cái sau bỏ qua REVIEW và
    cho ngưỡng thấp hơn hẳn, chặn tại đó là bỏ tiền."""</i>
    be = breakeven()
    two_action = COST_FP_BLOCK / (COST_FN + COST_FP_BLOCK)
    three_action = ((COST_FP_BLOCK - COST_REVIEW)
                    / (COST_FP_BLOCK + (1 - REVIEW_CATCH) * COST_FN))
    <b>assert</b> be["review_used"] <b>is</b> <b>True</b>          <i># số mặc định: REVIEW có dải riêng</i>
    <b>assert</b> be["block"] == pytest.approx(three_action)
    <b>assert</b> be["block"] &gt; two_action           <i># 0,244 vs 0,048 với số mặc định</i>
    <b>assert</b> be["review"] &lt; be["block"]         <i># decide() đòi review ≤ block</i>
    <i># Tại một điểm GIỮA hai biên, REVIEW phải rẻ hơn cả ALLOW lẫn BLOCK.</i>
    p = 0.5 * (be["review"] + be["block"])
    <b>assert</b> COST_REVIEW + p * (1 - REVIEW_CATCH) * COST_FN &lt; p * COST_FN
    <b>assert</b> COST_REVIEW + p * (1 - REVIEW_CATCH) * COST_FN &lt; (1 - p) * COST_FP_BLOCK


<b>def</b> test_breakeven_degrades_cleanly_when_review_dominated(monkeypatch):
    <i>"""Khi một lần xác minh đắt hơn cả chặn nhầm, REVIEW không còn dải nào rẻ
    nhất. breakeven() phải suy về hai hành động VÀ vẫn giữ t_review ≤ t_block —
    tuyệt đối không trả cặp (review &gt; block) mà decide() sẽ ném lỗi."""</i>
    <b>import</b> src.thresholds <b>as</b> th
    monkeypatch.setattr(th, "COST_FN", 500_000)
    monkeypatch.setattr(th, "COST_FP_BLOCK", 10_000)
    monkeypatch.setattr(th, "COST_REVIEW", 400_000)
    be = th.breakeven()
    <b>assert</b> be["review_used"] <b>is</b> <b>False</b>
    <b>assert</b> be["review"] &lt;= be["block"]                    <i># bất biến của decide()</i>
    <b>assert</b> be["block"] == pytest.approx(10_000 / 510_000) <i># biên ALLOW→BLOCK</i>
    <i># Cặp trả về phải nạp thẳng vào decide() được, không ném ValueError.</i>
    act = decide([0.0, 0.5, 0.99], be["review"], be["block"])
    <b>assert</b> REVIEW <b>not</b> <b>in</b> list(act)                        <i># dải REVIEW rỗng → không bao giờ chọn</i>

<b>def</b> test_time_group_split_is_the_strictest(hist):
    <i>"""Câu hỏi khắc nghiệt nhất — và test này ghi lại luôn CÁI GIÁ của nó:
    valid/test co lại còn vài phần trăm. Đó là lý do phải báo cáo nó như một

<b>def</b> test_decide_is_monotone():

<b>def</b> test_pick_thresholds_beats_the_default_half():
    <i>"""Ngưỡng chọn theo chi phí phải rẻ hơn ngưỡng mặc định 0,5 — nếu không thì
    cả bài toán chọn ngưỡng vô nghĩa."""</i>
    rng = np.random.default_rng(0)
    y = rng.binomial(1, 0.004, 40_000)
    p = np.clip(rng.beta(1.2, 30, 40_000) + y * rng.beta(6, 3, 40_000), 0, 1)
    th = pick_thresholds(y, p)
    <b>assert</b> th["review"] &lt;= th["block"]

<b>def</b> test_vectorised_cost_matches_bruteforce():
    <i>"""Đại số tách g(tr)+h(tb) phải khớp với đếm thẳng — nếu lệch thì ngưỡng sai."""</i>
    rng = np.random.default_rng(1)

    th = pick_thresholds(y, p)

  <h2><code>src/serve.py</code></h2>
  <div class="ds-code"><i>"""API chấm điểm. Ngưỡng ĐỌC TỪ ARTIFACT, không viết trong file này.

    uvicorn src.serve:app --port 8000     → http://localhost:8000/docs

Viết thẳng 0,4 và 0,9 vào service là cách phổ biến nhất để hệ thống chạy lệch
khỏi thứ bạn đã đo: ai đó tinh chỉnh ngưỡng offline, không ai sửa service, và
bảng trong luận văn mô tả một hệ thống không tồn tại. Ở đây ngưỡng đi cùng
model trong cùng một file .joblib, và tests/test_serve.py so từng dòng quyết
định của API với quyết định offline để chứng minh hai bên không thể lệch.
"""</i>
<b>import</b> json
<b>import</b> logging
<b>import</b> os
<b>import</b> time
<b>from</b> contextlib <b>import</b> asynccontextmanager
<b>from</b> typing <b>import</b> Optional

<b>import</b> joblib
<b>import</b> pandas <b>as</b> pd
<b>from</b> fastapi <b>import</b> FastAPI, HTTPException
<b>from</b> pydantic <b>import</b> BaseModel, Field

<b>from</b> .config <b>import</b> HISTORY_COLS, MODEL_DIR
<b>from</b> .thresholds <b>import</b> decide

log = logging.getLogger("fraud")
_BUNDLE = <b>None</b>


<b>def</b> model_dir():
    <b>return</b> os.environ.get("FRAUD_MODEL_DIR", MODEL_DIR)


<b>def</b> load_bundle(model_dir_=<b>None</b>, name=<b>None</b>):
    <i>"""Đọc artifact + kiểm tra ngưỡng bên trong nó có hợp lệ không."""</i>
    <b>from</b> pathlib <b>import</b> Path
    d = Path(model_dir_ <b>or</b> model_dir())
    name = name <b>or</b> json.loads((d / "current.json").read_text())["artifact"]
    b = joblib.load(d / name)
    th = b["meta"]["thresholds"]
    <b>if</b> <b>not</b> 0 &lt;= th["review"] &lt;= th["block"] &lt;= 1:
        <b>raise</b> RuntimeError(f"ngưỡng trong artifact không hợp lệ: {th}")
    <b>return</b> b


<b>def</b> get_bundle():
    <i>"""Nạp MỘT lần rồi giữ trong bộ nhớ — joblib.load mất ~200ms, gọi mỗi
    request là phá sạch ngân sách độ trễ. Nạp lười (thay vì lúc import) để
    một container thiếu model báo lỗi rõ ràng ở /health thay vì chết lúc khởi
    động với một stack trace không ai đọc."""</i>
    <b>global</b> _BUNDLE
    <b>if</b> _BUNDLE <b>is</b> <b>None</b>:
        _BUNDLE = load_bundle()
    <b>return</b> _BUNDLE


@asynccontextmanager
<b>async</b> <b>def</b> lifespan(app):
    <b>try</b>:
        get_bundle()                      <i># nạp sẵn để request đầu tiên không chậm</i>
    <b>except</b> Exception <b>as</b> e:                <i># noqa: BLE001</i>
        log.error("chưa nạp được model: %s", e)
    <b>yield</b>


app = FastAPI(title="Fraud Scoring API", version="2.0", lifespan=lifespan)


<b>class</b> Transaction(BaseModel):
    <i>"""Đúng schema chuẩn + sáu cột lịch sử. Thiếu cột lịch sử là hợp lệ (thẻ
    mới): pipeline điền bằng median của tập train và bật cờ báo thiếu."""</i>
    timestamp: str
    amount: float = Field(gt=0)
    card_id: str
    merchant_type: str
    city: str
    device_type: str
    hist_mean: Optional[float] = <b>None</b>
    hist_std: Optional[float] = <b>None</b>
    hist_n: Optional[float] = <b>None</b>
    secs_since_last: Optional[float] = <b>None</b>
    n_tx_1h: Optional[float] = <b>None</b>
    n_tx_24h: Optional[float] = <b>None</b>


<b>class</b> Score(BaseModel):
    risk_score: float
    decision: str
    t_review: float
    t_block: float
    model_version: str
    latency_ms: float


<b>def</b> score_frame(df: pd.DataFrame):
    <i>"""Dùng chung cho API và cho mọi kiểm tra offline — một đường code duy nhất."""</i>
    b = get_bundle()
    th = b["meta"]["thresholds"]
    p = b["pipeline"].predict_proba(df)[:, 1]
    <b>return</b> p, decide(p, th["review"], th["block"])


@app.get("/health")
<b>def</b> health():
    <b>try</b>:
        m = get_bundle()["meta"]
    <b>except</b> Exception <b>as</b> e:                <i># noqa: BLE001</i>
        <b>raise</b> HTTPException(status_code=503, detail=f"chưa nạp được model: {e}")
    <b>return</b> {"status": "ok", "model_version": m["model_version"],
            "schema_version": m["schema_version"], "thresholds": m["thresholds"],
            "trained_at": m["trained_at"]}


@app.get("/model-card")
<b>def</b> model_card():
    <i>"""Toàn bộ siêu dữ liệu, gồm cả bảng chi phí đã dùng để chọn ngưỡng. Mở
    đường dẫn này trong buổi bảo vệ khi bị hỏi 'ngưỡng ở đâu ra'."""</i>
    <b>return</b> get_bundle()["meta"]


@app.post("/score", response_model=Score)
<b>def</b> score(tx: Transaction):
    t0 = time.perf_counter()
    b = get_bundle()
    <b>try</b>:
        row = tx.model_dump()
        <b>for</b> c <b>in</b> HISTORY_COLS:
            row.setdefault(c, <b>None</b>)
        p, act = score_frame(pd.DataFrame([row]))
    <b>except</b> Exception <b>as</b> e:                <i># noqa: BLE001 — biên ngoài cùng</i>
        log.exception("scoring failed")
        <b>raise</b> HTTPException(status_code=422, detail=f"scoring failed: {e}")

    dt = (time.perf_counter() - t0) * 1000
    log.info("score=%.4f decision=%s card=%s ms=%.1f", p[0], act[0], tx.card_id, dt)
    th = b["meta"]["thresholds"]
    <b>return</b> Score(risk_score=round(float(p[0]), 6), decision=str(act[0]),
                 t_review=th["review"], t_block=th["block"],
                 model_version=b["meta"]["model_version"], latency_ms=round(dt, 2))</div>

<b>def</b> test_api_matches_offline_decisions(client, deployed, splits):
    <i>"""60 giao dịch thật: điểm VÀ quyết định của API phải trùng khít bản offline."""</i>
    _, valid, _ = splits
    sample = valid.iloc[:: max(len(valid) // 60, 1)].head(60)
    th = deployed.get_bundle()["meta"]["thresholds"]

    p_off = deployed.get_bundle()["pipeline"].predict_proba(sample)[:, 1]
    a_off = decide(p_off, th["review"], th["block"])

        <b>assert</b> (body["t_review"], body["t_block"]) == (th["review"], th["block"])

HEALTHCHECK CMD python -c "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"

<template data-node="pr-monitor">
  <p>Mô hình không hỏng ngay — nó <b>mục dần</b>. Phần này là thứ phân biệt một bài tập với một hệ thống, và là chương mà rất ít luận văn thạc sĩ viết được cho ra hồn.</p>

  <h2>Ba loại drift</h2>
  <table>
    <tr><th>Loại</th><th>Cái gì đổi</th><th>Ví dụ</th><th>Phát hiện bằng</th></tr>
    <tr><td><b>Data drift</b></td><td>Phân phối đầu vào $P(X)$</td><td>Tết đến, số tiền trung bình tăng gấp ba</td><td>So phân phối từng cột giữa tháng này và lúc train</td></tr>
    <tr><td><b>Concept drift</b></td><td>Quan hệ $P(y \mid X)$</td><td>Kẻ gian đổi chiêu: giờ chia nhỏ thành nhiều giao dịch bé</td><td>Cần nhãn → phát hiện trễ</td></tr>
    <tr><td><b>Label drift</b></td><td>Tỉ lệ nhãn $P(y)$</td><td>Chiến dịch lừa đảo mới làm tỉ lệ gian lận tăng gấp đôi</td><td>Theo dõi tỉ lệ dương theo tuần</td></tr>
  </table>
  <p>Concept drift là loại nguy hiểm nhất vì <b>đầu vào trông vẫn bình thường</b> — chỉ có điều mối liên hệ với nhãn đã đổi. Trong bài toán gian lận nó xảy ra liên tục, vì bên kia là con người đang chủ động thích nghi.</p>

  <h2>Đo drift bằng PSI — đủ dùng và dễ giải thích</h2>
  <div data-viz="drift"></div>
  <p>Population Stability Index so phân phối hiện tại với phân phối lúc train:</p>
  <p>$$\text{PSI} = \sum_i (a_i - e_i)\ln\frac{a_i}{e_i}$$</p>
  <p>với $e_i$, $a_i$ là tỉ lệ mẫu rơi vào khoảng $i$ ở tập tham chiếu và tập hiện tại.</p>
  <div class="ds-code"><b>def</b> psi(expected, actual, bins=10):
    edges = np.percentile(expected, np.linspace(0, 100, bins+1))
    edges = np.unique(edges)          <i># ← bỏ cạnh trùng; cột nhiều số 0 rất hay dính</i>
    edges[0], edges[-1] = -np.inf, np.inf
    e = np.histogram(expected, edges)[0] / len(expected) + 1e-6
    a = np.histogram(actual,   edges)[0] / len(actual)   + 1e-6
    <b>return</b> <b>float</b>(((a - e) * np.log(a / e)).sum())</div>
  <p class="wb-help">Dòng <code>np.unique</code> là bắt buộc trong thực tế: với cột mà hơn 10% giá trị bằng 0 (rất phổ biến — <code>n_tx_1h</code> chẳng hạn), các phân vị thấp trùng nhau và <code>np.histogram</code> sẽ báo <i>“bins must increase monotonically”</i>.</p>
  <table>
    <tr><th>PSI</th><th>Kết luận</th><th>Hành động</th></tr>
    <tr><td>&lt; 0,10</td><td>Ổn định</td><td>Không làm gì</td></tr>
    <tr><td>0,10 – 0,25</td><td>Có dịch chuyển vừa</td><td>Theo dõi sát, chuẩn bị retrain</td></tr>
    <tr><td>&gt; 0,25</td><td>Dịch chuyển đáng kể</td><td>Retrain</td></tr>
  </table>
  <p>Các ngưỡng này là quy ước ngành (dùng rộng rãi trong credit scoring), không phải định lý — hãy trích dẫn nguồn chứ đừng trình bày như chân lý.</p>

<template data-node="pr-cost">
  <p>Đây là bài ngắn nhưng có tỉ lệ giá trị trên công sức cao nhất trong cả trang. <b>Một bảng quy ra tiền làm luận văn của bạn khác hẳn phần lớn luận văn cùng khoá.</b></p>

  <h2>Ma trận chi phí</h2>
  <table>
    <tr><th></th><th>Thực tế: gian lận</th><th>Thực tế: sạch</th></tr>
    <tr><th>Chặn</th><td>TP: <b>tiết kiệm</b> 3.000.000₫ (trừ 40.000₫ xác minh)</td><td>FP: <b>tốn</b> 40.000₫ + rủi ro mất khách</td></tr>
    <tr><th>Cho qua</th><td>FN: <b>mất</b> 3.000.000₫</td><td>TN: 0₫</td></tr>
  </table>
  <p>Lấy số ở đâu:</p>
  <ul>
    <li><b>Chi phí FN</b> = giá trị trung bình một vụ gian lận. Tính từ chính dữ liệu: <code>df[df.Class==1].amount.mean()</code>, cộng chi phí xử lý khiếu nại.</li>
    <li><b>Chi phí FP</b> = thời gian nhân viên xác minh × lương giờ, cộng ước lượng chi phí khách bực. Con số sau khó — <b>hãy nói rõ đó là giả định và làm phân tích độ nhạy</b>.</li>
  </ul>

  <h2>Phân tích độ nhạy — biến điểm yếu thành điểm mạnh</h2>
  <p>Bạn không biết chính xác chi phí FP. Thay vì đoán một số rồi giấu, hãy cho thấy kết luận của bạn <b>ổn định trong một khoảng rộng</b>:</p>
  <div class="ds-code"><b>for</b> cost_fp <b>in</b> [20_000, 40_000, 80_000, 160_000]:
    t, total = pick_threshold(y_valid, p_valid, COST_FN=3e6, COST_FP=cost_fp)

const LS_KEY = 'ds-roadmap-done-v1';

const LEAVES = TREE.flatMap(p => p.kids.map(k => ({ ...k, phase: p })));
const byId   = Object.fromEntries(LEAVES.map(l => [l.id, l]));

/* Đọc tiến độ. Bốn thứ có thể sai và cả bốn đều xảy ra thật:
     · localStorage bị chặn (chế độ riêng tư, cookie bị khoá) → truy cập ném lỗi
     · giá trị không phải JSON (một tiện ích mở rộng ghi đè, đồng bộ lỗi)
     · JSON hợp lệ nhưng không phải mảng
     · mảng chứa id của những bài đã đổi tên hoặc đã bỏ ở bản trước
   Bản cũ để JSON.parse ném thẳng ra ngoài, và vì dòng đó nằm ở đầu script nên
   TOÀN BỘ trang trắng — người dùng thấy một trang hỏng chứ không mất mỗi tiến độ. */
function loadDone() {
  let raw;
  try { raw = localStorage.getItem(LS_KEY); }
  catch { return { set: new Set(), dropped: 0, blocked: true }; }
  if (!raw) return { set: new Set(), dropped: 0 };
  let arr;
  try { arr = JSON.parse(raw); } catch { return { set: new Set(), dropped: 0, corrupt: true }; }
  if (!Array.isArray(arr)) return { set: new Set(), dropped: 0, corrupt: true };
  const good = arr.filter(v => typeof v === 'string' && byId[v]);
  return { set: new Set(good), dropped: arr.length - good.length };
}

const _loaded = loadDone();
const done = _loaded.set;
const storageBlocked = !!_loaded.blocked;

let saveFailedNotified = false;
function saveDone() {
  if (storageBlocked) return;
  try { localStorage.setItem(LS_KEY, JSON.stringify([...done])); }
  catch {
    // Đọc được lúc đầu nhưng GHI hỏng giữa chừng (hết quota, hoặc trình duyệt đổi
    // chính sách). Bản trước nuốt lỗi ở đây → người học đánh dấu cả buổi rồi mất
    // sạch khi tải lại mà không hề được cảnh báo. Báo MỘT lần, không spam.
    if (!saveFailedNotified) {
      saveFailedNotified = true;
      // Dùng #storeWarn RIÊNG, không dùng #undoBar: luồng "Xoá tiến độ" gọi saveDone()
      // rồi showUndo() ngay sau đó, nên nếu viết vào #undoBar thì cảnh báo bị đè mất
      // trong tích tắc và saveFailedNotified=true khiến nó không hiện lại lần nào nữa.
      const bar = document.getElementById('storeWarn');
      if (bar) {
        bar.hidden = false;
        bar.textContent = 'Không lưu được tiến độ (bộ nhớ cục bộ đầy hoặc bị chặn) — '
                        + 'các đánh dấu mới có thể mất khi tải lại trang.';
      }
      try { announce('Cảnh báo: không lưu được tiến độ vào bộ nhớ cục bộ.'); } catch {}
    }
  }
}
if (_loaded.corrupt || _loaded.dropped) saveDone();   // ghi lại bản đã dọn
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function fmtMin(m) {
  if (m < 60) return m + ' phút';
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h}h${String(r).padStart(2, '0')}` : `${h}h`;
}
/* Tổng của một bài = đọc + thực hành + deliverable. Mọi con số thời lượng
   trên trang đi qua đúng hàm này, nên không có chỗ nào tính khác đi được. */
const mins     = l => l.r + l.x + l.d;
/* Giờ, làm tròn tới 0,5 và viết theo kiểu Việt (dấu phẩy thập phân). Làm tròn
   tới số nguyên như bản cũ biến 74,2 thành "74" ở chỗ này và "5,3 giờ/ngày" ở
   chỗ kia — hai con số không nhân ra nhau, và người đọc phát hiện ngay. */
const hrs = m => (Math.round(m / 30) / 2).toString().replace('.', ',');
/* Tên chặng rút gọn cho chú giải và bảng: giữ số thứ tự, bỏ phần vế sau dấu
   gạch dài hoặc ngoặc. "1 · Công cụ — biết gõ trước khi biết nghĩ" → "1. Công cụ" */
const phaseShort = p => p.t.replace(/^(\d+) · /, '$1. ').replace(/ [—(].*$/, '');
const sumMins  = ls => ls.reduce((s, l) => s + mins(l), 0);
const phaseMin = p => sumMins(p.kids);
const dayMins  = d => sumMins(d.ids.map(i => byId[i]).filter(Boolean));

/* ============================================================
   3. Rail — cây lộ trình
   ============================================================ */
/* Cây lộ trình. Mỗi bài là một <a> thật, không phải <div> gắn onclick — nghĩa là
   Tab tới được, Enter mở được, chuột giữa mở tab mới được, và trình đọc màn hình
   gọi nó là "liên kết" thay vì im lặng. Nút gập/mở là <button> có aria-expanded. */
function buildTree() {
  const ul = $('#tree');
  ul.innerHTML = TREE.map(p => `
    <li class="wb-tree__node ds-tree__phase" data-phase="${p.id}">
      <div class="wb-tree__row" data-goto="${p.kids[0].id}">
        <button class="wb-tree__toggle" aria-expanded="true"
                aria-label="Thu gọn chặng ${p.t}" data-toggle></button>
        <a class="wb-tree__label ds-tree__link" href="#/${p.kids[0].id}">${p.t}</a>
        <span class="wb-tree__meta">${fmtMin(phaseMin(p))}</span>
      </div>
      <ul class="wb-tree__children">
        ${p.kids.map(k => `
          <li class="wb-tree__node" data-leaf="${k.id}">
            <div class="wb-tree__row" data-goto="${k.id}">
              <span class="wb-tree__toggle is-leaf" aria-hidden="true"></span>
              <input type="checkbox" class="wb-tree__check" data-check="${k.id}"
                     aria-label="Đánh dấu đã học xong: ${k.t}">
              <a class="wb-tree__label ds-tree__link" href="#/${k.id}"
                 id="treelink-${k.id}">${k.t}</a>
              <span class="wb-tree__meta" aria-hidden="true">${mins(k)}′</span>
            </div>
          </li>`).join('')}
      </ul>
    </li>`).join('');

  ul.addEventListener('click', e => {
    const toggle = e.target.closest('[data-toggle]');
    if (toggle) {
      const node = toggle.closest('.wb-tree__node');
      const collapsed = node.classList.toggle('is-collapsed');
      toggle.setAttribute('aria-expanded', String(!collapsed));
      toggle.setAttribute('aria-label',
        (collapsed ? 'Mở rộng chặng ' : 'Thu gọn chặng ') + node.querySelector('.wb-tree__label').textContent);
      return;
    }
    if (e.target.closest('a, [data-check]')) return;   // link và checkbox tự lo
    // Bấm vào khoảng trống của hàng vẫn đi tới bài — tiện chuột, và không ảnh
    // hưởng bàn phím vì <div> này không nhận tiêu điểm.
    const row = e.target.closest('[data-goto]');
    if (row) location.hash = '#/' + row.dataset.goto;
  });

  ul.addEventListener('change', e => {
    if (!e.target.matches('[data-check]')) return;
    setDone(e.target.dataset.check, e.target.checked);
  });
}

function setDone(id, val) {
  val ? done.add(id) : done.delete(id);
  saveDone();
  syncProgress();
}

function syncProgress() {
  $$('[data-check]').forEach(c => {
    const on = done.has(c.dataset.check);
    c.checked = on;
    c.closest('.wb-tree__row').querySelector('.wb-tree__label').classList.toggle('is-done', on);
  });
  const total = LEAVES.length, n = LEAVES.filter(l => done.has(l.id)).length;
  const pct = Math.round(n / total * 100);
  $('#railPct').textContent = `${pct}% · ${n}/${total} bài`;
  $('#railBar').style.width = pct + '%';
  $('#topProgress').textContent = pct + '%';
  const btn = $('#markBtn');
  if (btn) {
    const on = done.has(btn.dataset.node);
    btn.classList.toggle('wb-btn--ghost', on);
    btn.innerHTML = on
      ? '<span class="wb-ico wb-ico--sm">check</span> Đã học xong'
      : 'Đánh dấu đã học xong';
  }
}

/* Kết bài: cầm được gì, và bài sau dùng nó làm gì. Dùng wb-card--flat để nó đọc
   như một chỗ nghỉ, không phải một cảnh báo — màu chỉ dành cho trạng thái thật. */
function gainBox(id) {

/* Sau khi đổi hash, trình duyệt KHÔNG dời tiêu điểm — nó vẫn nằm ở cái link vừa
   bấm trong cột trái. Người dùng bàn phím và trình đọc màn hình vì thế không
   biết nội dung đã đổi, và phải Tab lại từ đầu. Hai hàm dưới sửa đúng chuyện đó:
   dời tiêu điểm tới tiêu đề bài mới, và thông báo tên bài qua một vùng aria-live. */
function focusHeading() {
  const h = $('#main h1') || $('#main');
  if (!h) return;
  h.setAttribute('tabindex', '-1');
  h.focus({ preventScroll: true });
}

function announce(msg) {
  const el = $('#routeStatus');
  if (!el) return;
  // Xoá rồi đặt lại sau một nhịp ngắn, vì gán cùng một chuỗi hai lần liên tiếp thì
  // phần lớn trình đọc màn hình không phát lại. Dùng setTimeout chứ KHÔNG dùng
  // requestAnimationFrame: rAF bị tạm dừng khi tab chạy nền (thông báo sẽ rơi mất),
  // và ~16ms của một khung hình là quá nhanh để một số trình đọc kịp ghi nhận thay
  // đổi. 60ms là khoảng an toàn cho cả hai vấn đề.
  el.textContent = '';
  clearTimeout(el._annTimer);
  el._annTimer = setTimeout(() => { el.textContent = msg; }, 60);
}

/* ============================================================
   5. Sau mỗi lần render: toán, popup, viz
   ============================================================ */
function typeset(el) {
  if (!window.renderMathInElement) return;
  renderMathInElement(el, {
    delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }],
    ignoredClasses: ['ds-code'],          // đô-la trong code không phải công thức
    throwOnError: false,
  });
}

/* Dùng cho cả ba nơi có nội dung bài: cột chính, popup toán, ngăn phụ. */
function enhance(scope) {
  // Bảng có thể rộng hơn cột chứa nó trên màn hẹp — cho nó tự cuộn trong khung
  // của mình thay vì đẩy cả trang sang ngang.
  $$('.ds-prose > table', scope).forEach(t => {
    const wrap = document.createElement('div');
    wrap.className = 'wb-table-scroll';
    t.replaceWith(wrap);
    wrap.append(t);
  });
  typeset(scope);
  renderPlan14(scope);
  renderPlanWeeks(scope);
  $$('[data-viz]', scope).forEach(initViz);
}

/* Lịch 14 ngày dựng từ DAYS. Mọi con số giờ ở đây là tổng của chính các bài
   trong ngày đó, nên lịch không thể nói khác trang chủ. */
function renderPlan14(scope) {
  const box = $('#planDays', scope);
  if (!box || box.dataset.ready) return;
  box.dataset.ready = '1';

  box.innerHTML = DAYS.map(d => {
    const items = d.ids.map(i => byId[i]).filter(Boolean);
    const tot = sumMins(items);
    const r = items.reduce((s, l) => s + l.r, 0);
    const x = items.reduce((s, l) => s + l.x, 0);
    const dv = items.reduce((s, l) => s + l.d, 0);
    return `
    <div class="ds-day">
      <p class="ds-day__h">Ngày ${d.n} · ${fmtMin(tot)}</p>
      <p class="ds-day__t">${d.t}</p>
      <p class="ds-daysplit">đọc ${fmtMin(r)} · thực hành ${fmtMin(x)} · deliverable ${fmtMin(dv)}</p>
      <ul class="ds-daylist">${items.map(l => `
        <li><a href="#/${l.id}">${l.t}</a> <span class="ds-leaf__m">${mins(l)}′</span></li>`).join('')}</ul>
      <p>${d.note}</p>
      <p class="wb-help"><b>Nộp được:</b> ${d.out}</p>
    </div>`;
  }).join('');

  const rest = $('#planRest', scope);
  if (rest) {
    const off = LEAVES.filter(l => !FAST.has(l.id));
    rest.innerHTML = `Cộng lại đúng <b>${hrs(sumMins(off))} giờ</b> cho ${off.length} bài bị hoãn — ` +
      `khoảng 4–5 tuần nữa ở nhịp 10 giờ/tuần, và lúc đó bạn đã đi hết lộ trình chuẩn.`;
  }
}

/* Lịch 8 tuần dựng từ WEEKS + TREE. Cùng nguồn số với lịch 14 ngày và trang chủ. */
function renderPlanWeeks(scope) {
  const box = $('#planWeeks', scope);
  if (!box || box.dataset.ready) return;
  box.dataset.ready = '1';

  const cell = w => {
    const ph = w.ids.map(i => TREE.find(p => p.id === i)).filter(Boolean);
    const ls = ph.flatMap(p => p.kids);
    return { ph, ls, tot: sumMins(ls),
             r: ls.reduce((s, l) => s + l.r, 0),
             x: ls.reduce((s, l) => s + l.x, 0),
             d: ls.reduce((s, l) => s + l.d, 0) };
  };
  const rows = WEEKS.map(w => {
    const c = cell(w);
    const heavy = c.tot / 60 > 12;
    return `<tr>
      <td><b>${w.n}</b></td>
      <td>${w.t}</td>
      <td>${c.ph.map(phaseShort).join('<br>')}</td>
      <td class="ds-numcell">${hrs(c.tot)} h${heavy ? ' <span class="wb-cap wb-cap--dashed wb-cap--sm">nặng</span>' : ''}
        <span class="ds-wsplit">${hrs(c.r)} đọc · ${hrs(c.x)} thực hành · ${hrs(c.d)} deliverable</span></td>
      <td>${w.out}</td></tr>`;
  }).join('');
  const total = sumMins(LEAVES);
  box.innerHTML = `<div class="wb-table-scroll"><table>
    <thead><tr><th>Tuần</th><th>Nội dung</th><th>Chặng</th><th>Giờ</th><th>Nộp được gì (deliverable)</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><th colspan="3">Tổng</th>
      <th class="ds-numcell">${hrs(total)} h<span class="ds-wsplit">≈ ${hrs(total / 8)} giờ/tuần</span></th>
      <th>83 bài · 11 chặng</th></tr></tfoot>
  </table></div>`;
}

function afterRender(scope) {
  enhance(scope);
  scope.scrollTop = 0;
  window.scrollTo({ top: 0 });
  syncProgress();
}

/* popup toán + ngăn phụ ---------------------------------------
   Hai lớp thông tin ngoài mạch chính, hai vật chứa khác nhau có chủ ý:
     ∑ chip  → modal ở giữa màn hình: một công thức, đọc xong là xong.
     + chip  → drawer trượt từ phải: một nhánh rẽ dài hơn (so sánh công cụ,
               phương án thay thế), trang chính vẫn thấy được phía sau. */
/* Quản lý tiêu điểm cho hai lớp phủ. Ba việc bắt buộc, và bản trước thiếu cả ba:
     · đưa tiêu điểm vào hộp thoại khi mở, để người dùng bàn phím không bị bỏ lại
       phía sau ở chỗ cũ và phải Tab qua cả trang mới tới được nội dung vừa mở;
     · nhốt Tab/Shift+Tab trong hộp thoại, và chặn nền bằng `inert` để trình đọc
       màn hình không đọc xuyên qua lớp phủ;
     · trả tiêu điểm về đúng cái chip đã mở nó khi đóng.
   Không có ba việc này thì aria-modal="true" chỉ là một lời khai, không phải hành vi. */
const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])';
let lastTrigger = null;

function trapFocus(e) {
  const box = $('.is-open .wb-modal, .is-open .wb-drawer');
  if (!box || e.key !== 'Tab') return;
  const items = $$(FOCUSABLE, box).filter(el => el.offsetParent !== null || el === document.activeElement);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  const cur = document.activeElement;
  // Khi vừa mở, tiêu điểm nằm trên CHÍNH hộp thoại (tabindex="-1") — nó không
  // thuộc danh sách focusable. Nếu chỉ chặn khi active là first/last thì cú
  // Shift+Tab ĐẦU TIÊN lọt qua: trình duyệt lùi tiêu điểm khỏi hộp, mà nền đang
  // `inert` nên không có gì chặn → tiêu điểm rơi ra thanh địa chỉ. Coi mọi vị
  // trí "ngoài danh sách" như biên để vòng lại trong hộp.
  const outside = !items.includes(cur);
  if (e.shiftKey && (outside || cur === first)) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && (outside || cur === last)) { e.preventDefault(); first.focus(); }
}

function openLayer(overlayId, trigger) {
  lastTrigger = trigger || document.activeElement;
  const ov = $('#' + overlayId);
  ov.classList.add('is-open');
  $('#shell').inert = true;                     // nền không nhận tiêu điểm, không bị đọc
  const box = $('.wb-modal, .wb-drawer', ov);
  // Hộp thoại tự nhận tiêu điểm trước, rồi mới tới phần tử đầu tiên bên trong —
  // nhờ vậy trình đọc màn hình đọc tên hộp thoại thay vì đọc thẳng nút Đóng.
  box.setAttribute('tabindex', '-1');
  box.focus();
  document.addEventListener('keydown', trapFocus, true);
}

function closeLayers() {
  const wasOpen = layerOpen();
  $('#mathOverlay').classList.remove('is-open');
  $('#asideOverlay').classList.remove('is-open');
  $('#shell').inert = false;
  document.removeEventListener('keydown', trapFocus, true);
  if (wasOpen && lastTrigger && document.contains(lastTrigger)) lastTrigger.focus();
  lastTrigger = null;
}

function layerOpen() {
  return $('#mathOverlay').classList.contains('is-open') ||
         $('#asideOverlay').classList.contains('is-open');
}

document.addEventListener('click', e => {
  const chip = e.target.closest('[data-math]');
  if (chip) {
    const key = chip.dataset.math;
    const tpl = document.querySelector(`template[data-mathdef="${key}"]`);
    $('#mathTitle').textContent = tpl?.dataset.title || 'Toán';
    const body = $('#mathBody');
    body.innerHTML = '';
    if (tpl) body.append(tpl.content.cloneNode(true));
    else body.innerHTML = '<p class="wb-help">Chưa có ghi chú cho mục này.</p>';
    enhance(body);
    body.parentElement.scrollTop = 0;
    openLayer('mathOverlay', chip);
    return;
  }

  const more = e.target.closest('[data-aside]:not(template)');
  if (more) {
    const key = more.dataset.aside;
    const tpl = document.querySelector(`template[data-aside="${key}"]`);
    $('#asideTitle').textContent = tpl?.dataset.title || 'Thông tin thêm';
    $('#asideSub').textContent = tpl?.dataset.sub || 'Không bắt buộc — đóng lại là về đúng chỗ đang đọc';
    const body = $('#asideBody');
    body.innerHTML = '';
    if (tpl) body.append(tpl.content.cloneNode(true));
    else body.innerHTML = '<p class="wb-help">Chưa có ghi chú cho mục này.</p>';
    body.scrollTop = 0;
    body.parentElement.scrollTop = 0;
    enhance(body);
    openLayer('asideOverlay', more);
    return;
  }

  if (e.target.closest('[data-modal-close]') || e.target.id === 'mathOverlay' || e.target.id === 'asideOverlay') {
    closeLayers();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeLayers(); return; }

  /* [ và ] = bài trước / bài sau. Cùng phím với "lùi/tiến" của nhiều trình đọc.
     Bỏ qua khi đang gõ vào ô tìm kiếm, đang mở lớp phủ, hoặc đang giữ phím tổ hợp
     (⌘] là chuyển tab của trình duyệt — không được cướp). */
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (layerOpen()) return;
  const t = e.target;
  if (t instanceof HTMLElement && (t.matches('input, textarea, select') || t.isContentEditable)) return;
  if (e.key !== '[' && e.key !== ']') return;

  const cur = location.hash.replace(/^#\/?/, '') || 'home';
  const i = LEAVES.findIndex(l => l.id === cur);
  if (e.key === ']') {
    if (i === -1) { if (LEAVES[0]) location.hash = '#/' + LEAVES[0].id; }
    else if (LEAVES[i + 1]) location.hash = '#/' + LEAVES[i + 1].id;
  } else {
    if (i > 0) location.hash = '#/' + LEAVES[i - 1].id;
    else if (i === 0) location.hash = '#/home';
  }
});

/* -- 6.2 Gradient descent ------------------------------------- */
VIZ.gd = el => {
  el.innerHTML = `
    <div class="wb-card"><div class="wb-card__body">
      <p class="ds-viz__label">Kéo “bước học” và xem quả bóng lăn xuống đáy — hoặc văng ra</p>
      <div class="ds-ctrl"><div class="ds-ctrl__top"><span class="ds-ctrl__name">Bước học (learning rate α)</span><span class="ds-ctrl__val" data-o="lr">0,10</span></div>
        <input class="wb-range" type="range" min="1" max="115" value="10" data-i="lr"></div>
      <div class="ds-ctrl"><div class="ds-ctrl__top"><span class="ds-ctrl__name">Số bước</span><span class="ds-ctrl__val" data-o="n">20</span></div>
        <input class="wb-range" type="range" min="1" max="60" value="20" data-i="n"></div>
      <svg viewBox="0 0 320 150" aria-hidden="true">
        <path data-o="curve" fill="none" stroke="var(--wb-border-strong)" stroke-width="1.5"/>
        <g data-o="dots"></g>
      </svg>
      <p class="ds-viz__readout" data-o="res">Sai số cuối: 0,004</p>
      <p class="ds-viz__alt" data-o="alt"></p>
      <p class="ds-viz__see"><b>Điều cần thấy:</b> α nhỏ → bò chậm nhưng chắc chắn tới đáy. α vừa → tới nhanh. α quá lớn (kéo về cuối) → mỗi bước nhảy qua đáy, sai số to dần rồi bay ra ngoài. Đây đúng là cảnh “loss = nan” khi bạn train model.</p>
    </div></div>`;
  const f = x => 0.5 * x * x, df = x => x;
  const out = k => el.querySelector(`[data-o="${k}"]`);
  const upd = () => {
    const lr = +el.querySelector('[data-i="lr"]').value / 50;
    const n  = +el.querySelector('[data-i="n"]').value;
    out('lr').textContent = lr.toFixed(2).replace('.', ',');
    out('n').textContent = n;
    const X = x => 160 + x * 55, Y = y => 138 - Math.min(y, 4.6) * 28;
    let d = '';
    for (let x = -2.6; x <= 2.6; x += 0.05) d += (d ? 'L' : 'M') + X(x) + ' ' + Y(f(x)) + ' ';
    out('curve').setAttribute('d', d);
    let x = -2.4, pts = '';
    for (let i = 0; i < n; i++) {
      x = x - lr * df(x);
      if (!isFinite(x) || Math.abs(x) > 3) { x = Math.sign(x) * 3; pts += `<circle cx="${X(x)}" cy="${Y(f(x))}" r="3" fill="var(--wb-danger)"/>`; break; }
      pts += `<circle cx="${X(x)}" cy="${Y(f(x))}" r="3" fill="var(--wb-fg)" opacity="${0.25 + 0.75 * i / n}"/>`;
    }
    out('dots').innerHTML = pts;
    const err = f(x);
    const blew = err > 4;
    out('res').textContent = 'Sai số cuối: ' + (blew ? 'văng ra ngoài ✗' : err.toFixed(4).replace('.', ','));
    out('alt').textContent =
      `Bước học ${lr.toFixed(2)}, chạy ${n} bước từ điểm xuất phát bên trái parabol. ` +
      (blew ? 'Quả bóng nhảy qua đáy mỗi bước, sai số to dần rồi văng ra ngoài khung — đây là cảnh loss = nan.'
            : `Quả bóng lăn về đáy, sai số cuối ${err.toFixed(4)}.`);
  };
  el.addEventListener('input', upd); upd();
};
