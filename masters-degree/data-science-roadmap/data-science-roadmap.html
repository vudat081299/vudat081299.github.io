<template data-node="t-numpy">
  <p>numpy là lớp nền bên dưới pandas. Bạn sẽ dùng nó ít hơn pandas, nhưng khi cần thì không thay thế được: mọi mô hình đều nhận đầu vào là mảng numpy, và mọi phép toán trên vector đều chạy qua đây.</p>

  <h2>Khác biệt cốt lõi: mảng numpy vs list Python</h2>
  <div class="ds-code"><b>import</b> numpy <b>as</b> np

xs = [1, 2, 3]
xs * 2            <i># → [1, 2, 3, 1, 2, 3]   ← nối danh sách!</i>

a = np.array([1, 2, 3])
a * 2             <i># → array([2, 4, 6])      ← nhân từng phần tử</i>
a + a             <i># → array([2, 4, 6])</i>
a @ a             <i># → 14  (tích vô hướng)</i></div>
  <p>Đây là toàn bộ ý tưởng: numpy làm <b>phép toán theo phần tử trên cả mảng cùng lúc</b>, chạy bằng mã C bên dưới. Một vòng lặp Python xử lý 1 triệu số mất khoảng 0,3 giây; numpy mất khoảng 0,003 giây.</p>
  <p><button class="ds-math" data-math="dot">Vector, tích vô hướng và khoảng cách</button> — nếu bạn chưa chắc “tích vô hướng” là gì thì mở cái này trước.</p>

  <h2>Những thứ bạn thật sự dùng</h2>
  <div class="ds-code">np.log1p(x)          <i># log(1+x) — cho cột số tiền lệch</i>
np.expm1(x)          <i># đảo ngược log1p</i>
np.where(cond, a, b) <i># như IF trong Excel, chạy trên cả mảng</i>
np.clip(x, 0, 1e7)   <i># cắt ngoại lai về khoảng cho phép</i>
np.percentile(x, [1, 99])
np.sin(x), np.cos(x), np.pi        <i># ← dùng cho mã hoá chu kỳ</i>
np.random.default_rng(42)          <i># bộ sinh ngẫu nhiên có seed</i>
arr.reshape(-1, 1)   <i># biến (n,) thành (n,1) — sklearn hay đòi</i>
arr.shape, arr.dtype</div>

  <h2>Hai khái niệm gây lỗi nhiều nhất</h2>
  <h3>1 · Shape</h3>
  <p><code>(1000,)</code> và <code>(1000, 1)</code> <b>không giống nhau</b>: cái đầu là một dãy phẳng, cái sau là một cột. sklearn thường đòi cái sau và báo <code>Expected 2D array, got 1D array instead</code>. Sửa bằng <code>.reshape(-1, 1)</code> — dấu <code>-1</code> nghĩa là “tự tính chiều này ra”.</p>
  <p><button class="ds-math" data-math="matmul">Ma trận và luật khớp shape</button></p>
  <h3>2 · Broadcasting</h3>
  <div class="ds-code">X = np.random.rand(1000, 5)   <i># 1000 dòng, 5 cột</i>
mu = X.mean(axis=0)            <i># shape (5,) — trung bình mỗi cột</i>
X_centered = X - mu            <i># numpy tự "nhân bản" mu cho 1000 dòng</i></div>
  <p><code>axis=0</code> nghĩa là “gộp dọc theo hàng” → ra một giá trị cho mỗi cột. <code>axis=1</code> thì ngược lại. Cách nhớ: <b>axis là chiều bị bóp mất</b>.</p>
  <p>Broadcasting rất tiện nhưng cũng lặng lẽ: nếu shape của bạn sai theo một cách "hợp lệ", numpy sẽ tạo ra một mảng khổng lồ thay vì báo lỗi. Khi kết quả ra shape lạ, in <code>.shape</code> ở từng bước.</p>

  <h2>Seed — điều kiện bắt buộc của luận văn</h2>
  <div class="ds-code">rng = np.random.default_rng(42)   <i># cách hiện đại, khuyên dùng</i>
rng.integers(0, 100, size=5)
<i># mọi hàm sklearn có tham số random_state=42</i></div>
  <p>Không cố định seed thì mỗi lần chạy ra một kết quả khác, và bạn không thể trả lời câu hỏi “chênh lệch này là do mô hình tốt hơn hay do may”. Đặt seed ở <b>mọi</b> chỗ có ngẫu nhiên: chia tập, khởi tạo mô hình, subsample.</p>
</template>

<template data-node="t-sklearn">
  <p>scikit-learn có hàng trăm lớp, nhưng tất cả đều tuân theo <b>bốn khái niệm</b>. Nắm được bốn cái này thì bạn dùng được cả thư viện mà không cần đọc tài liệu từng lớp — kể cả những lớp bạn chưa từng thấy.</p>

  <h2>1 · Estimator — mọi thứ đều là một đối tượng có <code>fit</code></h2>
  <div class="ds-code"><b>from</b> sklearn.linear_model <b>import</b> LogisticRegression
model = LogisticRegression(C=1.0, max_iter=1000)   <i># cấu hình ở đây (siêu tham số)</i>
model.fit(X_train, y_train)                        <i># học từ dữ liệu</i>
model.predict(X_test)                              <i># → nhãn 0/1</i>
model.predict_proba(X_test)[:, 1]                  <i># → xác suất lớp 1  ← thường bạn cần cái này</i></div>
  <p>Quy ước tên: thuộc tính <b>học được từ dữ liệu</b> luôn kết thúc bằng dấu gạch dưới — <code>model.coef_</code>, <code>model.classes_</code>, <code>scaler.mean_</code>. Thấy dấu <code>_</code> ở cuối là biết nó chỉ tồn tại sau khi <code>fit</code>.</p>
  <div class="wb-alert wb-alert--warning wb-alert--plain"><div class="wb-alert__body">
    <p class="wb-alert__title">Với bài toán lệch nhãn, đừng dùng <code>predict</code></p>
    <p class="wb-alert__msg"><code>predict</code> mặc định cắt ở ngưỡng 0,5. Với 0,17% gian lận, gần như không giao dịch nào vượt 0,5 → mô hình trả về toàn số 0 và bạn tưởng nó hỏng. Hãy lấy <code>predict_proba</code> rồi <b>tự chọn ngưỡng</b> — xem bài <b>Đo lường &amp; ngưỡng</b>.</p>
  </div></div>

  <h2>2 · Transformer — <code>fit</code> ở train, <code>transform</code> ở mọi nơi</h2>
  <div class="ds-code"><b>from</b> sklearn.preprocessing <b>import</b> StandardScaler
scaler = StandardScaler()
scaler.fit(X_train)                  <i># HỌC μ và σ — chỉ từ train</i>
Xtr = scaler.transform(X_train)      <i># ÁP DỤNG</i>
Xte = scaler.transform(X_test)       <i># ÁP DỤNG cùng μ, σ đó — KHÔNG fit lại</i>

Xtr = scaler.fit_transform(X_train)  <i># viết tắt của hai dòng đầu</i></div>
  <p>Đây là chỗ sinh ra lỗi rò rỉ dữ liệu phổ biến nhất trong ngành. Nếu bạn <code>fit</code> trên toàn bộ dữ liệu, thì $\mu$ và $\sigma$ đã chứa thông tin của tập test → kết quả đẹp giả tạo. <button class="ds-math" data-math="standardize">Chi tiết Standardize vs Min-Max, và cái bẫy này</button></p>

  <h2>3 · Pipeline — nối các bước thành một đối tượng duy nhất</h2>
  <div class="ds-code"><b>from</b> sklearn.pipeline <b>import</b> Pipeline

pipe = Pipeline([
    ("scale", StandardScaler()),
    ("model", LogisticRegression()),
])
pipe.fit(X_train, y_train)         <i># fit_transform cho scale, rồi fit cho model</i>
pipe.predict_proba(X_test)         <i># transform cho scale, rồi predict cho model</i></div>
  <p>Ba lý do khiến đây là khái niệm quan trọng nhất trong sklearn:</p>
  <ul>
    <li><b>Không thể rò rỉ.</b> Trong cross-validation, pipeline tự động <code>fit</code> lại scaler <i>bên trong từng fold</i>. Làm tay thì gần như chắc chắn bạn sẽ sai chỗ này.</li>
    <li><b>Lúc chạy thật không lệch.</b> Bạn lưu <i>một</i> file chứa cả cách tạo feature lẫn mô hình. API chỉ cần <code>pipe.predict_proba(df_1_dòng)</code> — không có cơ hội để code production tính feature khác với lúc train.</li>
    <li><b>Tune được cả hai tầng cùng lúc:</b> <code>{"model__C": [0.1, 1, 10], "scale__with_mean": [True, False]}</code> — hai dấu gạch dưới nối tên bước với tên tham số.</li>
  </ul>

  <h2>4 · ColumnTransformer — mỗi loại cột một cách xử lý</h2>
  <p>Dữ liệu thật không đồng nhất: cột số cần scale, cột chữ cần one-hot, cột giờ cần sin/cos. <code>ColumnTransformer</code> là cái bảng điều phối đó.</p>
  <div class="ds-code"><b>from</b> sklearn.compose <b>import</b> ColumnTransformer
<b>from</b> sklearn.preprocessing <b>import</b> OneHotEncoder

prep = ColumnTransformer([
    ("num", StandardScaler(),                        ["amount", "n_tx_1h"]),
    ("cat", OneHotEncoder(handle_unknown="ignore"),  ["merchant_type", "city"]),
], remainder="drop")

pipe = Pipeline([("prep", prep), ("model", LGBMClassifier())])</div>
  <p><code>handle_unknown="ignore"</code> là thứ cứu bạn khi chạy thật: hôm nay xuất hiện một thành phố chưa từng có trong tập train, không có tham số này thì API sẽ nổ.</p>
  <p>Bài <b>★ Pipeline + ColumnTransformer</b> ở chặng 4 sẽ ráp đầy đủ, bao gồm cả cách nhét biến đổi sin/cos của bạn vào đây.</p>

  <p class="ds-more"><button class="ds-aside" data-aside="x-sklearn-imports">Bản đồ import: cần gì lấy từ đâu</button><button class="ds-aside" data-aside="cmp-gbdt">So sánh thư viện boosting</button></p>
</template>

<template data-node="m-vector">
  <p>Bạn không cần học lại đại số tuyến tính. Bạn cần đúng ba ý, vì chúng quyết định bạn <b>đọc được lỗi</b> và <b>hiểu vì sao phải scale dữ liệu</b>.</p>

  <h2>Ý 1 — Một dòng dữ liệu là một điểm trong không gian</h2>
  <p>Giao dịch của bạn có 3 cột: số tiền, giờ, số lần quẹt trong 1 giờ. Vậy nó là một điểm trong không gian 3 chiều, toạ độ <code>(250000, 23, 4)</code>. Với 30 cột thì là một điểm trong không gian 30 chiều — không hình dung nổi, nhưng <b>toán thì y hệt</b>.</p>
  <p>Toàn bộ machine learning là hình học trên đám điểm này: mô hình tuyến tính vẽ một mặt phẳng chia đôi chúng, KNN tìm điểm gần nhất, k-means gom cụm, mạng nơ-ron bẻ cong không gian cho tới khi hai lớp tách rời.</p>
  <p><button class="ds-math" data-math="dot">Vector, tích vô hướng, khoảng cách — giải chi tiết</button></p>

  <h2>Ý 2 — “Gần nhau” phụ thuộc vào đơn vị đo, nên phải scale</h2>
  <p>Hai giao dịch: A = (1.000.000đ, 10h) và B = (1.000.100đ, 22h). Khoảng cách Euclid giữa chúng:</p>
  <p>$$\sqrt{100^2 + 12^2} = \sqrt{10000 + 144} \approx 100{,}7$$</p>
  <p>Con số bị chi phối hoàn toàn bởi 100 đồng chênh lệch, trong khi 12 tiếng chênh lệch gần như vô hình. Máy không biết 100 đồng là không đáng kể còn 12 tiếng là rất đáng kể — nó chỉ thấy hai con số.</p>
  <p>Sau khi chuẩn hoá (mỗi cột trừ trung bình, chia độ lệch chuẩn), cả hai cột nói cùng một ngôn ngữ: “cách trung bình bao nhiêu độ lệch chuẩn”. Đó là lý do <code>StandardScaler</code> tồn tại, và tại sao nó phải nằm trước mọi mô hình đo khoảng cách.</p>
  <p><button class="ds-math" data-math="standardize">Standardize vs Min-Max vs Robust</button></p>

  <h2>Ý 3 — Ma trận là cả bảng, và mọi lỗi shape đều nói cùng một điều</h2>
  <p>Bảng 1.000 giao dịch × 30 cột là ma trận $X$ kích thước $1000\times30$. Mô hình tuyến tính có 30 trọng số. Nhân $Xw$ ra 1.000 điểm số cùng lúc.</p>
  <p><button class="ds-math" data-math="matmul">Nhân ma trận và luật khớp shape</button></p>
  <p>Thói quen nên tạo ngay tuần này: sau mỗi bước biến đổi dữ liệu, in <code>X.shape</code>. 80% lỗi trong tuần đầu là lỗi shape, và <code>.shape</code> chỉ thẳng vào chỗ sai.</p>

  <p class="ds-more"><button class="ds-aside" data-aside="x-la-skip">Phần đại số tuyến tính bỏ qua được</button></p>
  </template>

<template data-node="m-deriv">
  <p>Đây là bài toán quan trọng nhất trong cả chặng 2, vì nó trả lời câu hỏi mà mọi người đều gật đầu mà ít ai nói lại được: <b>“máy học” cụ thể là làm gì?</b></p>

  <h2>Câu trả lời trong một câu</h2>
  <p>Máy có một bộ số (tham số), một cách chấm điểm mức độ sai (hàm mất mát), và nó <b>lặp đi lặp lại việc nhích bộ số theo hướng làm điểm sai giảm xuống</b>. Hết. Không có gì huyền bí hơn.</p>

  <h2>Ba mảnh ghép</h2>
  <h3>1 · Đạo hàm = độ dốc tại một điểm</h3>
  <p>Bạn đứng trên sườn đồi trong sương mù. Không nhìn thấy đáy, nhưng cảm nhận được chân mình đang nghiêng về đâu và dốc cỡ nào. Đạo hàm là con số mô tả đúng cảm giác đó.</p>
  <p><button class="ds-math" data-math="deriv">Đạo hàm &amp; gradient — chi tiết, có ví dụ số</button></p>

  <h3>2 · Gradient = độ dốc khi có nhiều tham số</h3>
  <p>Mô hình không có 1 nút vặn mà có 30 (hoặc 175 tỉ). Gradient là danh sách “vặn nút này thì sai số đổi bao nhiêu” cho từng nút. Gộp lại, nó là một mũi tên chỉ hướng <b>dốc lên nhanh nhất</b>.</p>

  <h3>3 · Bước đi = trừ đi gradient nhân với độ dài bước</h3>
  <p>$$w \leftarrow w - \alpha\,\nabla J(w)$$</p>
  <p><button class="ds-math" data-math="gdupdate">Bóc từng ký hiệu + chạy tay một bước</button></p>

  <h2>Nhìn thấy nó chạy</h2>
  <p>Kéo hai thanh dưới đây. Đây là toàn bộ quá trình huấn luyện, thu nhỏ về một tham số duy nhất:</p>

<template data-node="m-prob">
  <p>Xác suất trong data science phục vụ hai việc rất cụ thể: <b>mô tả một cột dữ liệu</b> (nó thường bao nhiêu, dao động cỡ nào) và <b>hiểu đầu ra của mô hình</b> (0,73 nghĩa là gì).</p>

  <h2>Ba con số mô tả một cột</h2>
  <p><button class="ds-math" data-math="expvar">Kỳ vọng, phương sai, độ lệch chuẩn — có ví dụ số</button></p>
  <p>Điều quan trọng nhất trong popup đó, nhắc lại ở đây vì bạn sẽ gặp mỗi ngày: với dữ liệu tiền tệ, <b>trung bình gần như luôn gây hiểu nhầm</b>. Một giao dịch 3 tỉ kéo trung bình lên trời trong khi 99% giao dịch quanh 200k. Luôn nhìn cả <code>median</code> và các phân vị — <code>df.describe()</code> đã in sẵn cho bạn.</p>

  <h2>Hình chuông và z-score</h2>
  <p><button class="ds-math" data-math="normal">Phân phối chuẩn, quy tắc 68–95–99,7, z-score</button></p>
  <p>Ứng dụng trực tiếp cho bài toán gian lận: thay vì hỏi “giao dịch này có to không”, hỏi <b>“giao dịch này to bất thường so với chính khách hàng đó không”</b>. Cột đó là z-score cá nhân hoá:</p>
  <div class="ds-code">stats = df.groupby("card_id")["amount"].agg(["mean", "std"])
df = df.merge(stats, on="card_id", how="left")
df["z_amount"] = (df["amount"] - df["mean"]) / (df["std"] + 1e-6)   <i># +ε tránh chia 0</i></div>
  <p>(Bản này còn rò rỉ vì <code>mean</code>/<code>std</code> tính trên cả tương lai — cách sửa nằm ở bài <b>Biến theo thời gian</b>. Nhưng ý tưởng thì đúng.)</p>

  <h2>Phân phối lệch — hình dạng thật của dữ liệu tiền</h2>
  <p>Số tiền giao dịch, thu nhập, lượt xem video, dân số thành phố — tất cả đều <b>lệch phải</b>: đa số nhỏ, vài giá trị khổng lồ. Đó không phải lỗi dữ liệu, đó là bản chất.</p>
  <p><button class="ds-math" data-math="logtransform">Vì sao lấy log của số tiền — bảng đối chiếu</button></p>

  <h2>Đọc đầu ra của mô hình cho đúng</h2>
  <p>Mô hình trả về 0,73. Nghĩa là gì?</p>
  <ul>
    <li><b>Nếu mô hình được hiệu chỉnh tốt (calibrated):</b> trong tất cả các giao dịch mà mô hình chấm 0,73, khoảng 73% thật sự là gian lận. Đây là cách hiểu đúng.</li>
    <li><b>Thực tế thường không như vậy.</b> Cây/boosting hay bị lệch hiệu chỉnh, đặc biệt sau khi bạn cân bằng lại dữ liệu bằng SMOTE hoặc <code>class_weight</code>.</li>
    <li>Kiểm tra bằng <b>calibration curve</b>; sửa bằng <code>CalibratedClassifierCV</code>. Nếu luận văn của bạn dùng con số xác suất để quy ra tiền, phần này <b>phải</b> có.</li>
  </ul>
  <div class="ds-code"><b>from</b> sklearn.calibration <b>import</b> calibration_curve
prob_true, prob_pred = calibration_curve(y_test, y_prob, n_bins=10)
<i># vẽ prob_pred (trục x) vs prob_true (trục y); đường lý tưởng là đường chéo 45°</i></div>

  <h2>Điều thường bị hiểu ngược</h2>
  <div class="wb-alert wb-alert--warning wb-alert--plain"><div class="wb-alert__body">
    <p class="wb-alert__title">“Dữ liệu của tôi không theo phân phối chuẩn, có train được không?”</p>
    <p class="wb-alert__msg">Được, hoàn toàn bình thường. Cây, rừng, boosting <b>không giả định phân phối nào cả</b>. Giả định chuẩn chỉ cần cho một số kiểm định thống kê và cho khoảng tin cậy của hồi quy tuyến tính — tức là ở phần <i>luận văn</i>, không phải phần <i>mô hình</i>. Đây là chỗ nhiều người mới tự làm khó mình.</p>

<template data-node="m-bayes">
  <p>Bayes đáng một bài riêng không phải vì bạn sẽ code nó, mà vì nó là <b>công cụ tư duy duy nhất giải thích được vì sao một mô hình “chính xác 99%” vẫn có thể vô dụng</b> — và đó chính là bài toán gian lận của bạn.</p>

  <h2>Ví dụ sẽ đi thẳng vào luận văn của bạn</h2>
  <p><button class="ds-math" data-math="bayes">Bayes — chạy hết bằng số, 100.000 giao dịch</button></p>
  <p>Kết quả trong popup, tóm lại: một hệ thống bắt đúng 99% gian lận và chỉ báo nhầm 1% giao dịch sạch, khi chạy trên dữ liệu có 0,2% gian lận, sẽ cho ra <b>precision chỉ 16,6%</b>. Cứ 6 lần báo động thì 5 lần làm phiền khách hàng thật.</p>
  <p>Đây không phải mô hình tệ. Đây là hệ quả toán học của việc <b>lớp dương quá hiếm</b>. Không kỹ thuật nào xoá được nó — bạn chỉ có thể đánh đổi.</p>

  <h2>Ba cách nói lại cùng một ý, chọn cách hợp với người nghe</h2>
  <table>
    <tr><th>Người nghe</th><th>Cách nói</th></tr>
    <tr><td>Hội đồng luận văn</td><td>“Với base rate 0,2%, precision bị chặn trên bởi tỉ lệ dương thật; do đó chúng tôi báo cáo PR-AUC thay vì ROC-AUC.”</td></tr>
    <tr><td>Trưởng phòng vận hành</td><td>“Muốn bắt thêm 10 vụ gian lận, đội anh phải gọi thêm khoảng 300 cuộc xác minh. Anh chọn con số nào?”</td></tr>
    <tr><td>Chính bạn, lúc debug</td><td>“Precision thấp không có nghĩa model hỏng. Kiểm tra base rate trước khi đi sửa model.”</td></tr>
  </table>

  <h2>Naive Bayes — mô hình, chứ không phải định lý</h2>
  <p>Có một mô hình tên là Naive Bayes dùng định lý này trực tiếp. “Naive” (ngây thơ) vì nó giả định <b>các feature độc lập với nhau</b> — giả định gần như luôn sai trong thực tế (số tiền và loại cửa hàng rõ ràng liên quan nhau).</p>
  <p>Vậy sao vẫn dùng? Vì nó cực nhanh, cần rất ít dữ liệu, và bất ngờ hiệu quả cho phân loại văn bản (lọc spam). Với dữ liệu bảng của bạn, nó chỉ đáng dùng làm <b>baseline rẻ tiền</b> — có một baseline "ngây thơ" trong bảng so sánh của luận văn là điểm cộng.</p>
  <div class="ds-code"><b>from</b> sklearn.naive_bayes <b>import</b> GaussianNB
nb = GaussianNB().fit(X_train, y_train)</div>

  <h2>Tư duy Bayes ngoài công thức</h2>
  <p>Ý cốt lõi đáng mang theo: <b>bằng chứng mới không thay thế niềm tin cũ, nó cập nhật niềm tin cũ</b>. Nếu bạn tin trước rằng gian lận rất hiếm, thì một tín hiệu yếu không đủ để lật niềm tin đó; cần tín hiệu rất mạnh. Đó chính là lý do trong hệ thống thật, người ta không chặn ngay mà <b>xếp hàng theo điểm rủi ro</b> rồi để người xác minh những ca cao nhất.</p>

  <h3>1 · Khoảng tin cậy bằng bootstrap — dùng mặc định</h3>

  <p>Đây là công cụ mạnh nhất vì nó áp dụng cho <b>mọi</b> chỉ số, kể cả “số tiền tiết kiệm được” — thứ không có công thức phương sai nào sẵn. Báo cáo dạng: <b>AUC = 0,921 (KTC 95%: 0,908–0,933)</b>.</p>
  <p>Quy tắc đọc: nếu khoảng của bạn <b>chồng lấn</b> khoảng của baseline, bạn chưa chứng minh được gì. Nói thẳng điều đó trong luận văn tốt hơn nhiều so với để phản biện chỉ ra.</p>

<template data-node="d-clean">
  <p>Ba vấn đề, ba cách xử lý. Nguyên tắc xuyên suốt: <b>mọi quyết định làm sạch đều phải nằm trong code, không phải trong Excel</b>, và phải học từ train rồi áp cho test — không bao giờ ngược lại.</p>

  <h2>1 · Giá trị thiếu</h2>
  <h3>Bước đầu tiên: hỏi vì sao thiếu</h3>
  <table>
    <tr><th>Kiểu thiếu</th><th>Ví dụ</th><th>Xử lý</th></tr>
    <tr><td>Thiếu ngẫu nhiên</td><td>Lỗi ghi log</td><td>Điền bằng trung vị / mode</td></tr>
    <tr><td><b>Thiếu mang thông tin</b></td><td>Cột "email khách" rỗng vì khách chưa đăng ký — mà khách chưa đăng ký thì rủi ro cao hơn</td><td>Điền <b>và</b> thêm cột cờ <code>_is_missing</code></td></tr>
    <tr><td>Thiếu do cấu trúc</td><td>"Ngày hoàn tiền" rỗng vì chưa hoàn tiền</td><td>Không phải thiếu — là "không áp dụng". Mã hoá riêng</td></tr>
  </table>
  <div class="ds-code"><b>from</b> sklearn.impute <b>import</b> SimpleImputer

<i># cách đúng, nằm trong pipeline nên không rò rỉ</i>
num_pipe = Pipeline([
    <i># add_indicator=True tự sinh thêm cột cờ 0/1 cho mỗi cột có giá trị thiếu</i>
    ("impute", SimpleImputer(strategy="median", add_indicator=<b>True</b>)),
    ("scale",  StandardScaler()),
])</div>
  <p>Dùng <b>trung vị</b> chứ không phải trung bình cho dữ liệu tiền tệ — trung bình bị ngoại lai kéo lệch <button class="ds-math" data-math="expvar">(xem ví dụ số)</button>.</p>
  <p><code>add_indicator=<b>True</b></code> là cách gọn nhất để vừa điền vừa giữ lại thông tin "chỗ này vốn trống". Nếu muốn tách riêng, sklearn còn lớp <code>MissingIndicator</code>. (Bạn có thể gặp <code>AddMissingIndicator</code> trong bài viết trên mạng — đó là của thư viện <code>feature_engine</code>, không phải sklearn, nên đừng ngạc nhiên khi import không được.)</p>
  <p><b>Khi nào xoá thay vì điền:</b> cột thiếu &gt; 60% và không mang thông tin → bỏ cột. Dòng thiếu <i>nhãn</i> → bỏ dòng (không bao giờ đoán nhãn).</p>

  <h2>2 · Ngoại lai</h2>
  <p>Câu hỏi đầu tiên không phải "xoá thế nào" mà <b>"đây là lỗi nhập liệu hay là sự thật hiếm gặp?"</b></p>
  <ul>
    <li>Số tiền âm, tuổi 200, ngày 30/02 → lỗi. Sửa hoặc bỏ.</li>
    <li>Giao dịch 3 tỉ đồng → có thể hoàn toàn thật. <b>Và trong bài toán gian lận, ngoại lai chính là thứ bạn đang đi tìm.</b> Xoá chúng là xoá mất tín hiệu.</li>
  </ul>
  <p>Vì vậy, thay vì xoá, hãy <b>làm dịu ảnh hưởng</b>:</p>
  <div class="ds-code"><i># cắt ngưỡng (winsorize) — giữ dòng, giới hạn giá trị</i>
lo, hi = df["amount"].quantile([0.001, 0.999])
df["amount_clipped"] = df["amount"].clip(lo, hi)

<i># hoặc đổi thang đo</i>
df["amount_log"] = np.log1p(df["amount"])

<i># hoặc dùng scaler miễn nhiễm ngoại lai</i>
<b>from</b> sklearn.preprocessing <b>import</b> RobustScaler</div>
  <p><b>Quan trọng:</b> ngưỡng <code>lo</code>/<code>hi</code> phải tính từ <b>tập train</b>, rồi áp cho test. Tính trên toàn bộ dữ liệu là rò rỉ.</p>

  <h2>3 · Trùng lặp và kiểu dữ liệu</h2>
  <div class="ds-code"><i># trùng thật sự</i>
df = df.drop_duplicates(subset=["tx_id"])

<i># kiểu dữ liệu — làm sớm, tiết kiệm hàng giờ debug</i>
df["ts"]      = pd.to_datetime(df["timestamp"], errors="coerce")
df["amount"]  = pd.to_numeric(df["amount"], errors="coerce")
df["city"]    = df["city"].str.strip().str.lower()   <i># " Hà Nội " và "hà nội" là một</i></div>
  <p><code>errors="coerce"</code> biến giá trị hỏng thành <code>NaN</code> thay vì làm nổ chương trình — rồi bạn đếm được có bao nhiêu cái hỏng bằng <code>.isna().sum()</code>.</p>
  <p>Chuẩn hoá chuỗi (<code>strip</code>, <code>lower</code>) nghe nhỏ nhặt nhưng thường làm số giá trị khác nhau của một cột giảm 30% — nghĩa là one-hot nhẹ đi 30% và mô hình học tốt hơn.</p>

  <h2>Ranh giới giữa "làm sạch" và "tạo feature"</h2>
  <p>Câu hỏi hay bị lẫn. Phân biệt đơn giản:</p>
  <table>
    <tr><th>Làm sạch (bước 4)</th><th>Feature engineering (bước 5)</th></tr>
    <tr><td>Sửa cái <b>sai</b>: kiểu dữ liệu, trùng, giá trị bất khả thi</td><td>Tạo cái <b>mới</b> từ cái đúng: sin/cos, tỉ lệ, đếm theo cửa sổ</td></tr>
    <tr><td>Làm một lần, ghi ra <code>data/processed/</code></td><td>Nằm trong <code>Pipeline</code>, chạy lại mỗi lần dự đoán</td></tr>
  </table>
  <p>Quy tắc thực dụng: nếu phép biến đổi <b>học tham số từ dữ liệu</b> (trung vị để điền, μ/σ để scale, danh sách hạng mục để one-hot) thì nó <b>phải</b> nằm trong Pipeline, dù bạn gọi nó là làm sạch. Chỉ những phép sửa tuyệt đối (đổi kiểu, bỏ trùng) mới được làm ngoài.</p>

<template data-node="d-leak">
  <p>Data leakage là khi mô hình được nhìn thấy thông tin mà lúc dự đoán thật <b>nó sẽ không có</b>. Kết quả: điểm số đẹp rực rỡ trên giấy, vô dụng khi chạy thật.</p>
  <p>Đây là <b>lỗi nghiêm trọng nhất trong toàn bộ trang này</b>. Một mô hình tệ vẫn là một luận văn hợp lệ. Một mô hình bị rò rỉ là một luận văn sai — và phản biện có kinh nghiệm phát hiện nó trong 5 phút.</p>

  <div class="wb-alert wb-alert--danger">
    <span class="wb-alert__icon">!</span>
    <div class="wb-alert__body"><p class="wb-alert__title">Dấu hiệu nhận biết duy nhất bạn cần nhớ</p>
      <p class="wb-alert__msg"><b>Kết quả đẹp hơn mức hợp lý.</b> AUC 0,999 trên bài toán gian lận, accuracy 100%, mô hình đơn giản bỗng thắng mọi thứ. Phản xạ đúng không phải là vui mừng mà là: <i>"tôi vừa rò rỉ ở đâu?"</i></p></div>
  </div>

  <h2>Câu hỏi gốc: tại thời điểm dự đoán, tôi biết những gì</h2>
  <p>Mọi kiểu rò rỉ bên dưới đều là biến thể của một câu hỏi duy nhất. Trả lời được nó cho từng cột là bạn đã chặn được gần hết:</p>
  <div data-viz="leak"></div>

  <h2>Sáu kiểu rò rỉ, từ phổ biến nhất</h2>

  <h3>1 · Rò rỉ mục tiêu — cột chứa đáp án</h3>
  <p>Cột <code>trang_thai = "đã hoàn tiền"</code> chỉ được điền sau khi xác nhận gian lận. Hay cột <code>so_lan_khieu_nai</code>. Chúng tương quan gần như hoàn hảo với nhãn vì chúng <b>là hệ quả của nhãn</b>, không phải nguyên nhân.</p>
  <p><b>Cách bắt:</b> chạy <code>df.corr()["label"].abs().sort_values(ascending=False)</code>. Mọi cột &gt; 0,8 đều phải bị thẩm vấn: <i>"cột này được ghi vào lúc nào so với thời điểm dự đoán?"</i></p>

  <h3>2 · Rò rỉ thời gian — dùng tương lai đoán quá khứ</h3>
  <p>Chia ngẫu nhiên một tập dữ liệu có thời gian: giao dịch tháng 12 nằm ở train, giao dịch tháng 6 nằm ở test. Mô hình đã "biết" xu hướng cuối năm khi đoán giữa năm.</p>
  <p><b>Cách chữa:</b> chia theo thời gian. Train = 8 tháng đầu, test = 2 tháng cuối. Chi tiết ở bài <b>Chia tập</b>.</p>

  <h3>3 · Rò rỉ tiền xử lý — <code>fit</code> trên toàn bộ dữ liệu</h3>
  <div class="ds-code"><i># ✗ SAI — μ, σ đã nhìn thấy tập test</i>
X = StandardScaler().fit_transform(X_all)
X_train, X_test = train_test_split(X)

<i># ✓ ĐÚNG — chia trước, và để Pipeline lo phần còn lại</i>
X_train, X_test = train_test_split(X_all)
pipe = Pipeline([("scale", StandardScaler()), ("model", LGBMClassifier())])
pipe.fit(X_train, y_train)</div>
  <p>Áp dụng cho <b>mọi</b> thứ học tham số: scaler, imputer, one-hot, PCA, target encoding, chọn feature.</p>

  <h3>4 · Rò rỉ nhóm — cùng một thực thể ở hai bên</h3>
  <p>Một khách hàng có 200 giao dịch. Chia ngẫu nhiên → 160 ở train, 40 ở test. Mô hình học thuộc thói quen của chính khách đó rồi được chấm điểm trên chính khách đó. Điểm cao giả tạo, và sẽ sụp khi gặp khách mới.</p>
  <p><b>Cách chữa:</b> <code>GroupKFold</code> hoặc <code>GroupShuffleSplit</code> với <code>groups=df["card_id"]</code>.</p>

  <h3>5 · Rò rỉ qua feature tổng hợp</h3>
  <p>Đây là kiểu tinh vi nhất, và nó ẩn ngay trong đoạn code "trung bình theo khách" mà bạn thấy ở bài pandas:</p>
  <div class="ds-code"><i># ✗ SAI — trung bình này gồm cả giao dịch TƯƠNG LAI của khách đó</i>
df["avg_amt"] = df.groupby("card_id")["amount"].transform("mean")

<i># ✓ ĐÚNG — chỉ dùng dữ liệu trước thời điểm hiện tại</i>
df = df.sort_values("ts")
df["avg_amt"] = (df.groupby("card_id")["amount"]
                   .transform(<b>lambda</b> s: s.shift(1).expanding().mean()))</div>
  <p><code>.shift(1)</code> là chi tiết sống còn: nó đẩy chuỗi xuống một dòng để giao dịch hiện tại <b>không tự tính vào trung bình của chính nó</b>.</p>

  <h3>6 · Rò rỉ qua chính bạn</h3>
  <p>Bạn thử 30 cấu hình, mỗi lần nhìn điểm trên tập test, giữ cái tốt nhất. Tập test đã hết "chưa từng thấy" — bạn đã dùng nó để chọn mô hình, tức là nó đã thành validation. Con số cuối cùng bị thổi phồng.</p>
  <p><b>Cách chữa:</b> ba tập. Train để học, validation để chọn, test để báo cáo — và <b>chỉ chạm vào test đúng một lần</b>, khi mọi quyết định đã chốt.</p>

  <h2>Quy trình kiểm tra rò rỉ — chạy trước khi tin bất kỳ kết quả nào</h2>
  <ol>
    <li>Kết quả có <b>quá đẹp</b> không? (AUC &gt; 0,99 trên bài thực tế = nghi ngờ)</li>
    <li>In <b>feature importance</b>. Nếu một cột chiếm &gt; 50% tầm quan trọng, mở nó ra xem cột đó thật sự là gì.</li>
    <li>Với mỗi cột trong top 10, hỏi: <i>"giá trị này có sẵn tại thời điểm dự đoán không?"</i></li>
    <li>Mọi phép <code>fit</code> đều nằm trong Pipeline chứ?</li>
    <li>Chia tập có tôn trọng <b>thời gian</b> và <b>nhóm</b> không?</li>
    <li>Bạn đã nhìn tập test bao nhiêu lần rồi?</li>
  </ol>

  <div class="wb-alert wb-alert--info wb-alert--plain"><div class="wb-alert__body">
    <p class="wb-alert__title">Điểm cộng cho luận văn</p>
    <p class="wb-alert__msg">Dành hẳn một mục nhỏ trong chương phương pháp tên là <b>"Phòng chống rò rỉ dữ liệu"</b>, liệt kê từng biện pháp bạn đã áp dụng (chia theo thời gian, Pipeline, shift(1) cho feature tổng hợp, chạm test một lần). Hội đồng đọc mục này sẽ tin phần còn lại của bạn hơn hẳn — vì rất ít luận văn có nó.</p>
  </div></div>
</template>

<template data-node="d-split">
  <p>Chia tập là nơi bạn <b>tự tạo ra bài thi cho mô hình</b>. Chia sai thì mọi con số về sau đều vô nghĩa — mô hình đang thi một đề dễ hơn thực tế.</p>

  <h2>Ba tập, ba vai trò khác nhau</h2>
  <table>
    <tr><th>Tập</th><th>Dùng để</th><th>Được nhìn bao nhiêu lần</th></tr>
    <tr><td><b>Train</b> (~60–70%)</td><td>Mô hình học tham số</td><td>Vô số</td></tr>
    <tr><td><b>Validation</b> (~15–20%)</td><td>Bạn chọn: mô hình nào, siêu tham số nào, feature nào, ngưỡng nào</td><td>Nhiều lần — đó là việc của nó</td></tr>
    <tr><td><b>Test</b> (~15–20%)</td><td>Báo cáo con số cuối cùng</td><td><b>Đúng một lần</b>, sau khi đã chốt mọi thứ</td></tr>
  </table>
  <p>Nếu bạn chỉ có train/test và dùng test để tune, con số cuối của bạn <b>bị thổi phồng</b> và bạn không biết phồng bao nhiêu. Đây là lỗi phổ biến nhất trong luận văn thạc sĩ.</p>

  <h2>Chọn cách chia — cây quyết định 3 câu hỏi</h2>
  <div class="ds-code">Dữ liệu có yếu tố thời gian, và mô hình sẽ chạy trên dữ liệu tương lai?
├── CÓ  → chia theo THỜI GIAN                (TimeSeriesSplit)
└── KHÔNG
     ├── Có thực thể lặp lại (khách, thiết bị, bệnh nhân)?
     │    ├── CÓ  → chia theo NHÓM           (GroupKFold)
     │    └── KHÔNG
     │         └── Nhãn lệch nặng?
     │              ├── CÓ  → chia PHÂN TẦNG (StratifiedKFold)
     │              └── KHÔNG → chia ngẫu nhiên thường</div>
  <p><b>Với bài toán gian lận của bạn, câu trả lời là "CÓ" ở câu đầu tiên.</b> Kẻ gian đổi chiêu theo thời gian; mô hình phải chứng minh nó dự đoán được tương lai, không phải nội suy quá khứ.</p>

  <h2>Ba cách chia, nhìn trên cùng một tập dữ liệu</h2>
  <p>Đọc mô tả thì ba cách nghe na ná nhau. Nhìn thì khác hẳn — và hai dòng kiểm tra dưới hình chạy thật trên chính cách chia bạn đang chọn:</p>
  <div data-viz="split"></div>

  <h2>Code cho từng trường hợp</h2>
  <h3>Chia theo thời gian — cách bạn sẽ dùng</h3>
  <div class="ds-code">df = df.sort_values("ts")
n = len(df)
train = df.iloc[: int(n*0.70)]
valid = df.iloc[int(n*0.70) : int(n*0.85)]
test  = df.iloc[int(n*0.85) :]

print(f"train: {train.ts.min():%Y-%m-%d} → {train.ts.max():%Y-%m-%d}")
print(f"test : {test.ts.min():%Y-%m-%d} → {test.ts.max():%Y-%m-%d}")</div>
  <p>In ra khoảng thời gian của từng tập và <b>đưa dòng in đó vào luận văn</b>. Nó chứng minh bạn không trộn tương lai vào quá khứ.</p>

  <h3>Cross-validation theo thời gian (walk-forward)</h3>
  <div class="ds-code"><b>from</b> sklearn.model_selection <b>import</b> TimeSeriesSplit
tscv = TimeSeriesSplit(n_splits=5)
<b>for</b> tr_idx, va_idx <b>in</b> tscv.split(X):
    ...   <i># fold 1: train [0:100]   valid [100:200]</i>
          <i># fold 2: train [0:200]   valid [200:300]  ← train lớn dần</i></div>
  <p>Tập train lớn dần theo từng fold, và validation <b>luôn nằm sau</b> train về thời gian. Đây là mô phỏng trung thực cách hệ thống thật hoạt động: bạn train trên mọi thứ đã biết và dự đoán ngày mai.</p>

  <p class="ds-more"><button class="ds-aside" data-aside="x-split-other">Hai cách chia khác: phân tầng &amp; theo nhóm</button></p>
  <h2>Kiểm tra sau khi chia — bốn dòng, làm mỗi lần</h2>
  <div class="ds-code"><b>assert</b> train.ts.max() &lt; test.ts.min(), "rò rỉ thời gian!"
<b>assert</b> <b>not</b> set(train.card_id) &amp; set(test.card_id), "rò rỉ nhóm!"   <i># nếu chia theo nhóm</i>
print(train.Class.mean(), test.Class.mean())   <i># tỉ lệ dương có tương đương không</i>
print(len(train), len(valid), len(test))</div>
  <p>Dùng <code>assert</code> chứ không phải nhìn bằng mắt. Nó sẽ bắt lỗi vào ngày bạn refactor code và vô tình bỏ mất <code>sort_values</code>.</p>

<template data-node="f-what">
  <p>Bạn nói bạn <i>hiểu khái niệm feature engineering nhưng không biết khi làm thật thì thao tác thế nào, trên tool gì</i>. Bài này trả lời đúng câu đó, bằng những thứ cụ thể: file nào, hàm nào, chạy lúc nào.</p>

  <h2>Định nghĩa bằng một câu và một ví dụ</h2>
  <p><b>Feature engineering là viết code biến các cột thô thành các cột số mà mô hình có thể học được — và làm sao để đúng đoạn code đó chạy lại y hệt lúc dự đoán thật.</b></p>
  <p>Ví dụ cụ thể nhất: dữ liệu thô có cột <code>timestamp = "2026-03-14 23:47:12"</code>. Mô hình không hiểu chuỗi này. Feature engineering biến nó thành:</p>
  <table>
    <tr><th>Cột thô</th><th>Cột sinh ra</th><th>Vì sao</th></tr>
    <tr><td rowspan="4"><code>timestamp</code></td><td><code>hour_sin</code>, <code>hour_cos</code></td><td>Để 23h và 0h gần nhau</td></tr>
    <tr><td><code>is_weekend</code></td><td>Hành vi cuối tuần khác ngày thường</td></tr>
    <tr><td><code>secs_since_last_tx</code></td><td>Quẹt liên tiếp 3 giây là tín hiệu mạnh</td></tr>
    <tr><td><code>n_tx_last_1h</code></td><td>Tần suất bất thường</td></tr>
  </table>
  <p>Một cột thành bốn cột có ý nghĩa. Đó là feature engineering. Không có phép màu nào — chỉ là <b>bạn biết điều gì đáng chú ý trong lĩnh vực này, và bạn viết nó ra thành cột</b>.</p>

  <h2>Nó nằm ở đâu trong quy trình, và chạy mấy lần</h2>
  <p>Đây là chỗ hay gây lẫn nhất. Feature engineering <b>chạy hai lần trong đời</b>:</p>
  <ol>
    <li><b>Lúc huấn luyện</b> — trên hàng trăm nghìn dòng, trong notebook hoặc <code>train.py</code>.</li>
    <li><b>Lúc dự đoán thật</b> — trên <b>một</b> dòng, bên trong API, mỗi lần có giao dịch.</li>
  </ol>
  <p>Và đây là điều then chốt: <b>hai lần đó phải cho ra kết quả giống hệt nhau.</b> Nếu lúc train bạn scale bằng $\mu = 250.000$ mà lúc chạy thật API tính lại $\mu$ từ dữ liệu hôm nay ra $310.000$, mô hình nhận đầu vào sai và dự đoán sai — âm thầm, không báo lỗi. Lỗi này có tên: <b>training/serving skew</b>.</p>
  <p>Cách duy nhất chắc chắn tránh được: gói toàn bộ feature engineering vào một <code>Pipeline</code> của sklearn, lưu nó chung với mô hình vào một file, và API nạp đúng file đó. Bài <b>★ Pipeline + ColumnTransformer</b> làm việc này.</p>

  <h2>Ba loại thao tác — và chỗ để chúng</h2>

  <p>Loại C là loại khó nhất về mặt kỹ thuật và cũng là loại cho tín hiệu mạnh nhất trong bài toán gian lận. Bài <b>Biến theo thời gian</b> nói riêng về nó.</p>

  <h2>Một buổi làm feature engineering thật diễn ra thế nào</h2>

5. Chạy lại → PR-AUC = 0,384. Ghi vào bảng.

  <p>Chú ý bước 3: <b>một giả thuyết mỗi lần, nói được bằng tiếng Việt</b>. Nếu bạn thêm 20 feature cùng lúc và điểm tăng, bạn không biết cái nào có ích — và luận văn không viết được.</p>
  <p>Bảng ở bước 5 chính là <b>bảng ablation</b> của luận văn. Ghi nó từ ngày đầu, đừng dựng lại từ trí nhớ vào ngày cuối.</p>

  <p>Đó cũng là lý do trong luận văn, phần đóng góp mới của bạn <b>nên</b> nằm ở feature engineering hoặc cách đánh giá — chứ không phải ở "tôi thử thêm một mô hình nữa".</p>

  <p>Đây là nhóm ít được dạy nhất và cho kết quả tốt nhất, vì nó <b>đưa ngữ cảnh vào một con số</b>:</p>

  <p>Luôn cộng thêm 1 (hoặc một epsilon nhỏ) ở mẫu số để tránh chia cho 0.</p>

  <h3>Cách 2 · Hàm dùng lại được, đặt trong <code>src/features.py</code></h3>
  <p class="ds-codecap">src/features.py</p>
  <div class="ds-code"><b>import</b> numpy <b>as</b> np
<b>import</b> pandas <b>as</b> pd

CYCLES = {"hour": 24, "dayofweek": 7, "month": 12, "minute": 60}

<b>def</b> add_cyclical(df: pd.DataFrame, ts_col: str = "timestamp") -&gt; pd.DataFrame:
    """Thêm cặp sin/cos cho mọi thành phần thời gian có chu kỳ."""
    out = df.copy()
    ts = pd.to_datetime(out[ts_col])
    <b>for</b> part, period <b>in</b> CYCLES.items():
        vals = getattr(ts.dt, part)
        out[f"{part}_sin"] = np.sin(2 * np.pi * vals / period)
        out[f"{part}_cos"] = np.cos(2 * np.pi * vals / period)
    <b>return</b> out</div>
  <p>Giờ notebook chỉ cần <code>from src.features import add_cyclical</code>. Cùng một hàm, và sau này API cũng gọi đúng hàm đó — đây là bước đầu tiên chống training/serving skew.</p>

  <h3>Cách 3 · Gắn vào Pipeline bằng <code>FunctionTransformer</code></h3>

<b>from</b> sklearn.pipeline <b>import</b> Pipeline

cyclical_tf = FunctionTransformer(add_cyclical, validate=<b>False</b>)

pipe = Pipeline([
    ("cyclical", cyclical_tf),      <i># ← sin/cos nằm ở đây</i>
    ("prep",     column_transformer),
    ("model",    LGBMClassifier()),
])
pipe.fit(df_train, y_train)
joblib.dump(pipe, "models/fraud_v1.joblib")   <i># một file chứa TẤT CẢ</i></div>
  <p><b>Đây là câu trả lời đầy đủ cho "step này thuộc phần nào".</b> Nó là một mắt xích trong Pipeline, được lưu chung với mô hình, và API chỉ cần:</p>

  <h2>Mức 1 · Đặc trưng thủ công — rẻ và bất ngờ hiệu quả</h2>
  <div class="ds-code">s = df["description"].fillna("")

  <p>Với nhiều bài toán, nhóm này đã lấy được phần lớn tín hiệu. Làm nó trước, đo, rồi mới cân nhắc mức 2.</p>

  <h2>Mức 2 · TF-IDF — chuẩn mực cho văn bản ngắn</h2>
  <p>Ý tưởng: một từ quan trọng với một văn bản nếu nó <b>xuất hiện nhiều trong văn bản đó</b> nhưng <b>hiếm trong toàn bộ tập</b>. Từ "và" xuất hiện khắp nơi nên gần như vô giá trị; từ "hoàn tiền khẩn" hiếm nên rất có giá trị.</p>
  <p>$$\text{tfidf}(t, d) = \underbrace{\text{tf}(t,d)}_{\text{tần suất trong văn bản}} \times \underbrace{\log\frac{N}{\text{df}(t)}}_{\text{độ hiếm trong tập}}$$</p>
  <div class="ds-code"><b>from</b> sklearn.feature_extraction.text <b>import</b> TfidfVectorizer
TfidfVectorizer(max_features=300, ngram_range=(1, 2), min_df=5)</div>
  <ul>
    <li><code>ngram_range=(1,2)</code> — lấy cả từ đơn và cặp từ liền nhau ("chuyển khoản" là một tín hiệu khác "chuyển" và "khoản" rời rạc).</li>
    <li><code>max_features=300</code> — giới hạn số cột, nếu không bảng sẽ phình lên hàng chục nghìn cột.</li>
  </ul>
  <p>Cắm thẳng vào ColumnTransformer như một nhánh riêng cho cột text. <b>Ưu điểm lớn:</b> giải thích được — bạn chỉ ra được từ nào đẩy điểm rủi ro lên, và đó là thứ hội đồng thích.</p>

  <h2>Mức 3 · Embedding từ mô hình ngôn ngữ</h2>
  <p>TF-IDF không biết "hoàn tiền" và "refund" liên quan nhau. Embedding thì biết, vì nó đặt các cụm từ gần nghĩa vào những điểm gần nhau trong không gian vector.</p>

emb = m.encode(df["description"].tolist())    <i># (n, 384) — 384 cột số</i></div>
  <p>Đánh đổi: 384 cột đặc, chậm hơn nhiều, và <b>mất khả năng giải thích</b> — bạn không nói được "chiều thứ 217 nghĩa là gì". Với dữ liệu bảng có ít text, TF-IDF thường thắng. Chỉ lên mức 3 khi text là nguồn thông tin chính.</p>

<template data-node="f-pipeline">
  <p>Đây là bài ráp mọi thứ lại. Sau bài này, code của bạn ngừng là "notebook lộn xộn" và bắt đầu là <b>một hiện vật có thể triển khai được</b> — một file duy nhất chứa cả cách tạo feature lẫn mô hình.</p>

  <h2>Vấn đề mà Pipeline giải quyết</h2>
  <p>Không có Pipeline, quy trình của bạn trông thế này:</p>
  <div class="ds-code"><i># notebook</i>                          <i># api.py — ai đó viết lại 3 tuần sau</i>
df["hour_sin"] = np.sin(...)          tx["hour_sin"] = math.sin(...)
df = pd.get_dummies(df, "city")       city_vec = one_hot(tx["city"])
X = (X - mu) / sigma                  x = (x - 250000) / 180000   <i># hardcode!</i></div>
  <p>Ba cơ hội để hai bên lệch nhau, và <b>không có cái nào báo lỗi khi lệch</b>. Mô hình vẫn trả về một con số — chỉ là số sai. Đây là lỗi phổ biến nhất khi đưa mô hình lên chạy thật.</p>

  <h2>Bản đầy đủ — copy được, chỉ cần đổi tên cột</h2>
  <p class="ds-codecap">src/pipeline.py</p>
  <div class="ds-code"><b>import</b> numpy <b>as</b> np, pandas <b>as</b> pd, joblib
<b>from</b> sklearn.pipeline <b>import</b> Pipeline
<b>from</b> sklearn.compose <b>import</b> ColumnTransformer
<b>from</b> sklearn.preprocessing <b>import</b> (StandardScaler, OneHotEncoder,
                                   FunctionTransformer)
<b>from</b> sklearn.impute <b>import</b> SimpleImputer
<b>from</b> lightgbm <b>import</b> LGBMClassifier

<i># ---------- 1. Biến đổi tự viết: không học tham số ----------</i>
CYCLES = {"hour": 24, "dayofweek": 7, "month": 12}

<b>def</b> add_derived(df):
    """Sinh mọi cột dẫn xuất từ MỘT dòng dữ liệu thô.
       Chạy y hệt lúc train và lúc serve."""
    out = df.copy()
    ts = pd.to_datetime(out["timestamp"])
    out["hour"], out["dayofweek"], out["month"] = ts.dt.hour, ts.dt.dayofweek, ts.dt.month

    <b>for</b> part, period <b>in</b> CYCLES.items():                 <i># ← sin/cos vào đây</i>
        out[f"{part}_sin"] = np.sin(2*np.pi*out[part]/period)
        out[f"{part}_cos"] = np.cos(2*np.pi*out[part]/period)

    out["amount_log"]  = np.log1p(out["amount"])
    out["amt_vs_hist"] = out["amount"] / (out["hist_mean"] + 1)
    out["is_weekend"]  = (out["dayofweek"] &gt;= 5).astype(<b>int</b>)
    <b>return</b> out

derive = FunctionTransformer(add_derived, validate=<b>False</b>)

<i># ---------- 2. Mỗi nhóm cột một cách xử lý ----------</i>
NUM = ["amount_log", "amt_vs_hist", "hour_sin", "hour_cos",
       "dayofweek_sin", "dayofweek_cos", "month_sin", "month_cos",
       "n_tx_1h", "secs_since_last", "is_weekend"]
CAT = ["merchant_type", "city", "device_type"]

num_pipe = Pipeline([
    ("impute", SimpleImputer(strategy="median", add_indicator=<b>True</b>)),
    ("scale",  StandardScaler()),
])
cat_pipe = Pipeline([
    ("impute", SimpleImputer(strategy="constant", fill_value="__NA__")),
    ("onehot", OneHotEncoder(handle_unknown="infrequent_if_exist",
                             min_frequency=0.01, sparse_output=<b>False</b>)),
])

prep = ColumnTransformer(
    [("num", num_pipe, NUM), ("cat", cat_pipe, CAT)],
    remainder="drop",            <i># cột không khai báo thì bỏ — an toàn hơn "passthrough"</i>
    verbose_feature_names_out=<b>False</b>,
)

<i># ---------- 3. Ráp thành một đối tượng duy nhất ----------</i>
DEFAULTS = <b>dict</b>(n_estimators=600, learning_rate=0.05, num_leaves=31,
                 class_weight="balanced", random_state=42)

<b>def</b> build_pipeline(**lgbm_kwargs):
    <b>return</b> Pipeline([
        ("derive", derive),
        ("prep",   prep),
        <i># {**A, **B}: B đè lên A — nên gọi build_pipeline(random_state=43) không lỗi</i>
        ("model",  LGBMClassifier(**{**DEFAULTS, **lgbm_kwargs})),
    ])</div>

  <h2>Dùng nó</h2>
  <div class="ds-code"><i># train.py</i>
pipe = build_pipeline()
pipe.fit(df_train, y_train)                       <i># df_train là dữ liệu THÔ</i>
joblib.dump(pipe, "models/fraud_v1.joblib")

<i># serve.py — cùng một file, không viết lại logic nào</i>
pipe = joblib.load("models/fraud_v1.joblib")
score = pipe.predict_proba(pd.DataFrame([tx_dict]))[0, 1]</div>
  <p>Chú ý: <code>pipe.fit</code> nhận <b>DataFrame thô</b>, không phải ma trận đã xử lý. Toàn bộ chuỗi biến đổi nằm bên trong. Đó là điểm mấu chốt.</p>

  <h2>Bốn thứ Pipeline cho bạn miễn phí</h2>
  <table>
    <tr><th>Lợi ích</th><th>Cụ thể</th></tr>
    <tr><td><b>Không rò rỉ trong CV</b></td><td><code>cross_val_score(pipe, X, y)</code> tự động fit lại scaler/encoder <i>bên trong từng fold</i>. Làm tay thì gần như chắc chắn sai.</td></tr>
    <tr><td><b>Không lệch train/serve</b></td><td>Một file, một logic.</td></tr>
    <tr><td><b>Tune xuyên tầng</b></td><td><code>{"model__num_leaves": [15,31,63], "prep__num__impute__strategy": ["median","mean"]}</code></td></tr>
    <tr><td><b>Tái lập được</b></td><td>Người phản biện tải repo về, <code>joblib.load</code>, chạy ra đúng số của bạn.</td></tr>
  </table>

  <h3>2 · Permutation importance — đáng tin hơn feature_importances_</h3>

  <p>Vì sao đáng tin hơn <code>feature_importances_</code> của cây: chỉ số mặc định của cây <b>thiên vị cột có nhiều giá trị khác nhau</b> (một cột ID ngẫu nhiên có thể xếp hạng cao). Permutation đo tác động thật lên chỉ số bạn quan tâm.</p>

<template data-node="f-store">
  <p>Bạn sẽ thấy "Feature Store" trong mọi roadmap MLOps. Bài này để bạn biết nó giải quyết vấn đề gì và <b>vì sao bạn gần như chắc chắn không cần nó</b>.</p>

  <h2>Vấn đề nó sinh ra để giải quyết</h2>
  <p>Công ty có 12 mô hình. Tám trong số đó cần feature "tổng chi tiêu 30 ngày của khách". Mỗi đội tự viết một phiên bản. Một đội tính theo ngày lịch, đội khác theo 720 giờ. Kết quả khác nhau, không ai biết bản nào đúng, và không đội nào tái sử dụng được của đội nào.</p>
  <p>Feature store là một nơi tập trung để: <b>định nghĩa feature một lần</b>, phục vụ nó cho cả huấn luyện (dữ liệu lịch sử) và chạy thật (độ trễ thấp), và <b>đảm bảo hai đường đó cho cùng kết quả</b>.</p>

  <h2>Vì sao bạn chưa cần</h2>
  <table>
    <tr><th>Điều kiện để feature store có ích</th><th>Tình huống của bạn</th></tr>
    <tr><td>Nhiều mô hình dùng chung feature</td><td>Bạn có 1</td></tr>
    <tr><td>Nhiều đội cần khám phá feature của nhau</td><td>Bạn có 1 người</td></tr>
    <tr><td>Cần point-in-time correctness ở quy mô lớn</td><td><code>.shift(1)</code> trong pandas làm được</td></tr>
    <tr><td>Có hạ tầng để vận hành thêm một dịch vụ</td><td>Bạn còn 2 tuần</td></tr>
  </table>
  <p>Với một luận văn, <code>Pipeline</code> của sklearn + một bảng aggregate trong CSDL đã đảm bảo đúng tính chất quan trọng nhất (train và serve dùng cùng logic) mà không thêm gì để vận hành.</p>

  <h2>Điều đáng nhớ: khái niệm point-in-time correctness</h2>
  <p>Đây mới là thứ có giá trị, và nó độc lập với công cụ: <b>khi tạo dữ liệu huấn luyện, mỗi dòng chỉ được chứa thông tin có sẵn tại đúng thời điểm của dòng đó.</b> Feature store tự động hoá việc này; bạn làm bằng tay với <code>.shift(1)</code>, <code>closed="left"</code>, và chia tập theo thời gian.</p>
  <p>Nếu hội đồng hỏi "sao không dùng feature store", câu trả lời mạnh là: <i>"Tính chất mà feature store bảo đảm là point-in-time correctness; trong phạm vi một mô hình, chúng tôi bảo đảm nó bằng cách [nêu cụ thể]. Feature store trở nên cần thiết khi số mô hình và số đội tăng lên — đó là hướng mở rộng ở mục 6.3."</i></p>
  <p class="wb-help">Tên để biết, không cần dùng: Feast (mã nguồn mở), Tecton, Vertex AI Feature Store, Databricks Feature Store.</p>

    <tr><td><b>LightGBM / XGBoost</b></td><td>Rất mạnh trên dữ liệu bảng; xử lý được cột hạng mục và giá trị thiếu; nhanh trên CPU</td><td>Nhiều siêu tham số, dễ overfit nếu tune ẩu; <b>không ngoại suy được</b> ra ngoài khoảng giá trị đã thấy</td><td><b>Điểm khởi đầu mặc định</b> cho dữ liệu bảng</td></tr>
    <tr><td><b>Mạng nơ-ron</b></td><td>Học được quan hệ rất phức tạp; xử lý ảnh/chữ/chuỗi; học được biểu diễn dùng lại được (embedding)</td><td>Cần nhiều dữ liệu, khó giải thích, chậm hơn</td><td>Dữ liệu không phải bảng; hoặc bảng nhưng có cột hạng mục cực nhiều giá trị cần embedding</td></tr>
  </table>

  <div class="wb-alert wb-alert--info">
    <span class="wb-alert__icon">i</span>

    <p class="wb-alert__msg">Năm mô hình trên là bản đồ cho họ bài toán bạn đang làm, không phải bản đồ của cả ngành. Dự báo chuỗi thời gian có gia đình mô hình riêng (naive, ETS, ARIMA, boosting có lag); gợi ý có gia đình riêng; nhân quả thì không dùng mô hình dự đoán chút nào. <b>Chặng 7</b> vẽ bản đồ cho từng họ đó.</p>
  </div></div>

  <h2>Quy trình chọn mô hình — theo đúng thứ tự này</h2>
  <ol>
    <li><b>Baseline ngu nhất trước.</b> Đoán bừa theo tỉ lệ, hoặc một luật thủ công ("chặn mọi giao dịch &gt; 50 triệu lúc 2h sáng"). Ghi lại điểm. Nếu mô hình sau này không thắng được cái này, bạn đang đi sai hướng.</li>
    <li><b>Logistic regression</b> với feature cơ bản. Nhanh, và cho bạn biết bài toán có tuyến tính không.</li>
    <li><b>LightGBM mặc định.</b> Không tune gì. Con số này thường đã rất gần con số cuối cùng của bạn.</li>
    <li><b>Cải tiến feature</b> — đây là chỗ có nhiều điểm nhất để lấy.</li>
    <li><b>Tune siêu tham số</b> — thường chỉ cho thêm 1–3%.</li>
    <li>Ensemble, stacking — thường không đáng công cho luận văn thạc sĩ.</li>
  </ol>
  <p>Rất nhiều người làm ngược: bắt đầu từ bước 5 hoặc 6, và bỏ qua bước 4 nơi phần lớn giá trị nằm.</p>

<template data-node="ml-linear">
  <p>Hồi quy tuyến tính là mô hình đơn giản nhất, và <b>chính vì đơn giản nên nó là baseline không thể thiếu</b>. Nếu mô hình phức tạp của bạn không thắng được nó một cách rõ ràng, bạn chưa có gì để viết.</p>

  <h2>Hồi quy tuyến tính — dự đoán một con số</h2>
  <p>Ý tưởng: đầu ra là tổng có trọng số của các đầu vào.</p>
  <p>$$\hat{y} = w_0 + w_1x_1 + w_2x_2 + \dots + w_nx_n$$</p>
  <p>Với một cột: đó là vẽ một đường thẳng qua đám điểm sao cho tổng bình phương khoảng cách nhỏ nhất. Với 30 cột: một siêu phẳng trong không gian 30 chiều — không hình dung được nhưng toán y hệt.</p>
  <p>Ý nghĩa hệ số: $w_j$ = <b>khi $x_j$ tăng 1 đơn vị, $\hat y$ đổi $w_j$, với điều kiện mọi cột khác giữ nguyên</b>. Vế cuối rất quan trọng và hay bị bỏ khi diễn giải.</p>
  <p><button class="ds-math" data-math="mse">MSE, RMSE, MAE — chọn cái nào</button></p>

  <h2>Hồi quy logistic — dự đoán xác suất</h2>
  <p>Vấn đề: tổng có trọng số cho ra số bất kỳ (−1200, 0,3, 5000), nhưng bạn cần xác suất trong [0, 1]. Giải pháp: đẩy nó qua hàm sigmoid.</p>
  <p>$$z = w_0 + \sum_j w_jx_j \qquad\qquad \hat{p} = \sigma(z) = \frac{1}{1+e^{-z}}$$</p>
  <p><button class="ds-math" data-math="sigmoid">Sigmoid &amp; log-odds — bảng giá trị và cách đọc hệ số cho đúng</button></p>
  <p>Bất chấp cái tên "hồi quy", đây là mô hình <b>phân loại</b>. Tên gọi lịch sử, gây nhầm lẫn cho mọi người mới, cứ chấp nhận.</p>

  <h2>Code</h2>
  <div class="ds-code"><b>from</b> sklearn.linear_model <b>import</b> LogisticRegression

pipe = Pipeline([
    ("prep",  prep),                       <i># scale là BẮT BUỘC cho mô hình tuyến tính</i>
    ("model", LogisticRegression(
        C=1.0,                             <i># nghịch đảo mức phạt — C nhỏ = phạt mạnh</i>
        class_weight="balanced",           <i># quan trọng khi nhãn lệch</i>
        max_iter=2000, random_state=42)),
])
pipe.fit(X_train, y_train)
y_prob = pipe.predict_proba(X_test)[:, 1]</div>

  <h2>Đọc hệ số — phần đưa vào luận văn</h2>
  <div class="ds-code">names = pipe.named_steps["prep"].get_feature_names_out()
coefs = pipe.named_steps["model"].coef_[0]
odds  = np.exp(coefs)          <i># ← đổi sang tỉ số odds, dễ diễn giải hơn nhiều</i>
pd.DataFrame({"feature": names, "coef": coefs, "odds_ratio": odds}) \
  .sort_values("coef", key=<b>abs</b>, ascending=<b>False</b>).head(15)</div>
  <p>Cách viết đúng: <i>"Hệ số của <code>is_rapid</code> là 1,42 (tỉ số odds 4,14), nghĩa là khi giao dịch xảy ra dưới 60 giây sau giao dịch trước, <b>odds gian lận tăng gấp 4,1 lần</b>, với các yếu tố khác không đổi."</i></p>
  <p>Cách viết <b>sai</b> mà rất nhiều luận văn mắc: "xác suất tăng 1,42". Hệ số tác động lên log-odds, không phải xác suất — và quan hệ giữa hai thứ đó không tuyến tính.</p>

  <h2>Hai điều kiện để hệ số có nghĩa</h2>
  <ul>
    <li><b>Feature phải được scale.</b> Nếu không, hệ số của cột số tiền (đơn vị đồng) và cột số lần quẹt không so sánh được với nhau.</li>
    <li><b>Không có đa cộng tuyến nặng.</b> Nếu hai cột tương quan 0,98, mô hình có thể gán +50 cho cột này và −49 cho cột kia; tổng thì đúng nhưng từng hệ số vô nghĩa. Kiểm tra bằng VIF hoặc chỉ đơn giản là bỏ một trong hai.</li>
  </ul>

  <h2>Vì sao vẫn giữ nó trong luận văn dù LightGBM tốt hơn</h2>
  <ol>
    <li><b>Nó là mốc so sánh.</b> "LightGBM đạt PR-AUC 0,412 so với 0,281 của hồi quy logistic" là một câu có thông tin. "LightGBM đạt 0,412" thì không.</li>
    <li><b>Nó cho biết bài toán phi tuyến tới mức nào.</b> Khoảng cách càng lớn, tương tác giữa các feature càng quan trọng — và đó là một phát hiện đáng viết.</li>
    <li><b>Nó giải thích được.</b> Khi cần trả lời "vì sao chặn giao dịch này", một mô hình tuyến tính chạy song song rất có giá trị, kể cả khi không phải mô hình quyết định.</li>
  </ol>
</template>

<template data-node="ml-loss">
  <p>Bài này ráp hai thứ bạn đã gặp rời rạc: <b>hàm mất mát</b> (cách chấm điểm sai) và <b>gradient descent</b> (cách sửa). Cùng nhau, chúng là toàn bộ cơ chế "học".</p>

  <h2>Ba mảnh của việc học</h2>
  <ol>
    <li><b>Mô hình</b> — một hàm có tham số $w$, biến đầu vào thành dự đoán.</li>
    <li><b>Hàm mất mát</b> — một con số duy nhất đo mức độ sai của toàn bộ dự đoán.</li>
    <li><b>Bộ tối ưu</b> — quy tắc sửa $w$ để con số đó giảm.</li>
  </ol>
  <p>Đổi bất kỳ mảnh nào, bạn có một thuật toán khác. Đó là lý do biết ba mảnh này quan trọng hơn biết tên 50 thuật toán.</p>

  <h2>Chọn hàm mất mát theo bài toán</h2>
  <table>
    <tr><th>Bài toán</th><th>Hàm mất mát</th><th>Chi tiết</th></tr>
    <tr><td>Dự đoán số</td><td>MSE / MAE</td><td><button class="ds-math" data-math="mse">so sánh</button></td></tr>
    <tr><td>Phân loại 2 lớp</td><td>Binary cross-entropy (log loss)</td><td><button class="ds-math" data-math="logloss">vì sao phạt nặng khi tự tin mà sai</button></td></tr>
    <tr><td>Phân loại nhiều lớp</td><td>Categorical cross-entropy</td><td>Kèm <button class="ds-math" data-math="softmax">softmax</button></td></tr>
    <tr><td>Xếp hạng</td><td>LambdaRank, pairwise loss</td><td>LightGBM có sẵn <code>objective="lambdarank"</code></td></tr>
  </table>

  <h2>Điểm mấu chốt: hàm mất mát ≠ chỉ số đánh giá</h2>
  <p>Đây là chỗ gây nhầm nhiều nhất, và nó ảnh hưởng trực tiếp tới luận văn của bạn.</p>
  <table>
    <tr><th></th><th>Hàm mất mát</th><th>Chỉ số đánh giá</th></tr>
    <tr><td>Dùng lúc nào</td><td>Trong khi train, mỗi bước</td><td>Sau khi train, để báo cáo</td></tr>
    <tr><td>Yêu cầu</td><td>Phải khả vi (có đạo hàm) để tối ưu được</td><td>Không cần — chỉ cần có ý nghĩa</td></tr>
    <tr><td>Ví dụ</td><td>Log loss</td><td>PR-AUC, F1, tiền tiết kiệm</td></tr>
  </table>
  <p>Bạn <b>không thể</b> tối ưu trực tiếp F1 bằng gradient descent vì nó không khả vi (nó phụ thuộc vào việc đếm, mà đếm thì nhảy bậc). Nên quy trình thực tế là: train bằng log loss → sau đó <b>chọn ngưỡng</b> để tối ưu chỉ số bạn thật sự quan tâm. Bài <b>Đo lường &amp; ngưỡng</b> làm bước hai.</p>

  <h2>Gradient descent — ba biến thể bạn sẽ gặp</h2>
  <p><button class="ds-math" data-math="gdupdate">Công thức cập nhật, bóc từng ký hiệu</button></p>
  <table>
    <tr><th>Tên</th><th>Mỗi bước dùng bao nhiêu dữ liệu</th><th>Tính chất</th></tr>
    <tr><td>Batch GD</td><td>Toàn bộ</td><td>Chính xác, chậm, không dùng thực tế</td></tr>
    <tr><td>SGD</td><td>Một mẫu</td><td>Nhanh, nhiễu, dao động mạnh</td></tr>
    <tr><td><b>Mini-batch</b></td><td>32–512 mẫu</td><td><b>Mặc định của mọi thứ</b></td></tr>
  </table>
  <p>Và ba bộ tối ưu thông minh hơn công thức cơ bản:</p>
  <ul>
    <li><b>Momentum</b> — cộng dồn một phần bước trước, như quả bóng có quán tính. Vượt qua vùng phẳng nhanh hơn.</li>
    <li><b>Adam</b> — tự điều chỉnh độ dài bước riêng cho từng tham số. <b>Mặc định cho deep learning.</b></li>
    <li><b>AdamW</b> — Adam với cách xử lý weight decay đúng hơn. Chuẩn hiện tại cho Transformer.</li>
  </ul>

  <h2>Thấy tận mắt</h2>
  <div data-viz="gd"></div>

  <p class="ds-more"><button class="ds-aside" data-aside="x-tree-learn">Cây và boosting thì “học” thế nào</button></p>
  </template>

<template data-node="ml-trees">
  <p>Đây là gia đình mô hình bạn sẽ dùng làm mô hình chính. Ba tầng, mỗi tầng sửa nhược điểm của tầng trước.</p>

  <h2>Tầng 1 · Cây quyết định — một chuỗi câu hỏi có/không</h2>
  <div class="ds-code">Số tiền &gt; 2.000.000?
├── Có → Giờ trong khoảng 0–4?
│         ├── Có → RỦI RO CAO   (87% gian lận trong nhánh này)
│         └── Không → rủi ro trung bình
└── Không → Số giao dịch trong 1h &gt; 5?
            ├── Có → rủi ro trung bình
            └── Không → an toàn</div>
  <p>Cây chọn câu hỏi bằng cách thử mọi cột và mọi ngưỡng, giữ cái làm hai nhánh con "thuần khiết" nhất. <button class="ds-math" data-math="entropy">Gini &amp; entropy — cách đo độ thuần khiết</button></p>
  <p><b>Ưu điểm lớn nhất:</b> vẽ ra được, giải thích cho người không kỹ thuật trong 30 giây. <b>Nhược điểm chí mạng:</b> nếu để tự do, cây sẽ chia cho tới khi mỗi lá chỉ còn một mẫu — tức là học thuộc lòng tập train. Đổi một dòng dữ liệu, cả cây đổi hình.</p>
  <div class="ds-code"><b>from</b> sklearn.tree <b>import</b> DecisionTreeClassifier, plot_tree
tree = DecisionTreeClassifier(max_depth=4, min_samples_leaf=50, random_state=42)
plot_tree(tree, feature_names=names, max_depth=3, filled=<b>True</b>)   <i># hình cho luận văn</i></div>

  <h2>Tầng 2 · Random Forest — trồng 500 cây rồi lấy trung bình</h2>
  <p>Một cây thì bấp bênh. Nhưng nếu trồng 500 cây, mỗi cây nhìn một mẫu dữ liệu khác nhau và một tập cột khác nhau, rồi lấy trung bình dự đoán — sai số ngẫu nhiên của từng cây triệt tiêu lẫn nhau.</p>
  <p>Hai nguồn đa dạng, cả hai đều cần:</p>
  <ul>
    <li><b>Bagging</b> — mỗi cây train trên một mẫu bootstrap (bốc có hoàn lại) của dữ liệu.</li>
    <li><b>Random subspace</b> — ở mỗi lần chia, chỉ xét một tập con ngẫu nhiên các cột. Điều này ngăn một cột rất mạnh chi phối toàn bộ 500 cây và làm chúng giống hệt nhau.</li>
  </ul>
  <div class="ds-code"><b>from</b> sklearn.ensemble <b>import</b> RandomForestClassifier
RandomForestClassifier(n_estimators=500, max_depth=<b>None</b>, min_samples_leaf=5,
                       class_weight="balanced_subsample", n_jobs=-1, random_state=42)</div>
  <p><b>Chỗ ví von hỏng:</b> người ta hay nói "trí tuệ đám đông". Nhưng đám đông chỉ khôn hơn cá nhân khi các thành viên <b>sai một cách độc lập</b>. Nếu mọi cây đều học cùng một thiên lệch từ dữ liệu (ví dụ dữ liệu thiếu một nhóm khách hàng), 500 cây sẽ sai giống hệt nhau — trung bình không cứu được gì.</p>

  <h2>Tầng 3 · Gradient Boosting — mỗi cây sửa lỗi của cây trước</h2>
  <p>Khác biệt căn bản với Random Forest:</p>
  <table>
    <tr><th></th><th>Random Forest</th><th>Gradient Boosting</th></tr>
    <tr><td>Cách trồng cây</td><td>Song song, độc lập</td><td>Tuần tự, cây sau học từ lỗi cây trước</td></tr>
    <tr><td>Cây thành phần</td><td>Sâu, mạnh</td><td>Nông (3–8 tầng), yếu</td></tr>
    <tr><td>Kết hợp</td><td>Bỏ phiếu / trung bình</td><td>Cộng dồn, mỗi cây nhân với learning rate</td></tr>
    <tr><td>Rủi ro overfit</td><td>Thấp</td><td><b>Cao</b> nếu quá nhiều cây</td></tr>
    <tr><td>Hiệu năng đỉnh</td><td>Tốt</td><td><b>Tốt hơn</b>, nếu tune đúng</td></tr>
  </table>

  <h3>LightGBM — cấu hình khởi đầu cho bài toán của bạn</h3>
  <div class="ds-code"><b>from</b> lightgbm <b>import</b> LGBMClassifier, early_stopping, log_evaluation

model = LGBMClassifier(
    n_estimators=2000,        <i># đặt cao, để early stopping tự dừng</i>
    learning_rate=0.05,       <i># thấp hơn = cần nhiều cây hơn nhưng tổng quát tốt hơn</i>
    num_leaves=31,            <i># ← siêu tham số quan trọng nhất của LightGBM</i>
    min_child_samples=50,     <i># tăng lên khi dữ liệu lệch, chống lá chỉ có 1 mẫu</i>
    subsample=0.8, subsample_freq=1,
    colsample_bytree=0.8,
    reg_lambda=1.0,           <i># phạt L2</i>
    class_weight="balanced",  <i># cho bài toán lệch nhãn</i>
    random_state=42, n_jobs=-1,
)
model.fit(X_train, y_train,
          eval_set=[(X_valid, y_valid)], eval_metric="average_precision",
          callbacks=[early_stopping(100), log_evaluation(100)])
print("số cây thực dùng:", model.best_iteration_)</div>

  <h3>Early stopping — cơ chế chống overfit quan trọng nhất</h3>

<template data-node="ml-overfit">
  <p>Overfitting là mô hình <b>học thuộc dữ liệu train thay vì học quy luật</b>. Đây là kẻ thù trung tâm của machine learning, và mọi kỹ thuật bạn học từ đây trở đi đều là cách chống nó.</p>

  <h2>Nhìn thấy nó</h2>
  <p>Kéo thanh "độ phức tạp". Chú ý hai con số bên dưới đi theo hai hướng khác nhau:</p>
  <div data-viz="overfit"></div>

  <h2>Chẩn đoán</h2>
  <table>
    <tr><th>Sai số train</th><th>Sai số test</th><th>Tên gọi</th><th>Làm gì</th></tr>
    <tr><td>Cao</td><td>Cao</td><td><b>Underfit</b> — mô hình quá đơn giản</td><td>Tăng độ phức tạp, thêm feature, train lâu hơn</td></tr>
    <tr><td>Thấp</td><td><b>Cao</b></td><td><b>Overfit</b> — học thuộc</td><td>Giảm độ phức tạp, thêm regularization, thêm dữ liệu</td></tr>
    <tr><td>Thấp</td><td>Thấp</td><td>Tốt</td><td>Dừng lại, đừng nghịch thêm</td></tr>
    <tr><td>Cao</td><td>Thấp</td><td>Bất thường</td><td>Kiểm tra lại cách chia tập — có gì đó sai</td></tr>
  </table>

  <h2>Bias–variance: hai nguồn sai số</h2>
  <ul>
    <li><b>Bias (thiên lệch)</b> — mô hình quá đơn giản để nắm được quy luật thật. Vẽ đường thẳng qua dữ liệu hình cong. Sai một cách <i>có hệ thống</i>.</li>
    <li><b>Variance (phương sai)</b> — mô hình quá nhạy với dữ liệu cụ thể. Đổi tập train, mô hình đổi hẳn. Sai một cách <i>không ổn định</i>.</li>
  </ul>
  <p>Ẩn dụ: bắn bia. Bias cao = mọi mũi tên chụm nhau nhưng lệch tâm. Variance cao = các mũi tên tản mát khắp bia, trung bình có thể đúng tâm nhưng không mũi nào trúng.</p>
  <p><b>Chỗ ví von hỏng:</b> hình ảnh bắn bia gợi ý bạn phải đánh đổi cái này lấy cái kia. Với các mô hình hiện đại (boosting, mạng lớn có regularization), bạn thường <b>giảm được cả hai</b> bằng cách thêm dữ liệu hoặc thêm feature tốt. Sự đánh đổi chỉ chặt chẽ khi lượng dữ liệu cố định.</p>

  <h2>Đường cong học: thêm dữ liệu có ích không</h2>
  <p>Bảng chẩn đoán ở trên nói bạn <i>đang</i> ở tình trạng nào. Đường cong học nói bạn <b>nên làm gì tiếp</b> — và đó là hai câu khác nhau:</p>
  <div data-viz="learncurve"></div>

  <h2>Bảy cách chống overfit, theo hiệu quả</h2>
  <table>
    <tr><th>Cách</th><th>Cụ thể</th><th>Hiệu quả</th></tr>
    <tr><td>1. Thêm dữ liệu</td><td>Nhiều mẫu hơn, đặc biệt là mẫu của lớp hiếm</td><td><b>Mạnh nhất</b>, thường khó nhất</td></tr>
    <tr><td>2. Giảm độ phức tạp</td><td><code>num_leaves</code> ↓, <code>max_depth</code> ↓</td><td>Mạnh, dễ làm</td></tr>
    <tr><td>3. Early stopping</td><td>Dừng khi validation ngừng cải thiện</td><td>Mạnh, gần như miễn phí</td></tr>
    <tr><td>4. Regularization</td><td>L1/L2 — <button class="ds-math" data-math="reg">chi tiết</button></td><td>Mạnh cho mô hình tuyến tính và mạng</td></tr>
    <tr><td>5. Lấy mẫu ngẫu nhiên</td><td><code>subsample=0.8</code>, <code>colsample_bytree=0.8</code></td><td>Vừa</td></tr>
    <tr><td>6. Bỏ bớt feature</td><td>Ít cột = ít cơ hội học nhiễu</td><td>Vừa</td></tr>
    <tr><td>7. Ensemble</td><td>Trung bình nhiều mô hình</td><td>Vừa, tốn công</td></tr>
  </table>

  <h2>Overfit ẩn — loại nguy hiểm hơn</h2>
  <p>Mọi thứ trên nói về overfit lên tập <i>train</i>, và cross-validation phát hiện được. Nhưng có một loại tinh vi hơn: <b>overfit lên tập validation</b>.</p>
  <p>Bạn thử 50 cấu hình, chọn cấu hình có điểm validation cao nhất. Cấu hình đó có thể chỉ đơn giản là <i>may mắn hợp với tập validation cụ thể này</i>. Bạn vừa dùng validation như một tập train thứ hai.</p>
  <p><b>Cách phòng:</b> giữ tập test hoàn toàn tách biệt và chỉ chạm vào <b>một lần</b>. Nếu điểm test tụt hẳn so với validation, bạn đã overfit lên validation — và con số đúng để báo cáo là con số test.</p>
</template>

<template data-node="ml-cv">
  <p>Một lần chia train/test cho bạn <b>một</b> con số, và bạn không biết con số đó dao động bao nhiêu. Cross-validation cho bạn nhiều con số, nên bạn biết cả mức trung bình lẫn độ ổn định.</p>

  <h2>k-fold, bằng lời</h2>
  <p>Chia dữ liệu thành 5 phần bằng nhau. Lần 1: train trên phần 2-3-4-5, kiểm tra trên phần 1. Lần 2: train trên 1-3-4-5, kiểm tra trên 2. Lặp 5 lần. Mỗi dòng dữ liệu được dùng để kiểm tra đúng một lần.</p>
  <p>Kết quả: 5 điểm số. Báo cáo <b>trung bình ± độ lệch chuẩn</b>. Độ lệch chuẩn chính là thông tin mà một lần chia không cho bạn.</p>

  <h2>Bốn kiểu fold, và cái hỏng khi chọn sai</h2>

  <h2>Code — luôn dùng Pipeline</h2>
  <div class="ds-code"><b>from</b> sklearn.model_selection <b>import</b> cross_val_score, StratifiedKFold

cv = StratifiedKFold(n_splits=5, shuffle=<b>True</b>, random_state=42)
scores = cross_val_score(pipe, X, y, cv=cv, scoring="average_precision")
print(f"PR-AUC = {scores.mean():.3f} ± {scores.std():.3f}")</div>
  <p>Truyền <code>pipe</code> chứ không phải mô hình trần. Khi đó sklearn <b>fit lại toàn bộ chuỗi tiền xử lý bên trong từng fold</b> — scaler chỉ học μ, σ từ 4 phần train của fold đó. Nếu bạn scale trước rồi mới CV, mọi fold đều rò rỉ.</p>

  <h2>5 · Đổi cách đóng khung</h2>
  <ul>
    <li><b>Phát hiện bất thường</b> — chỉ học "thế nào là bình thường", báo động khi lệch. Hữu ích khi lớp dương cực hiếm hoặc kiểu gian lận mới liên tục xuất hiện. Xem bài <b>Không nhãn</b>.</li>
    <li><b>Xếp hạng</b> — không phân loại nhị phân, mà xếp mọi giao dịch theo rủi ro và đưa top-N cho đội xác minh. Chỉ số: precision@k. <b>Đây thường là cách đóng khung sát thực tế nhất.</b></li>
  </ul>

  <h2>Bảng thí nghiệm mẫu cho luận văn</h2>
  <table>
    <tr><th>Cấu hình</th><th>PR-AUC</th><th>Recall@1% FPR</th><th>Ghi chú</th></tr>
    <tr><td>Baseline (không xử lý lệch)</td><td>0,312</td><td>0,41</td><td>ngưỡng 0,5 gần như không bắt được gì</td></tr>
    <tr><td>+ class_weight="balanced"</td><td>0,367</td><td>0,58</td><td>một dòng code</td></tr>
    <tr><td>+ SMOTE (0,1)</td><td>0,361</td><td>0,56</td><td>không cải thiện, tốn 4× thời gian train</td></tr>
    <tr><td>+ chọn ngưỡng theo chi phí</td><td>0,367</td><td>0,58</td><td>PR-AUC không đổi nhưng <b>tiền tiết kiệm +23%</b></td></tr>
  </table>
  <p>Dòng cuối là loại kết quả làm luận văn khác biệt: nó cho thấy bạn hiểu rằng <b>chỉ số kỹ thuật không đổi mà giá trị kinh doanh vẫn tăng được</b>.</p>

<template data-node="ml-metrics">
  <p>Đây là bài mà một quyết định sai làm hỏng toàn bộ luận văn: <b>chọn nhầm chỉ số đánh giá</b>. Mô hình sẽ tối ưu đúng thứ bạn đo, nên nếu bạn đo sai thứ, bạn nhận được một mô hình tốt cho việc bạn không cần.</p>

  <h2>Ma trận nhầm lẫn — gốc của mọi chỉ số</h2>
  <table>
    <tr><th></th><th>Thực tế: gian lận</th><th>Thực tế: sạch</th></tr>
    <tr><th>Mô hình chặn</th><td><b>TP</b> — bắt đúng 👍</td><td><b>FP</b> — báo nhầm, làm phiền khách</td></tr>
    <tr><th>Mô hình cho qua</th><td><b>FN</b> — bỏ lọt, mất tiền</td><td><b>TN</b> — đúng, và chiếm 99,8% mọi thứ</td></tr>
  </table>
  <p>Mọi chỉ số đều là một cách gộp bốn ô này. Hiểu bảng này rồi thì không cần học thuộc công thức nào.</p>

  <h2>Bốn chỉ số, và câu hỏi mỗi cái trả lời</h2>
  <table>
    <tr><th>Chỉ số</th><th>Công thức</th><th>Trả lời câu hỏi</th></tr>
    <tr><td><b>Accuracy</b></td><td>$\frac{TP+TN}{\text{tổng}}$</td><td>"Đúng bao nhiêu phần trăm?" — <b>vô dụng khi lệch</b>, vì TN áp đảo</td></tr>
    <tr><td><b>Precision</b></td><td>$\frac{TP}{TP+FP}$</td><td>"Khi mô hình báo động, tin được bao nhiêu?" → chi phí làm phiền khách</td></tr>
    <tr><td><b>Recall</b></td><td>$\frac{TP}{TP+FN}$</td><td>"Trong tất cả gian lận thật, bắt được bao nhiêu?" → chi phí mất tiền</td></tr>
    <tr><td><b>F1</b></td><td>$\frac{2PR}{P+R}$</td><td>Trung bình điều hoà — tiện để so sánh, nhưng <b>giả định precision và recall quan trọng ngang nhau</b>, điều gần như không bao giờ đúng</td></tr>
  </table>

  <h2>Kéo ngưỡng và nhìn hậu quả</h2>
  <div data-viz="thresh"></div>

  <h2>PR-AUC là chỉ số chính của bạn</h2>
  <p><button class="ds-math" data-math="auc">ROC-AUC vs PR-AUC — vì sao ROC nói dối khi dữ liệu lệch</button></p>
  <div class="ds-code"><b>from</b> sklearn.metrics <b>import</b> average_precision_score, roc_auc_score
pr_auc  = average_precision_score(y_test, y_prob)   <i># ← chỉ số chính</i>
roc_auc = roc_auc_score(y_test, y_prob)             <i># báo cáo kèm để so với paper khác</i></div>
  <p>Nhớ: đường cơ sở của PR-AUC là <b>tỉ lệ dương</b> (0,0017), không phải 0,5. Nên PR-AUC = 0,35 nghĩa là tốt hơn ngẫu nhiên khoảng 200 lần — hãy nói rõ điều này trong luận văn, nếu không người đọc sẽ tưởng 0,35 là kém.</p>

  <h2>Chọn ngưỡng — bước mà hầu hết luận văn bỏ qua</h2>
  <p>Mô hình cho ra xác suất. Chuyển thành quyết định cần một ngưỡng. Mặc định 0,5 <b>gần như luôn sai</b> cho bài toán lệch.</p>
  <h3>Cách 1 · Tối đa F1 (được, nhưng tuỳ tiện)</h3>
  <div class="ds-code"><b>from</b> sklearn.metrics <b>import</b> precision_recall_curve
p, r, th = precision_recall_curve(y_valid, y_prob_valid)
f1 = 2*p*r / (p + r + 1e-9)
best = th[f1[:-1].argmax()]</div>

  <h3>Cách 2 · Tối thiểu chi phí (đúng, và làm luận văn mạnh hơn hẳn)</h3>
  <div class="ds-code">COST_FN = 3_000_000      <i># bỏ lọt một vụ gian lận</i>
COST_FP =    40_000      <i># xác minh nhầm một khách</i>

<b>def</b> total_cost(y_true, y_prob, t):
    pred = (y_prob &gt;= t).astype(<b>int</b>)
    fn = ((y_true == 1) &amp; (pred == 0)).sum()
    fp = ((y_true == 0) &amp; (pred == 1)).sum()
    <b>return</b> fn * COST_FN + fp * COST_FP

ths   = np.linspace(0.001, 0.999, 999)
costs = [total_cost(y_valid, y_prob_valid, t) <b>for</b> t <b>in</b> ths]
best_t = ths[int(np.argmin(costs))]
print(f"ngưỡng tối ưu {best_t:.3f} — thiệt hại {min(costs)/1e6:.0f} triệu ₫")</div>
  <p><b>Chọn ngưỡng trên tập validation, rồi áp cố định lên test.</b> Chọn ngưỡng trên test là một dạng rò rỉ.</p>

  <h3>Cách 3 · Ràng buộc theo năng lực vận hành</h3>
  <p>Thực tế nhất: đội xác minh xử lý được 200 ca/ngày. Vậy ngưỡng phải là mức cho ra đúng ~200 cảnh báo/ngày, và chỉ số là <b>precision@200</b>. Cách đóng khung này rất ít luận văn Việt Nam dùng, và nó dễ bảo vệ vì nó đúng cách hệ thống thật hoạt động.</p>

  <h2>Bảng kết quả nên có trong luận văn</h2>
  <table>
    <tr><th>Mô hình</th><th>PR-AUC (KTC 95%)</th><th>Recall @ ngưỡng chi phí</th><th>Precision</th><th>Thiệt hại (triệu ₫/tháng)</th></tr>
    <tr><td>Luật thủ công hiện tại</td><td>—</td><td>0,31</td><td>0,08</td><td>1.240</td></tr>
    <tr><td>Logistic Regression</td><td>0,281 (0,259–0,304)</td><td>0,49</td><td>0,14</td><td>890</td></tr>
    <tr><td>LightGBM baseline</td><td>0,367 (0,344–0,391)</td><td>0,58</td><td>0,19</td><td>710</td></tr>
    <tr><td><b>Đề xuất (+ feature thời gian)</b></td><td><b>0,412 (0,388–0,437)</b></td><td><b>0,64</b></td><td><b>0,22</b></td><td><b>598</b></td></tr>
  </table>
  <p>Cột cuối là cột hội đồng nhớ. Nó biến "PR-AUC tăng 0,045" — một con số không ai cảm nhận được — thành "tiết kiệm 112 triệu mỗi tháng".</p>

  <div class="wb-alert wb-alert--warning wb-alert--plain"><div class="wb-alert__body">
    <p class="wb-alert__title">Đừng báo cáo accuracy</p>
    <p class="wb-alert__msg">Nếu bảng của bạn có cột accuracy 99,8%, người đọc có kinh nghiệm sẽ nghĩ ngay rằng bạn chưa hiểu bài toán lệch nhãn. Nếu bắt buộc phải có, hãy đặt kèm accuracy của mô hình "luôn đoán sạch" (99,83%) để cho thấy bạn biết nó vô nghĩa.</p>

<template data-node="ml-tune">
  <p>Tuning siêu tham số là bước cho thêm 1–3% và ngốn nhiều giờ máy nhất. Làm sau cùng, sau khi feature đã ổn.</p>

  <h2>Ba cách</h2>
  <table>
    <tr><th>Cách</th><th>Cơ chế</th><th>Khi nào</th></tr>
    <tr><td><b>Grid search</b></td><td>Thử mọi tổ hợp</td><td>≤ 3 tham số, mỗi cái ≤ 4 giá trị</td></tr>
    <tr><td><b>Random search</b></td><td>Bốc ngẫu nhiên N tổ hợp</td><td>Nhiều tham số — <b>thường tốt hơn grid với cùng ngân sách</b></td></tr>
    <tr><td><b>Optuna</b> (Bayesian)</td><td>Học từ các lần thử trước để chọn lần sau</td><td>Khi mỗi lần train tốn phút trở lên</td></tr>
  </table>
  <p>Vì sao random thường thắng grid: trong 10 tham số thường chỉ 2–3 cái thật sự quan trọng. Grid lãng phí phần lớn ngân sách để thử các tổ hợp khác nhau của những tham số vô nghĩa.</p>

  <h2>Optuna — mẫu dùng được ngay</h2>
  <div class="ds-code"><b>import</b> optuna
<b>from</b> sklearn.model_selection <b>import</b> cross_val_score

<b>def</b> objective(trial):
    params = {
        "num_leaves":        trial.suggest_int("num_leaves", 7, 127, log=<b>True</b>),
        "learning_rate":     trial.suggest_float("learning_rate", 0.01, 0.2, log=<b>True</b>),
        "min_child_samples": trial.suggest_int("min_child_samples", 20, 300),
        "subsample":         trial.suggest_float("subsample", 0.6, 1.0),
        "colsample_bytree":  trial.suggest_float("colsample_bytree", 0.5, 1.0),
        "reg_lambda":        trial.suggest_float("reg_lambda", 1e-3, 30, log=<b>True</b>),
    }
    pipe = build_pipeline(**params)
    <b>return</b> cross_val_score(pipe, X_train, y_train, cv=cv,
                            scoring="average_precision").mean()

study = optuna.create_study(direction="maximize",
                            sampler=optuna.samplers.TPESampler(seed=42))
study.optimize(objective, n_trials=60)
print(study.best_params, study.best_value)</div>
  <p><code>log=True</code> cho những tham số mà "gấp đôi" có ý nghĩa hơn "cộng thêm 1" — learning rate, regularization. Không có nó, bộ dò lãng phí phần lớn thời gian ở vùng giá trị lớn.</p>

  <h2>Bốn quy tắc để không tự lừa mình</h2>
  <ol>
    <li><b>Tune trên validation hoặc CV, không bao giờ trên test.</b></li>
    <li><b>Cố định seed</b> — nếu không, bạn không biết chênh lệch giữa hai cấu hình là do tham số hay do ngẫu nhiên.</li>
    <li><b>Kiểm tra tham số tốt nhất có nằm ở biên không.</b> Nếu <code>num_leaves</code> tối ưu là 127 và đó cũng là giá trị lớn nhất bạn cho phép, hãy mở rộng khoảng.</li>
    <li><b>Ghi lại mọi lần thử.</b> Optuna lưu sẵn <code>study.trials_dataframe()</code> — xuất ra CSV và đưa vào phụ lục luận văn.</li>
  </ol>

  <h2>Kỳ vọng thực tế</h2>
  <table>
    <tr><th>Việc</th><th>Cải thiện điển hình</th><th>Thời gian</th></tr>
    <tr><td>Thêm một nhóm feature tốt</td><td>+0,03 → +0,15 PR-AUC</td><td>2–4 giờ suy nghĩ</td></tr>
    <tr><td>Đổi LogReg → LightGBM</td><td>+0,05 → +0,10</td><td>15 phút</td></tr>
    <tr><td>Tune 60 lần thử</td><td><b>+0,005 → +0,03</b></td><td>1–6 giờ máy</td></tr>
    <tr><td>Ensemble 5 mô hình</td><td>+0,003 → +0,01</td><td>vài giờ, khó triển khai</td></tr>
  </table>
  <p>Bảng này giải thích thứ tự làm việc: <b>đừng tune trước khi feature xong</b>. Với 2 tuần, một lần Optuna 60 trial vào ngày 9 là đủ.</p>

  <p class="ds-more"><button class="ds-aside" data-aside="cmp-tune">So sánh grid · random · Optuna</button></p>
</template>

<template data-node="ml-shap">
  <p>Hội đồng gần như chắc chắn sẽ hỏi: <i>"Vì sao mô hình quyết định như vậy?"</i>. Trong lĩnh vực tài chính, đây không chỉ là câu hỏi học thuật — nhiều quy định yêu cầu tổ chức tín dụng giải thích được quyết định từ chối.</p>

  <h2>Ý tưởng SHAP, không cần công thức</h2>
  <p>Tưởng tượng một nhóm làm chung dự án và được thưởng 100 triệu. Chia thế nào cho công bằng? Lý thuyết trò chơi có một đáp án: với mỗi người, xét mọi thứ tự gia nhập nhóm có thể, đo phần giá trị tăng thêm khi người đó vào, rồi lấy trung bình. Đó là <b>giá trị Shapley</b>.</p>
  <p>SHAP áp đúng ý tưởng đó cho feature: <b>mỗi feature đóng góp bao nhiêu vào việc đẩy dự đoán lệch khỏi mức trung bình</b>. Tổng mọi đóng góp + giá trị cơ sở = dự đoán cuối. Đây là tính chất quan trọng: nó <b>cộng lại đúng bằng</b> kết quả, nên giải thích không phải là ước lượng mơ hồ.</p>

  <div data-viz="shap"></div>

  <h2>Code</h2>
  <div class="ds-code"><b>import</b> shap
model = pipe.named_steps["model"]
X_t   = pipe.named_steps["prep"].transform(X_test)      <i># dữ liệu đã biến đổi</i>
names = pipe.named_steps["prep"].get_feature_names_out()

explainer = shap.TreeExplainer(model)                   <i># nhanh, cho mô hình cây</i>
exp = explainer(X_t)                                    <i># ← API mới: trả về đối tượng Explanation</i>
exp.feature_names = <b>list</b>(names)

shap.plots.beeswarm(exp)                                <i># toàn cục — hình chính của luận văn</i>
shap.plots.bar(exp)                                     <i># xếp hạng độ quan trọng</i>
shap.plots.waterfall(exp[0])                            <i># MỘT ca cụ thể — exp[0] là mẫu số 0</i></div>
  <div class="wb-alert wb-alert--warning wb-alert--plain"><div class="wb-alert__body">
    <p class="wb-alert__title">Dùng <code>explainer(X)</code>, đừng dùng <code>explainer.shap_values(X)</code></p>
    <p class="wb-alert__msg">Bạn sẽ thấy rất nhiều hướng dẫn cũ viết <code>shap_values = explainer.shap_values(X)</code> rồi <code>shap_values[0]</code> cho "mẫu đầu tiên". Với bài toán hai lớp, <b>tuỳ phiên bản shap</b> mà hàm đó trả về một mảng <code>(n_mẫu, n_cột)</code> hoặc một danh sách hai mảng cho hai lớp — nên <code>shap_values[0]</code> khi thì là mẫu số 0, khi thì là <i>toàn bộ lớp 0</i>. Hình vẽ ra vẫn có, chỉ là sai. API mới <code>explainer(X)</code> trả về đối tượng <code>Explanation</code> có nhãn rõ ràng và không mập mờ như vậy.</p>
  </div></div>

  <h2>Hai loại hình, hai mục đích trong luận văn</h2>
  <table>
    <tr><th>Hình</th><th>Trả lời</th><th>Đặt ở chương</th></tr>
    <tr><td><b>Summary plot</b> (beeswarm)</td><td>"Mô hình học được gì <b>nói chung</b> về gian lận?"</td><td>Kết quả &amp; thảo luận</td></tr>
    <tr><td><b>Force / waterfall plot</b></td><td>"Vì sao <b>giao dịch này</b> bị chặn?"</td><td>Nghiên cứu tình huống — rất thuyết phục khi bảo vệ</td></tr>
  </table>
  <p>Cách đọc beeswarm: mỗi chấm là một giao dịch. Trục ngang = mức đẩy dự đoán (phải = tăng rủi ro). Màu = giá trị feature cao hay thấp. Nếu <code>secs_since_last</code> có các chấm màu "thấp" nằm bên phải, nghĩa là <b>khoảng cách thời gian ngắn đẩy rủi ro lên</b> — và câu đó viết thẳng vào luận văn được.</p>

  <h2>Ba giới hạn phải nêu (nêu ra làm bạn mạnh hơn, không yếu đi)</h2>
  <ul>
    <li><b>SHAP không phải quan hệ nhân quả.</b> Nó nói feature đóng góp gì <i>vào dự đoán của mô hình</i>, không nói feature <i>gây ra</i> gian lận. Nhầm lẫn này rất phổ biến trong các luận văn.</li>
    <li><b>Feature tương quan mạnh chia nhau công trạng</b> một cách khó đoán. Hai cột gần trùng nhau có thể mỗi cột nhận một nửa.</li>
    <li><b>Chậm</b> trên dữ liệu lớn. Lấy mẫu 1.000–5.000 dòng là đủ cho hình trong luận văn.</li>
  </ul>

  <p class="ds-more"><button class="ds-aside" data-aside="cmp-explain">So sánh SHAP · permutation · PDP · LIME</button></p>
</template>

<template data-node="ml-unsup">
  <p>Khi không có nhãn — hoặc có nhưng quá ít, quá trễ — bạn vẫn làm được việc. Với bài toán gian lận, nhóm này đặc biệt đáng quan tâm vì <b>kiểu gian lận mới không có trong dữ liệu lịch sử</b>.</p>

  <h2>Phân cụm — nhóm những thứ giống nhau</h2>
  <div class="ds-code"><b>from</b> sklearn.cluster <b>import</b> KMeans
km = KMeans(n_clusters=5, random_state=42, n_init=10).fit(X_scaled)
df["cluster"] = km.labels_</div>
  <p>k-means đo khoảng cách Euclid, nên <b>bắt buộc scale trước</b>, và nên mã hoá sin/cos cho biến chu kỳ — đây là một trong những nơi sin/cos thật sự quan trọng.</p>
  <p>Dùng trong luận văn: phân khúc khách hàng, rồi cho thấy tỉ lệ gian lận khác nhau giữa các cụm. Hoặc dùng <code>cluster</code> làm một feature cho mô hình có giám sát.</p>
  <p>Chọn số cụm: phương pháp khuỷu tay (elbow) hoặc silhouette score. Nhưng thành thật mà nói, <b>số cụm thường được chọn theo ý nghĩa nghiệp vụ</b> chứ không theo chỉ số — và nói thẳng điều đó trung thực hơn là giả vờ nó khách quan.</p>

  <h2>Phát hiện bất thường — mô hình hoá "bình thường"</h2>
  <table>
    <tr><th>Thuật toán</th><th>Ý tưởng</th><th>Dùng khi</th></tr>
    <tr><td><b>Isolation Forest</b></td><td>Điểm bất thường bị "cô lập" bằng ít lần chia ngẫu nhiên hơn</td><td>Mặc định tốt, nhanh, ít tham số</td></tr>
    <tr><td><b>Local Outlier Factor</b></td><td>So mật độ quanh một điểm với mật độ quanh hàng xóm của nó</td><td>Khi bất thường mang tính cục bộ</td></tr>
    <tr><td><b>Autoencoder</b></td><td>Nén rồi khôi phục; điểm khó khôi phục là điểm lạ</td><td>Nhiều chiều, có nhiều dữ liệu bình thường</td></tr>
    <tr><td><b>One-Class SVM</b></td><td>Vẽ ranh giới bao quanh vùng "bình thường"</td><td>Dữ liệu nhỏ</td></tr>
  </table>
  <div class="ds-code"><b>from</b> sklearn.ensemble <b>import</b> IsolationForest
iso = IsolationForest(contamination=0.002, random_state=42).fit(X_train_normal)
df["anomaly_score"] = -iso.score_samples(X)     <i># cao = lạ hơn</i></div>

  <h2>Cách kết hợp mạnh nhất cho luận văn</h2>
  <p>Đừng chọn một trong hai. <b>Dùng điểm bất thường làm feature cho mô hình có giám sát:</b></p>
  <div class="ds-code">df["iso_score"] = -iso.score_samples(X)
FEATURES = [..., "iso_score"]       <i># thêm vào danh sách feature của LightGBM</i></div>
  <p>Lý do nó hoạt động tốt: mô hình có giám sát học rất giỏi các kiểu gian lận <b>đã biết</b>, còn điểm bất thường bắt được cái <b>chưa từng thấy</b>. Hai tín hiệu bổ sung nhau, và cách kết hợp này là một đóng góp hợp lệ, dễ trình bày cho một luận văn thạc sĩ ứng dụng.</p>

  <div class="wb-alert wb-alert--warning wb-alert--plain"><div class="wb-alert__body">
    <p class="wb-alert__title">Đánh giá mô hình không giám sát rất khó</p>
    <p class="wb-alert__msg">Không có nhãn thì không có đúng/sai. Trong luận văn, hãy đánh giá gián tiếp: (a) dùng nhãn có sẵn <b>chỉ để đánh giá</b>, không để train — cách này hợp lệ và rất thuyết phục; (b) cho chuyên gia nghiệp vụ xem 50 ca bất thường nhất và đếm tỉ lệ đáng ngờ thật; (c) đo mức cải thiện khi thêm điểm bất thường vào mô hình có giám sát. Cách (c) là cách dễ bảo vệ nhất.</p>
  </div></div>
</template>
