<template data-node="dl-nn">
  <p>Mạng nơ-ron nghe huyền bí nhưng thực chất là <b>hồi quy logistic xếp chồng lên nhau nhiều tầng</b>. Nếu bạn hiểu bài <b>Hồi quy logistic</b>, bạn đã đi được 70% quãng đường.</p>

  <h2>Từ một nơ-ron tới một mạng</h2>
  <p>Một "nơ-ron" làm đúng hai việc:</p>
  <p>$$z = w_1x_1 + w_2x_2 + \dots + b \qquad\qquad a = f(z)$$</p>
  <p>Bước 1 là tổng có trọng số — <b>y hệt</b> hồi quy tuyến tính. Bước 2 là một hàm phi tuyến $f$. Hết. Một nơ-ron chính là một hồi quy logistic nếu $f$ = sigmoid.</p>
  <p>Xếp 64 nơ-ron cạnh nhau → một <b>lớp</b>. Nối đầu ra lớp này vào đầu vào lớp sau → một <b>mạng</b>.</p>

  <h2>Vì sao phải có hàm phi tuyến</h2>
  <p>Đây là câu hỏi hay nhất trong toàn bộ deep learning, và câu trả lời rất gọn: <b>nếu bỏ $f$ đi, mọi tầng gộp lại vẫn chỉ là một phép tuyến tính.</b></p>
  <p>Ba lớp tuyến tính liên tiếp: $W_3(W_2(W_1x)) = (W_3W_2W_1)x = Wx$ — một ma trận duy nhất. Mạng 100 tầng không mạnh hơn một tầng chút nào.</p>
  <p>Hàm phi tuyến là thứ duy nhất khiến độ sâu có ý nghĩa. Nó cho phép mạng bẻ cong không gian, và sau vài lần bẻ, hai lớp dữ liệu lồng vào nhau trở nên tách được bằng một mặt phẳng.</p>
  <table>
    <tr><th>Hàm</th><th>Công thức</th><th>Dùng ở đâu</th></tr>
    <tr><td><b>ReLU</b></td><td>$\max(0, z)$</td><td><b>Mặc định cho lớp ẩn.</b> Rẻ, không bị vanishing gradient ở phần dương</td></tr>
    <tr><td>GELU</td><td>xấp xỉ ReLU nhưng mượt</td><td>Chuẩn trong Transformer</td></tr>
    <tr><td>Sigmoid</td><td>$\frac{1}{1+e^{-z}}$</td><td>Chỉ ở lớp <b>đầu ra</b>, bài toán 2 lớp</td></tr>
    <tr><td>Softmax</td><td><button class="ds-math" data-math="softmax">xem</button></td><td>Chỉ ở lớp <b>đầu ra</b>, nhiều lớp</td></tr>
  </table>

  <h2>Một mạng đầy đủ cho dữ liệu bảng</h2>
  <div class="ds-code"><b>import</b> torch, torch.nn <b>as</b> nn

model = nn.Sequential(
    nn.Linear(30, 64),   <i># 30 feature → 64 nơ-ron</i>
    nn.ReLU(),
    nn.Dropout(0.3),     <i># chống overfit: bỏ ngẫu nhiên 30% nơ-ron mỗi lượt train</i>
    nn.Linear(64, 32),
    nn.ReLU(),
    nn.Linear(32, 1),    <i># một số duy nhất (logit)</i>
)
loss_fn   = nn.BCEWithLogitsLoss(pos_weight=torch.tensor([580.0]))  <i># nhãn lệch</i>
optimizer = torch.optim.AdamW(model.parameters(), lr=1e-3)</div>
  <p><code>BCEWithLogitsLoss</code> nhận thẳng logit và tự làm sigmoid bên trong — ổn định số học hơn là tự sigmoid rồi tính BCE. Đây là lỗi cấu hình phổ biến nhất của người mới dùng PyTorch.</p>

  <h2>Vòng lặp huấn luyện — nhìn một lần là hết bí ẩn</h2>
  <div class="ds-code"><b>for</b> epoch <b>in</b> range(50):
    <b>for</b> xb, yb <b>in</b> train_loader:          <i># từng mini-batch</i>
        optimizer.zero_grad()             <i># 1. xoá gradient cũ</i>
        pred = model(xb)                  <i># 2. chạy xuôi</i>
        loss = loss_fn(pred, yb)          <i># 3. chấm điểm sai</i>
        loss.backward()                   <i># 4. chạy ngược, tính gradient</i>
        optimizer.step()                  <i># 5. cập nhật trọng số</i></div>
  <p>Năm dòng này là <b>toàn bộ</b> việc huấn luyện mọi mạng nơ-ron, từ mạng 3 tầng của bạn tới GPT. Khác biệt chỉ nằm ở kiến trúc <code>model</code> và quy mô.</p>
  <p>Dòng 4 là <button class="ds-math" data-math="chain">quy tắc dây chuyền</button> chạy tự động. Dòng 5 là <button class="ds-math" data-math="gdupdate">công thức cập nhật</button>.</p>

  <h2>Bao nhiêu tầng, bao nhiêu nơ-ron?</h2>
  <p>Với dữ liệu bảng: 2–3 lớp ẩn, 32–256 nơ-ron mỗi lớp. Sâu hơn hiếm khi giúp. Nếu bạn thấy mình cần mạng 10 tầng cho dữ liệu bảng, gần như chắc chắn LightGBM sẽ tốt hơn với 1% công sức.</p>
</template>

<template data-node="dl-backprop">
  <p>Backpropagation nghe như một thuật toán phức tạp. Thực chất nó là <b>quy tắc dây chuyền của giải tích, áp dụng có tổ chức</b>. Bài này để bạn hiểu đủ để đọc lỗi, không phải để tự cài đặt.</p>

  <h2>Vấn đề nó giải quyết</h2>
  <p>Mạng có 50.000 trọng số. Bạn cần biết: <b>nếu nhích trọng số thứ 37.412 lên một chút, sai số đổi bao nhiêu?</b> — cho cả 50.000 trọng số.</p>
  <p>Cách ngây thơ: nhích từng cái, chạy lại toàn mạng, đo chênh lệch. Cần 50.000 lần chạy cho <b>một</b> bước huấn luyện. Không khả thi.</p>
  <p>Backprop tính hết 50.000 đạo hàm trong <b>một</b> lần chạy ngược, tốn xấp xỉ bằng một lần chạy xuôi. Đó là toàn bộ giá trị của nó, và là lý do deep learning khả thi về mặt tính toán.</p>

  <h2>Cơ chế</h2>
  <p><button class="ds-math" data-math="chain">Quy tắc dây chuyền — ví dụ số, kiểm chứng được</button></p>
  <p>Mạng là hàm lồng nhau: $\text{loss}(f_3(f_2(f_1(x))))$. Quy tắc dây chuyền nói đạo hàm của hàm lồng = tích các đạo hàm dọc chuỗi.</p>
  <p>Backprop tận dụng một điều: khi tính đạo hàm cho lớp 1, bạn cần đúng những tích mà bạn đã tính khi làm lớp 2 và lớp 3. Nên nó đi <b>từ cuối về đầu</b>, mỗi bước tái sử dụng kết quả bước trước:</p>
  <div class="ds-code">Chạy xuôi :  x → lớp1 → lớp2 → lớp3 → dự đoán → loss
Chạy ngược:      ∂loss/∂w1 ← ∂loss/∂w2 ← ∂loss/∂w3 ← ∂loss/∂pred
                 (mỗi bước nhân thêm một đạo hàm cục bộ)</div>

  <h2>Hai bệnh sinh ra trực tiếp từ cơ chế này</h2>
  <table>
    <tr><th>Bệnh</th><th>Nguyên nhân</th><th>Triệu chứng</th><th>Thuốc</th></tr>
    <tr><td><b>Vanishing gradient</b></td><td>Nhân nhiều số &lt; 1 với nhau → tiến về 0</td><td>Lớp đầu gần như không đổi, loss đứng yên</td><td>ReLU thay sigmoid · residual connection · batch/layer norm</td></tr>
    <tr><td><b>Exploding gradient</b></td><td>Nhân nhiều số &gt; 1 → bùng nổ</td><td><code>loss: nan</code></td><td><code>clip_grad_norm_(params, 1.0)</code> · giảm lr</td></tr>
  </table>
  <p>Hiểu điều này giải thích vì sao <b>residual connection</b> (nối tắt $x + f(x)$) là phát minh quan trọng: nó tạo một đường cho gradient chảy thẳng về đầu mà không bị nhân nhỏ dần. Đó cũng là lý do Transformer có nối tắt ở mỗi khối.</p>

  <h2>Trong thực tế bạn chỉ cần biết ba dòng</h2>
  <div class="ds-code">optimizer.zero_grad()   <i># PyTorch CỘNG DỒN gradient — quên dòng này là lỗi kinh điển</i>
loss.backward()         <i># autograd chạy toàn bộ backprop</i>
optimizer.step()</div>
  <p>Bạn sẽ không bao giờ tự viết backprop. Nhưng khi loss không giảm, bạn cần biết <i>gradient là thứ đang bị mất hoặc bị nổ</i> để biết chỗ nhìn.</p>

  <h2>Kiểm tra bạn đã hiểu</h2>
  <p>Câu hỏi: mạng của bạn có 20 lớp dùng sigmoid, loss không giảm chút nào sau 30 epoch. Chuyện gì đang xảy ra, và sửa thế nào?</p>
  <p class="wb-help">Trả lời: đạo hàm sigmoid tối đa chỉ 0,25. Nhân 20 lần: $0{,}25^{20} \approx 10^{-12}$. Gradient tới lớp đầu gần như bằng 0 nên nó không học gì. Sửa: đổi sang ReLU, thêm residual connection, hoặc giảm số lớp.</p>
</template>

<template data-node="dl-train">
  <p>Bài này là bộ điều khiển: những nút bạn thật sự vặn khi huấn luyện, và cách chẩn đoán khi mọi thứ hỏng.</p>

  <h2>Từ vựng bắt buộc</h2>
  <table>
    <tr><th>Thuật ngữ</th><th>Nghĩa</th><th>Giá trị thường dùng</th></tr>
    <tr><td><b>Epoch</b></td><td>Một lượt đi hết toàn bộ dữ liệu train</td><td>10–200, để early stopping quyết định</td></tr>
    <tr><td><b>Batch</b></td><td>Số mẫu xử lý cùng lúc trước khi cập nhật trọng số</td><td>32–512</td></tr>
    <tr><td><b>Step / iteration</b></td><td>Một lần cập nhật trọng số = một batch</td><td>—</td></tr>
    <tr><td><b>Learning rate</b></td><td>Độ dài mỗi bước</td><td>1e-3 (Adam), 1e-5 (fine-tune)</td></tr>
  </table>
  <p>Với 100.000 mẫu và batch 256: một epoch = 391 step.</p>

  <h2>Learning rate — nút quan trọng nhất</h2>
  <p>Nếu chỉ được chỉnh một tham số, chỉnh cái này. <button class="ds-math" data-math="gdupdate">Xem nó ảnh hưởng thế nào</button></p>
  <div class="ds-code"><i># lịch trình chuẩn hiện nay: warmup rồi giảm dần theo cosine</i>
sched = torch.optim.lr_scheduler.OneCycleLR(
    optimizer, max_lr=1e-3, total_steps=epochs * len(train_loader))
<i># trong vòng lặp, sau optimizer.step():</i>
sched.step()</div>
  <p>Vì sao warmup: lúc đầu trọng số ngẫu nhiên nên gradient rất lớn và nhiễu; bước dài ngay từ đầu dễ đẩy mô hình vào vùng xấu. Vì sao giảm dần: về cuối bạn cần bước ngắn để tinh chỉnh, không phải nhảy qua nhảy lại quanh đáy.</p>

  <h2>Chống overfit trong deep learning</h2>
  <table>
    <tr><th>Kỹ thuật</th><th>Cơ chế</th><th>Giá trị</th></tr>
    <tr><td><b>Early stopping</b></td><td>Dừng khi validation ngừng cải thiện</td><td>patience = 5–10 epoch</td></tr>
    <tr><td><b>Dropout</b></td><td>Tắt ngẫu nhiên một phần nơ-ron mỗi lượt → mạng không dựa vào một đường duy nhất</td><td>0,1–0,5</td></tr>
    <tr><td><b>Weight decay</b></td><td>L2 <button class="ds-math" data-math="reg">regularization</button></td><td>0,01 với AdamW</td></tr>
    <tr><td><b>Batch/Layer norm</b></td><td>Chuẩn hoá đầu ra mỗi lớp → train ổn định hơn</td><td>Gần như luôn dùng</td></tr>
  </table>

  <h2>Đọc đường cong loss — bảng chẩn đoán</h2>
  <table>
    <tr><th>Bạn thấy</th><th>Nghĩa là</th><th>Làm gì</th></tr>
    <tr><td>Train ↓, valid ↓, rồi valid ↑</td><td>Overfit từ điểm quay đầu</td><td>Early stopping tại đó</td></tr>
    <tr><td>Cả hai đứng yên ở mức cao</td><td>Underfit hoặc lr quá nhỏ</td><td>Mạng to hơn, lr lớn hơn</td></tr>
    <tr><td>Loss nhảy loạn</td><td>lr quá lớn hoặc batch quá nhỏ</td><td>Giảm lr 10 lần</td></tr>
    <tr><td><code>nan</code></td><td>Gradient nổ, hoặc chia 0, hoặc <code>log(0)</code></td><td>Clip gradient, kiểm tra dữ liệu đầu vào có <code>inf</code>/<code>NaN</code></td></tr>
    <tr><td>Valid <b>tốt hơn</b> train</td><td>Bình thường nếu có dropout (dropout tắt lúc đánh giá). Nếu chênh nhiều → nghi rò rỉ</td><td>Kiểm tra cách chia tập</td></tr>
  </table>

  <h2>Quy trình gỡ lỗi khi mạng không học</h2>
  <ol>
    <li><b>Thử overfit 100 mẫu.</b> Lấy 100 dòng, tắt regularization, train tới khi loss ≈ 0. Nếu <b>không</b> làm được, mã của bạn có lỗi (nhãn lệch hàng, quên <code>zero_grad</code>, lr sai hoàn toàn). Đây là bài test giá trị nhất và ít người biết.</li>
    <li>Kiểm tra dữ liệu đầu vào: có <code>NaN</code> không, đã scale chưa.</li>
    <li>Quét learning rate: thử 1e-2, 1e-3, 1e-4.</li>
    <li>Kiểm tra hàm loss có khớp bài toán không (BCE cho nhị phân, không phải MSE).</li>
    <li>Kiểm tra shape của <code>pred</code> và <code>y</code> có khớp không — broadcasting âm thầm là thủ phạm hay gặp.</li>
  </ol>

  <div class="wb-alert wb-alert--info wb-alert--plain"><div class="wb-alert__body">
    <p class="wb-alert__title">Cho luận văn: ghi lại mọi lần chạy</p>
    <p class="wb-alert__msg">Dùng MLflow hoặc Weights &amp; Biases để tự động lưu tham số + đường cong loss + kết quả. Đường cong train/validation là <b>một hình chuẩn mực</b> trong chương thực nghiệm, và bạn không dựng lại được nó nếu không ghi từ đầu.</p>
  </div></div>
</template>

<template data-node="dl-embed">
  <p>Embedding là ý tưởng nền tảng cho mọi thứ hiện đại — từ hệ gợi ý tới ChatGPT. Nó đủ đơn giản để hiểu trong 15 phút, và hiểu nó thì Transformer bớt khó đi một nửa.</p>

  <h2>Vấn đề</h2>
  <p>Bạn có 50.000 mã cửa hàng. One-hot cho ra 50.000 cột, mỗi dòng có đúng một số 1. Ba vấn đề:</p>
  <ul>
    <li>Tốn bộ nhớ khủng khiếp.</li>
    <li>Mọi cửa hàng <b>cách đều nhau</b> — "cửa hàng vàng bạc" và "tiệm kim hoàn" xa nhau y như "tiệm kim hoàn" và "quán phở".</li>
    <li>Cửa hàng chỉ có 3 giao dịch thì cột của nó gần như không học được gì.</li>
  </ul>

  <h2>Giải pháp: học một vector ngắn cho mỗi thực thể</h2>
  <p>Thay 50.000 cột bằng 32 số. Không phải 32 số do bạn chọn — mà là <b>32 số mô hình tự học trong lúc train</b>, sao cho chúng giúp giảm loss.</p>
  <p>Kết quả tự nhiên: những cửa hàng có hành vi giống nhau sẽ có vector gần nhau, vì như thế thì hữu ích cho việc dự đoán.</p>
  <div class="ds-code">emb = nn.Embedding(num_embeddings=50_000, embedding_dim=32)
<i># thực chất là một bảng tra cứu 50.000 × 32, và mọi ô đều là tham số học được</i>
vec = emb(torch.tensor([1234]))   <i># → vector 32 chiều của cửa hàng #1234</i></div>
  <p>Quy tắc chọn số chiều: $\min(50, \sqrt[4]{n})$ hoặc đơn giản là $n^{0{,}25}$. Với 50.000 giá trị → khoảng 15–32 chiều.</p>

  <h2>Vì sao "gần nhau" lại có nghĩa</h2>
  <p>Không ai bảo mô hình rằng hai cửa hàng giống nhau. Nhưng nếu chúng xuất hiện trong những bối cảnh tương tự (cùng loại khách, cùng khoảng tiền, cùng khung giờ), thì đặt vector của chúng gần nhau <b>làm giảm loss</b> — nên gradient descent tự đẩy chúng lại gần.</p>
  <p>Đây chính là cơ chế đằng sau word embedding: "vua" và "hoàng đế" gần nhau vì chúng xuất hiện trong những câu tương tự. <b>Ý nghĩa nổi lên từ ngữ cảnh, không ai gán.</b></p>
  <p><b>Chỗ ví von hỏng:</b> người ta hay nói embedding "hiểu nghĩa". Nó không hiểu gì cả — nó chỉ mã hoá <i>thống kê đồng xuất hiện</i>. Vì thế nó cũng học luôn cả định kiến có trong dữ liệu, và đó là một vấn đề đạo đức thật, không phải giả định.</p>

  <h2>Dùng trong bài toán của bạn</h2>
  <div class="ds-code"><b>class</b> FraudNet(nn.Module):
    <b>def</b> __init__(self, n_merchants, n_numeric):
        super().__init__()
        self.merchant_emb = nn.Embedding(n_merchants, 16)
        self.mlp = nn.Sequential(
            nn.Linear(16 + n_numeric, 64), nn.ReLU(), nn.Dropout(0.3),
            nn.Linear(64, 1))

    <b>def</b> forward(self, merchant_id, x_num):
        e = self.merchant_emb(merchant_id)         <i># (batch, 16)</i>
        <b>return</b> self.mlp(torch.cat([e, x_num], dim=1))</div>
  <p>Sau khi train, <code>merchant_emb.weight</code> là ma trận 50.000 × 16. Bạn có thể giảm chiều bằng UMAP/t-SNE và vẽ ra — <b>một hình rất tốt cho luận văn</b>, cho thấy mô hình đã tự nhóm các cửa hàng rủi ro cao vào một vùng.</p>
  <p>Mẹo thực dụng: có thể huấn luyện embedding bằng mạng nơ-ron rồi <b>lấy 16 cột đó làm feature cho LightGBM</b>. Kết hợp này thường tốt hơn cả hai cách riêng lẻ, và là một đóng góp hợp lệ cho luận văn.</p>

  <h2>Cầu nối sang Transformer</h2>
  <p>Trong mô hình ngôn ngữ, mỗi <b>token</b> (từ hoặc mảnh từ) có một embedding. Câu "thẻ này vừa quẹt" trở thành 4 vector. Rồi Transformer làm cho các vector đó <b>trao đổi thông tin với nhau</b> — và cơ chế trao đổi đó chính là attention, bài tiếp theo.</p>
</template>

<template data-node="dl-cnn-rnn">
  <p>Hai kiến trúc này thống trị 2012–2017 và ở nhiều tác vụ đã bị Transformer thay thế. Nhưng “bị thay thế ở tác vụ dẫn đầu” <b>không</b> đồng nghĩa với “không còn dùng”: cả hai vẫn là lựa chọn hợp lý khi dữ liệu ít, tài nguyên hạn chế, hoặc chuỗi ngắn — và cả hai vẫn là <b>baseline hợp lệ</b> trong một luận văn.</p>

    <div class="wb-alert__body"><p class="wb-alert__title">Bài này cần tới đâu, tuỳ lộ trình bạn đang đi</p>

  <h2>CNN — cho dữ liệu có cấu trúc không gian</h2>
  <p>Ý tưởng: một bộ lọc nhỏ (ví dụ 3×3) trượt khắp bức ảnh, tìm một mẫu hình cục bộ như cạnh dọc. Cùng bộ lọc đó dùng ở mọi vị trí — nên nếu học được cách nhận ra cạnh ở góc trái, nó nhận ra cạnh ở khắp nơi.</p>
  <p>Hai ý tưởng cốt lõi đáng nhớ, vì chúng xuất hiện lại ở nhiều nơi:</p>
  <ul>
    <li><b>Chia sẻ tham số</b> — một bộ lọc dùng ở mọi vị trí, nên số tham số nhỏ hơn nhiều so với mạng đầy đủ.</li>
    <li><b>Bất biến tịnh tiến</b> — con mèo ở góc nào cũng là con mèo.</li>
  </ul>
  <p>Dùng cho: ảnh, và <b>chuỗi thời gian 1 chiều</b> (Conv1D) — cái sau có thể liên quan tới bài của bạn nếu bạn xử lý chuỗi giao dịch.</p>

  <h2>RNN / LSTM — cho dữ liệu tuần tự</h2>
  <p>Ý tưởng: đọc chuỗi từng phần tử một, mang theo một "trạng thái ẩn" như trí nhớ ngắn hạn. LSTM và GRU là các biến thể có cổng để nhớ được lâu hơn.</p>
  <p><b>Hai vấn đề khiến chúng bị thay thế:</b></p>
  <ol>
    <li><b>Không song song hoá được.</b> Phải xử lý phần tử thứ 5 xong mới tới thứ 6. Với chuỗi dài và GPU hiện đại, đây là nút cổ chai chí mạng.</li>
    <li><b>Quên cái ở xa.</b> Thông tin từ token 1 phải đi qua 500 bước để tới token 500, và bị pha loãng dần — cùng cơ chế với vanishing gradient.</li>
  </ol>
  <p>Transformer giải cả hai: mọi vị trí nhìn thấy mọi vị trí <b>trực tiếp</b> (không qua trung gian) và <b>cùng lúc</b> (song song hoàn toàn). Đó là toàn bộ lý do nó thắng — hiểu điều này là hiểu vì sao 2017 là bước ngoặt.</p>

  <h2>Còn dùng ở đâu năm 2026</h2>
  <table>
    <tr><th>Kiến trúc</th><th>Vẫn dùng khi</th></tr>
    <tr><td>CNN</td><td>Ảnh khi tài nguyên hạn chế, xử lý ảnh trên thiết bị nhúng; Conv1D cho chuỗi ngắn</td></tr>
    <tr><td>LSTM/GRU</td><td>Chuỗi ngắn, dữ liệu ít, cần mô hình nhẹ. Vẫn là baseline hợp lệ trong luận văn</td></tr>
    <tr><td>Transformer</td><td>Gần như mọi thứ khác</td></tr>
  </table>
  <p class="wb-help">Nếu luận văn của bạn mô hình hoá <i>chuỗi giao dịch</i> của một thẻ, so sánh LSTM vs Transformer là một thiết kế thí nghiệm hợp lý và có tài liệu tham khảo dồi dào.</p>
</template>

<template data-node="dl-attn">
  <p>Đây là khái niệm bạn nói mình chưa biết. Bài này giải từ số 0 — không giả định gì ngoài bài <b>Embedding</b> vừa đọc.</p>

  <h2>Vấn đề mà attention sinh ra để giải</h2>
  <p>Câu: <b>"Con mèo không băng qua đường vì <span style="text-decoration:underline">nó</span> quá mệt."</b></p>
  <p>"Nó" chỉ con mèo hay chỉ con đường? Bạn biết ngay là con mèo, vì đường không biết mệt. Nhưng mô hình chỉ thấy một dãy vector. Để biểu diễn từ "nó" cho đúng, mô hình <b>phải nhìn lại các từ khác trong câu</b>.</p>
  <p>Trước 2017, RNN làm việc này bằng cách mang thông tin đi qua từng bước — như trò tam sao thất bản, thông tin nhoè dần. Attention làm điều đơn giản hơn nhiều: <b>cho mỗi từ hỏi thẳng mọi từ khác, cùng một lúc.</b></p>

  <h2>Ẩn dụ: thư viện</h2>
  <p>Bạn vào thư viện với một câu hỏi trong đầu.</p>
  <table>
    <tr><th>Trong thư viện</th><th>Trong attention</th></tr>
    <tr><td>Câu hỏi của bạn: "tôi cần tài liệu về ai đang mệt"</td><td><b>Query (Q)</b> — mỗi token tự sinh ra câu hỏi của nó</td></tr>
    <tr><td>Nhãn dán trên gáy mỗi cuốn sách</td><td><b>Key (K)</b> — mỗi token quảng cáo "tôi có thông tin loại này"</td></tr>
    <tr><td>Nội dung thật bên trong sách</td><td><b>Value (V)</b> — thông tin sẽ được lấy đi</td></tr>
    <tr><td>Bạn so câu hỏi với từng nhãn, cuốn nào hợp thì đọc nhiều hơn</td><td>Tính điểm khớp Q·K, biến thành trọng số</td></tr>
    <tr><td>Bạn tổng hợp: 60% từ cuốn A, 30% từ cuốn B, 10% từ cuốn C</td><td>Trung bình có trọng số các Value</td></tr>
  </table>
  <p><b>Chỗ ví von hỏng:</b> trong thư viện, sách có sẵn nhãn do thủ thư dán. Trong attention, <b>Q, K, V đều được sinh ra từ chính token đó bằng ba ma trận trọng số học được</b>. Không ai dán nhãn — mô hình tự học cách đặt câu hỏi, cách quảng cáo, và cách đóng gói nội dung, sao cho toàn bộ giảm loss.</p>

  <h2>Bấm thử</h2>
  <p>Mỗi từ nhìn những từ nào để hiểu chính nó. Bấm vào "Đà Nẵng":</p>
  <div data-viz="attn"></div>

  <h2>Bốn bước, bằng lời</h2>
  <ol>
    <li><b>Sinh ba vector cho mỗi token.</b> Từ embedding $x$, nhân với ba ma trận học được: $Q = xW^Q$, $K = xW^K$, $V = xW^V$.</li>
    <li><b>Chấm điểm liên quan.</b> Query của token $i$ nhân vô hướng với Key của mọi token $j$. Điểm cao = liên quan. <button class="ds-math" data-math="dot">tích vô hướng là gì</button></li>
    <li><b>Chuẩn hoá thành trọng số.</b> Chia cho $\sqrt{d_k}$ rồi qua <button class="ds-math" data-math="softmax">softmax</button> → các trọng số dương, cộng lại bằng 1.</li>
    <li><b>Trộn.</b> Vector mới của token $i$ = tổng có trọng số các Value. Giờ nó đã "biết" ngữ cảnh.</li>
  </ol>
  <p><button class="ds-math" data-math="attention">Công thức đầy đủ, bóc từng ký hiệu, và vì sao có chữ "scaled"</button></p>

  <h2>Multi-head: tám câu hỏi song song</h2>
  <p>Một bộ Q,K,V chỉ học được một kiểu quan hệ. Transformer chạy 8–16 "đầu" song song với các ma trận chiếu khác nhau. Khi phân tích các mô hình đã train, người ta thấy các đầu tự phân công: đầu này chuyên quan hệ ngữ pháp, đầu kia chuyên đại từ chỉ về đâu, đầu khác chuyên token liền kề.</p>
  <p><b>Không ai gán nhiệm vụ đó.</b> Sự phân công nổi lên từ quá trình tối ưu — và đây là một trong những điều đẹp nhất của kiến trúc này.</p>

  <p class="ds-more"><button class="ds-aside" data-aside="x-attn-kinds">Ba loại attention bạn sẽ gặp tên</button></p>
  <h2>Cái giá: bình phương độ dài</h2>
  <p>Mỗi token nhìn mọi token → ma trận $n \times n$. Chuỗi 1.000 token = 1 triệu ô. Gấp đôi độ dài = gấp bốn chi phí.</p>
  <p>Đây là lý do context window đắt đỏ, và là chủ đề của hàng trăm paper (FlashAttention, Linformer, Performer, sliding window...). <b>Cũng là một mỏ đề tài luận văn</b> nếu bạn muốn hướng lý thuyết hơn.</p>

  <h2>Attention có liên quan gì tới bài toán gian lận của bạn?</h2>
  <p>Có, theo cách trực tiếp: coi <b>chuỗi giao dịch gần nhất của một thẻ</b> như một "câu", mỗi giao dịch là một "token". Self-attention cho phép giao dịch hiện tại nhìn lại các giao dịch trước và tự quyết định cái nào đáng chú ý — thay vì bạn phải viết tay các feature "trung bình 1h", "đếm 24h".</p>
  <p>Đây là hướng đề tài có thật và đang được nghiên cứu tích cực. Cảnh báo trung thực: <b>trên dữ liệu bảng vừa và nhỏ, cách này thường vẫn thua LightGBM với feature thủ công tốt.</b> Nếu chọn hướng này, hãy đóng khung nó là "so sánh biểu diễn chuỗi học được vs feature thủ công" — thì kết quả nào cũng là một đóng góp, kể cả khi Transformer thua.</p>
</template>

  <h2>Vai trò từng phần</h2>
  <table>
    <tr><th>Thành phần</th><th>Làm gì</th><th>Bỏ đi thì sao</th></tr>
    <tr><td><b>Multi-head attention</b></td><td>Trộn thông tin <i>giữa</i> các token</td><td>Mỗi token mù tịt về ngữ cảnh</td></tr>
    <tr><td><b>Feed-forward</b></td><td>Biến đổi phi tuyến <i>từng</i> token, chiếm ~2/3 số tham số</td><td>Mô hình mất phần lớn dung lượng nhớ và suy luận</td></tr>

  </table>
  <p>Chú ý sự phân công: attention lo <b>giao tiếp giữa các vị trí</b>, feed-forward lo <b>tính toán tại từng vị trí</b>. Xen kẽ hai việc này là ý tưởng kiến trúc cốt lõi.</p>

  <h2>Positional encoding — vì attention mù về thứ tự</h2>
  <p>Đây là chi tiết đẹp và <b>liên quan trực tiếp tới câu hỏi sin/cos của bạn</b>.</p>
  <p>Attention tính điểm giữa mọi cặp token, nhưng phép đó <b>không quan tâm thứ tự</b>: đảo hai từ trong câu, kết quả y hệt. Với ngôn ngữ, đó là thảm hoạ — "chó cắn người" và "người cắn chó" phải khác nhau.</p>
  <p>Giải pháp trong paper gốc: <b>cộng thêm một tín hiệu sin/cos vào embedding</b> để mã hoá vị trí.</p>
  <p>$$PE(pos, 2i) = \sin\!\left(\frac{pos}{10000^{2i/d}}\right), \qquad PE(pos, 2i+1) = \cos\!\left(\frac{pos}{10000^{2i/d}}\right)$$</p>
  <div class="wb-alert wb-alert--info">
    <span class="wb-alert__icon">i</span>
    <div class="wb-alert__body"><p class="wb-alert__title">Vòng tròn đó lại xuất hiện</p>
      <p class="wb-alert__msg">Đây <b>chính xác</b> là ý tưởng bạn dùng cho giờ 23h–0h, chỉ khác: thay vì một chu kỳ 24 giờ, họ dùng nhiều chu kỳ chồng lên nhau (từ rất ngắn tới rất dài). Nhờ vậy mô hình vừa phân biệt được vị trí liền kề, vừa nắm được khoảng cách xa. Nếu bạn hiểu bài <b>Biến chu kỳ</b> thì bạn đã hiểu positional encoding — nó là cùng một mẹo, áp cho vị trí thay vì cho giờ. Các mô hình hiện đại (LLaMA, GPT-NeoX) dùng <b>RoPE</b>, vẫn dựa trên phép quay trên vòng tròn, chỉ tinh vi hơn.</p></div>
  </div>

  <p class="ds-more"><button class="ds-aside" data-aside="x-tf-variants">Ba biến thể Transformer &amp; paper gốc</button></p>
  <h2>Cần biết bao nhiêu cho luận văn về dữ liệu bảng?</h2>
  <p>Nếu đề tài của bạn là fraud detection trên dữ liệu bảng, bạn cần <b>giải thích được</b> Transformer nếu bị hỏi (rất có thể bị hỏi), nhưng không cần dùng. Trả lời tốt: <i>"Transformer vượt trội với dữ liệu chuỗi và văn bản nhờ self-attention nắm được phụ thuộc xa. Với dữ liệu bảng có số chiều vừa phải, các so sánh gần đây cho thấy gradient boosting vẫn tốt hơn, nên tôi chọn LightGBM; hướng mở rộng là mô hình hoá chuỗi giao dịch bằng Transformer."</i></p>

<template data-node="dl-llm">
  <p>Bài này để bạn nói chuyện được về LLM cho đúng, và biết chỗ nào chúng thật sự hữu ích cho dự án của bạn.</p>

  <h2>LLM là gì, bỏ hết hào quang</h2>
  <p>Một Transformer decoder-only rất lớn, huấn luyện trên khối lượng văn bản khổng lồ với đúng <b>một</b> nhiệm vụ: <b>đoán token tiếp theo</b>. Mọi khả năng khác — trả lời, viết code, dịch — đều nổi lên từ nhiệm vụ đó, không được lập trình riêng.</p>
  <p><b>Hiểu nhầm cần gỡ:</b> LLM không tra cứu một cơ sở dữ liệu. Nó không "biết" theo nghĩa có một chỗ lưu sự thật. Nó sinh ra token có xác suất cao dựa trên mẫu hình đã học. Đó là lý do nó <b>bịa ra thông tin nghe rất hợp lý</b> (hallucination) — không phải lỗi vặt sẽ được vá, mà là hệ quả trực tiếp của cách nó hoạt động.</p>

  <h2>Bốn cách dùng, từ rẻ tới đắt</h2>
  <table>
    <tr><th>Cách</th><th>Cơ chế</th><th>Chi phí</th><th>Khi nào</th></tr>
    <tr><td><b>Prompting</b></td><td>Viết chỉ dẫn tốt</td><td>Gần như 0</td><td>Luôn thử trước</td></tr>
    <tr><td><b>Few-shot</b></td><td>Đưa 3–10 ví dụ ngay trong prompt</td><td>Thấp</td><td>Cần định dạng đầu ra nhất quán</td></tr>
    <tr><td><b>RAG</b></td><td>Tìm tài liệu liên quan, nhét vào prompt</td><td>Vừa</td><td>Cần trả lời dựa trên tài liệu riêng của bạn</td></tr>
    <tr><td><b>Fine-tune</b></td><td>Huấn luyện tiếp trên dữ liệu của bạn</td><td>Cao</td><td>Cần <i>phong cách/định dạng</i> riêng, hoặc lĩnh vực rất hẹp</td></tr>
  </table>
  <div class="wb-alert wb-alert--warning wb-alert--plain"><div class="wb-alert__body">
    <p class="wb-alert__title">Hiểu nhầm rất phổ biến về fine-tuning</p>
    <p class="wb-alert__msg">Fine-tune dạy mô hình <b>cách nói</b>, không dạy nó <b>sự thật mới</b>. Muốn mô hình biết chính sách nội bộ công ty bạn, RAG là đúng công cụ, không phải fine-tune. Rất nhiều dự án tốn hàng chục triệu để fine-tune cho một vấn đề mà RAG giải quyết tốt hơn với chi phí thấp hơn.</p>
  </div></div>

  <h2>RAG trong ba câu</h2>
  <ol>
    <li>Cắt tài liệu của bạn thành đoạn, biến mỗi đoạn thành vector <b>embedding</b>, lưu vào vector database.</li>
    <li>Khi có câu hỏi, biến câu hỏi thành vector, tìm các đoạn có vector gần nhất <button class="ds-math" data-math="dot">(cosine similarity)</button>.</li>
    <li>Nhét các đoạn đó vào prompt: <i>"Dựa trên các đoạn sau, hãy trả lời..."</i></li>
  </ol>
  <p>Nhìn từ góc độ này, RAG chỉ là <b>tìm kiếm ngữ nghĩa + prompt</b>. Nó không huyền bí, và cái quyết định chất lượng là bước tìm kiếm chứ không phải mô hình.</p>

  <h2>LLM giúp gì cho dự án gian lận của bạn</h2>

  <p>Câu hỏi thẳng: dữ liệu của bạn là bảng, vậy có nên dùng deep learning không? <b>Câu trả lời ngắn: không, nhưng phải biết vì sao để trả lời hội đồng.</b></p>

  <h2>Vì sao boosting vẫn thắng trên dữ liệu bảng</h2>
  <ul>
    <li><b>Dữ liệu bảng không có cấu trúc để khai thác.</b> CNN thắng nhờ tính cục bộ trong ảnh; Transformer thắng nhờ quan hệ giữa các token. Cột 3 và cột 4 trong bảng của bạn không có quan hệ hình học nào — hoán vị cột không đổi gì.</li>
    <li><b>Đặc trưng không đồng nhất.</b> Một cột là tiền, một cột là mã danh mục, một cột là tỉ lệ. Cây xử lý tự nhiên; mạng nơ-ron cần chuẩn hoá cẩn thận cho từng loại.</li>
    <li><b>Cây bất biến với phép biến đổi đơn điệu.</b> Log hay không log, cây cho kết quả y hệt. Mạng nơ-ron thì rất nhạy.</li>
    <li><b>Ranh giới quyết định dạng bậc thang.</b> Nhiều quy luật thật trong dữ liệu bảng có dạng ngưỡng ("trên 50 tuổi thì..."), và cây mô hình hoá điều đó bằng đúng một lần chia; mạng phải xấp xỉ bằng nhiều nơ-ron.</li>
  </ul>
  <p>Đây không phải ý kiến cá nhân — nó được kiểm chứng lại nhiều lần trong các so sánh quy mô lớn (Grinsztajn và cộng sự 2022 là tài liệu hay trích dẫn nhất). <b>Trích dẫn được một nguồn cho nhận định này làm phần "lựa chọn mô hình" trong luận văn của bạn vững hẳn.</b></p>

  <h2>Các kiến trúc deep learning cho dữ liệu bảng — biết tên</h2>
  <table>
    <tr><th>Mô hình</th><th>Ý tưởng</th><th>Thực tế</th></tr>
    <tr><td><b>TabNet</b></td><td>Attention chọn feature theo từng bước</td><td>Nổi nhất, kết quả không nhất quán khi tái lập</td></tr>
    <tr><td><b>FT-Transformer</b></td><td>Coi mỗi feature như một token, dùng Transformer</td><td>Cạnh tranh được, nhưng cần tune nhiều</td></tr>
    <tr><td><b>NODE</b></td><td>Cây quyết định "mềm" khả vi</td><td>Ít dùng</td></tr>
    <tr><td><b>SAINT</b></td><td>Attention trên cả hàng lẫn cột</td><td>Nghiên cứu</td></tr>
  </table>

  <h2>Khi nào deep learning THỰC SỰ có lợi cho bài của bạn</h2>
  <ol>
    <li><b>Cột hạng mục lực lượng rất lớn</b> — embedding cho 50.000 cửa hàng thường tốt hơn one-hot hay target encoding.</li>
    <li><b>Có dữ liệu chuỗi</b> — chuỗi giao dịch của một thẻ theo thời gian. Đây là chỗ Transformer/LSTM có đất diễn thật.</li>
    <li><b>Có nhiều loại dữ liệu (multi-modal)</b> — bảng + văn bản + ảnh hoá đơn. Chỉ mạng nơ-ron kết hợp được trong một mô hình.</li>
    <li><b>Học biểu diễn chung</b> — huấn luyện trên dữ liệu không nhãn khổng lồ rồi tinh chỉnh cho tác vụ có nhãn ít.</li>
  </ol>

  <p>Cách này cho bạn: điểm số thường tốt hơn cả hai cách riêng lẻ, một đóng góp rõ ràng để viết, và <b>một hình đẹp</b> (chiếu embedding xuống 2 chiều, tô màu theo tỉ lệ gian lận). Chi phí: một buổi.</p>

<template data-node="q-regress">
  <p>Đổi một chữ trong đề bài — “giao dịch này có gian lận không” thành “đơn hàng này giao mất bao nhiêu phút” — và bạn rời khỏi phân loại, sang <b>hồi quy</b>. Đầu ra không còn là xác suất trong khoảng 0–1 mà là một số thực có đơn vị: phút, đồng, kWh, kg.</p>

  <h2>Giữ nguyên gần hết — đổi đúng ba chỗ</h2>
  <div class="wb-table-scroll"><table>
    <thead><tr><th>Bước</th><th>So với bài phân loại</th></tr></thead>

      <tr><td>1–5 · Đóng khung, lấy dữ liệu, EDA, làm sạch, feature</td><td><b>Giữ nguyên hoàn toàn.</b> sin/cos, lag, rolling, one-hot — y hệt</td></tr>
      <tr><td>6 · Chia tập</td><td><b>Đổi:</b> không có <code>stratify</code> theo nhãn nữa. Nếu biến mục tiêu lệch mạnh, chia theo <i>nhóm phân vị</i> của nó để mọi tập đều có phần đuôi</td></tr>
      <tr><td>7 · Mô hình</td><td><b>Gần như giữ nguyên:</b> đổi <code>LGBMClassifier</code> → <code>LGBMRegressor</code>, <code>LogisticRegression</code> → <code>Ridge</code></td></tr>
      <tr><td>8 · Đo lường</td><td><b>Đổi hoàn toàn.</b> Không còn PR-AUC, ngưỡng, ma trận nhầm lẫn — xem phần dưới</td></tr>
    </tbody>
  </table></div>
  <p>Đây là mẫu hình lặp lại ở cả chặng này: <b>phần lớn công việc chuyển giao được, chỗ vỡ luôn nằm ở chia tập và đo lường.</b></p>

  <h2>Bốn chỉ số, và câu hỏi để chọn giữa chúng</h2>
  <div class="wb-table-scroll"><table>
    <thead><tr><th>Chỉ số</th><th>Đọc là</th><th>Chọn khi</th><th>Bẫy</th></tr></thead>
    <tbody>
      <tr><td><b>MAE</b></td><td>“Sai trung bình 8,3 phút”</td><td>Mặc định. Đơn vị giống biến mục tiêu nên nói được với người không kỹ thuật</td><td>Coi sai 1 phút và sai 60 phút là cùng bản chất, chỉ khác độ lớn</td></tr>
      <tr><td><b>RMSE</b></td><td>Cũng đơn vị đó, nhưng phạt nặng sai số lớn</td><td>Khi một cú sai lớn tốn hơn nhiều lần so với nhiều cú sai nhỏ (dự báo tải điện, tồn kho)</td><td>Rất nhạy với ngoại lai — một dòng bẩn kéo lệch cả con số</td></tr>
      <tr><td><b>MAPE</b></td><td>“Sai trung bình 12%”</td><td>Khi cần so sánh giữa các mặt hàng có quy mô rất khác nhau</td><td><b>Vỡ khi giá trị thật gần 0</b> (chia cho 0), và phạt dự báo cao hơn nhẹ hơn dự báo thấp hơn — nên nó âm thầm khuyến khích mô hình đoán thấp</td></tr>
      <tr><td><b>R²</b></td><td>“Giải thích được 0,72 phương sai”</td><td>Báo cáo học thuật, so với baseline “luôn đoán trung bình”</td><td>Không có đơn vị nên <b>không nói được gì về việc sai đó có chấp nhận được không</b>. R² = 0,9 vẫn có thể sai 3 tiếng mỗi đơn</td></tr>
    </tbody>
  </table></div>
  <p>Cách chọn nhanh: hỏi <b>“sai một đơn vị thì tốn bao nhiêu, và chi phí đó tăng tuyến tính hay tăng nhanh hơn?”</b> Tuyến tính → MAE. Nhanh hơn → RMSE. Đây là cùng một câu hỏi “quy ra tiền” của bài phân loại, chỉ khoác áo khác.</p>
  <div class="ds-code"><b>from</b> sklearn.metrics <b>import</b> mean_absolute_error, root_mean_squared_error, r2_score
<b>from</b> lightgbm <b>import</b> LGBMRegressor

model = LGBMRegressor(random_state=42).fit(X_tr, y_tr)
pred  = model.predict(X_va)

<i># baseline BẮT BUỘC: luôn đoán trung vị của tập train</i>
base  = np.full_like(y_va, np.median(y_tr), dtype=<b>float</b>)

<b>for</b> name, p <b>in</b> [("baseline", base), ("lgbm", pred)]:
    print(name, <b>round</b>(mean_absolute_error(y_va, p), 2),
                <b>round</b>(root_mean_squared_error(y_va, p), 2),
                <b>round</b>(r2_score(y_va, p), 3))</div>
  <p>Chú ý baseline là <b>trung vị</b>, không phải trung bình: trung vị là giá trị tối ưu cho MAE, trung bình tối ưu cho RMSE. Chọn sai baseline là tự cho mình một đối thủ yếu.</p>

  <h2>Một con số không đủ: khoảng dự đoán</h2>
  <p>“Đơn này giao trong 34 phút” là một lời hứa. “Đơn này giao trong 28–47 phút, 80% khả năng” là một <b>thông tin dùng được</b> — nó nói cho hệ thống biết khi nào nên hứa và khi nào nên báo trước là có thể trễ.</p>
  <p>Cách rẻ nhất để có khoảng đó với LightGBM là <b>hồi quy phân vị</b>: train ba mô hình cho ba phân vị.</p>
  <div class="ds-code"><i># ba mô hình: cận dưới, trung vị, cận trên → khoảng 80%</i>
models = {}
<b>for</b> q <b>in</b> [0.1, 0.5, 0.9]:
    models[q] = LGBMRegressor(objective="quantile", alpha=q,
                              random_state=42).fit(X_tr, y_tr)

lo, mid, hi = (models[q].predict(X_va) <b>for</b> q <b>in</b> [0.1, 0.5, 0.9])

<i># KIỂM CHỨNG: khoảng 80% thì phải bao được ~80% giá trị thật</i>
coverage = ((y_va &gt;= lo) &amp; (y_va &lt;= hi)).mean()
print(f"độ phủ thực tế: {coverage:.1%}  (mong đợi ~80%)")</div>
  <p>Dòng cuối là dòng quan trọng nhất và cũng là dòng hay bị bỏ. Một khoảng dự đoán chỉ có giá trị nếu <b>độ phủ thực tế khớp với mức đã công bố</b>. Phủ 55% trong khi tuyên bố 80% thì tệ hơn không đưa khoảng nào, vì nó tạo ra một sự tự tin sai chỗ. Báo cáo cả hai con số — độ rộng khoảng và độ phủ — là một điểm cộng dễ ăn trong luận văn.</p>
  <p class="wb-help">Nếu cần bảo đảm chặt chẽ hơn về mặt lý thuyết, từ khoá cần tra là <b>conformal prediction</b> — nó cho khoảng có bảo đảm độ phủ với giả định rất nhẹ. Đủ để nêu tên trong phần hướng phát triển.</p>

  <h2>Ba sai lầm đặc trưng của hồi quy</h2>
  <ol>
    <li><b>Không nhìn phân phối phần dư.</b> Vẽ <code>y_true − y_pred</code> theo <code>y_pred</code>: nếu nó loe ra hình phễu, sai số tỉ lệ với độ lớn — cân nhắc dự đoán <code>log(y)</code> rồi mũ ngược lại <button class="ds-math" data-math="logtransform">(vì sao lấy log)</button>. Nếu phần dư có cấu trúc (cong, phân cụm), bạn còn thiếu feature.</li>
    <li><b>Dự đoán ra giá trị vô lý mà không chặn.</b> Thời gian giao hàng âm, giá nhà âm. Kẹp đầu ra về miền hợp lệ, và <b>đếm xem phải kẹp bao nhiêu lần</b> — con số đó là một chẩn đoán, không phải một chi tiết vặt.</li>
    <li><b>Dùng R² làm chỉ số chính rồi không ai biết mô hình có dùng được không.</b> Luôn kèm MAE cùng đơn vị gốc, và một câu so với ngưỡng nghiệp vụ: “sai trung bình 8 phút, trong khi khách chấp nhận sai lệch tới 15 phút”.</li>
  </ol>

  <p>Cách đúng là <b>backtesting walk-forward</b>: mô phỏng lại đúng cái bạn sẽ làm trong đời thật — đứng ở một mốc thời gian, chỉ nhìn về quá khứ, dự đoán tương lai, rồi trượt mốc đó tới.</p>

  <p><b>Tham số <code>gap</code> là chi tiết ít người dùng và nó rất quan trọng.</b> Nếu trong thực tế bạn phải dự báo trước 7 ngày (vì cần thời gian đặt hàng), thì mốc dự đoán cách dữ liệu mới nhất 7 ngày — đặt <code>gap=7</code>. Không đặt là bạn đang tự cho mình dữ liệu mà lúc chạy thật sẽ chưa có.</p>

  <p>Và đây là lý do có <b>MASE</b> (Mean Absolute Scaled Error): nó là MAE của bạn <i>chia cho</i> MAE của naive.</p>

  <p>MASE là chỉ số đáng dùng làm chỉ số chính cho forecasting: nó không vỡ khi giá trị bằng 0 (khác MAPE), không phụ thuộc đơn vị nên so sánh được giữa các chuỗi, và quan trọng nhất — <b>nó luôn nhắc bạn con số của mình đang so với cái gì</b>. Một bảng kết quả forecasting không có cột naive là một bảng chưa đọc được.</p>

  <h2>Feature cho forecasting: lag, cửa sổ trượt, lịch</h2>
  <div data-viz="lag"></div>
  <div class="ds-code"><i># LAG — giá trị của chính chuỗi ở quá khứ. Chọn lag theo PACF, đừng đoán</i>
<b>for</b> k <b>in</b> [1, 7, 14, 28]:
    df[f"lag_{k}"] = df["y"].shift(k)

<i># CỬA SỔ TRƯỢT — luôn shift(1) TRƯỚC rồi mới rolling, nếu không là rò rỉ</i>
<b>for</b> w <b>in</b> [7, 28]:
    df[f"roll_mean_{w}"] = df["y"].shift(1).rolling(w).mean()
    df[f"roll_std_{w}"]  = df["y"].shift(1).rolling(w).std()

<i># LỊCH — thứ, ngày trong tháng, tháng, ngày lễ; mã hoá chu kỳ bằng sin/cos</i>
df["dow"]     = df["ds"].dt.dayofweek
df["dow_sin"] = np.sin(2*np.pi*df["dow"]/7)
df["dow_cos"] = np.cos(2*np.pi*df["dow"]/7)
df["is_holiday"] = df["ds"].isin(HOLIDAYS).astype(<b>int</b>)</div>
  <p>Thứ tự <code>.shift(1).rolling(w)</code> chứ không phải <code>.rolling(w).shift(1)</code> — cả hai đều chạy, chỉ một cái đúng. Viết một test cho nó, theo đúng loại test số 4 ở bài <b>Làm việc với AI</b>.</p>

    <li>Chốt <b>tầm dự báo</b> (dự báo trước bao nhiêu bước) và <b>độ trễ dữ liệu</b> (khi dự báo thì dữ liệu mới nhất cũ bao nhiêu). Hai con số này quyết định <code>gap</code>.</li>

  <p>Ma trận nhầm lẫn chuẩn hoá là hình đáng đưa vào luận văn nhất của bài multiclass. Nó không chỉ nói mô hình sai bao nhiêu mà nói <b>sai theo hướng nào</b> — và “lớp 3 hay bị nhận nhầm thành lớp 7” thường dẫn thẳng tới một phát hiện về dữ liệu (hai lớp đó thực chất chồng lấn, hoặc người gán nhãn cũng lẫn).</p>

  <h2>Ba việc cần làm thêm khi lên nhiều lớp</h2>
  <ul>
    <li><b>Chia tập stratify theo lớp hiếm nhất.</b> Với 12 lớp mà lớp hiếm nhất chỉ có 30 mẫu, một lần chia không may là tập test có 2 mẫu — mọi chỉ số của lớp đó thành nhiễu.</li>
    <li><b>Gộp các lớp quá hiếm thành “KHÁC”</b> nếu chúng dưới ~50 mẫu và nghiệp vụ cho phép. Thà có một lớp “KHÁC” xử lý được còn hơn ba lớp không bao giờ đoán đúng.</li>
    <li><b>Cân nhắc cấu trúc phân cấp.</b> Nếu 12 lớp thực ra là 3 nhóm lớn × 4 lớp con, một mô hình hai tầng thường tốt hơn và giải thích dễ hơn.</li>
  </ul>
</template>

<template data-node="q-nlp">
  <p>Bài <b>Chữ &amp; embedding</b> ở chặng 4 xử lý cột chữ như một nguồn feature phụ. Bài này coi văn bản là <b>đầu vào chính</b> — phân loại ticket hỗ trợ, phân tích cảm xúc bình luận, trích xuất thông tin từ văn bản tự do.</p>
  <p>Một câu định khung: trong NLP hiện nay, cám dỗ lớn nhất là bắt đầu từ mô hình mạnh nhất. <b>Đừng.</b> Bắt đầu từ TF-IDF không phải vì tiết kiệm, mà vì nó là thứ duy nhất cho bạn biết bài toán của bạn <i>khó tới đâu</i>.</p>

  <h2>Ba mức, và tiêu chí lên mức tiếp theo</h2>
  <div class="wb-table-scroll"><table>
    <thead><tr><th>Mức</th><th>Làm gì</th><th>Chi phí</th><th>Lên mức sau khi</th></tr></thead>
    <tbody>
      <tr><td><b>1 · TF-IDF + tuyến tính</b></td><td><code>TfidfVectorizer</code> + <code>LogisticRegression</code>. Thêm n-gram 1–2 từ</td><td>Vài giây CPU</td><td><b>Luôn chạy đầu tiên.</b> Nó là mốc so sánh bắt buộc</td></tr>
      <tr><td><b>2 · Embedding câu</b></td><td><code>sentence-transformers</code> sinh vector, rồi đưa vào LightGBM hoặc logistic</td><td>Vài phút GPU (Colab)</td><td>Mức 1 chạm trần và lỗi chủ yếu do <i>từ đồng nghĩa / diễn đạt khác</i></td></tr>
      <tr><td><b>3 · Fine-tune Transformer</b></td><td>Huấn luyện tiếp một mô hình pretrained trên nhãn của bạn</td><td>Hàng chục phút tới vài giờ GPU</td><td>Mức 2 chạm trần, bạn có &gt;~2.000 mẫu có nhãn, và độ chính xác thật sự đáng số giờ đó</td></tr>

<b>from</b> sklearn.feature_extraction.text <b>import</b> TfidfVectorizer
<b>from</b> sklearn.linear_model <b>import</b> LogisticRegression
<b>from</b> sklearn.pipeline <b>import</b> make_pipeline

pipe = make_pipeline(
    TfidfVectorizer(ngram_range=(1, 2), min_df=3, max_features=50_000),

  <p>Với tiếng Việt, TF-IDF hoạt động khá tốt ngay cả khi không tách từ, nhưng tách từ (ví dụ bằng <code>underthesea</code> hoặc <code>pyvi</code>) thường cải thiện rõ vì tiếng Việt có nhiều từ ghép hai âm tiết. Thử cả hai và ghi lại — đó là một dòng thí nghiệm hợp lệ.</p>

  <h2>Fine-tune và RAG: hai thứ khác nhau, hay bị dùng lẫn</h2>
  <div class="wb-table-scroll"><table>
    <thead><tr><th></th><th>Fine-tuning</th><th>RAG</th></tr></thead>
    <tbody>
      <tr><td>Giải quyết</td><td>Mô hình chưa biết <b>làm</b> tác vụ này (định dạng, giọng văn, quy tắc phân loại của bạn)</td><td>Mô hình chưa <b>biết</b> nội dung này (tài liệu nội bộ, dữ liệu mới)</td></tr>
      <tr><td>Cập nhật kiến thức</td><td>Phải train lại</td><td>Chỉ cần thêm tài liệu vào kho</td></tr>
      <tr><td>Trích nguồn</td><td>Không có</td><td><b>Có</b> — trả về được đoạn văn bản gốc</td></tr>
      <tr><td>Chọn khi</td><td>Tác vụ hẹp, có nhãn, định dạng đầu ra cố định</td><td>Hỏi–đáp trên tài liệu, cần dẫn nguồn</td></tr>
    </tbody>
  </table></div>
  <p><b>Nếu bài toán của bạn là phân loại văn bản, cả hai đều không phải câu trả lời đầu tiên.</b> Một TF-IDF hoặc một embedding + LightGBM thường vừa rẻ hơn, vừa nhanh hơn, vừa giải thích được — và giải thích được là điều hội đồng hỏi. Chỉ nhắc tới RAG khi đề bài thật sự là hỏi–đáp trên một kho tài liệu.</p>

  <h2>Đánh giá NLP: đo cái gì, thay vì khoe tên mô hình</h2>
  <p>Đây là chỗ nhiều luận văn NLP yếu nhất — chọn được mô hình lớn nhưng phần đánh giá chỉ có một con số accuracy.</p>
  <div class="wb-table-scroll"><table>
    <thead><tr><th>Tác vụ</th><th>Metric</th><th>Lưu ý</th></tr></thead>
    <tbody>
      <tr><td>Phân loại văn bản, phân tích cảm xúc</td><td>macro-F1 + bảng từng lớp</td><td>Lớp “trung tính” thường là lớp khó nhất và hay bị giấu trong con số gộp</td></tr>
      <tr><td>Nhận dạng thực thể (NER)</td><td>F1 mức <b>span</b>, không phải mức token</td><td>Đoán đúng 3/4 token của một tên riêng là <b>sai</b>, không phải đúng 75%</td></tr>
      <tr><td>Tóm tắt, sinh văn bản</td><td>ROUGE/BLEU <b>cộng với</b> đánh giá của con người</td><td>Các chỉ số tự động chỉ đo trùng lặp từ ngữ — chúng không đo được đúng/sai sự thật</td></tr>
      <tr><td>Truy xuất, RAG</td><td>Recall@K, MRR cho phần truy xuất; tỉ lệ trả lời có dẫn nguồn đúng cho phần sinh</td><td>Tách hai phần ra mà đo — lỗi thường nằm ở truy xuất chứ không ở sinh</td></tr>
    </tbody>
  </table></div>
  <p>Và một việc rẻ mà giá trị cao: <b>đọc tay 50 ca sai</b>, phân loại chúng thành 4–5 nhóm nguyên nhân, đưa bảng đó vào luận văn. Nó cho thấy bạn hiểu bài toán chứ không chỉ chạy được thư viện, và gần như luôn chỉ ra một cải tiến rẻ mà không chỉ số nào gợi ý được.</p>

  <h2>Rò rỉ đặc trưng của NLP</h2>
  <ul>
    <li><b>Văn bản trùng lặp gần đúng giữa train và test.</b> Ticket được gửi lại, bình luận copy-paste, bài đăng lại. Khử trùng lặp bằng băm hoặc độ tương đồng <b>trước khi</b> chia tập.</li>
    <li><b>Chia ngẫu nhiên khi dữ liệu có thời gian hoặc có tác giả.</b> Cùng một người viết 200 bình luận nằm cả ở train lẫn test → mô hình học nhận ra người đó, không phải nhận ra cảm xúc.</li>
    <li><b><code>fit</code> vectorizer trên toàn bộ dữ liệu.</b> Từ vựng và IDF được học từ cả tập test. Đặt <code>TfidfVectorizer</code> <i>trong</i> Pipeline là xong.</li>
  </ul>
</template>

  <p>Mẹo thu hẹp phạm vi: nếu detection quá đắt, hỏi xem <b>classification trên ảnh đã cắt</b> có giải quyết được vấn đề nghiệp vụ không. Rất thường là có.</p>

  <h2>CNN và vision transformer — định vị</h2>
  <p>Bài <b>CNN &amp; RNN</b> ở chặng 6 đã giải thích ý tưởng CNN. Phần cần thêm ở đây gọn:</p>
  <ul>
    <li><b>CNN</b> có sẵn giả định “thông tin cục bộ, bất biến tịnh tiến” cài trong kiến trúc, nên nó học tốt với <b>ít dữ liệu hơn</b>. Vẫn là lựa chọn hợp lý cho phần lớn dự án cỡ luận văn.</li>
    <li><b>Vision Transformer (ViT)</b> cắt ảnh thành các mảnh rồi coi chúng như token — chính xác là cơ chế bạn học ở bài Attention. Nó không có giả định cục bộ cài sẵn, nên <b>cần nhiều dữ liệu hơn hoặc phải pretrain rồi fine-tune</b>. Với dữ liệu vừa và nhỏ, một CNN pretrained thường ngang hoặc hơn.</li>
    <li>Trong thực tế bạn hầu như luôn <b>fine-tune một mô hình pretrained</b>, không train từ đầu. Train từ đầu cần lượng dữ liệu mà bạn không có.</li>
  </ul>

  <h2>Mini-lab: transfer learning, chạy được trong Colab</h2>
  <p>Mục tiêu của lab này là <b>trải nghiệm</b>, không phải điểm số. Chọn một bộ dữ liệu nhỏ (ví dụ hoa, hoặc ảnh sản phẩm đạt/lỗi), và làm đúng ba bước.</p>
  <div class="ds-code"><b>import</b> torch, torch.nn <b>as</b> nn
<b>from</b> torchvision <b>import</b> models, transforms

<i># 1. lấy mô hình đã học sẵn trên ImageNet</i>
net = models.resnet18(weights="IMAGENET1K_V1")

<i># 2. ĐÓNG BĂNG phần thân, chỉ thay và học lại lớp cuối</i>
<b>for</b> p <b>in</b> net.parameters():
    p.requires_grad = <b>False</b>
net.fc = nn.Linear(net.fc.in_features, N_CLASSES)   <i># chỉ lớp này được học</i>

<i># 3. chuẩn hoá ĐÚNG như lúc pretrain — sai chỗ này là điểm tụt không hiểu vì sao</i>
tf = transforms.Compose([
    transforms.Resize(256), transforms.CenterCrop(224),
    transforms.ToTensor(),
    transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),
])</div>
  <p>Ba bước này thường cho kết quả rất tốt sau vài phút GPU. Chỉ khi nó chạm trần mới nghĩ tới việc mở băng vài lớp cuối của phần thân và train tiếp với learning rate nhỏ hơn nhiều (khoảng 1/10).</p>
  <p><b>Baseline bắt buộc trước khi fine-tune bất cứ thứ gì:</b> đóng băng toàn bộ mạng, lấy vector đặc trưng ở lớp áp chót, đưa vào một logistic regression. Đó là <i>linear probe</i>, chạy mất một phút, và nó cho bạn biết đặc trưng pretrained đã đủ tốt chưa.</p>

  <h2>Ba chỗ hỏng riêng của CV</h2>
  <ol>
    <li><b>Rò rỉ theo nhóm.</b> Nhiều ảnh của cùng một vật thể / cùng một bệnh nhân / cùng một ca sản xuất nằm cả ở train lẫn test. Điểm cao giả tạo. Chia theo <b>nhóm</b>, không theo ảnh — cùng nguyên tắc với <code>GroupKFold</code> ở bài <b>Chia tập</b>.</li>
    <li><b>Tăng cường dữ liệu (augmentation) sai ngữ nghĩa.</b> Lật ngang một ảnh chữ số biến 6 thành thứ không phải 6; lật một ảnh X-quang đổi trái thành phải. Augmentation phải giữ nguyên nhãn — kiểm bằng cách nhìn 20 ảnh sau khi tăng cường.</li>
    <li><b>Tương quan giả với nền hoặc thiết bị.</b> Mô hình học “ảnh chụp bằng máy A thì là lớp dương” vì tình cờ mọi ca dương đều chụp bằng máy A. Cách bắt: kiểm tra mô hình trên ảnh đã che vật thể chính — nếu vẫn đoán đúng, nó đang nhìn nền.</li>
  </ol>
  <p class="wb-help">Lỗi số 3 là lỗi kinh điển của các bài báo CV y tế và cũng là loại phát hiện rất đáng viết. Nếu bạn tìm ra một tương quan giả trong dữ liệu của mình, đó là một đóng góp thật, không phải một thất bại.</p>
</template>

  <p><b>Popularity là baseline bắt buộc,</b> và bạn nên chuẩn bị tinh thần rằng nó khó thắng. Rất nhiều bài báo gợi ý bị phản biện chỉ vì không so với popularity.</p>

  <h2>Metric xếp hạng: ba cái cần biết</h2>
  <div class="wb-table-scroll"><table>
    <thead><tr><th>Metric</th><th>Đo gì</th><th>Có quan tâm thứ tự không</th></tr></thead>
    <tbody>
      <tr><td><b>Recall@K</b></td><td>Trong những thứ người dùng thật sự thích, bao nhiêu phần trăm lọt vào top-K</td><td>Không — nằm ở vị trí 1 hay 10 đều tính như nhau</td></tr>
      <tr><td><b>MAP@K</b></td><td>Precision trung bình dọc theo danh sách</td><td>Có</td></tr>
      <tr><td><b>NDCG@K</b></td><td>Như MAP nhưng chiết khấu theo vị trí bằng hàm log, và nhận được mức độ liên quan nhiều bậc</td><td>Có — <b>mạnh nhất</b>, và là chuẩn báo cáo trong các bài báo xếp hạng</td></tr>
    </tbody>
  </table></div>
  <p>Chọn <b>K</b> theo giao diện thật, không theo thói quen: nếu màn hình hiện 6 mục thì đo @6, đừng đo @20 vì thấy số đẹp hơn.</p>

  <h2>Chia tập: leave-last-out theo thời gian</h2>
  <p>Chia ngẫu nhiên các tương tác là sai theo đúng cách của forecasting: mô hình được thấy thứ người dùng mua tháng sau để đoán thứ họ mua tháng này.</p>
  <div class="ds-code"><i># đúng: với mỗi người dùng, tương tác CUỐI CÙNG dùng để test</i>
df = df.sort_values(["user_id", "ts"])
test  = df.groupby("user_id").tail(1)
train = df.drop(test.index)

<i># chặt chẽ hơn: cắt theo một MỐC THỜI GIAN chung cho mọi người dùng</i>
cutoff = df["ts"].quantile(0.8)
train, test = df[df.ts &lt;= cutoff], df[df.ts &gt; cutoff]</div>
  <p>Cách thứ hai chặt hơn và gần với thực tế hơn (bạn triển khai mô hình tại một thời điểm, không phải tại “tương tác cuối của mỗi người”). Nêu rõ bạn chọn cách nào và vì sao — đó là một quyết định thiết kế hội đồng sẽ hỏi.</p>

  <h2>Vì sao offline tốt mà online vẫn tệ</h2>
  <p>Đây là đặc điểm quan trọng nhất của họ bài toán này, và là chỗ nó chạm vào bài <b>A/B testing</b> ngay sau đây.</p>
  <ul>
    <li><b>Vòng phản hồi.</b> Dữ liệu lịch sử chỉ ghi lại những thứ <i>đã được hệ thống cũ gợi ý</i>. Bạn không bao giờ biết người dùng có thích thứ chưa từng được hiện ra hay không. Mô hình mới học từ dữ liệu đó sẽ bắt chước hệ thống cũ.</li>
    <li><b>Vị trí gây thiên lệch.</b> Mục ở vị trí 1 được bấm nhiều hơn mục ở vị trí 10 <i>chỉ vì</i> nó ở vị trí 1. Không hiệu chỉnh thì bạn đang học lại thói quen của giao diện, không phải sở thích.</li>
    <li><b>Chỉ số offline không phải chỉ số kinh doanh.</b> NDCG tăng 5% không đảm bảo doanh thu tăng, và có khi còn giảm nếu mô hình đẩy mạnh những thứ rẻ tiền dễ bấm.</li>
  </ul>
  <p>Kết luận thực dụng cho luận văn: <b>báo cáo offline, nhưng nói rõ giới hạn của nó và mô tả thí nghiệm online bạn <i>sẽ</i> chạy</b> (chia lưu lượng, chỉ số chính, cỡ mẫu cần). Mô tả được một thiết kế A/B đúng đắn có giá trị bằng việc chạy nó, và nó là phần rất ít luận văn viết được.</p>
</template>

<template data-node="q-causal">
  <p>Toàn bộ trang này tới đây dạy bạn <b>dự đoán</b>. Bài này về câu hỏi khác hẳn, và là câu hỏi mà tổ chức thật sự trả tiền để trả lời: <b>“nếu tôi <i>làm</i> việc này, chuyện gì sẽ xảy ra?”</b></p>
  <p>Khác biệt không phải là kỹ thuật, mà là logic. Mô hình dự đoán trả lời “trong thế giới như hiện tại, cái gì thường đi cùng cái gì”. Câu hỏi nhân quả hỏi về một thế giới <i>bị can thiệp</i> — và dữ liệu quan sát được không chứa thế giới đó.</p>

  <h2>Ví dụ để thấy chỗ vỡ</h2>
  <p>Một mô hình rất tốt học được: <b>khách hàng dùng tính năng X có tỉ lệ rời bỏ thấp hơn 40%.</b> Kết luận tự nhiên: đẩy mọi người dùng X để giảm rời bỏ. Kết luận đó có thể sai hoàn toàn, vì ba lý do khác nhau:</p>
  <ul>
    <li><b>Đảo chiều nhân quả:</b> không phải X giữ chân khách, mà khách <i>vốn đã</i> gắn bó thì mới đi tìm X.</li>
    <li><b>Biến gây nhiễu (confounding):</b> khách hàng doanh nghiệp lớn vừa hay dùng X, vừa ít rời bỏ — vì họ là doanh nghiệp lớn. X không làm gì cả.</li>
    <li><b>Thiên lệch chọn mẫu:</b> chỉ những khách đã vượt qua giai đoạn onboarding mới thấy X, mà nhóm đó vốn đã ít rời bỏ.</li>
  </ul>
  <p><b>Không có mô hình dự đoán nào — không LightGBM, không deep learning, không SHAP — phân biệt được ba khả năng này.</b> Chúng đều học tương quan, và tương quan giống hệt nhau trong cả ba trường hợp. Đây là giới hạn về loại câu hỏi, không phải giới hạn về sức mạnh mô hình. Hiểu điều này là hiểu vì sao SHAP <i>không</i> phải công cụ nhân quả, dù hình của nó rất dễ đọc theo hướng nhân quả.</p>

  <h2>A/B test: vì sao ngẫu nhiên hoá giải được cả ba</h2>
  <p>Gán ngẫu nhiên người dùng vào nhóm A hoặc B làm một việc rất mạnh: nó khiến hai nhóm <b>giống nhau về mọi thứ</b> — cả những thứ bạn đo được lẫn những thứ bạn không nghĩ tới. Còn lại đúng một khác biệt: nhóm nào được can thiệp. Nên chênh lệch kết quả <i>là</i> tác động của can thiệp.</p>
  <h3>Bốn thứ phải chốt <b>trước</b> khi bật thí nghiệm</h3>
  <ol>
    <li><b>Một chỉ số chính duy nhất</b> (OEC). Không phải năm chỉ số rồi chọn cái nào đẹp — đó là p-hacking <button class="ds-math" data-math="pvalue">(p-value nói gì và không nói gì)</button>.</li>
    <li><b>Cỡ mẫu và thời gian chạy</b>, tính từ mức chênh lệch nhỏ nhất đáng quan tâm. Tính trước, không tính sau.</li>
    <li><b>Đơn vị ngẫu nhiên hoá:</b> theo người dùng, theo phiên, hay theo cửa hàng. Chọn sai gây rò rỉ giữa hai nhóm.</li>
    <li><b>Chỉ số bảo vệ</b> (guardrail): những thứ không được phép xấu đi, kể cả khi chỉ số chính tốt lên.</li>
  </ol>
  <div class="ds-code"><b>from</b> statsmodels.stats.power <b>import</b> zt_ind_solve_power
<b>from</b> statsmodels.stats.proportion <b>import</b> proportions_ztest
<b>import</b> numpy <b>as</b> np

<i># TRƯỚC khi chạy: cần bao nhiêu người mỗi nhóm?</i>
p0, mde = 0.10, 0.01                      <i># tỉ lệ hiện tại 10%, muốn phát hiện +1 điểm %</i>
h = 2*np.arcsin(np.sqrt(p0+mde)) - 2*np.arcsin(np.sqrt(p0))    <i># cỡ tác động Cohen's h</i>
n = zt_ind_solve_power(effect_size=h, alpha=0.05, power=0.8)
print(f"cần ~{n:,.0f} người MỖI nhóm")

<i># SAU khi chạy: chênh lệch + khoảng tin cậy, đừng chỉ báo p-value</i>
stat, pval = proportions_ztest([conv_b, conv_a], [n_b, n_a])</div>
  <p>Con số cỡ mẫu thường gây sốc — và đó là thông tin hữu ích: nó cho bạn biết <b>có nên chạy thí nghiệm này không</b>. Nếu cần 200.000 người mà bạn chỉ có 5.000/tháng, thí nghiệm đó không khả thi và bạn cần một cách khác.</p>
  <p>Luôn báo cáo <b>chênh lệch kèm khoảng tin cậy</b> <button class="ds-math" data-math="ci">(bootstrap &amp; khoảng tin cậy)</button>, không chỉ p-value. “+0,8 điểm phần trăm, KTC 95% [0,1; 1,5]” nói được nhiều hơn “p = 0,03”, và không thể bị đọc nhầm thành “chắc chắn tốt hơn”.</p>

  <h2>Bốn lỗi làm hỏng một A/B test</h2>
  <div class="wb-table-scroll"><table>
    <thead><tr><th>Lỗi</th><th>Hậu quả</th><th>Cách chống</th></tr></thead>
    <tbody>
      <tr><td><b>Dừng sớm khi thấy đẹp</b> (peeking)</td><td>Tỉ lệ dương tính giả tăng vọt — nhìn đủ nhiều lần thì kiểu gì cũng có lúc p &lt; 0,05</td><td>Chốt thời điểm dừng từ đầu; hoặc dùng phương pháp tuần tự có hiệu chỉnh</td></tr>
      <tr><td><b>Thử nhiều chỉ số / nhiều phân khúc</b></td><td>Cùng vấn đề: 20 phép kiểm ở mức 5% thì trung bình có 1 cái "ý nghĩa" do ngẫu nhiên</td><td>Một chỉ số chính; phân tích theo phân khúc chỉ để <i>sinh giả thuyết</i>, không để kết luận</td></tr>
      <tr><td><b>Rò rỉ giữa hai nhóm</b> (interference)</td><td>Người nhóm A bị ảnh hưởng bởi nhóm B (mạng xã hội, thị trường hai chiều) → tác động bị pha loãng</td><td>Ngẫu nhiên hoá theo cụm: theo thành phố, theo nhóm bạn bè</td></tr>
      <tr><td><b>Hiệu ứng mới lạ</b></td><td>Chỉ số tăng vọt tuần đầu chỉ vì giao diện lạ, rồi tụt về cũ</td><td>Chạy đủ dài để qua giai đoạn đó; nhìn kết quả theo tuần chứ không chỉ tổng</td></tr>
    </tbody>
  </table></div>

  <h2>Khi không thể chạy thí nghiệm</h2>
  <p>Rất nhiều câu hỏi quan trọng không cho phép ngẫu nhiên hoá — vì lý do đạo đức, chi phí, hoặc vì sự việc đã xảy ra rồi. Lúc đó có một nhóm phương pháp <b>quasi-experimental</b>, và với luận văn thì <i>định vị được chúng</i> là đủ:</p>
  <div class="wb-table-scroll"><table>
    <thead><tr><th>Phương pháp</th><th>Dùng khi</th><th>Giả định cốt lõi</th></tr></thead>
    <tbody>
      <tr><td><b>Difference-in-differences</b></td><td>Một nhóm bị tác động tại một thời điểm, nhóm khác thì không</td><td>Nếu không có can thiệp, hai nhóm đã đi <b>song song</b> — kiểm bằng cách vẽ giai đoạn trước</td></tr>
      <tr><td><b>Regression discontinuity</b></td><td>Can thiệp được quyết định bởi một ngưỡng (điểm số, tuổi, thu nhập)</td><td>Ngay sát hai bên ngưỡng, các đơn vị gần như giống nhau</td></tr>
      <tr><td><b>Propensity score matching</b></td><td>Có nhiều biến quan sát được và muốn ghép cặp nhóm tương tự</td><td><b>Không còn biến gây nhiễu nào chưa đo được</b> — giả định mạnh và không kiểm chứng được</td></tr>
      <tr><td><b>Biến công cụ</b> (IV)</td><td>Có một biến ảnh hưởng tới can thiệp nhưng không ảnh hưởng trực tiếp tới kết quả</td><td>Tìm được một biến công cụ hợp lệ là phần khó nhất</td></tr>
    </tbody>
  </table></div>
  <p>Điểm chung: mỗi phương pháp mua được kết luận nhân quả bằng cách <b>đổi lấy một giả định không kiểm chứng trực tiếp được</b>. Nêu rõ giả định đó và cách bạn kiểm tra nó gián tiếp — chính là phần làm nên chất lượng của một chương phương pháp.</p>

  <h2>Ba phân tích chiếm phần lớn công việc thật</h2>
  <h3>1 · Cohort — nhóm theo thời điểm bắt đầu</h3>
  <p>Câu hỏi: “khách hàng đăng ký tháng 1 có ở lại lâu hơn khách đăng ký tháng 6 không?” Không nhóm theo cohort thì mọi thay đổi về tỉ lệ giữ chân đều lẫn với thay đổi về cơ cấu khách mới.</p>
  <div class="ds-code"><b>WITH</b> first_order <b>AS</b> (
  <b>SELECT</b> user_id, DATE_TRUNC('month', <b>MIN</b>(order_ts)) <b>AS</b> cohort
  <b>FROM</b> orders <b>GROUP BY</b> user_id
)
<b>SELECT</b> f.cohort,
       DATE_DIFF('month', f.cohort, DATE_TRUNC('month', o.order_ts)) <b>AS</b> month_n,
       <b>COUNT</b>(<b>DISTINCT</b> o.user_id) <b>AS</b> active_users
<b>FROM</b> orders o <b>JOIN</b> first_order f <b>USING</b> (user_id)
<b>GROUP BY</b> 1, 2 <b>ORDER BY</b> 1, 2;</div>
  <p>Kết quả xoay thành bảng cohort — hàng là tháng đăng ký, cột là số tháng kể từ đó. Đọc theo hàng thấy vòng đời một nhóm; đọc theo cột so sánh các nhóm ở cùng độ tuổi. Đây là một trong những bảng có mật độ thông tin cao nhất trong analytics.</p>

  <h3>2 · Funnel — rơi rụng qua từng bước</h3>
  <p>Câu hỏi: “trong 100 người vào trang, bao nhiêu người thanh toán, và rụng nhiều nhất ở bước nào?” Hai chi tiết hay làm sai:</p>
  <ul>
    <li><b>Phải theo đúng thứ tự và trong một cửa sổ thời gian.</b> Người xem sản phẩm hôm nay và mua tháng sau không nên tính là cùng một phễu.</li>
    <li><b>Đếm theo người, không theo sự kiện.</b> Một người xem 8 lần không phải 8 người.</li>
  </ul>

  <h3>3 · Segmentation — cắt theo nhóm</h3>
  <p>Câu hỏi: “con số tổng đang giấu chuyện gì?” Một tỉ lệ chuyển đổi đứng yên có thể là nhóm di động tăng bù cho nhóm máy tính giảm. <b>Nghịch lý Simpson</b> — xu hướng đúng trong mọi nhóm con nhưng đảo chiều khi gộp lại — là lý do bước này không bỏ được. Cách làm rẻ nhất là RFM (gần đây / tần suất / giá trị) trước khi nghĩ tới phân cụm.</p>

  <h2>KPI: hai câu hỏi trước khi thêm một chỉ số vào dashboard</h2>
  <ul>
    <li><b>Ai sẽ làm gì khác đi khi con số này thay đổi?</b> Không trả lời được thì đó không phải KPI, đó là trang trí.</li>
    <li><b>Nó bị lách được bằng cách nào?</b> Mọi chỉ số bị đặt làm mục tiêu đều sớm bị tối ưu theo cách bạn không muốn — đo “số ticket đã đóng” thì ticket sẽ được đóng nhanh mà không giải quyết. Cặp đôi bảo vệ (số ticket đóng <i>và</i> tỉ lệ mở lại) là cách chống thông dụng nhất.</li>
  </ul>
  <p>Và một chỉ số không có <b>ngữ cảnh</b> thì không đọc được. Mọi con số trên dashboard nên đi kèm ít nhất một trong ba: so với kỳ trước, so với mục tiêu, hoặc so với dải dao động bình thường.</p>

  <h2>Dashboard: ba quy tắc và một cảnh báo</h2>
  <ul>

  <h2>Dữ liệu A/B test tự sinh — cho mini-project 6</h2>
  <p>Với bài nhân quả, dữ liệu tự sinh <b>tốt hơn</b> dữ liệu thật, vì bạn biết trước sự thật và kiểm chứng được phương pháp của mình.</p>
  <div class="ds-code"><b>import</b> numpy <b>as</b> np, pandas <b>as</b> pd
rng = np.random.default_rng(7)
n = 20_000

<i># biến gây nhiễu: khách hàng "nặng ký" vừa hay được thấy tính năng mới, vừa hay mua</i>
heavy = rng.binomial(1, 0.3, n)

<i># (a) DỮ LIỆU QUAN SÁT — nhóm điều trị KHÔNG ngẫu nhiên</i>
treat_obs = rng.binomial(1, 0.2 + 0.5*heavy)
<i># (b) THÍ NGHIỆM — gán ngẫu nhiên, độc lập với mọi thứ</i>
treat_rct = rng.binomial(1, 0.5, n)

TRUE_EFFECT = 0.02        <i># sự thật: tính năng làm tăng 2 điểm phần trăm</i>
conv = <b>lambda</b> t: rng.binomial(1, 0.10 + 0.12*heavy + TRUE_EFFECT*t)

df = pd.DataFrame({"heavy": heavy,
                   "t_obs": treat_obs, "y_obs": conv(treat_obs),
                   "t_rct": treat_rct, "y_rct": conv(treat_rct)})

<i># so hai cách ước lượng với sự thật 0,02</i>
naive = df.groupby("t_obs").y_obs.mean().diff().iloc[-1]
rct   = df.groupby("t_rct").y_rct.mean().diff().iloc[-1]
print(f"quan sát thô: {naive:.4f}   thí nghiệm: {rct:.4f}   sự thật: {TRUE_EFFECT}")</div>
  <p>Chạy đoạn này và nhìn: ước lượng từ dữ liệu quan sát lệch <b>gấp nhiều lần</b> tác động thật, còn ước lượng từ thí nghiệm ngẫu nhiên thì bám sát. Cùng dữ liệu, cùng công thức, khác nhau đúng một chỗ — cách nhóm điều trị được gán. Sau đó thử tự sửa ước lượng quan sát bằng cách phân tầng theo <code>heavy</code> và xem nó về gần sự thật tới đâu.</p>
  <p>Đây là bài tập có tỉ lệ hiểu-biết trên thời gian cao nhất trong cả chặng: mười lăm phút, và bạn thấy tận mắt vì sao “mô hình rất chính xác” không đồng nghĩa với “kết luận đúng”.</p>

  <h2>Adapter — <code>src/adapters.py</code></h2>
  <p>File duy nhất trong repo biết dữ liệu thô trông thế nào. Hai adapter: một cho IEEE-CIS thật, một sinh bộ mô phỏng cùng schema.</p>
  <div class="ds-code"><i>"""Adapter: bộ dữ liệu thô  →  SCHEMA CHUẨN.

Đây là chỗ DUY NHẤT trong repo biết dữ liệu gốc trông thế nào. Đổi dataset =
viết thêm một hàm ở đây, không sửa dòng nào ở features/train/serve.
"""</i>
<b>import</b> numpy <b>as</b> np
<b>import</b> pandas <b>as</b> pd

<b>from</b> .config <b>import</b> RAW_SCHEMA, SEED

<i># IEEE-CIS chỉ cho TransactionDT = số giây kể từ một mốc gốc không công bố.</i>
<i># 2017-12-01 là quy ước phổ biến trong cộng đồng Kaggle, KHÔNG phải con số Kaggle</i>
<i># xác nhận. Dịch mốc gốc KHÔNG đổi thứ tự thời gian, khoảng cách giữa các giao</i>
<i># dịch hay cách chia theo thời gian — nên mọi feature THỜI GIAN TƯƠNG ĐỐI</i>
<i># (secs_since_last, n_tx_1h/24h, time split) không đổi. NHƯNG hour/dayofweek/</i>
<i># month tính từ mốc TUYỆT ĐỐI nên phụ thuộc mốc gốc: đoán sai mốc thì các</i>
<i># feature lịch bị lệch một cách hệ thống. Nêu là giả định, và coi feature lịch</i>
<i># là gần đúng khi viết luận văn.</i>
IEEE_ORIGIN = pd.Timestamp("2017-12-01")


<b>def</b> _finalize(df: pd.DataFrame) -&gt; pd.DataFrame:
    <i>"""Ép đúng schema chuẩn và kiểm tra bất biến. Mọi adapter kết thúc ở đây."""</i>
    missing = [c <b>for</b> c <b>in</b> RAW_SCHEMA <b>if</b> c <b>not</b> <b>in</b> df.columns]
    <b>if</b> missing:
        <b>raise</b> ValueError(f"adapter thiếu cột schema: {missing}")
    out = df.loc[:, list(RAW_SCHEMA)].copy()
    out["timestamp"] = pd.to_datetime(out["timestamp"])
    out["amount"] = pd.to_numeric(out["amount"], errors="coerce")
    out["is_fraud"] = pd.to_numeric(out["is_fraud"], errors="coerce").fillna(0).astype("int8")
    <b>for</b> c <b>in</b> ("tx_id", "card_id", "merchant_type", "city", "device_type"):
        out[c] = out[c].astype("string").fillna("unknown")

    out = out.dropna(subset=["timestamp", "amount"])
    out = out[out["amount"] &gt; 0]
    out = out.sort_values("timestamp", kind="mergesort").reset_index(drop=<b>True</b>)

    <b>assert</b> out["is_fraud"].isin([0, 1]).all(), "nhãn phải là 0/1"
    <b>assert</b> out["timestamp"].is_monotonic_increasing, "phải sắp theo thời gian"
    <b>assert</b> <b>not</b> out["tx_id"].duplicated().any(), "tx_id phải là duy nhất"
    <b>return</b> out


<b>def</b> _solve_intercept(base_logit, target_rate, lo=-20.0, hi=5.0, iters=60):
    <i>"""Tìm hằng số cộng vào logit để tỉ lệ dương trung bình ra đúng target_rate.

    Thay cho việc dò tay một con số ma thuật rồi in df.is_fraud.mean() xem
    trúng chưa. Đây cũng là bài tập tốt về log-odds: cộng 1 vào hằng số này là
    nhân odds lên e ≈ 2,72 lần.
    """</i>
    <b>for</b> _ <b>in</b> range(iters):
        mid = (lo + hi) / 2
        <b>if</b> np.mean(1 / (1 + np.exp(-(base_logit + mid)))) &gt; target_rate:
            hi = mid
        <b>else</b>:
            lo = mid
    <b>return</b> (lo + hi) / 2


<b>def</b> from_simulation(n: int = 400_000, seed: int = SEED, n_cards: int = 4_000,
                    target_rate: float = 0.002, days: int = 180) -&gt; pd.DataFrame:
    <i>"""Bộ mô phỏng — CÙNG schema với dữ liệu thật.

    Dùng để chạy test, chạy CI và chạy thử trên máy yếu: không cần tải gì,
    không cần tài khoản Kaggle, và bạn BIẾT TRƯỚC quy luật đúng — nên nếu mô
    hình không tìm ra được thì lỗi nằm ở code chứ không ở dữ liệu.

    Ba quy luật cài sẵn, mỗi cái kiểm chứng một nhóm feature:
      1. rủi ro cao lúc rạng sáng            → kiểm chứng mã hoá sin/cos
      2. rủi ro tăng theo số tiền            → kiểm chứng log1p + z_vs_hist
      3. có "chiến dịch" quẹt dồn dập trong ít phút (card testing ngoài đời)
                                             → kiểm chứng n_tx_1h / secs_since_last

    Quy luật 3 là lý do bộ này KHÔNG chỉ là nhiễu trắng: nếu bạn bỏ nhóm feature
    lịch sử, PR-AUC phải tụt thấy rõ. Đó là một ablation chạy được trong 2 phút.
    """</i>
    rng = np.random.default_rng(seed)
    start = pd.Timestamp("2025-01-01")
    span = days * 24 * 3600
    cards = np.array([f"C{i:05d}" <b>for</b> i <b>in</b> range(n_cards)])

    <i># Thẻ KHÔNG có sẵn hết từ ngày đầu: 70% là nền khách cũ, 30% mở dần trong</i>
    <i># kỳ. Không có chi tiết này thì split_time_group (giai đoạn tương lai + khách</i>
    <i># mới) cho ra tập rỗng — và bạn sẽ không bao giờ đo được câu hỏi đó.</i>
    n_seed = int(n_cards * 0.70)
    birth = np.concatenate([np.zeros(n_seed),
                            np.sort(rng.uniform(0, span, n_cards - n_seed))])

    <b>def</b> pick_cards(times):
        <i>"""Mỗi giao dịch chỉ thuộc về một thẻ ĐÃ mở trước thời điểm đó."""</i>
        alive = n_seed + np.searchsorted(birth[n_seed:], times, side="right")
        <b>return</b> np.floor(rng.random(len(times)) * alive).astype(int)

    <i># --- nền: giao dịch bình thường, rải đều theo thời gian ---</i>
    n_burst_tx = int(n * 0.04)
    offs = rng.uniform(0, span, n - n_burst_tx)
    card_ix = pick_cards(offs)
    in_burst = np.zeros(len(offs), dtype=bool)

    <i># --- chiến dịch: một thẻ bị quẹt 4–12 lần trong vòng ~20 phút ---</i>
    b_offs, b_cards = [], []
    <b>while</b> len(b_offs) &lt; n_burst_tx:
        k = int(rng.integers(4, 13))
        t0 = rng.uniform(0, span - 1200)
        c = int(pick_cards(np.array([t0]))[0])
        b_offs.extend(t0 + np.sort(rng.uniform(0, 1200, k)))
        b_cards.extend([c] * k)
    b_offs, b_cards = np.array(b_offs[:n_burst_tx]), np.array(b_cards[:n_burst_tx])

    offs = np.concatenate([offs, b_offs])
    card_ix = np.concatenate([card_ix, b_cards])
    in_burst = np.concatenate([in_burst, np.ones(len(b_offs), dtype=bool)])

    order = np.argsort(offs, kind="mergesort")
    offs, card_ix, in_burst = offs[order], card_ix[order], in_burst[order]
    ts = start + pd.to_timedelta(offs, unit="s")
    amount = np.exp(rng.normal(12.0, 1.4, len(offs)))

    hour = ts.hour.to_numpy()
    night = ((hour &gt;= 22) | (hour &lt;= 4)).astype(float)
    base = 1.9 * night + 0.55 * (np.log1p(amount) - 12.0) + 3.4 * in_burst
    label = rng.binomial(1, 1 / (1 + np.exp(-(base + _solve_intercept(base, target_rate)))))

    m = len(offs)
    df = pd.DataFrame({
        "tx_id": [f"S{i:08d}" <b>for</b> i <b>in</b> range(m)],
        "timestamp": ts,
        "card_id": cards[card_ix],
        "amount": amount,
        "merchant_type": rng.choice(
            ["grocery", "electronics", "travel", "gaming", "pharmacy"], m,
            p=[0.40, 0.15, 0.10, 0.15, 0.20]),
        "city": rng.choice(["HN", "HCM", "DN", "CT", "HP"], m, p=[.34, .38, .12, .08, .08]),
        "device_type": rng.choice(["mobile", "desktop", "pos"], m, p=[.62, .21, .17]),
        "is_fraud": label,
    })
    <b>return</b> _finalize(df)


<b>def</b> from_ieee(raw_dir, nrows=<b>None</b>) -&gt; pd.DataFrame:
    <i>"""IEEE-CIS Fraud Detection → schema chuẩn.

    Cần hai file đã giải nén trong data/raw/:
        train_transaction.csv · train_identity.csv

    Hai điểm phải nêu trong luận văn, vì cả hai đều là XẤP XỈ:
      · card1 KHÔNG phải mã thẻ — nó là một mã đã băm gần với "thẻ". Dùng nó
        làm card_id là xấp xỉ hợp lý nhất có được, và chia theo nhóm dựa trên
        nó là bảo thủ (thà nhóm rộng hơn thật còn hơn hẹp hơn thật).
      · DeviceType chỉ có ở bảng identity, phủ chưa tới 1/4 số giao dịch →
        phần còn lại là "unknown", và "unknown" tự nó đã là một tín hiệu.
    """</i>
    <b>from</b> pathlib <b>import</b> Path
    raw_dir = Path(raw_dir)
    tx = pd.read_csv(
        raw_dir / "train_transaction.csv", nrows=nrows,
        usecols=["TransactionID", "isFraud", "TransactionDT", "TransactionAmt",
                 "ProductCD", "card1", "addr1"])
    ident = pd.read_csv(raw_dir / "train_identity.csv",
                        usecols=["TransactionID", "DeviceType"])
    tx = tx.merge(ident, on="TransactionID", how="left")

    df = pd.DataFrame({
        "tx_id": tx["TransactionID"].astype(str),
        "timestamp": IEEE_ORIGIN + pd.to_timedelta(tx["TransactionDT"], unit="s"),
        "card_id": "IEEE-" + tx["card1"].fillna(-1).astype("int64").astype(str),
        "amount": tx["TransactionAmt"],
        "merchant_type": tx["ProductCD"].fillna("unknown"),
        "city": "addr" + tx["addr1"].fillna(-1).astype("int64").astype(str),
        "device_type": tx["DeviceType"].fillna("unknown"),
        "is_fraud": tx["isFraud"],
    })
    <b>return</b> _finalize(df)


ADAPTERS = {"sim": from_simulation, "ieee": from_ieee}</div>

  <h2>Chạy — <code>src/prepare_data.py</code></h2>
  <div class="ds-code"><i>"""Bước 1 của quy trình: dữ liệu thô → data/processed/transactions.parquet.

    python -m src.prepare_data --source sim               # 120k dòng, không cần tải gì
    python -m src.prepare_data --source ieee --nrows 300000

Sau lệnh này, không file nào khác trong repo còn được đọc data/raw/.
"""</i>
<b>import</b> argparse
<b>import</b> json

<b>import</b> pandas <b>as</b> pd

<b>from</b> .adapters <b>import</b> ADAPTERS
<b>from</b> .config <b>import</b> DATA_PROC, DATA_RAW, PROC_FILE, SCHEMA_VERSION, SEED
<b>from</b> .history <b>import</b> add_history


<b>def</b> main(argv=<b>None</b>):
    ap = argparse.ArgumentParser()
    ap.add_argument("--source", choices=sorted(ADAPTERS), default="sim")
    ap.add_argument("--nrows", type=int, default=<b>None</b>)
    ap.add_argument("--n", type=int, default=400_000, help="chỉ dùng cho --source sim")
    ap.add_argument("--seed", type=int, default=SEED)
    a = ap.parse_args(argv)

    <b>if</b> a.source == "sim":
        df = ADAPTERS["sim"](n=a.n, seed=a.seed)
    <b>else</b>:
        df = ADAPTERS[a.source](DATA_RAW, nrows=a.nrows)

    df = add_history(df)          <i># feature lịch sử tính TRÊN TOÀN BỘ chuỗi, TRƯỚC khi chia</i>
    DATA_PROC.mkdir(parents=<b>True</b>, exist_ok=<b>True</b>)
    df.to_parquet(PROC_FILE, index=<b>False</b>)

    card = {
        "schema_version": SCHEMA_VERSION,
        "source": a.source,
        "rows": int(len(df)),
        "cards": int(df["card_id"].nunique()),
        "fraud_rate": float(df["is_fraud"].mean()),
        "from": str(df["timestamp"].min()),
        "to": str(df["timestamp"].max()),
        "built_at": pd.Timestamp.utcnow().isoformat(),
    }
    (DATA_PROC / "datacard.json").write_text(json.dumps(card, indent=2, ensure_ascii=<b>False</b>))
    print(json.dumps(card, indent=2, ensure_ascii=<b>False</b>))
    <b>return</b> card


<b>if</b> __name__ == "__main__":
    main()</div>

  <h2>Bộ mô phỏng không phải đồ chơi — nó là dụng cụ đo</h2>
  <p>Ba quy luật được cài vào có chủ ý, mỗi cái kiểm chứng đúng một nhóm feature bạn sắp viết:</p>
  <div class="wb-table-scroll"><table>
    <thead><tr><th>Quy luật cài sẵn</th><th>Nhóm feature nó kiểm chứng</th><th>Nếu bỏ nhóm đó thì…</th></tr></thead>
    <tbody>
      <tr><td>Rủi ro cao lúc 22h–4h</td><td><code>hour_sin</code> / <code>hour_cos</code></td><td>PR-AUC tụt — bằng chứng mã hoá chu kỳ có tác dụng thật</td></tr>
      <tr><td>Rủi ro tăng theo số tiền</td><td><code>amount_log</code>, <code>z_vs_hist</code></td><td>PR-AUC tụt nhẹ</td></tr>
      <tr><td>"Chiến dịch": một thẻ bị quẹt 4–12 lần trong 20 phút</td><td><code>n_tx_1h</code>, <code>secs_since_last</code></td><td>PR-AUC tụt mạnh nhất</td></tr>
    </tbody>
  </table></div>
  <p>Đây là điều bộ dữ liệu thật <b>không</b> cho bạn: ở đây bạn <i>biết</i> câu trả lời đúng. Nếu mô hình không tìm ra quy luật giờ, lỗi nằm ở code bạn vừa viết — không phải ở dữ liệu, không phải ở siêu tham số. Nó biến việc gỡ lỗi từ đoán mò thành kiểm chứng.</p>
  <p>Hằng số <code>target_rate</code> được giải bằng <b>chia đôi</b> chứ không dò tay. Cộng 1 vào hằng số logit đó là nhân odds lên $e \approx 2{,}7$ lần — bạn có thể tự kiểm bằng một dòng.</p>

  <h2>Còn PaySim — bộ mà đồ án môn học của bạn đã dùng?</h2>
  <p>Câu hỏi này đáng trả lời riêng, vì bạn <b>đã có sẵn</b> một đồ án chạy trên PaySim.</p>
  <p><a class="wb-btn wb-btn--ghost wb-btn--sm" href="../business-analytics/fraud-detection-project.html">
    <span class="wb-ico wb-ico--sm">open_in_new</span> Đồ án môn học · Fraud Detection (PaySim)</a></p>
  <p>Câu trả lời ngắn: <b>tái dùng được phần khung, không tái dùng được phần dữ liệu.</b> Lý do thứ hai mới là lý do thật:</p>
  <ol>
    <li><b>PaySim là dữ liệu mô phỏng</b> — như bộ trong repo này. Khác biệt là bộ trong repo <i>tự nhận</i> mình là dụng cụ đo và chỉ dùng để kiểm code, còn PaySim hay bị báo cáo như thể là kết quả về thế giới thật.</li>
    <li><b>Chín đặc trưng tổng hợp trong đồ án được sinh <i>có điều kiện theo nhãn</i></b> <code>isFraud</code> — tuổi tài khoản, thiết bị lạ, lệch địa chỉ… đều rút từ hai phân phối khác nhau tuỳ giao dịch đó là gian lận hay không. Đó chính là <b>rò rỉ nhãn theo đúng định nghĩa</b>: đáp án bị nhét ngược vào feature. PR-AUC 0,997 của nhóm bạn là hệ quả trực tiếp, không phải thành tích.</li>

  <h2>2 · <code>src/features.py</code> — feature từ một dòng</h2>
  <p>Hàm này chạy <b>y hệt nhau</b> ở ba nơi: lúc train (278 nghìn dòng), lúc đánh giá, và lúc serve (đúng một dòng). Đó là lý do nó nằm trong Pipeline chứ không nằm trong notebook.</p>
  <div class="ds-code"><i>"""Feature sinh được CHỈ TỪ NỘI DUNG CỦA CHÍNH MỘT DÒNG.

Hàm này chạy y hệt nhau ở ba nơi: lúc train (500 nghìn dòng), lúc test, và
lúc serve (đúng một dòng). Đó là lý do nó nằm trong Pipeline chứ không nằm
trong notebook.
"""</i>
<b>import</b> numpy <b>as</b> np
<b>import</b> pandas <b>as</b> pd

<b>from</b> .config <b>import</b> CYCLES, HISTORY_COLS, NUM_FEATURES, CAT_FEATURES, TS_COL

<i># Cột thô bắt buộc phải có trước khi gọi add_derived</i>
REQUIRED_RAW = ["timestamp", "amount", "merchant_type", "city", "device_type"]


<b>def</b> add_derived(df: pd.DataFrame) -&gt; pd.DataFrame:
    <i>"""Thêm cột dẫn xuất. Không đọc dòng khác, không đọc tương lai."""</i>
    missing = [c <b>for</b> c <b>in</b> REQUIRED_RAW <b>if</b> c <b>not</b> <b>in</b> df.columns]
    <b>if</b> missing:
        <b>raise</b> ValueError(f"add_derived thiếu cột thô: {missing}")

    out = df.copy()
    ts = pd.to_datetime(out[TS_COL])

    <i># Cột lịch sử: lúc serve có thể vắng hoặc là None → ép về số, thiếu thì NaN.</i>
    <i># Không điền 0 ở đây: 0 nghĩa là "đã đo và bằng 0", NaN nghĩa là "chưa biết",</i>
    <i># và SimpleImputer(add_indicator=True) ở pipeline sẽ nói cho model biết điều đó.</i>
    <b>for</b> c <b>in</b> HISTORY_COLS:
        out[c] = pd.to_numeric(out.get(c), errors="coerce") <b>if</b> c <b>in</b> out <b>else</b> np.nan

    out["hour"] = ts.dt.hour
    out["dayofweek"] = ts.dt.dayofweek
    out["month"] = ts.dt.month

    <b>for</b> part, period <b>in</b> CYCLES.items():                      <i># ← mã hoá chu kỳ</i>
        out[f"{part}_sin"] = np.sin(2 * np.pi * out[part] / period)
        out[f"{part}_cos"] = np.cos(2 * np.pi * out[part] / period)

    out["is_weekend"] = (out["dayofweek"] &gt;= 5).astype("int8")
    out["amount_log"] = np.log1p(pd.to_numeric(out["amount"], errors="coerce"))

    <i># So với thói quen của chính thẻ đó. Thẻ chưa có lịch sử → NaN, không phải 1.</i>
    out["amt_vs_hist"] = out["amount"] / (out["hist_mean"] + 1.0)
    out["z_vs_hist"] = (out["amount"] - out["hist_mean"]) / (out["hist_std"] + 1e-6)

    <b>for</b> c <b>in</b> CAT_FEATURES:
        out[c] = out[c].astype("string").fillna("unknown").astype(object)

    absent = [c <b>for</b> c <b>in</b> NUM_FEATURES <b>if</b> c <b>not</b> <b>in</b> out.columns]
    <b>if</b> absent:
        <b>raise</b> ValueError(f"add_derived quên sinh: {absent}")
    <b>return</b> out</div>
