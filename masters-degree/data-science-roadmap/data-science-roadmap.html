    <li><b>Ẩn danh:</b> băm ID khách, bỏ tên/số thẻ/địa chỉ. Giữ lại quan hệ (cùng một khách vẫn phải có cùng một mã băm).</li>
    <li><b>Cân nhắc không công bố dữ liệu</b>, chỉ công bố code — cách này được chấp nhận rộng rãi.</li>
    <li>Nếu cần chia sẻ, xem xét dữ liệu tổng hợp giữ được tính chất thống kê.</li>
  </ul>

  <h2>Tạo dữ liệu mô phỏng để chạy thử pipeline</h2>
  <p>Trong lúc chờ dữ liệu thật, đây là đoạn tạo dữ liệu giả có sẵn quy luật (bao gồm cả quy luật theo giờ để bạn kiểm chứng sin/cos):</p>
  <div class="ds-code"><b>import</b> numpy <b>as</b> np, pandas <b>as</b> pd
rng = np.random.default_rng(42)
n = 100_000

hour   = rng.integers(0, 24, n)
amount = np.exp(rng.normal(12, 1.5, n))            <i># phân phối log-chuẩn, lệch phải</i>
card   = rng.integers(0, 5_000, n)

<i># rủi ro thật: cao lúc rạng sáng (chu kỳ!) và khi số tiền lớn</i>
night = ((hour &gt;= 22) | (hour &lt;= 4)).astype(<b>float</b>)
logit = -8.8 + 1.8*night + 0.7*np.log1p(amount)/5   <i># −8,8 là để ra ~0,2% dương</i>
p     = 1 / (1 + np.exp(-logit))
label = rng.binomial(1, p)

df = pd.DataFrame({"hour": hour, "amount": amount, "card_id": card, "Class": label})
print(df.Class.mean())          <i># ~0,002 = 0,2%</i>
print(df.groupby("hour").Class.mean())   <i># thấy rõ đỉnh lúc rạng sáng</i></div>
  <p>Bộ này rất hữu ích vì <b>bạn biết trước sự thật</b>: nếu mô hình của bạn không tìm ra được quy luật theo giờ, thì lỗi nằm ở code chứ không phải ở dữ liệu.</p>
  <p>Con số <code>-8.8</code> là cái điều chỉnh để tỉ lệ dương ra đúng cỡ thực tế. Nếu bạn đổi <code>1.8</code> hay hệ số của <code>amount</code>, tỉ lệ dương sẽ trôi theo — cứ in <code>df.Class.mean()</code> rồi chỉnh hằng số đầu tiên lên/xuống cho tới khi vừa ý. Đây cũng là một bài tập tốt: nó cho bạn cảm giác trực tiếp về <b>log-odds</b>, cộng thêm 1 vào hằng số đó là nhân odds lên $e \approx 2{,}7$ lần.</p>

  <h2>2 · <code>src/features.py</code> — biến đổi từng dòng</h2>
  <div class="ds-code"><b>import</b> numpy <b>as</b> np, pandas <b>as</b> pd
<b>from</b> .config <b>import</b> CYCLES, TS_COL

<b>def</b> add_derived(df: pd.DataFrame) -&gt; pd.DataFrame:
    """Sinh feature CHỈ từ nội dung của chính dòng đó.
       Chạy y hệt lúc train (nhiều dòng) và lúc serve (một dòng)."""
    out = df.copy()
    ts  = pd.to_datetime(out[TS_COL])

    out["hour"]      = ts.dt.hour
    out["dayofweek"] = ts.dt.dayofweek
    out["month"]     = ts.dt.month

    <b>for</b> part, period <b>in</b> CYCLES.items():                <i># ← mã hoá chu kỳ</i>
        out[f"{part}_sin"] = np.sin(2 * np.pi * out[part] / period)
        out[f"{part}_cos"] = np.cos(2 * np.pi * out[part] / period)

    out["is_weekend"]  = (out["dayofweek"] &gt;= 5).astype(<b>int</b>)
    out["amount_log"]  = np.log1p(out["amount"])
    out["amt_vs_hist"] = out["amount"] / (out["hist_mean"].fillna(out["amount"]) + 1)
    out["z_vs_hist"]   = ((out["amount"] - out["hist_mean"])
                          / (out["hist_std"] + 1e-6)).fillna(0)
    <b>return</b> out</div>

  <h2>3 · <code>src/history.py</code> — feature cần lịch sử</h2>
  <div class="ds-code"><b>import</b> pandas <b>as</b> pd

<b>def</b> add_history(df: pd.DataFrame) -&gt; pd.DataFrame:
    """Tính feature theo cửa sổ thời gian. CHỈ chạy lúc train.
       Lúc serve, các cột này lấy từ Redis/CSDL."""
    d = df.sort_values(["card_id", "timestamp"]).copy()
    d["timestamp"] = pd.to_datetime(d["timestamp"])

    g = d.groupby("card_id")
    d["secs_since_last"] = g["timestamp"].diff().dt.total_seconds()

    <i># .shift(1) = KHÔNG tính chính giao dịch hiện tại → chống rò rỉ</i>
    d["hist_mean"] = g["amount"].transform(<b>lambda</b> s: s.shift(1).expanding().mean())
    d["hist_std"]  = g["amount"].transform(<b>lambda</b> s: s.shift(1).expanding().std())

    d = d.set_index("timestamp")
    <b>for</b> win <b>in</b> ("1h", "24h"):
        d[f"n_tx_{win}"] = (d.groupby("card_id")["amount"]
                              .rolling(win, closed="left")   <i># loại dòng hiện tại</i>
                              .count().reset_index(level=0, drop=<b>True</b>))
    <b>return</b> d.reset_index()</div>

  <h2>4 · <code>src/pipeline.py</code></h2>
  <div class="ds-code"><b>from</b> sklearn.pipeline <b>import</b> Pipeline
<b>from</b> sklearn.compose <b>import</b> ColumnTransformer
<b>from</b> sklearn.preprocessing <b>import</b> StandardScaler, OneHotEncoder, FunctionTransformer
<b>from</b> sklearn.impute <b>import</b> SimpleImputer
<b>from</b> lightgbm <b>import</b> LGBMClassifier
<b>from</b> .features <b>import</b> add_derived
<b>from</b> .config <b>import</b> NUM_FEATURES, CAT_FEATURES, SEED

<i># tham số mặc định để RIÊNG, để lời gọi bên ngoài ghi đè được</i>
DEFAULTS = <b>dict</b>(n_estimators=1500, learning_rate=0.05, num_leaves=31,
                 min_child_samples=100, subsample=0.8, subsample_freq=1,
                 colsample_bytree=0.8, reg_lambda=1.0,
                 class_weight="balanced", random_state=SEED, n_jobs=-1)

<b>def</b> build_pipeline(**kw) -&gt; Pipeline:
    params = {**DEFAULTS, **kw}          <i># ← kw ĐÈ LÊN mặc định, không nhân đôi</i>
    num = Pipeline([("imp", SimpleImputer(strategy="median", add_indicator=<b>True</b>)),
                    ("sc",  StandardScaler())])
    cat = Pipeline([("imp", SimpleImputer(strategy="constant", fill_value="__NA__")),
                    ("oh",  OneHotEncoder(handle_unknown="infrequent_if_exist",
                                          min_frequency=0.01, sparse_output=<b>False</b>))])
    prep = ColumnTransformer([("num", num, NUM_FEATURES),
                              ("cat", cat, CAT_FEATURES)],
                             remainder="drop", verbose_feature_names_out=<b>False</b>)
    <b>return</b> Pipeline([
        ("derive", FunctionTransformer(add_derived, validate=<b>False</b>)),
        ("prep",   prep),
        ("model",  LGBMClassifier(**params)),
    ])</div>
  <div class="wb-alert wb-alert--warning wb-alert--plain"><div class="wb-alert__body">
    <p class="wb-alert__title">Vì sao phải tách <code>DEFAULTS</code> ra thay vì viết thẳng vào lời gọi</p>
    <p class="wb-alert__msg">Nếu bạn viết <code>LGBMClassifier(..., random_state=SEED, **kw)</code> thì ngày bạn cần chạy 5 seed và gọi <code>build_pipeline(random_state=43)</code>, Python báo <code>TypeError: got multiple values for keyword argument 'random_state'</code>. Gộp bằng <code>{**DEFAULTS, **kw}</code> thì tham số truyền vào luôn thắng — và bạn sẽ cần đúng tính năng đó ở bài <b>Kết quả có ý nghĩa thống kê không</b>.</p>

  <h2>5 · <code>src/train.py</code></h2>
  <div class="ds-code"><b>import</b> joblib, json, numpy <b>as</b> np, pandas <b>as</b> pd
<b>from</b> sklearn.metrics <b>import</b> average_precision_score, roc_auc_score
<b>from</b> .config <b>import</b> DATA_RAW, MODEL_DIR, TARGET, SEED
<b>from</b> .history <b>import</b> add_history
<b>from</b> .pipeline <b>import</b> build_pipeline

<b>def</b> time_split(df, ratios=(0.70, 0.85)):
    df = df.sort_values("timestamp")
    n  = len(df); a, b = int(n*ratios[0]), int(n*ratios[1])
    <b>return</b> df.iloc[:a], df.iloc[a:b], df.iloc[b:]

<b>def</b> main():
    df = pd.read_csv(DATA_RAW / "transactions.csv")
    df = add_history(df)                       <i># feature lịch sử TRƯỚC khi chia</i>
    train, valid, test = time_split(df)

    <b>assert</b> train.timestamp.max() &lt; test.timestamp.min(), "rò rỉ thời gian!"
    print(f"train {len(train):,} | valid {len(valid):,} | test {len(test):,}")

    y_tr, y_va, y_te = (d[TARGET] <b>for</b> d <b>in</b> (train, valid, test))
    pipe = build_pipeline()
    pipe.fit(train, y_tr)

    p_va = pipe.predict_proba(valid)[:, 1]
    p_te = pipe.predict_proba(test)[:, 1]
    metrics = {
        "pr_auc_valid":  float(average_precision_score(y_va, p_va)),
        "pr_auc_test":   float(average_precision_score(y_te, p_te)),
        "roc_auc_test":  float(roc_auc_score(y_te, p_te)),
        "base_rate":     float(y_te.mean()),
    }
    print(json.dumps(metrics, indent=2))

    MODEL_DIR.mkdir(exist_ok=<b>True</b>)
    joblib.dump(pipe, MODEL_DIR / "fraud_v1.joblib")
    (MODEL_DIR / "metrics.json").write_text(json.dumps(metrics, indent=2))

<b>if</b> __name__ == "__main__":
    main()</div>

  <h2>6 · <code>src/evaluate.py</code> — ngưỡng theo chi phí + hình cho luận văn</h2>
  <div class="ds-code"><b>import</b> numpy <b>as</b> np, matplotlib.pyplot <b>as</b> plt
<b>from</b> sklearn.metrics <b>import</b> precision_recall_curve, average_precision_score
<b>from</b> .config <b>import</b> COST_FN, COST_FP

<b>def</b> pick_threshold(y_true, y_prob):
    ths   = np.linspace(0.001, 0.999, 999)
    costs = []
    <b>for</b> t <b>in</b> ths:
        pred = (y_prob &gt;= t)
        fn = ((y_true == 1) &amp; ~pred).sum()
        fp = ((y_true == 0) &amp;  pred).sum()
        costs.append(fn*COST_FN + fp*COST_FP)
    i = int(np.argmin(costs))
    <b>return</b> float(ths[i]), float(costs[i])

<b>def</b> bootstrap_ci(y_true, y_prob, n=1000, seed=42):
    y, p = np.asarray(y_true), np.asarray(y_prob)   <i># ← Series thì tra theo nhãn, phải ép mảng</i>
    rng  = np.random.default_rng(seed)
    s = [average_precision_score(y[i], p[i])
         <b>for</b> i <b>in</b> (rng.integers(0, len(y), len(y)) <b>for</b> _ <b>in</b> range(n))]
    <b>return</b> float(np.percentile(s, 2.5)), float(np.percentile(s, 97.5))

<b>def</b> plot_pr(y_true, y_prob, path):
    p, r, _ = precision_recall_curve(y_true, y_prob)
    plt.figure(figsize=(5, 4))
    plt.plot(r, p, lw=2)
    plt.axhline(y_true.mean(), ls="--", lw=1, label="ngẫu nhiên")
    plt.xlabel("Recall"); plt.ylabel("Precision"); plt.legend(); plt.tight_layout()
    plt.savefig(path, dpi=200)</div>

<template data-node="pr-serve">
  <p>Mô hình nằm trong file <code>.joblib</code> chưa phải là sản phẩm. Bài này biến nó thành một dịch vụ mà hệ thống khác gọi được — và đây chính là thứ bạn demo trước hội đồng.</p>

  <h2><code>src/serve.py</code> — API đầy đủ</h2>
  <div class="ds-code"><b>from</b> fastapi <b>import</b> FastAPI, HTTPException
<b>from</b> pydantic <b>import</b> BaseModel, Field
<b>import</b> joblib, pandas <b>as</b> pd, time, logging
<b>from</b> .config <b>import</b> MODEL_DIR

app   = FastAPI(title="Fraud Scoring API", version="1.0")
model = joblib.load(MODEL_DIR / "fraud_v1.joblib")
log   = logging.getLogger("fraud")

BLOCK, REVIEW = 0.90, 0.40      <i># ngưỡng chọn ở bài Đo lường</i>

<b>class</b> Transaction(BaseModel):
    """Kiểu dữ liệu ĐẦU VÀO — pydantic tự kiểm tra và báo lỗi rõ ràng."""
    timestamp:     str
    amount:        float = Field(gt=0)
    card_id:       str
    merchant_type: str
    city:          str
    device_type:   str
    <i># feature lịch sử: caller cung cấp, hoặc service tự tra Redis</i>
    hist_mean:       float | <b>None</b> = <b>None</b>
    hist_std:        float | <b>None</b> = <b>None</b>
    secs_since_last: float | <b>None</b> = <b>None</b>
    n_tx_1h:         int   = 0
    n_tx_24h:        int   = 0

<b>class</b> Score(BaseModel):
    risk_score: float
    decision:   str
    latency_ms: float
    model_version: str

@app.get("/health")
<b>def</b> health():
    <b>return</b> {"status": "ok", "model": "fraud_v1"}

@app.post("/score", response_model=Score)
<b>def</b> score(tx: Transaction):
    t0 = time.perf_counter()
    <b>try</b>:
        df = pd.DataFrame([tx.model_dump()])
        p  = <b>float</b>(model.predict_proba(df)[0, 1])
    <b>except</b> Exception <b>as</b> e:
        log.exception("scoring failed")
        <b>raise</b> HTTPException(500, f"scoring failed: {e}")

    <b>if</b>   p &gt;= BLOCK:  decision = "BLOCK"
    <b>elif</b> p &gt;= REVIEW: decision = "REVIEW"
    <b>else</b>:            decision = "ALLOW"

    dt = (time.perf_counter() - t0) * 1000
    log.info("score=%.4f decision=%s card=%s ms=%.1f", p, decision, tx.card_id, dt)
    <b>return</b> Score(risk_score=round(p, 4), decision=decision,
                 latency_ms=round(dt, 2), model_version="fraud_v1")</div>

<template data-node="pr-monitor">
  <p>Mô hình không hỏng ngay — nó <b>mục dần</b>. Phần này là thứ phân biệt một bài tập với một hệ thống, và là chương mà rất ít luận văn thạc sĩ viết được cho ra hồn.</p>

  <h2>Ba loại drift</h2>
  <table>
    <tr><th>Loại</th><th>Cái gì đổi</th><th>Ví dụ</th><th>Phát hiện bằng</th></tr>
    <tr><td><b>Data drift</b></td><td>Phân phối đầu vào $P(X)$</td><td>Tết đến, số tiền trung bình tăng gấp ba</td><td>So phân phối từng cột giữa tháng này và lúc train</td></tr>
    <tr><td><b>Concept drift</b></td><td>Quan hệ $P(y \mid X)$</td><td>Kẻ gian đổi chiêu: giờ chia nhỏ thành nhiều giao dịch bé</td><td>Cần nhãn → phát hiện trễ</td></tr>
    <tr><td><b>Label drift</b></td><td>Tỉ lệ nhãn $P(y)$</td><td>Chiến dịch lừa đảo mới làm tỉ lệ gian lận tăng gấp đôi</td><td>Theo dõi tỉ lệ dương theo tuần</td></tr>
  </table>
  <p>Concept drift là loại nguy hiểm nhất vì <b>đầu vào trông vẫn bình thường</b> — chỉ có điều mối liên hệ với nhãn đã đổi. Trong bài toán gian lận nó xảy ra liên tục, vì bên kia là con người đang chủ động thích nghi.</p>

  <h2>Đo drift bằng PSI — đủ dùng và dễ giải thích</h2>
  <p>Population Stability Index so phân phối hiện tại với phân phối lúc train:</p>
  <p>$$\text{PSI} = \sum_i (a_i - e_i)\ln\frac{a_i}{e_i}$$</p>
  <p>với $e_i$, $a_i$ là tỉ lệ mẫu rơi vào khoảng $i$ ở tập tham chiếu và tập hiện tại.</p>
  <div class="ds-code"><b>def</b> psi(expected, actual, bins=10):
    edges = np.percentile(expected, np.linspace(0, 100, bins+1))
    edges = np.unique(edges)          <i># ← bỏ cạnh trùng; cột nhiều số 0 rất hay dính</i>
    edges[0], edges[-1] = -np.inf, np.inf
    e = np.histogram(expected, edges)[0] / len(expected) + 1e-6
    a = np.histogram(actual,   edges)[0] / len(actual)   + 1e-6
    <b>return</b> <b>float</b>(((a - e) * np.log(a / e)).sum())</div>
  <p class="wb-help">Dòng <code>np.unique</code> là bắt buộc trong thực tế: với cột mà hơn 10% giá trị bằng 0 (rất phổ biến — <code>n_tx_1h</code> chẳng hạn), các phân vị thấp trùng nhau và <code>np.histogram</code> sẽ báo <i>“bins must increase monotonically”</i>.</p>
  <table>
    <tr><th>PSI</th><th>Kết luận</th><th>Hành động</th></tr>
    <tr><td>&lt; 0,10</td><td>Ổn định</td><td>Không làm gì</td></tr>
    <tr><td>0,10 – 0,25</td><td>Có dịch chuyển vừa</td><td>Theo dõi sát, chuẩn bị retrain</td></tr>
    <tr><td>&gt; 0,25</td><td>Dịch chuyển đáng kể</td><td>Retrain</td></tr>
  </table>
  <p>Các ngưỡng này là quy ước ngành (dùng rộng rãi trong credit scoring), không phải định lý — hãy trích dẫn nguồn chứ đừng trình bày như chân lý.</p>

  <h2>Bảng theo dõi tối thiểu</h2>
  <table>
    <tr><th>Nhóm</th><th>Chỉ số</th><th>Cảnh báo khi</th></tr>
    <tr><td>Hệ thống</td><td>Độ trễ p99, tỉ lệ lỗi, số request/giây</td><td>p99 &gt; 100ms, lỗi &gt; 0,1%</td></tr>
    <tr><td>Đầu vào</td><td>PSI mỗi feature, tỉ lệ thiếu, số giá trị hạng mục lạ</td><td>PSI &gt; 0,25</td></tr>
    <tr><td>Đầu ra</td><td>Phân phối điểm rủi ro, tỉ lệ CHẶN/XÁC MINH</td><td>Tỉ lệ chặn đổi &gt; 50% so với tuần trước</td></tr>
    <tr><td>Chất lượng</td><td>Precision/recall trên nhãn đã có (trễ 30–60 ngày)</td><td>Precision giảm &gt; 20%</td></tr>
    <tr><td>Kinh doanh</td><td>Tổng tiền gian lận lọt qua, số cuộc gọi xác minh</td><td>Theo tháng</td></tr>
  </table>
  <p><b>Nhóm "Đầu ra" là nhóm quý nhất</b>: nó không cần nhãn, nên bạn phát hiện bất thường <i>ngay lập tức</i> thay vì chờ 60 ngày. Nếu tỉ lệ chặn nhảy từ 0,4% lên 3% trong một đêm, có gì đó đã hỏng — và bạn biết trước khi khách hàng gọi tổng đài.</p>

  <h2>Chiến lược huấn luyện lại</h2>
  <table>
    <tr><th>Cách</th><th>Cơ chế</th><th>Đánh giá</th></tr>
    <tr><td>Theo lịch</td><td>Mỗi tháng train lại trên 12 tháng gần nhất</td><td>Đơn giản, dễ vận hành. <b>Chọn cái này cho luận văn.</b></td></tr>
    <tr><td>Theo kích hoạt</td><td>Train khi PSI hoặc precision vượt ngưỡng</td><td>Hiệu quả hơn, phức tạp hơn</td></tr>
    <tr><td>Học trực tuyến</td><td>Cập nhật liên tục theo từng mẫu</td><td>Rủi ro cao trong tài chính — khó kiểm toán, dễ bị đầu độc dữ liệu</td></tr>
  </table>
  <p>Sau khi train lại, <b>đừng thay ngay</b>: chạy song song (shadow mode) một tuần, so quyết định của bản mới với bản cũ, rồi mới chuyển. Nếu có thể thì A/B test trên 5% lưu lượng.</p>

  <div class="wb-alert wb-alert--warning">
    <span class="wb-alert__icon">!</span>
    <div class="wb-alert__body"><p class="wb-alert__title">Vòng phản hồi tự đầu độc</p>
      <p class="wb-alert__msg">Mô hình chặn giao dịch → giao dịch đó không có nhãn thật → dữ liệu train tương lai chỉ chứa những gì mô hình <b>cho qua</b> → mô hình ngày càng tự tin về vùng nó vốn đã đúng và mù về vùng nó đang chặn. Đây là <i>selective labels problem</i>, và cách giảm thiểu chuẩn là <b>cho qua ngẫu nhiên một tỉ lệ nhỏ</b> (0,5–1%) các giao dịch đáng lẽ bị chặn, để thu nhãn thật. Nêu được vấn đề này và giải pháp trong luận văn là một điểm cộng lớn.</p></div>
  </div>

<template data-node="pr-cost">
  <p>Đây là bài ngắn nhưng có tỉ lệ giá trị trên công sức cao nhất trong cả trang. <b>Một bảng quy ra tiền làm luận văn của bạn khác hẳn phần lớn luận văn cùng khoá.</b></p>

  <h2>Ma trận chi phí</h2>
  <table>
    <tr><th></th><th>Thực tế: gian lận</th><th>Thực tế: sạch</th></tr>
    <tr><th>Chặn</th><td>TP: <b>tiết kiệm</b> 3.000.000₫ (trừ 40.000₫ xác minh)</td><td>FP: <b>tốn</b> 40.000₫ + rủi ro mất khách</td></tr>
    <tr><th>Cho qua</th><td>FN: <b>mất</b> 3.000.000₫</td><td>TN: 0₫</td></tr>
  </table>
  <p>Lấy số ở đâu:</p>
  <ul>
    <li><b>Chi phí FN</b> = giá trị trung bình một vụ gian lận. Tính từ chính dữ liệu: <code>df[df.Class==1].amount.mean()</code>, cộng chi phí xử lý khiếu nại.</li>
    <li><b>Chi phí FP</b> = thời gian nhân viên xác minh × lương giờ, cộng ước lượng chi phí khách bực. Con số sau khó — <b>hãy nói rõ đó là giả định và làm phân tích độ nhạy</b>.</li>
  </ul>

  <h2>Phân tích độ nhạy — biến điểm yếu thành điểm mạnh</h2>
  <p>Bạn không biết chính xác chi phí FP. Thay vì đoán một số rồi giấu, hãy cho thấy kết luận của bạn <b>ổn định trong một khoảng rộng</b>:</p>
  <div class="ds-code"><b>for</b> cost_fp <b>in</b> [20_000, 40_000, 80_000, 160_000]:
    t, total = pick_threshold(y_valid, p_valid, COST_FN=3e6, COST_FP=cost_fp)
    print(f"FP={cost_fp:>8,}₫  →  ngưỡng {t:.3f}  |  thiệt hại {total/1e6:>6.0f} triệu")</div>
  <div class="ds-code">FP=  20,000₫  →  ngưỡng 0,214  |  thiệt hại    612 triệu
FP=  40,000₫  →  ngưỡng 0,318  |  thiệt hại    698 triệu
FP=  80,000₫  →  ngưỡng 0,447  |  thiệt hại    801 triệu
FP= 160,000₫  →  ngưỡng 0,602  |  thiệt hại    944 triệu</div>
  <p>Kết luận viết được: <i>"Ngưỡng tối ưu nhạy với giả định chi phí, nhưng mô hình đề xuất vượt baseline trong toàn bộ khoảng khảo sát 20.000–160.000₫."</i> Câu này mạnh hơn nhiều so với việc chọn đại một con số.</p>

<template data-node="th-topic">
  <p>Một luận văn thạc sĩ không cần phát minh gì mới. Nó cần <b>một khoảng trống nhỏ, xác định được, và bạn lấp nó bằng bằng chứng</b>. Bài này về cách tìm khoảng trống đó.</p>

  <p>Phần đóng góp — cái "delta" — nằm ở ít nhất một trong các ô. Ví dụ cụ thể:</p>

  <h2>Vì sao roadmap.sh làm bạn rối — và đó không phải lỗi của bạn</h2>
  <p>Ba lý do, giờ nói được chính xác:</p>
  <ol>
    <li><b>Nó là mục lục của một nghề, không phải giáo trình của một dự án.</b> Nó liệt kê thứ mà bất kỳ người làm data nào cũng <i>có thể</i> cần, ở bất kỳ đâu, trong 3–5 năm. Khi bạn có một mục tiêu cụ thể — một sản phẩm, một luận văn, hai tuần — hơn một nửa bản đồ lập tức thành không liên quan.</li>
    <li><b>Nó phẳng.</b> Ô <code>eigenvalues-diagonalization</code> và ô <code>feature-engineering</code> trông ngang hàng nhau, dù một cái bạn không bao giờ dùng còn cái kia quyết định phân nửa kết quả.</li>
    <li><b>Nó liệt kê <i>chủ đề</i>, không liệt kê <i>cái bẫy</i>.</b> Đây là điểm yếu nghiêm trọng nhất và cũng khó thấy nhất: một bản đồ chủ đề không có chỗ nào để ghi “cẩn thận, chỗ này 80% người mới làm sai”. Mà chính những chỗ đó mới là thứ phân biệt một mô hình dùng được với một con số đẹp vô nghĩa.</li>
  </ol>
  <p>Nói cho công bằng: roadmap.sh làm tốt đúng việc nó định làm — cho bạn <b>tên</b> của mọi thứ để bạn tự tra. Nó chỉ không định làm việc mà bạn đang cần. Dùng nó như một danh sách kiểm tra từ vựng sau khi bạn đã đi hết trang này thì hợp lý; dùng nó làm lộ trình học đầu tiên thì không.</p>

/* ============================================================
   2. Trạng thái + tiện ích
   ============================================================ */
const LS_KEY = 'ds-roadmap-done-v1';
const done = new Set(JSON.parse(localStorage.getItem(LS_KEY) || '[]'));
const saveDone = () => localStorage.setItem(LS_KEY, JSON.stringify([...done]));

const LEAVES = TREE.flatMap(p => p.kids.map(k => ({ ...k, phase: p })));
const byId   = Object.fromEntries(LEAVES.map(l => [l.id, l]));
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function fmtMin(m) {
  if (m < 60) return m + ' phút';
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h}h${String(r).padStart(2, '0')}` : `${h}h`;
}
const phaseMin = p => p.kids.reduce((s, k) => s + k.m, 0);

/* ============================================================
   3. Rail — cây lộ trình
   ============================================================ */
function buildTree() {
  const ul = $('#tree');
  ul.innerHTML = TREE.map(p => `
    <li class="wb-tree__node ds-tree__phase" data-phase="${p.id}">
      <div class="wb-tree__row" data-goto="${p.kids[0].id}">
        <button class="wb-tree__toggle" aria-label="Mở/đóng ${p.t}"></button>
        <span class="wb-tree__label">${p.t}</span>
        <span class="wb-tree__meta">${fmtMin(phaseMin(p))}</span>
      </div>
      <ul class="wb-tree__children">
        ${p.kids.map(k => `
          <li class="wb-tree__node" data-leaf="${k.id}">
            <div class="wb-tree__row" data-goto="${k.id}">
              <button class="wb-tree__toggle is-leaf" aria-hidden="true" tabindex="-1"></button>
              <input type="checkbox" class="wb-tree__check" data-check="${k.id}" aria-label="Đánh dấu đã học: ${k.t}">
              <span class="wb-tree__label">${k.t}</span>
              <span class="wb-tree__meta">${k.m}′</span>
            </div>
          </li>`).join('')}
      </ul>
    </li>`).join('');

  ul.addEventListener('click', e => {
    const toggle = e.target.closest('.wb-tree__toggle:not(.is-leaf)');
    if (toggle) { toggle.closest('.wb-tree__node').classList.toggle('is-collapsed'); return; }
    if (e.target.matches('[data-check]')) return;            // checkbox tự xử lý
    const row = e.target.closest('[data-goto]');
    if (row) location.hash = '#/' + row.dataset.goto;
  });

  ul.addEventListener('change', e => {
    if (!e.target.matches('[data-check]')) return;
    setDone(e.target.dataset.check, e.target.checked);
  });
}

function setDone(id, val) {
  val ? done.add(id) : done.delete(id);
  saveDone();
  syncProgress();
}

function syncProgress() {
  $$('[data-check]').forEach(c => {
    const on = done.has(c.dataset.check);
    c.checked = on;
    c.closest('.wb-tree__row').querySelector('.wb-tree__label').classList.toggle('is-done', on);
  });
  const total = LEAVES.length, n = LEAVES.filter(l => done.has(l.id)).length;
  const pct = Math.round(n / total * 100);
  $('#railPct').textContent = `${pct}% · ${n}/${total} bài`;
  $('#railBar').style.width = pct + '%';
  $('#topProgress').textContent = pct + '%';
  const btn = $('#markBtn');
  if (btn) {
    const on = done.has(btn.dataset.node);
    btn.classList.toggle('wb-btn--ghost', on);
    btn.innerHTML = on
      ? '<span class="wb-ico wb-ico--sm">check</span> Đã học xong'
      : 'Đánh dấu đã học xong';
  }
}

/* Kết bài: cầm được gì, và bài sau dùng nó làm gì. Dùng wb-card--flat để nó đọc
   như một chỗ nghỉ, không phải một cảnh báo — màu chỉ dành cho trạng thái thật. */
function gainBox(id) {
  const g = PAYOFF[id];
  if (!g) return '';
  return `
    <div class="wb-card wb-card--flat" style="margin-top:26px"><div class="wb-card__body">
      <div class="ds-gain">
        <div class="ds-gain__row">
          <span class="wb-ico wb-ico--sm ds-gain__ico">inventory_2</span>
          <div><p class="ds-gain__k">Bạn vừa có</p><p class="ds-gain__v">${g[0]}</p></div>
        </div>
        <div class="ds-gain__row">
          <span class="wb-ico wb-ico--sm ds-gain__ico">east</span>
          <div><p class="ds-gain__k">Nó dẫn đi đâu</p><p class="ds-gain__v">${g[1]}</p></div>

      </div>
    </div></div>`;
}

/* ============================================================
   4. Router
   ============================================================ */

  const id = (location.hash.replace(/^#\/?/, '') || 'home');
  const main = $('#main');
  if (id === 'home') { renderHome(); return; }

  const leaf = byId[id];
  if (!leaf) { location.replace('#/home'); return; }

  const tpl = document.querySelector(`template[data-node="${id}"]`);
  const idx = LEAVES.findIndex(l => l.id === id);
  const prev = LEAVES[idx - 1], next = LEAVES[idx + 1];
  const prio = PRIO[leaf.p];

  main.innerHTML = `
    <div class="wb-page-head">
      <nav class="wb-breadcrumb" aria-label="Breadcrumb">
        <a href="#/home">Lộ trình</a><span class="wb-breadcrumb__sep">/</span>
        <span class="wb-breadcrumb__current">${leaf.phase.t}</span>
      </nav>
      <p class="wb-eyebrow">Bài ${idx + 1}/${LEAVES.length}</p>
      <h1>${leaf.t}</h1>
    </div>

function typeset(el) {
  if (!window.renderMathInElement) return;
  renderMathInElement(el, {
    delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }],
    ignoredClasses: ['ds-code'],          // đô-la trong code không phải công thức
    throwOnError: false,
  });
}

/* Dùng cho cả ba nơi có nội dung bài: cột chính, popup toán, ngăn phụ. */
function enhance(scope) {
  // Bảng có thể rộng hơn cột chứa nó trên màn hẹp — cho nó tự cuộn trong khung
  // của mình thay vì đẩy cả trang sang ngang.
  $$('.ds-prose > table', scope).forEach(t => {
    const wrap = document.createElement('div');
    wrap.className = 'wb-table-scroll';
    t.replaceWith(wrap);
    wrap.append(t);
  });
  typeset(scope);
  $$('[data-viz]', scope).forEach(initViz);
}

function afterRender(scope) {
  enhance(scope);
  scope.scrollTop = 0;
  window.scrollTo({ top: 0 });
  syncProgress();
}

/* popup toán + ngăn phụ ---------------------------------------
   Hai lớp thông tin ngoài mạch chính, hai vật chứa khác nhau có chủ ý:
     ∑ chip  → modal ở giữa màn hình: một công thức, đọc xong là xong.
     + chip  → drawer trượt từ phải: một nhánh rẽ dài hơn (so sánh công cụ,
               phương án thay thế), trang chính vẫn thấy được phía sau. */
function closeLayers() {
  $('#mathOverlay').classList.remove('is-open');
  $('#asideOverlay').classList.remove('is-open');
}
function layerOpen() {
  return $('#mathOverlay').classList.contains('is-open') ||
         $('#asideOverlay').classList.contains('is-open');
}

document.addEventListener('click', e => {
  const chip = e.target.closest('[data-math]');
  if (chip) {
    const key = chip.dataset.math;
    const tpl = document.querySelector(`template[data-mathdef="${key}"]`);
    $('#mathTitle').textContent = tpl?.dataset.title || 'Toán';
    const body = $('#mathBody');
    body.innerHTML = '';
    if (tpl) body.append(tpl.content.cloneNode(true));
    else body.innerHTML = '<p class="wb-help">Chưa có ghi chú cho mục này.</p>';
    enhance(body);
    $('#mathOverlay').classList.add('is-open');
    return;
  }

  const more = e.target.closest('[data-aside]:not(template)');
  if (more) {
    const key = more.dataset.aside;
    const tpl = document.querySelector(`template[data-aside="${key}"]`);
    $('#asideTitle').textContent = tpl?.dataset.title || 'Thông tin thêm';
    $('#asideSub').textContent = tpl?.dataset.sub || 'Không bắt buộc — đóng lại là về đúng chỗ đang đọc';
    const body = $('#asideBody');
    body.innerHTML = '';
    if (tpl) body.append(tpl.content.cloneNode(true));
    else body.innerHTML = '<p class="wb-help">Chưa có ghi chú cho mục này.</p>';
    body.scrollTop = 0;
    body.parentElement.scrollTop = 0;
    enhance(body);
    $('#asideOverlay').classList.add('is-open');
    return;
  }

  if (e.target.closest('[data-modal-close]') || e.target.id === 'mathOverlay' || e.target.id === 'asideOverlay') {
    closeLayers();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeLayers(); return; }

  /* [ và ] = bài trước / bài sau. Cùng phím với "lùi/tiến" của nhiều trình đọc.
     Bỏ qua khi đang gõ vào ô tìm kiếm, đang mở lớp phủ, hoặc đang giữ phím tổ hợp
     (⌘] là chuyển tab của trình duyệt — không được cướp). */
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (layerOpen()) return;
  const t = e.target;
  if (t instanceof HTMLElement && (t.matches('input, textarea, select') || t.isContentEditable)) return;
  if (e.key !== '[' && e.key !== ']') return;

  const cur = location.hash.replace(/^#\/?/, '') || 'home';
  const i = LEAVES.findIndex(l => l.id === cur);
  if (e.key === ']') {
    if (i === -1) { if (LEAVES[0]) location.hash = '#/' + LEAVES[0].id; }
    else if (LEAVES[i + 1]) location.hash = '#/' + LEAVES[i + 1].id;
  } else {
    if (i > 0) location.hash = '#/' + LEAVES[i - 1].id;
    else if (i === 0) location.hash = '#/home';
  }
});

/* -- 6.2 Gradient descent ------------------------------------- */
VIZ.gd = el => {
  el.innerHTML = `
    <div class="wb-card"><div class="wb-card__body">
      <p class="ds-viz__label">Kéo “bước học” và xem quả bóng lăn xuống đáy — hoặc văng ra</p>
      <div class="ds-ctrl"><div class="ds-ctrl__top"><span class="ds-ctrl__name">Bước học (learning rate α)</span><span class="ds-ctrl__val" data-o="lr">0,10</span></div>
        <input class="wb-range" type="range" min="1" max="115" value="10" data-i="lr"></div>
      <div class="ds-ctrl"><div class="ds-ctrl__top"><span class="ds-ctrl__name">Số bước</span><span class="ds-ctrl__val" data-o="n">20</span></div>
        <input class="wb-range" type="range" min="1" max="60" value="20" data-i="n"></div>
      <svg viewBox="0 0 320 150" aria-hidden="true">
        <path data-o="curve" fill="none" stroke="var(--wb-border-strong)" stroke-width="1.5"/>
        <g data-o="dots"></g>
      </svg>
      <p class="ds-viz__readout" data-o="res">Sai số cuối: 0,004</p>
      <p class="ds-viz__see"><b>Điều cần thấy:</b> α nhỏ → bò chậm nhưng chắc chắn tới đáy. α vừa → tới nhanh. α quá lớn (kéo về cuối) → mỗi bước nhảy qua đáy, sai số to dần rồi bay ra ngoài. Đây đúng là cảnh “loss = nan” khi bạn train model.</p>
    </div></div>`;
  const f = x => 0.5 * x * x, df = x => x;
  const out = k => el.querySelector(`[data-o="${k}"]`);
  const upd = () => {
    const lr = +el.querySelector('[data-i="lr"]').value / 50;
    const n  = +el.querySelector('[data-i="n"]').value;
    out('lr').textContent = lr.toFixed(2).replace('.', ',');
    out('n').textContent = n;
    const X = x => 160 + x * 55, Y = y => 138 - Math.min(y, 4.6) * 28;
    let d = '';
    for (let x = -2.6; x <= 2.6; x += 0.05) d += (d ? 'L' : 'M') + X(x) + ' ' + Y(f(x)) + ' ';
    out('curve').setAttribute('d', d);
    let x = -2.4, pts = '';
    for (let i = 0; i < n; i++) {
      x = x - lr * df(x);
      if (!isFinite(x) || Math.abs(x) > 3) { x = Math.sign(x) * 3; pts += `<circle cx="${X(x)}" cy="${Y(f(x))}" r="3" fill="var(--wb-danger)"/>`; break; }
      pts += `<circle cx="${X(x)}" cy="${Y(f(x))}" r="3" fill="var(--wb-fg)" opacity="${0.25 + 0.75 * i / n}"/>`;
    }
    out('dots').innerHTML = pts;
    const err = f(x);
    out('res').textContent = 'Sai số cuối: ' + (err > 4 ? 'văng ra ngoài ✗' : err.toFixed(4).replace('.', ','));
  };
  el.addEventListener('input', upd); upd();
};

VIZ.thresh = el => {
  el.innerHTML = `

        <input class="wb-range" type="range" min="2" max="98" value="50" data-i="t"></div>
      <div class="wb-grid wb-grid--auto" style="--wb-grid-min:130px;margin-top:8px">
        <div><p class="ds-viz__sub">Bắt đúng (TP)</p><p class="ds-viz__readout" data-o="tp">—</p></div>
        <div><p class="ds-viz__sub">Bỏ lọt (FN)</p><p class="ds-viz__readout" data-o="fn">—</p></div>
        <div><p class="ds-viz__sub">Báo nhầm (FP)</p><p class="ds-viz__readout" data-o="fp">—</p></div>
      </div>
      <div class="wb-grid wb-grid--2" style="margin-top:14px">
        <div><p class="ds-viz__sub">Precision — trong số bị chặn, bao nhiêu đúng là gian lận</p><p class="ds-viz__readout" data-o="pr">—</p></div>
        <div><p class="ds-viz__sub">Recall — trong số gian lận thật, bắt được bao nhiêu</p><p class="ds-viz__readout" data-o="rc">—</p></div>
      </div>
      <div class="wb-alert wb-alert--plain" style="margin-top:14px">
        <div class="wb-alert__body">
          <p class="wb-alert__title">Quy ra tiền</p>
          <p class="wb-alert__msg">Mỗi vụ bỏ lọt mất 3.000.000 ₫ · mỗi lần báo nhầm tốn 40.000 ₫ (nhân viên gọi xác minh + khách bực).
          <b data-o="cost">—</b></p>
        </div>
      </div>
      <p class="ds-viz__see"><b>Điều cần thấy:</b> không có ngưỡng “đúng”. Hạ ngưỡng thì bắt được nhiều gian lận hơn nhưng chặn nhầm khách thật nhiều hơn. Chọn ngưỡng là <b>quyết định kinh doanh</b>, và cách chọn có cơ sở là tìm điểm tổng thiệt hại thấp nhất — không phải điểm F1 cao nhất.</p>
    </div></div>`;
  const out = k => el.querySelector(`[data-o="${k}"]`);
  // Mô phỏng: điểm gian lận lệch cao, điểm bình thường lệch thấp (beta thô).
  const N_POS = 200, N_NEG = 99800;
  const tprAt = t => Math.min(1, Math.pow(1 - t, 0.45));       // recall giảm chậm khi tăng ngưỡng
  const fprAt = t => Math.pow(1 - t, 4.2) * 0.35;              // báo nhầm giảm rất nhanh
  const upd = () => {
    const t = +el.querySelector('[data-i="t"]').value / 100;
    out('t').textContent = t.toFixed(2).replace('.', ',');
    const tp = Math.round(N_POS * tprAt(t)), fn = N_POS - tp;
    const fp = Math.round(N_NEG * fprAt(t));
    const pr = tp + fp ? tp / (tp + fp) : 0, rc = tp / N_POS;
    out('tp').textContent = tp; out('fn').textContent = fn; out('fp').textContent = fp.toLocaleString('vi-VN');
    out('pr').textContent = (pr * 100).toFixed(1).replace('.', ',') + '%';
    out('rc').textContent = (rc * 100).toFixed(1).replace('.', ',') + '%';
    const cost = fn * 3_000_000 + fp * 40_000;
    out('cost').textContent = ' → tổng thiệt hại ' + Math.round(cost / 1e6).toLocaleString('vi-VN') + ' triệu ₫';
  };
  el.addEventListener('input', upd); upd();
};

/* -- 6.4 Overfitting ------------------------------------------ */
VIZ.overfit = el => {
  el.innerHTML = `
    <div class="wb-card"><div class="wb-card__body">
      <p class="ds-viz__label">Kéo “độ phức tạp” — mô hình đi từ ngu tới thuộc lòng</p>
      <div class="ds-ctrl"><div class="ds-ctrl__top"><span class="ds-ctrl__name">Bậc đa thức (độ phức tạp)</span><span class="ds-ctrl__val" data-o="d">3</span></div>
        <input class="wb-range" type="range" min="1" max="14" value="3" data-i="d"></div>
      <svg viewBox="0 0 320 150" aria-hidden="true">
        <path data-o="fit" fill="none" stroke="var(--wb-fg)" stroke-width="2"/>
        <g data-o="pts"></g>
      </svg>
      <div class="wb-grid wb-grid--2" style="margin-top:10px">
        <div><p class="ds-viz__sub">Sai số trên tập train</p><p class="ds-viz__readout" data-o="tr">—</p></div>
        <div><p class="ds-viz__sub">Sai số trên tập test</p><p class="ds-viz__readout" data-o="te">—</p></div>
      </div>
      <p class="ds-viz__see"><b>Điều cần thấy:</b> sai số train luôn giảm khi tăng độ phức tạp. Sai số test giảm rồi <b>quay đầu tăng</b>. Điểm quay đầu là chỗ bạn nên dừng. Nếu chỉ nhìn train, bạn sẽ chọn bậc 14 và tin rằng mình vừa làm ra mô hình tuyệt vời.</p>
    </div></div>`;
  const xs = [.05,.14,.22,.31,.39,.48,.55,.63,.71,.8,.88,.95];
  const noise = [.06,-.05,.03,.08,-.07,.02,.05,-.06,.04,-.03,.07,-.04];
  const truth = x => Math.sin(x * Math.PI * 1.15) * 0.7 + 0.15;
  const ys = xs.map((x, i) => truth(x) + noise[i]);
  const out = k => el.querySelector(`[data-o="${k}"]`);
  const fitPoly = (xs, ys, deg) => {           // bình phương tối thiểu, giải bằng khử Gauss
    const n = deg + 1, A = [], b = [];
    for (let i = 0; i < n; i++) {
      A.push(Array.from({length:n}, (_, j) => xs.reduce((s, x) => s + Math.pow(x, i + j), 0)));
      b.push(xs.reduce((s, x, k) => s + Math.pow(x, i) * ys[k], 0));
    }
    for (let i = 0; i < n; i++) {
      let p = i; for (let r = i + 1; r < n; r++) if (Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r;
      [A[i], A[p]] = [A[p], A[i]]; [b[i], b[p]] = [b[p], b[i]];
      if (Math.abs(A[i][i]) < 1e-12) continue;
      for (let r = 0; r < n; r++) { if (r === i) continue; const f = A[r][i] / A[i][i];
        for (let c = i; c < n; c++) A[r][c] -= f * A[i][c]; b[r] -= f * b[i]; }
    }
    return b.map((v, i) => Math.abs(A[i][i]) < 1e-12 ? 0 : v / A[i][i]);
  };
  const upd = () => {
    const d = +el.querySelector('[data-i="d"]').value;
    out('d').textContent = d;
    const c = fitPoly(xs, ys, d);
    const ev = x => c.reduce((s, k, i) => s + k * Math.pow(x, i), 0);
    const X = x => 12 + x * 296, Y = y => 130 - y * 105;
    let p = '';
    for (let x = 0; x <= 1.001; x += 0.005) { const y = Math.max(-0.3, Math.min(1.3, ev(x))); p += (p ? 'L' : 'M') + X(x) + ' ' + Y(y) + ' '; }
    out('fit').setAttribute('d', p);
    out('pts').innerHTML = xs.map((x, i) => `<circle cx="${X(x)}" cy="${Y(ys[i])}" r="3.2" fill="var(--wb-fg-subtle)"/>`).join('');
    const tr = Math.sqrt(xs.reduce((s, x, i) => s + (ev(x) - ys[i]) ** 2, 0) / xs.length);
    const te = Math.sqrt([.1,.28,.45,.6,.75,.92].reduce((s, x) => s + (ev(x) - truth(x)) ** 2, 0) / 6);
    out('tr').textContent = tr.toFixed(3).replace('.', ',');
    out('te').textContent = (te > 9 ? '≫ 9' : te.toFixed(3).replace('.', ','));
  };
  el.addEventListener('input', upd); upd();
};

/* -- 6.5 Attention -------------------------------------------- */
VIZ.attn = el => {
  const toks = ['Thẻ', 'này', 'vừa', 'quẹt', 'ở', 'Hà Nội', 'và', 'Đà Nẵng'];
  // “độ liên quan” tự đặt cho ví dụ — thật thì học được từ dữ liệu
  const rel = {
    0:[.30,.05,.05,.25,.02,.15,.03,.15], 1:[.35,.25,.05,.15,.02,.08,.03,.07],
    2:[.05,.05,.25,.40,.03,.10,.02,.10], 3:[.22,.04,.18,.20,.04,.16,.02,.14],
    4:[.05,.03,.05,.20,.15,.26,.03,.23], 5:[.14,.03,.05,.16,.08,.32,.04,.18],
    6:[.05,.03,.04,.10,.05,.30,.13,.30], 7:[.13,.03,.05,.15,.07,.27,.04,.26],
  };
  el.innerHTML = `
    <div class="wb-card"><div class="wb-card__body">
      <p class="ds-viz__label">Bấm một từ — xem nó “nhìn” những từ nào để hiểu chính nó</p>
      <div class="wb-cluster" data-o="row" style="gap:6px"></div>
      <p class="ds-viz__see" data-o="note"><b>Điều cần thấy:</b> bấm vào <b>“Đà Nẵng”</b>. Nó nhìn mạnh sang “Hà Nội” — vì để biết giao dịch này có bất thường không, mô hình cần đặt hai địa điểm cạnh nhau. Đó là toàn bộ ý tưởng của attention: mỗi từ tự đi hỏi các từ khác, và <b>trọng số hỏi ai nhiều là do học ra</b>, không phải do người viết luật.</p>
    </div></div>`;
  const row = el.querySelector('[data-o="row"]');
  let sel = 7;
  const draw = () => {
    row.innerHTML = toks.map((t, i) => {
      const w = rel[sel][i];
      return `<button class="wb-cap" data-k="${i}" style="--a:${w};background:color-mix(in srgb, var(--wb-fg) ${Math.round(w*100*2.4)}%, transparent);color:${w>0.22?'var(--wb-canvas)':'var(--wb-fg)'};${i===sel?'outline:2px solid var(--wb-fg);outline-offset:2px':''}">${t} <span style="opacity:.75;font-family:var(--wb-font-mono);font-size:10px">${w.toFixed(2).replace('.',',')}</span></button>`;
    }).join('');
  };
  row.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) { sel = +b.dataset.k; draw(); } });
  draw();
};

/* ============================================================
   7. Khởi động
   ============================================================ */
$('[data-side-toggle]').addEventListener('click', () => {
  const narrow = window.matchMedia('(max-width: 900px)').matches;
  $('#shell').classList.toggle(narrow ? 'is-side-open' : 'is-side-collapsed');
});
$('#themeBtn').addEventListener('click', () => {
  const dark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('ds-theme', dark ? 'dark' : 'light');
  $('#themeBtn').innerHTML = `<span class="wb-ico">${dark ? 'light_mode' : 'dark_mode'}</span>`;
});
if (localStorage.getItem('ds-theme') === 'dark' ||
   (!localStorage.getItem('ds-theme') && matchMedia('(prefers-color-scheme: dark)').matches)) {
  document.documentElement.classList.add('dark');
  $('#themeBtn').innerHTML = '<span class="wb-ico">light_mode</span>';
}
$('#resetBtn').addEventListener('click', () => { done.clear(); saveDone(); syncProgress(); });
/* Chỉ số tìm kiếm: tiêu đề + toàn bộ nội dung bài, để tra được một khái niệm
   (SMOTE, PR-AUC, sin/cos…) chứ không chỉ tra được tên bài. */
/* Nội dung nằm trong ngăn phụ và popup toán vẫn phải tìm được — nếu không, việc đẩy
   nó ra khỏi mạch chính lại thành làm mất nó. Nhưng nó vào một ô riêng, tính điểm
   nhẹ hơn, và hai bài "mục lục" (Tra ngược, Sổ tay công cụ) thì bỏ hẳn: chúng trỏ
   tới cả chục ngăn nên nếu tính đủ thì bài nào cũng thua chúng. */
const HUB_LINKS = 3;
const SEARCH_INDEX = Object.fromEntries(LEAVES.map(l => {
  const tpl = document.querySelector(`template[data-node="${l.id}"]`);
  const own = (l.t + ' ' + l.phase.t + ' ' + (tpl ? tpl.content.textContent : '')).toLowerCase();
  let extra = '';
  const links = tpl ? [...tpl.content.querySelectorAll('[data-aside], [data-math]')] : [];
  if (links.length <= HUB_LINKS) {
    for (const c of links) {
      const k = c.dataset.aside || c.dataset.math;
      const sel = c.dataset.aside ? `template[data-aside="${k}"]` : `template[data-mathdef="${k}"]`;
      const sub = document.querySelector(sel);
      if (sub) extra += ' ' + (sub.dataset.title || '') + ' ' + sub.content.textContent;
    }
  }
  return [l.id, { own, extra: extra.toLowerCase() }];
}));

/* Tìm kiếm: thay cây bằng danh sách phẳng xếp theo mức liên quan, vì một thuật ngữ
   như "sin/cos" xuất hiện ở hàng chục bài — lọc cây thì vẫn còn quá nhiều để chọn. */
const countIn = (hay, q) => {
  let i = 0, n = 0;
  while ((i = hay.indexOf(q, i)) !== -1 && n < 30) { n++; i += q.length; }
  return n;
};

function scoreLeaf(l, q) {
  let s = 0;
  if (l.t.toLowerCase().includes(q)) s += 100;
  if (l.phase.t.toLowerCase().includes(q)) s += 20;
  const ix = SEARCH_INDEX[l.id];
  return s + countIn(ix.own, q) + countIn(ix.extra, q) * 0.5;
}

$('#searchBox').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  const box = $('#results');
  $('#tree').hidden = !!q;
  box.hidden = !q;
  if (!q) { box.innerHTML = ''; return; }

  const hits = LEAVES.map(l => ({ l, s: scoreLeaf(l, q) })).filter(h => h.s > 0)
                     .sort((a, b) => b.s - a.s);
  if (!hits.length) {
    box.innerHTML = '<div class="wb-empty"><p class="wb-empty__title">Không tìm thấy</p>' +
                    '<p class="wb-empty__msg">Thử một từ khoá ngắn hơn.</p></div>';
    return;
  }
  const top = hits.slice(0, 15);
  box.innerHTML =
    `<p class="ds-rail__progress"><span>${hits.length} bài khớp${hits.length > 15 ? ' · 15 bài liên quan nhất' : ''}</span></p>` +
    top.map(({ l, s }) => `
      <button class="ds-leaf" data-goto="${l.id}">
        <span class="ds-leaf__t">${l.t}${s >= 100 ? '' : `<br><span style="color:var(--wb-fg-subtle);font-size:11px">${l.phase.t}</span>`}</span>
        <span class="ds-leaf__m">${l.m}′</span>
      </button>`).join('');
  box.onclick = ev => {
    const b = ev.target.closest('[data-goto]');
    if (b) location.hash = '#/' + b.dataset.goto;
  };
});

buildTree();
addEventListener('hashchange', render);
addEventListener('DOMContentLoaded', () => { render(); });
render();
</script>
