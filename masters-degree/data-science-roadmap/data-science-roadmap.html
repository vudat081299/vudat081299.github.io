        <div><p class="ds-viz__sub">Recall — trong số gian lận thật, bắt được bao nhiêu</p><p class="ds-viz__readout" data-o="rc">—</p></div>
      </div>
      <div class="wb-alert wb-alert--plain" style="margin-top:14px">
        <div class="wb-alert__body">
          <p class="wb-alert__title">Quy ra tiền</p>
          <p class="wb-alert__msg">Mỗi vụ bỏ lọt mất 3.000.000 ₫ · mỗi lần báo nhầm tốn 40.000 ₫ (nhân viên gọi xác minh + khách bực).
          <b data-o="cost">—</b></p>
        </div>
      </div>
      <p class="ds-viz__alt" data-o="alt"></p>
      <p class="ds-viz__see"><b>Điều cần thấy:</b> không có ngưỡng “đúng”. Hạ ngưỡng thì bắt được nhiều gian lận hơn nhưng chặn nhầm khách thật nhiều hơn. Chọn ngưỡng là <b>quyết định kinh doanh</b>, và cách chọn có cơ sở là tìm điểm tổng thiệt hại thấp nhất — không phải điểm F1 cao nhất.</p>
    </div></div>`;
  const out = k => el.querySelector(`[data-o="${k}"]`);
  // Mô phỏng: điểm gian lận lệch cao, điểm bình thường lệch thấp (beta thô).
  const N_POS = 200, N_NEG = 99800;
  const tprAt = t => Math.min(1, Math.pow(1 - t, 0.45));       // recall giảm chậm khi tăng ngưỡng
  const fprAt = t => Math.pow(1 - t, 4.2) * 0.35;              // báo nhầm giảm rất nhanh
  const upd = () => {
    const t = +el.querySelector('[data-i="t"]').value / 100;
    out('t').textContent = t.toFixed(2).replace('.', ',');
    const tp = Math.round(N_POS * tprAt(t)), fn = N_POS - tp;
    const fp = Math.round(N_NEG * fprAt(t));
    const pr = tp + fp ? tp / (tp + fp) : 0, rc = tp / N_POS;
    out('tp').textContent = tp; out('fn').textContent = fn; out('fp').textContent = fp.toLocaleString('vi-VN');
    out('pr').textContent = (pr * 100).toFixed(1).replace('.', ',') + '%';
    out('rc').textContent = (rc * 100).toFixed(1).replace('.', ',') + '%';
    const cost = fn * 3_000_000 + fp * 40_000;
    out('cost').textContent = ' → tổng thiệt hại ' + Math.round(cost / 1e6).toLocaleString('vi-VN') + ' triệu ₫';
    out('alt').textContent =
      `Ở ngưỡng ${t.toFixed(2)}: bắt đúng ${tp} vụ, bỏ lọt ${fn} vụ, báo nhầm ${fp} giao dịch hợp lệ. ` +
      `Precision ${(pr * 100).toFixed(1)}%, recall ${(rc * 100).toFixed(1)}%. ` +
      `Tổng thiệt hại ${Math.round(cost / 1e6)} triệu đồng.`;
  };
  el.addEventListener('input', upd); upd();
};

VIZ.overfit = el => {
  el.innerHTML = `
    <div class="wb-card"><div class="wb-card__body">
      <p class="ds-viz__label">Kéo “độ phức tạp” — mô hình đi từ ngu tới thuộc lòng</p>
      <div class="ds-ctrl"><div class="ds-ctrl__top"><span class="ds-ctrl__name">Bậc đa thức (độ phức tạp)</span><span class="ds-ctrl__val" data-o="d">3</span></div>
        <input class="wb-range" type="range" min="1" max="14" value="3" data-i="d"></div>
      <svg viewBox="0 0 320 150" aria-hidden="true">
        <path data-o="fit" fill="none" stroke="var(--wb-fg)" stroke-width="2"/>
        <g data-o="pts"></g>
      </svg>
      <div class="wb-grid wb-grid--2" style="margin-top:10px">
        <div><p class="ds-viz__sub">Sai số trên tập train</p><p class="ds-viz__readout" data-o="tr">—</p></div>
        <div><p class="ds-viz__sub">Sai số trên tập test</p><p class="ds-viz__readout" data-o="te">—</p></div>
      </div>
      <p class="ds-viz__alt" data-o="alt"></p>
      <p class="ds-viz__see"><b>Điều cần thấy:</b> sai số train luôn giảm khi tăng độ phức tạp. Sai số test giảm rồi <b>quay đầu tăng</b>. Điểm quay đầu là chỗ bạn nên dừng. Nếu chỉ nhìn train, bạn sẽ chọn bậc 14 và tin rằng mình vừa làm ra mô hình tuyệt vời.</p>
    </div></div>`;
  const xs = [.05,.14,.22,.31,.39,.48,.55,.63,.71,.8,.88,.95];
  const noise = [.06,-.05,.03,.08,-.07,.02,.05,-.06,.04,-.03,.07,-.04];
  const truth = x => Math.sin(x * Math.PI * 1.15) * 0.7 + 0.15;
  const ys = xs.map((x, i) => truth(x) + noise[i]);
  const out = k => el.querySelector(`[data-o="${k}"]`);
  const fitPoly = (xs, ys, deg) => {           // bình phương tối thiểu, giải bằng khử Gauss
    const n = deg + 1, A = [], b = [];
    for (let i = 0; i < n; i++) {
      A.push(Array.from({length:n}, (_, j) => xs.reduce((s, x) => s + Math.pow(x, i + j), 0)));
      b.push(xs.reduce((s, x, k) => s + Math.pow(x, i) * ys[k], 0));
    }
    for (let i = 0; i < n; i++) {
      let p = i; for (let r = i + 1; r < n; r++) if (Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r;
      [A[i], A[p]] = [A[p], A[i]]; [b[i], b[p]] = [b[p], b[i]];
      if (Math.abs(A[i][i]) < 1e-12) continue;
      for (let r = 0; r < n; r++) { if (r === i) continue; const f = A[r][i] / A[i][i];
        for (let c = i; c < n; c++) A[r][c] -= f * A[i][c]; b[r] -= f * b[i]; }
    }
    return b.map((v, i) => Math.abs(A[i][i]) < 1e-12 ? 0 : v / A[i][i]);
  };
  const upd = () => {
    const d = +el.querySelector('[data-i="d"]').value;
    out('d').textContent = d;
    const c = fitPoly(xs, ys, d);
    const ev = x => c.reduce((s, k, i) => s + k * Math.pow(x, i), 0);
    const X = x => 12 + x * 296, Y = y => 130 - y * 105;
    let p = '';
    for (let x = 0; x <= 1.001; x += 0.005) { const y = Math.max(-0.3, Math.min(1.3, ev(x))); p += (p ? 'L' : 'M') + X(x) + ' ' + Y(y) + ' '; }
    out('fit').setAttribute('d', p);
    out('pts').innerHTML = xs.map((x, i) => `<circle cx="${X(x)}" cy="${Y(ys[i])}" r="3.2" fill="var(--wb-fg-subtle)"/>`).join('');
    const tr = Math.sqrt(xs.reduce((s, x, i) => s + (ev(x) - ys[i]) ** 2, 0) / xs.length);
    const te = Math.sqrt([.1,.28,.45,.6,.75,.92].reduce((s, x) => s + (ev(x) - truth(x)) ** 2, 0) / 6);
    out('tr').textContent = tr.toFixed(3).replace('.', ',');
    out('te').textContent = (te > 9 ? '≫ 9' : te.toFixed(3).replace('.', ','));
    out('alt').textContent =
      `Đa thức bậc ${d} khớp qua 12 điểm dữ liệu. Sai số trên tập train ${tr.toFixed(3)}, ` +
      `trên tập test ${te > 9 ? 'lớn hơn 9' : te.toFixed(3)}. ` +
      (d >= 9 ? 'Đường cong uốn lượn qua đúng từng điểm — mô hình đang học thuộc nhiễu.'
              : d <= 2 ? 'Đường cong quá thẳng để bám được quy luật.'
              : 'Đường cong bám quy luật mà không đuổi theo từng điểm.');
  };
  el.addEventListener('input', upd); upd();
};

  const rel = {

    2:[.05,.05,.25,.40,.03,.10,.02,.10], 3:[.22,.04,.18,.20,.04,.16,.02,.14],
    4:[.05,.03,.05,.20,.15,.26,.03,.23], 5:[.14,.03,.05,.16,.08,.32,.04,.18],
    6:[.05,.03,.04,.10,.05,.30,.13,.30], 7:[.13,.03,.05,.15,.07,.27,.04,.26],
  };
  el.innerHTML = `
    <div class="wb-card"><div class="wb-card__body">
      <p class="ds-viz__label">Bấm một từ — xem nó “nhìn” những từ nào để hiểu chính nó</p>
      <div class="wb-cluster" data-o="row" style="gap:6px"></div>
      <p class="ds-viz__alt" data-o="alt"></p>
      <p class="ds-viz__see" data-o="note"><b>Điều cần thấy:</b> bấm vào <b>“Đà Nẵng”</b>. Nó nhìn mạnh sang “Hà Nội” — vì để biết giao dịch này có bất thường không, mô hình cần đặt hai địa điểm cạnh nhau. Đó là toàn bộ ý tưởng của attention: mỗi từ tự đi hỏi các từ khác, và <b>trọng số hỏi ai nhiều là do học ra</b>, không phải do người viết luật.</p>
    </div></div>`;
  const row = el.querySelector('[data-o="row"]');
  let sel = 7;
  const draw = () => {
    row.innerHTML = toks.map((t, i) => {
      const w = rel[sel][i];

    alt.textContent = `Đang chọn từ “${toks[sel]}”. Trọng số chú ý của nó tới từng từ, từ cao xuống thấp: ` +
      rank.map(([t, v]) => `${t} ${v.toFixed(2)}`).join(', ') + '.';
  };
  row.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) { sel = +b.dataset.k; drawAll(); } });
  drawAll();
};

/* -- 6.6 Khung chung cho các khối mới -------------------------
   Mọi khối tương tác phải trả lời năm câu, nếu không nó chỉ là trang trí:
   câu hỏi nó giải · thao tác cần làm · điều cần thấy · hiểu nhầm hay gặp ·
   nối với code thật. Hàm này ép đủ năm, và gom về một khuôn duy nhất để
   người đọc học một lần là biết đọc mọi khối sau. */
const seeBlock = ({ see, wrong, code }) => `
  <div class="ds-viz__see">
    <p><b>Điều cần thấy:</b> ${see}</p>
    <p><b>Hiểu nhầm hay gặp:</b> ${wrong}</p>
    ${code ? `<p><b>Trong code:</b> ${code}</p>` : ''}
  </div>`;
/* Nhóm nút loại trừ nhau. Dùng aria-pressed nên trạng thái đọc được bằng
   trình đọc màn hình, không chỉ nhìn thấy bằng màu. */
const seg = (name, opts, cur) => `
  <div class="ds-seg" role="group" aria-label="${name}">
    ${opts.map(o => `<button class="ds-seg__btn" data-seg="${o.k}" aria-pressed="${o.k === cur}">${o.t}</button>`).join('')}
  </div>`;
function wireSeg(el, onPick) {
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-seg]');
    if (!b) return;
    $$('[data-seg]', b.parentElement).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    onPick(b.dataset.seg);
  });
}
const key = items => `<div class="ds-key">${items.map(([c, t]) =>
  `<span class="ds-key__i"><span class="ds-key__sw" style="background:${c}"></span>${t}</span>`).join('')}</div>`;

      </div></div>

        wrong:'“chia ngẫu nhiên là khách quan nhất”. Ngẫu nhiên chỉ đúng khi các dòng độc lập. Có thời gian hoặc có thực thể lặp thì ngẫu nhiên là cách rò rỉ dữ liệu nhanh nhất — và điểm số sẽ <i>đẹp lên</i>, nên nó không tự lộ.',
        code:'<code>train_test_split(..., shuffle=False)</code> · <code>TimeSeriesSplit</code> · <code>GroupShuffleSplit(groups=df["card_id"])</code>',
      })}
    </div></div>`;
  const cells = el.querySelector('[data-o="cells"]'), grp = el.querySelector('[data-o="grp"]');
  const verdict = el.querySelector('[data-o="verdict"]'), alt = el.querySelector('[data-o="alt"]');
  const COL = { TR:'var(--wb-fg)', VA:'var(--wb-neutral-strong)', TE:'var(--wb-border-strong)' };
  const draw = mode => {
    let lab;
    if (mode === 'time') lab = i => i < 16 ? 'TR' : i < 20 ? 'VA' : 'TE';
    else if (mode === 'group') lab = i => cards[i] < 4 ? 'TR' : cards[i] === 4 ? 'VA' : 'TE';
    else { const perm = [3,17,0,21,8,12,1,23,5,9,14,2,19,6,11,22,4,15,7,18,10,20,13,16];
           lab = i => perm[i] < 16 ? 'TR' : perm[i] < 20 ? 'VA' : 'TE'; }
    const w = 11.6, gap = 1.6;
    cells.innerHTML = Array.from({ length: N }, (_, i) => {
      const x = 4 + i * (w + gap), l = lab(i);
      return `<rect x="${x}" y="16" width="${w}" height="24" rx="2" fill="${COL[l]}"/>
              <text x="${x + w / 2}" y="31" font-size="6.5" text-anchor="middle"
                    fill="${l === 'TE' ? 'var(--wb-fg)' : 'var(--wb-canvas)'}">${l}</text>`;
    }).join('');
    grp.innerHTML = Array.from({ length: N }, (_, i) =>
      `<text x="${4 + i * (w + gap) + w / 2}" y="80" font-size="7" text-anchor="middle"
             fill="var(--wb-fg-subtle)">${cards[i]}</text>`).join('');
    // hai kiểm tra chạy thật trên nhãn vừa sinh, không phải câu chữ viết sẵn
    const idx = Array.from({ length: N }, (_, i) => i);
    const maxTR = Math.max(...idx.filter(i => lab(i) === 'TR'));
    const minTE = Math.min(...idx.filter(i => lab(i) === 'TE'));
    const future = maxTR > minTE;
    const shared = [...new Set(cards)].filter(c => {
      const ls = new Set(idx.filter(i => cards[i] === c).map(lab));
      return ls.size > 1;
    });
    verdict.innerHTML =
      `<b>Rò rỉ tương lai:</b> ${future ? '<b>CÓ</b> — có ô train nằm sau ô test trên trục thời gian' : 'không'}<br>
       <b>Thẻ nằm ở cả hai bên:</b> ${shared.length ? `<b>${shared.length}/6 thẻ</b> — mô hình học thuộc thói quen của chính thẻ đó` : 'không có'}`;
    alt.textContent =
      `Chế độ ${modes[mode]}: dải 24 ô theo thứ tự thời gian, mỗi ô ghi TR/VA/TE. ` +
      `Rò rỉ tương lai: ${future ? 'có' : 'không'}. Số thẻ xuất hiện ở nhiều hơn một tập: ${shared.length} trên 6.`;
  };
  wireSeg(el, draw); draw('rand');
};

      <p class="ds-viz__alt" data-o="alt"></p>
      ${seeBlock({
        see:'chọn <b>KFold</b> với k = 4: chỉ 2 dòng dương trong 20, nên có fold validation <i>không chứa dòng dương nào</i> — mọi chỉ số của fold đó vô nghĩa. <b>StratifiedKFold</b> rải chúng ra. <b>TimeSeriesSplit</b> thì fold đầu train rất ít, và không fold nào nhìn thấy tương lai.',
        wrong:'“cross-validation luôn đáng tin hơn một lần chia”. Chỉ đúng nếu <i>kiểu</i> fold khớp với cấu trúc dữ liệu. Chia sai kiểu nhưng chạy 10 fold thì bạn chỉ nhận được một con số sai với sai số chuẩn nhỏ.',
        code:'<code>StratifiedKFold(5, shuffle=True, random_state=42)</code> · <code>TimeSeriesSplit(5)</code> · <code>GroupKFold(5).split(X, y, groups=df["card_id"])</code>',
      })}
    </div></div>`;
  const rows = el.querySelector('[data-o="rows"]'), note = el.querySelector('[data-o="note"]'), alt = el.querySelector('[data-o="alt"]');
  const upd = () => {
    const kind = el.querySelector('[data-seg][aria-pressed="true"]').dataset.seg;
    const k = +el.querySelector('[data-i="k"]').value;
    el.querySelector('[data-o="k"]').textContent = k;
    // fold[i] = chỉ số fold mà dòng i thuộc về phần validation (−1 = không bao giờ)
    let fold;
    if (kind === 'kf')      fold = i => Math.floor(i / (N / k));
    else if (kind === 'st') fold = i => i % k;                       // rải đều nên lớp hiếm chia được
    else if (kind === 'gp') fold = i => grp[i] % k;
    else                    fold = i => { const s = Math.floor(N / (k + 1)); const f = Math.floor(i / s) - 1;
                                          return f >= 0 && f < k ? f : -1; };
    const bw = 13.6, gap = 1.6, h = Math.min(16, 96 / k);
    let out = '', emptyFolds = 0;
    for (let f = 0; f < k; f++) {
      const y = 6 + f * (h + 5);
      let nPos = 0;
      out += `<text x="2" y="${y + h * 0.75}" font-size="7" fill="var(--wb-fg-subtle)">${f + 1}</text>`;
      for (let i = 0; i < N; i++) {
        const isVa = fold(i) === f;
        // TimeSeriesSplit: chỉ những dòng TRƯỚC khối validation mới là train
        const used = kind !== 'ts' || i <= Math.max(...Array.from({ length: N }, (_, j) => fold(j) === f ? j : -1));
        if (isVa && pos.has(i)) nPos++;
        const x = 12 + i * (bw + gap);
        const fill = isVa ? 'var(--wb-neutral-strong)' : used ? 'var(--wb-fg)' : 'var(--wb-surface-2)';
        out += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="2" fill="${fill}"/>`;
        if (pos.has(i)) out += `<text x="${x + bw / 2}" y="${y + h * 0.78}" font-size="8" text-anchor="middle"
                                      fill="${isVa ? 'var(--wb-fg)' : 'var(--wb-canvas)'}">▲</text>`;
      }
      if (!nPos) emptyFolds++;
    }
    rows.innerHTML = out;
    const shared = kind === 'gp' ? 0 : [...new Set(grp)].filter(g => {
      const fs = new Set(Array.from({ length: N }, (_, i) => grp[i] === g ? fold(i) : null).filter(v => v !== null));
      return fs.size > 1;
    }).length;
    note.innerHTML =
      `<b>Fold validation không có dòng dương nào:</b> ${emptyFolds ? `<b>${emptyFolds}/${k}</b> — chỉ số của các fold đó vô nghĩa` : 'không có'}<br>
       <b>Nhóm bị tách ra nhiều fold:</b> ${shared ? `<b>${shared}/5 nhóm</b> — mô hình học thuộc thực thể` : 'không có'}` +
      (kind === 'ts' ? '<br><b>Nhìn thấy tương lai:</b> không — mỗi fold chỉ train trên phần bên trái' : '');
    alt.textContent = `${kinds[kind]} với k = ${k}. ${emptyFolds} trên ${k} fold validation không chứa dòng dương nào; ` +
      `${shared} trên 5 nhóm bị tách ra nhiều fold.`;
  };
  wireSeg(el, upd); el.addEventListener('input', upd); upd();
};

        code:'hàm <code>psi()</code> khoảng 6 dòng numpy ở bài <b>Giám sát</b>, chạy hằng tuần trên log của bước 10.',

    const eps = 1e-4;
    const psi = base.reduce((acc, r, i) => {

    el.querySelector('[data-o="psi"]').textContent = psi.toFixed(3).replace('.', ',');

    el.querySelector('[data-o="lv"]').textContent = lv;

      `Phân phối tháng này lệch sang phải so với phân phối lúc train.`;
  };
  el.addEventListener('input', upd); upd();
};

            <text x="76" y="126" font-size="7.5" text-anchor="middle" fill="var(--wb-fg-subtle)">Recall →</text>
          </svg>
          <p class="ds-viz__readout" data-o="ap">0,74</p>
        </div>
      </div>
      <p class="ds-viz__alt" data-o="alt"></p>
      ${seeBlock({
        see:'kéo tỉ lệ dương từ 10% xuống 0,1%. <b>ROC-AUC gần như đứng yên</b>, còn <b>PR-AUC tụt thẳng đứng</b>. Mô hình không hề đổi — chỉ bài toán khó hơn. Đường đứt trong hình PR là mức của một mô hình đoán bừa, và nó tụt xuống sát đáy: đó là lý do PR-AUC 0,4 trên dữ liệu 0,2% dương là một kết quả <i>tốt</i>.',
        wrong:'“ROC-AUC 0,95 nghĩa là mô hình rất tốt”. Với lớp dương cực hiếm, ROC-AUC cao là chuyện bình thường vì mẫu số của FPR là số ca âm khổng lồ. Luôn báo cáo PR-AUC <b>kèm tỉ lệ nền</b>, vì không có tỉ lệ nền thì PR-AUC cũng không đọc được.',

  const alt = el.querySelector('[data-o="alt"]');
  const upd = () => {

    el.querySelector('[data-o="p"]').textContent =

    // một mô hình cố định: TPR(t) và FPR(t) không phụ thuộc tỉ lệ nền
    const tpr = t => Math.pow(1 - t, 0.42), fpr = t => Math.pow(1 - t, 3.6);
    let rocD = '', prD = '', auc = 0, ap = 0, prevR = 0;
    for (let i = 0; i <= 100; i++) {

      const P = (R * prev) / (R * prev + F * (1 - prev) || 1e-9);
      prD += (prD ? 'L' : 'M') + (14 + R * 126).toFixed(1) + ' ' + (112 - P * 104).toFixed(1) + ' ';
      if (i) { const t0 = (i - 1) / 100; auc += (fpr(t0) - F) * (R + tpr(t0)) / 2; ap += (R - prevR) * P; }
      prevR = R;
    }
    el.querySelector('[data-o="roc"]').setAttribute('d', rocD);
    el.querySelector('[data-o="pr"]').setAttribute('d', prD);
    const ch = el.querySelector('[data-o="chance"]');
    ch.setAttribute('y1', 112 - prev * 104); ch.setAttribute('y2', 112 - prev * 104);
    const aucV = Math.abs(auc), apV = Math.abs(ap);
    el.querySelector('[data-o="auc"]').textContent = 'ROC-AUC ' + aucV.toFixed(3).replace('.', ',');
    el.querySelector('[data-o="ap"]').textContent = 'PR-AUC ' + apV.toFixed(3).replace('.', ',');
    alt.textContent = `Với tỉ lệ lớp dương ${(prev * 100).toFixed(2)}%: ROC-AUC = ${aucV.toFixed(3)}, ` +
      `PR-AUC = ${apV.toFixed(3)}, mức đoán bừa của PR-AUC = ${prev.toFixed(4)}. Mô hình không đổi giữa các mức.`;
  };
  el.addEventListener('input', upd); upd();
};

VIZ.splitgate = el => {
  const Q = {
    time: { t:'Giao dịch mới', q:'Khách hàng đã biết, chỉ giao dịch là mới. Câu hỏi mặc định của một hệ thống chống gian lận đang chạy.',
      fn:'split_time()', rows:'valid 57.722 · test 60.000', pr:'0,029 / 0,048',
      note:'Con số cao nhất trong ba cách — và là con số nên báo cáo làm kết quả chính, vì nó khớp với cách hệ thống thật được dùng.' },

      note:'Nếu con số này tụt <i>rất</i> sâu so với cách trên, mô hình của bạn đang dựa nhiều vào việc nhận ra từng thẻ — dùng được, nhưng phải nói ra.' },
    both: { t:'Giai đoạn tương lai + khách mới', q:'Vừa muộn hơn về thời gian, vừa là khách chưa từng thấy. Gần production nhất sau vài tháng chạy.',
      fn:'split_time_group()', rows:'test co lại còn vài trăm dòng', pr:'không đủ dòng dương để ước lượng',
      note:'Khắc nghiệt nhất, và <b>tốn dữ liệu nhất</b>. Trên bộ 400 nghìn dòng với 0,2% gian lận, tập test còn quá ít ca dương để con số có nghĩa. Kết luận đúng là nói thẳng điều đó, không phải báo cáo một PR-AUC tính trên 3 dòng.' },

      </dl>
      <p class="ds-viz__alt" data-o="alt"></p>
      ${seeBlock({
        see:'ba chế độ dùng <b>cùng một mô hình</b> và cho ba con số khác nhau. Con số thấp hơn ở chế độ khắc nghiệt <i>không</i> nghĩa là mô hình tệ đi — nó nghĩa là bạn vừa hỏi một câu khó hơn. Điều sai duy nhất là báo cáo một con số mà không nói nó trả lời câu nào.',
        wrong:'“cứ chia khắc nghiệt nhất cho chắc”. Không — chế độ thứ ba làm tập test co lại tới mức mất hết ca dương, và một con số tính trên 3 ca dương thì tệ hơn là không có con số nào. Báo cáo (1) làm chính, (3) làm kiểm tra độ bền, và nói rõ cỡ mẫu của (3).',
        code:'<code>SPLITTERS[kind](df)</code> trong <code>src/split.py</code>, rồi <code>describe(tr, va, te)</code> in ra bảng số dòng và số ca dương của từng tập — chạy nó SAU MỖI lần chia.',
      })}
    </div></div>`;
  const bar = el.querySelector('[data-o="bar"]'), alt = el.querySelector('[data-o="alt"]');

  const draw = k => {

    else lab = i => {
      const base = i < 17 ? 'TR' : i < 21 ? 'VA' : 'TE';
      if (base === 'TR') return 'TR';
      const seenInTrain = Array.from({ length: 17 }, (_, j) => cards[j]).includes(cards[i]);

    const q = Q[k];
    ['q', 'fn', 'rows', 'pr', 'note'].forEach(f => el.querySelector(`[data-o="${f}"]`).innerHTML = q[f]);
    const counts = { TR:0, VA:0, TE:0, X:0 };
    for (let i = 0; i < N; i++) counts[lab(i)]++;
    alt.textContent = `Chế độ ${q.t}: trong 26 giao dịch xếp theo thời gian có ${counts.TR} ô train, ` +
      `${counts.VA} ô valid, ${counts.TE} ô test${counts.X ? `, và ${counts.X} ô bị loại vì thẻ đã xuất hiện trong train` : ''}. ` +
      `Hàm tương ứng: ${q.fn}.`;
  };
  wireSeg(el, draw); draw('time');
};

        code:'<code>breakeven()</code> trong <code>src/thresholds.py</code> cho công thức đóng; <code>pick_thresholds()</code> quét lưới trên validation kèm ràng buộc sức chứa. So hai con số là bài kiểm tra tỉnh táo rẻ nhất của cả dự án.',

  const g = k => +el.querySelector(`[data-i="${k}"]`).value;
  const o = k => el.querySelector(`[data-o="${k}"]`);
  const vnd = v => v >= 1e6 ? (v / 1e6).toFixed(1).replace('.', ',') + ' triệu ₫'
                            : Math.round(v / 1e3).toLocaleString('vi-VN') + ' nghìn ₫';
  const CATCH = 0.9;
  // Phân phối điểm rủi ro mô phỏng — và mô phỏng theo một tính chất CÓ THẬT của
  // mô hình đã hiệu chỉnh: điểm đọc được như xác suất, tức P(gian lận | điểm=t)=t.
  // 60.000 giao dịch, tỉ lệ gian lận 0,23%. Hệ quả cốt lõi: khi điểm đã hiệu
  // chỉnh, đáy đường tổng chi phí rơi ĐÚNG vào biên hoà vốn REVIEW→BLOCK, tức
  // (cFP−cRV)/(cFP+(1−CATCH)·cFN), với MỌI bảng chi phí — cùng lập luận hiệu chỉnh
  // như bản hai hành động, chỉ thay so sánh BLOCK-với-ALLOW bằng BLOCK-với-REVIEW
  // (hệ có ba hành động, nên dùng cFP/(cFN+cFP) làm ngưỡng chặn là bỏ mất REVIEW).
  // Đó là lý do vạch tối ưu và số "ngưỡng hoà vốn" bên dưới luôn trùng nhau.
  // Hai cụm điểm, chọn để CDF có DẠNG ĐÓNG: cụm (1−t)^spike (gần như toàn bộ giao
  // dịch hợp lệ, điểm ~0) trộn với cụm t^bump (gian lận, điểm cao). spike=510 canh
  // để bắt được ~15% gian lận — khớp recall thật của mô hình ở bản ghi chạy phía trên.
  const N = 60000, POS = 137, priorPos = POS / N, priorNeg = 1 - priorPos;
  const spike = 510, bump = 3, pw = Math.pow;
  const pi = (priorPos - 1 / (spike + 2)) / ((bump + 1) / (bump + 2) - 1 / (spike + 2));
  const cdfPos = t => ((1 - pi) * (1 - pw(1 - t, spike + 1) * ((spike + 1) * t + 1)) / (spike + 2)
                      + pi * (bump + 1) * pw(t, bump + 2) / (bump + 2)) / priorPos;   // CDF điểm ở nhóm gian lận
  const cdfNeg = t => ((1 - pi) * (spike + 1) * (1 - pw(1 - t, spike + 2)) / (spike + 2)
                      + pi * (pw(t, bump + 1) - (bump + 1) * pw(t, bump + 2) / (bump + 2))) / priorNeg;   // CDF điểm ở nhóm hợp lệ
  const upd = () => {
    const cFN = g('fn') * 1e5, cFP = g('fp') * 1e4, cRV = g('rv') * 1e4;
    o('fn').textContent = vnd(cFN); o('fp').textContent = vnd(cFP); o('rv').textContent = vnd(cRV);
    o('c_fa').textContent = vnd(cFN);
    o('c_fr').textContent = vnd(cRV + (1 - CATCH) * cFN);
    o('c_lr').textContent = vnd(cRV);
    o('c_lb').textContent = vnd(cFP);

    // Ngưỡng hoà vốn dạng đóng — HAI biên của hệ BA hành động, mỗi biên là điểm
    // hoà chi phí giữa hai hành động cạnh nhau (KHÔNG phải BLOCK so với ALLOW):
    const trBE = cRV / (CATCH * cFN);                        // ALLOW → REVIEW
    const tbFull = (cFP - cRV) / (cFP + (1 - CATCH) * cFN);  // REVIEW → BLOCK
    // REVIEW chỉ đáng dùng khi có dải p mà nó rẻ nhất, tức trBE < tbFull. Nếu một
    // lần xác minh còn đắt hơn cả chặn nhầm thì REVIEW bị trội, hệ suy về hai hành động.
    const reviewActive = trBE < tbFull;
    const rMark = reviewActive ? trBE : 0;
    const tbBE = reviewActive ? tbFull : cFP / (cFN + cFP);

    // Tổng chi phí theo NGƯỠNG CHẶN t (ngưỡng xác minh cố định ở rMark). Vì điểm đã
    // hiệu chỉnh, cực tiểu rơi ĐÚNG vào biên REVIEW→BLOCK, khỏi phải dò lưới.
    const cost = t => reviewActive
      ? POS * cdfPos(rMark) * cFN                                        // gian lận cho qua (p < rMark)
        + POS * (cdfPos(t) - cdfPos(rMark)) * (cRV + (1 - CATCH) * cFN)  // gian lận đưa xác minh
        + (N - POS) * (cdfNeg(t) - cdfNeg(rMark)) * cRV                  // hợp lệ đưa xác minh
        + (N - POS) * (1 - cdfNeg(t)) * cFP                             // hợp lệ bị chặn nhầm
      : POS * cdfPos(t) * cFN + (N - POS) * (1 - cdfNeg(t)) * cFP;       // suy biến hai hành động
    const nothing = POS * cFN;
    const best = tbBE, bestC = cost(best);
    // Thang đứng lấy mốc "không làm gì" làm chuẩn, cắt bớt bức tường bên trái (chặn
    // sạch mọi khách) để nhìn thấy đáy — nếu để nguyên biên độ thì đáy bị dí bẹp.
    const ref = nothing * 1.3;
    const X = t => 16 + t * 296, Y = cc => 100 - Math.min(cc / ref, 1) * 88;
    // Chỉ vẽ trên miền policy HỢP LỆ: ngưỡng chặn phải ≥ ngưỡng xác minh rMark.
    // Với t < rMark thì cdf(t)−cdf(rMark) âm ("số giao dịch REVIEW âm") — không phải
    // một quyết định thật — nên bắt đầu đường ngay tại rMark thay vì kéo từ 0. Ở số
    // mặc định rMark≈0,015 nên gần như không đổi; nhưng slider có thể đẩy rMark lên
    // ~0,6, khi đó cả nửa trái của đường cũ là vô nghĩa.
    const t0 = reviewActive ? rMark : 0;
    let dPath = '';
    for (let i = 0; i <= 200; i++) {
      const t = t0 + (1 - t0) * (i / 200);
      dPath += (dPath ? 'L' : 'M') + X(t).toFixed(1) + ' ' + Y(cost(t)).toFixed(1) + ' ';
    }
    o('curve').setAttribute('d', dPath);
    o('opt').setAttribute('x1', X(best)); o('opt').setAttribute('x2', X(best));
    o('dot').setAttribute('cx', X(best)); o('dot').setAttribute('cy', Y(bestC));

    o('tb').textContent = tbBE.toFixed(3).replace('.', ',');
    o('tr').textContent = reviewActive ? trBE.toFixed(3).replace('.', ',') : 'không áp dụng';
    o('trsub').textContent = reviewActive ? 'nếu đội đủ sức chứa' : 'REVIEW bị loại khỏi bài toán';
    o('cost').textContent = Math.round(bestC / 1e6).toLocaleString('vi-VN') + ' triệu ₫';
    o('save').textContent = `rẻ hơn ${Math.round((1 - bestC / nothing) * 100)}% so với không làm gì`;
    // Biên BLOCK đổi bản chất theo chế độ: có REVIEW thì là biên REVIEW→BLOCK;
    // khi REVIEW bị trội (xác minh đắt hơn cả chặn nhầm) hệ suy về hai hành động
    // và biên BLOCK quay về đúng cFP/(cFN+cFP) — không được gọi nhầm là REVIEW→BLOCK.
    const boundary = reviewActive
      ? 'biên REVIEW→BLOCK, không phải biên hai hành động cFP/(cFN+cFP)'
      : 'biên ALLOW→BLOCK cFP/(cFN+cFP) — REVIEW bị loại vì một lần xác minh đắt hơn cả chặn nhầm';
    el.querySelector('[data-o="alt"]').textContent =
      `Với bỏ lọt ${vnd(cFN)}, chặn nhầm ${vnd(cFP)}, xác minh ${vnd(cRV)}: ` +
      (reviewActive
        ? `ngưỡng xác minh hoà vốn ${trBE.toFixed(3)}, `
        : `REVIEW không tối ưu ở bảng chi phí này nên không dùng; `) +
      `ngưỡng chặn hoà vốn ${tbBE.toFixed(3)} (${boundary}). Đường tổng chi phí có đáy tại ngưỡng ` +
      `${best.toFixed(3)}, tổng ${Math.round(bestC / 1e6)} triệu đồng trên 60.000 giao dịch, rẻ hơn ` +
      `${Math.round((1 - bestC / nothing) * 100)}% so với cho qua tất.`;
  };
  el.addEventListener('input', upd); upd();
};

/* Xoá tiến độ là hành động không hoàn tác được và nút nằm ngay cạnh thanh tiến
   độ — quá dễ bấm nhầm. Thay vì hộp confirm() (chặn trang, dễ bấm bừa), giữ lại
   bản sao và cho hoàn tác trong 10 giây. */
let undoSnapshot = null, undoTimer = null;
$('#resetBtn').addEventListener('click', () => {
  if (undoSnapshot) return;                       // đang trong cửa sổ hoàn tác
  if (!done.size) { flashRail('Chưa có bài nào được đánh dấu.'); return; }
  undoSnapshot = [...done];
  done.clear(); saveDone(); syncProgress();
  showUndo(undoSnapshot.length);
});

function showUndo(n) {
  const bar = $('#undoBar');
  bar.hidden = false;
  bar.innerHTML = `<span>Đã xoá ${n} bài đã đánh dấu.</span>
    <button class="wb-btn wb-btn--sm" id="undoBtn">Hoàn tác</button>`;
  $('#undoBtn').addEventListener('click', () => {
    undoSnapshot.forEach(id => { if (byId[id]) done.add(id); });
    saveDone(); syncProgress(); clearUndo();
  });
  clearTimeout(undoTimer);
  undoTimer = setTimeout(clearUndo, 10000);
  announce(`Đã xoá tiến độ ${n} bài. Nút hoàn tác còn hiệu lực 10 giây.`);
}
function clearUndo() {
  clearTimeout(undoTimer);
  undoSnapshot = null;
  const bar = $('#undoBar');
  bar.hidden = true; bar.innerHTML = '';
}
function flashRail(msg) {
  const bar = $('#undoBar');
  bar.hidden = false;
  bar.textContent = msg;
  setTimeout(() => { bar.hidden = true; bar.textContent = ''; }, 2500);
}

/* Nếu localStorage không dùng được thì nói ra, đừng để người học đánh dấu cả
   buổi rồi mất sạch khi tải lại. */

}
/* Chỉ số tìm kiếm: tiêu đề + toàn bộ nội dung bài, để tra được một khái niệm
   (SMOTE, PR-AUC, sin/cos…) chứ không chỉ tra được tên bài. */
/* Nội dung nằm trong ngăn phụ và popup toán vẫn phải tìm được — nếu không, việc đẩy
   nó ra khỏi mạch chính lại thành làm mất nó. Nhưng nó vào một ô riêng, tính điểm
   nhẹ hơn, và hai bài "mục lục" (Tra ngược, Sổ tay công cụ) thì bỏ hẳn: chúng trỏ
   tới cả chục ngăn nên nếu tính đủ thì bài nào cũng thua chúng. */
/* Bỏ dấu tiếng Việt, ở CẢ hai phía: chỉ số và truy vấn. Nhờ vậy gõ "chia tap"
   ra được bài "Chia tập", và gõ "ro ri du lieu" ra được "rò rỉ dữ liệu" — người
   đang gấp gõ không dấu là chuyện bình thường, không phải lỗi của họ. */
const deaccent = str => str.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                          .replace(/\u0111/g, 'd').replace(/\u0110/g, 'D');
const norm = str => deaccent(String(str).toLowerCase());

const HUB_LINKS = 3;
const SEARCH_INDEX = Object.fromEntries(LEAVES.map(l => {
  const tpl = document.querySelector(`template[data-node="${l.id}"]`);
  const own = norm(l.t + ' ' + l.phase.t + ' ' + (tpl ? tpl.content.textContent : ''));
  let extra = '';
  const links = tpl ? [...tpl.content.querySelectorAll('[data-aside], [data-math]')] : [];
  if (links.length <= HUB_LINKS) {
    for (const c of links) {
      const k = c.dataset.aside || c.dataset.math;
      const sel = c.dataset.aside ? `template[data-aside="${k}"]` : `template[data-mathdef="${k}"]`;
      const sub = document.querySelector(sel);
      if (sub) extra += ' ' + (sub.dataset.title || '') + ' ' + sub.content.textContent;
    }
  }
  return [l.id, { own, extra: norm(extra) }];
}));

/* Tìm kiếm theo TỪ, không theo chuỗi con.

   Bản cũ chỉ khớp chuỗi con đúng nguyên văn, nên "chia tap theo thoi gian" (gõ
   không dấu), "rò rỉ dữ liệu" (bài viết là "rò rỉ") hay "nan" đều ra 0 kết quả
   dù nội dung có đủ. Ở đây tách truy vấn thành từ, bỏ dấu tiếng Việt cả hai
   phía, và cộng điểm theo số từ khớp — nên gõ thiếu dấu hoặc sai thứ tự vẫn ra.

   Kèm một bảng đồng nghĩa nhỏ, chia làm hai loại:
     · thuật ngữ song ngữ  — "chia tập" ↔ "train test split"
     · TRIỆU CHỨNG LỖI     — người bí thường gõ đúng thông báo lỗi họ nhìn thấy
                             ("loss nan", "ValueError shape", "MemoryError"),
                             không gõ tên khái niệm. Đây là lúc cần tra nhất. */
const SYN = {
  'leakage':'rò rỉ dữ liệu leakage tương lai', 'ro ri':'rò rỉ leakage',
  'split':'chia tập train test valid split', 'chia tap':'chia tập split',
  'imbalance':'mất cân bằng lệch nhãn imbalance smote', 'lech nhan':'mất cân bằng imbalance',
  'nguong':'ngưỡng threshold chặn', 'threshold':'ngưỡng threshold chi phí',
  'overfit':'overfitting quá khớp học thuộc', 'qua khop':'overfitting',
  'chuoi thoi gian':'chuỗi thời gian forecasting time series',
  'phan loai':'phân loại classification', 'hoi quy':'hồi quy regression',
  'do luong':'đo lường metric PR-AUC ROC-AUC', 'metric':'đo lường chỉ số PR-AUC',
  'trien khai':'triển khai serve API FastAPI Docker',
  'giai thich':'giải thích SHAP interpretability',
  'tai lap':'tái lập reproducibility seed ghim phiên bản',
  'luan van':'luận văn thesis IMRaD bảo vệ',
  // triệu chứng lỗi — gõ nguyên văn cái đang hiện trên màn hình
  'nan':'loss nan learning rate gradient bùng nổ phân kỳ',
  'loss nan':'gradient descent learning rate quá lớn phân kỳ',
  'valueerror':'shape lỗi kích thước broadcasting numpy',
  'shape':'shape broadcasting numpy kích thước không khớp',
  'memoryerror':'hết bộ nhớ dtype chunksize máy yếu Colab',
  'het ram':'hết bộ nhớ dtype chunksize máy yếu',
  'may yeu':'máy yếu cloud Colab Codespaces trình duyệt',
  'khong cai duoc':'cài đặt môi trường cloud Colab trình duyệt',
  'libomp':'LightGBM libomp OpenMP cài đặt Docker',
  'diem cao qua':'rò rỉ leakage kết quả quá tốt đáng ngờ',
  'qua tot':'rò rỉ leakage kết quả đáng ngờ',
  'accuracy cao':'mất cân bằng accuracy PR-AUC lừa dối',
  'khong hoi tu':'huấn luyện learning rate early stopping gỡ lỗi',
  'chay cham':'máy yếu tối ưu chunksize mẫu nhỏ Colab GPU',
  'unknown category':'giá trị chưa từng thấy one-hot handle_unknown serve',
  'du lieu o dau':'dataset dữ liệu IEEE-CIS Kaggle mô phỏng',
};
const countIn = (hay, re) => {
  const m = hay.match(re);
  return m ? Math.min(m.length, 30) : 0;
};
const esc = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

/* Khớp theo RANH GIỚI TỪ, không theo chuỗi con. Chuỗi con làm từ hai chữ cái như
   "ro" khớp cả trong "trong", "cho", "phong" — nên gõ "rò rỉ dữ liệu" lại ra bài
   EDA đứng trên bài Data leakage. Với từ dài (≥4 ký tự) thì cho phép khớp cả
   tiền tố, để "leak" vẫn ra "leakage". */
const wordRe = t => new RegExp(
  `(?:^|[^\\p{L}\\p{N}])${esc(t)}${t.length >= 4 ? '' : '(?![\\p{L}\\p{N}])'}`, 'giu');

/* Mở rộng truy vấn: từ người gõ + từ đồng nghĩa của cụm khớp được. */
function expand(qRaw) {
  const q = norm(qRaw);
  let extra = '';
  for (const [k, v] of Object.entries(SYN)) if (q.includes(k)) extra += ' ' + norm(v);
  const terms = [...new Set((q + ' ' + extra).split(/[^\p{L}\p{N}]+/u).filter(t => t.length >= 2))];
  return { q, terms, res: terms.map(t => [t, wordRe(t)]) };
}

function scoreLeaf(l, q, res) {
  const title = norm(l.t), phase = norm(l.phase.t), ix = SEARCH_INDEX[l.id];
  let s = 0;
  if (title.includes(q)) s += 160;                      // khớp nguyên cụm ở tiêu đề
  if (q.length >= 5 && ix.own.includes(q)) s += 60;     // khớp nguyên cụm trong thân bài
  let hitAll = true;
  for (const [t, re] of res) {
    const inTitle = wordRe(t).test(title);
    if (inTitle) s += 50;
    if (wordRe(t).test(phase)) s += 12;
    const nOwn = countIn(ix.own, re);
    s += Math.min(nOwn, 10);
    s += Math.min(countIn(ix.extra, re), 6) * 0.5;
    if (!inTitle && !nOwn) hitAll = false;
  }
  // thưởng khi khớp ĐỦ mọi từ — "chia tập thời gian" phải hơn bài chỉ có "thời gian"
  if (res.length > 1 && hitAll) s *= 1.7;
  return s;
}

function runSearch(raw) {
  const box = $('#results');
  const qRaw = raw.trim();
  $('#tree').hidden = !!qRaw;
  box.hidden = !qRaw;
  if (!qRaw) { box.innerHTML = ''; return; }

  const { q, res } = expand(qRaw);
  const hits = LEAVES.map(l => ({ l, s: scoreLeaf(l, q, res) })).filter(h => h.s > 0)
                     .sort((a, b) => b.s - a.s || mins(a.l) - mins(b.l));
  if (!hits.length) {
    box.innerHTML =
      '<div class="wb-empty"><p class="wb-empty__title">Không tìm thấy</p>' +
      '<p class="wb-empty__msg">Thử một từ ngắn hơn, hoặc gõ đúng thông báo lỗi bạn đang thấy ' +
      '(“loss nan”, “ValueError shape”, “MemoryError”). Bài <b>Tra ngược</b> ở chặng 0 ' +
      'ánh xạ triệu chứng sang bước và công cụ.</p></div>';
    announce('Không tìm thấy bài nào.');
    return;
  }
  const top = hits.slice(0, 15);
  box.innerHTML =
    `<p class="ds-rail__progress"><span>${hits.length} bài khớp${hits.length > 15 ? ' · 15 bài liên quan nhất' : ''}</span></p>` +
    top.map(({ l }) => `
      <a class="ds-leaf" href="#/${l.id}">
        <span class="ds-leaf__t">${l.t}<br><span style="color:var(--wb-fg-subtle);font-size:11px">${l.phase.t}</span></span>
        <span class="ds-leaf__m">${mins(l)}′</span>
      </a>`).join('');
  announce(`${hits.length} bài khớp với “${qRaw}”.`);
}

/* Gõ nhanh thì không chạy lại sau mỗi ký tự — 83 bài × chỉ số đầy đủ là đủ nặng
   để thấy khựng trên máy yếu, mà máy yếu đúng là đối tượng của trang này. */
let searchTimer = null;
$('#searchBox').addEventListener('input', e => {
  const v = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => runSearch(v), 120);
});
$('#searchBox').addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.target.value = ''; runSearch(''); }
});

/* Một listener uỷ quyền duy nhất cho MỌI nút [data-goto], gắn một lần lúc khởi
   động. Bản cũ gắn lại trong renderHome(), nên mỗi lần quay về trang chủ lại
   chồng thêm một listener — về 5 lần thì một cú bấm chạy 5 lần, và trên thiết bị
   chậm chuyện đó nhìn thấy được. */
document.addEventListener('click', e => {
  const b = e.target.closest('button[data-goto]');
  if (b) location.hash = '#/' + b.dataset.goto;
});

/* Tự kiểm tính nhất quán của dữ liệu lịch. Chạy mỗi lần tải trang và chỉ nói khi
   có gì đó sai — rẻ hơn nhiều so với việc phát hiện lệch số sau khi đã in ra PDF.
   Gõ auditPlan() trong Console để xem đầy đủ. */
function auditPlan(verbose) {
  const bad = [];
  const flat = DAYS.flatMap(d => d.ids);
  flat.forEach((id, i) => {
    if (!byId[id]) bad.push(`DAYS: id lạ "${id}"`);
    if (flat.indexOf(id) !== i) bad.push(`DAYS: "${id}" xuất hiện nhiều lần`);
  });
  DAYS.forEach(d => {
    const h = dayMins(d) / 60;
    if (h > 6.5) bad.push(`Ngày ${d.n} dài ${h.toFixed(1)} giờ — quá 6,5 giờ`);
    if (h < 3.5) bad.push(`Ngày ${d.n} chỉ ${h.toFixed(1)} giờ — quá ngắn, gộp lại đi`);
    if (!d.out) bad.push(`Ngày ${d.n} không có deliverable`);
  });
  const wIds = WEEKS.flatMap(w => w.ids);
  TREE.forEach(p => {
    const n = wIds.filter(x => x === p.id).length;
    if (n !== 1) bad.push(`WEEKS: chặng ${p.id} xuất hiện ${n} lần (phải đúng 1)`);
  });
  LEAVES.forEach(l => {
    if (![l.r, l.x, l.d].every(v => Number.isInteger(v) && v >= 0)) bad.push(`${l.id}: r/x/d không hợp lệ`);
    if (mins(l) <= 0) bad.push(`${l.id}: tổng thời lượng bằng 0`);
    if (!PAYOFF[l.id]) bad.push(`${l.id}: thiếu PAYOFF`);
  });
  const fastFromDays = sumMins(LEAVES.filter(l => FAST.has(l.id)));
  const fastFromPlan = DAYS.reduce((s, d) => s + dayMins(d), 0);
  if (fastFromDays !== fastFromPlan) bad.push(`Tổng fast track lệch: ${fastFromDays} vs ${fastFromPlan}`);

  if (bad.length) console.warn('[lộ trình] ' + bad.length + ' vấn đề:', bad);
  else if (verbose) console.info('[lộ trình] OK — %d bài, %d ngày, %s giờ fast track',
    LEAVES.length, DAYS.length, hrs(fastFromPlan));
  return bad;
}
auditPlan();

buildTree();
addEventListener('hashchange', render);
addEventListener('DOMContentLoaded', () => { render(); });
render();
</script>
