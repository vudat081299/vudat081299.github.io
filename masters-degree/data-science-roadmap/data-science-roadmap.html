<!-- ============================================================
     POPUP TOÁN — mỗi cái tự đứng được: vấn đề → ví dụ số → ký hiệu
     ============================================================ -->

<template data-mathdef="dot" data-title="Vector và tích vô hướng — “giống nhau” đo bằng gì">
  <p>Một dòng dữ liệu <b>là</b> một vector. Giao dịch của bạn: <code>[số tiền 250.000, giờ 23, số lần quẹt trong 1h = 4]</code> → vector 3 chiều <code>[250000, 23, 4]</code>. Toàn bộ machine learning là hình học trên những mũi tên này.</p>
  <h4>Tích vô hướng: “hai mũi tên có cùng hướng không”</h4>
  <p>Lấy từng cặp số nhân với nhau rồi cộng lại. Với $a = [3, 4]$ và $b = [2, 1]$:</p>
  <p>$$a \cdot b = 3\times2 + 4\times1 = 10$$</p>
  <p>Số này lớn khi hai vector chỉ về cùng hướng, bằng 0 khi chúng vuông góc (không liên quan gì nhau), âm khi ngược hướng. <b>Mọi mô hình tuyến tính, mọi lớp neural network, mọi attention đều chỉ là tích vô hướng lặp lại rất nhiều lần.</b></p>
  <h4>Độ dài và khoảng cách</h4>
  <p>Độ dài (chuẩn L2): $\|a\| = \sqrt{3^2+4^2} = 5$. Khoảng cách giữa hai điểm là độ dài của hiệu: $\|a-b\|$.</p>
  <p>Cosine similarity = tích vô hướng đã bỏ qua độ dài, chỉ còn góc:</p>
  <p>$$\cos\theta = \frac{a\cdot b}{\|a\|\,\|b\|} \in [-1, 1]$$</p>
  <p>Dùng khi bạn quan tâm “giống nhau về hình dạng” chứ không quan tâm độ lớn — ví dụ so hai văn bản, hai embedding người dùng.</p>
  <div class="wb-alert wb-alert--warning wb-alert--plain"><div class="wb-alert__body">
    <p class="wb-alert__title">Vì sao phải scale trước khi tính khoảng cách</p>
    <p class="wb-alert__msg">Cột “số tiền” chạy tới hàng triệu, cột “giờ” chỉ 0–23. Trong $\|a-b\|$, cột số tiền nuốt chửng mọi cột khác — không phải vì nó quan trọng hơn, mà vì nó đo bằng đơn vị to hơn. Đó chính là lý do có bước StandardScaler.</p>
  </div></div>
  <p class="wb-help">Trong code: một dòng = <code>df.iloc[0].values</code> → <code>np.array([...])</code>. Tích vô hướng = <code>np.dot(a, b)</code> hoặc <code>a @ b</code>.</p>
</template>

<template data-mathdef="matmul" data-title="Ma trận — vì sao mọi lỗi đều là lỗi shape">
  <p>Ma trận chỉ là <b>một chồng vector</b>. Bảng dữ liệu 1.000 giao dịch × 30 cột là ma trận $X$ kích thước $1000 \times 30$. Quy ước bất di bất dịch: <b>hàng = một mẫu, cột = một feature</b>.</p>
  <h4>Nhân ma trận = làm tích vô hướng hàng loạt</h4>
  <p>Mô hình tuyến tính có 30 trọng số $w$ (một cho mỗi cột). Muốn chấm điểm cả 1.000 giao dịch cùng lúc:</p>
  <p>$$\hat{y} = X w, \qquad (1000\times30)\,(30\times1) = (1000\times1)$$</p>
  <p>Mỗi phần tử của kết quả là tích vô hướng của một hàng $X$ với $w$. Máy làm 1.000 phép đó song song — đó là lý do người ta viết code “vector hoá” thay vì vòng lặp <code>for</code>.</p>
  <h4>Luật duy nhất cần nhớ</h4>
  <p>$(m \times \color{#888}{n}) \times (\color{#888}{n} \times p) = (m \times p)$ — <b>hai số ở giữa phải khớp</b>, và chúng biến mất.</p>
  <p>Khi bạn gặp <code>ValueError: shapes (1000,30) and (25,1) not aligned</code>, nó nói đúng một điều: model được huấn luyện với 25 cột nhưng bạn đưa vào 30 cột (hoặc ngược lại). Gần như luôn là do one-hot encoding sinh ra số cột khác nhau giữa train và test — và đó chính là lý do phải dùng <code>Pipeline</code> thay vì encode thủ công hai lần.</p>
  <p class="wb-help">Trong code: <code>X.shape</code> in ra <code>(1000, 30)</code>. Gõ <code>.shape</code> sau mỗi bước biến đổi là thói quen tốt nhất bạn có thể tạo trong tuần đầu.</p>
</template>

<template data-mathdef="deriv" data-title="Đạo hàm & gradient — “học” thực chất là gì">
  <p>Bạn đang đứng trên sườn đồi trong sương mù dày, muốn xuống đáy thung lũng. Bạn không nhìn thấy gì, nhưng bạn <b>cảm nhận được dốc dưới chân</b>: nghiêng về đâu. Đạo hàm chính là cái cảm nhận đó, viết bằng số.</p>
  <h4>Đạo hàm một biến</h4>
  <p>$f'(x)$ trả lời: “nếu tôi nhích $x$ lên một tí xíu, $f$ đổi bao nhiêu, theo chiều nào?”</p>
  <p>$$f(x) = x^2 \;\Rightarrow\; f'(x) = 2x$$</p>
  <p>Tại $x = 3$: $f'(3) = 6$ — dương và khá lớn, nghĩa là đang dốc lên về bên phải. Muốn đi <b>xuống</b> thì bước ngược dấu đạo hàm: sang trái.</p>
  <h4>Gradient = đạo hàm khi có nhiều biến</h4>
  <p>Mô hình của bạn không có 1 tham số mà có 30 (hoặc 175 tỉ). Gradient $\nabla J$ là danh sách đạo hàm theo từng tham số:</p>
  <p>$$\nabla J(w) = \left[\frac{\partial J}{\partial w_1}, \frac{\partial J}{\partial w_2}, \dots, \frac{\partial J}{\partial w_n}\right]$$</p>
  <p>Nó là <b>một mũi tên chỉ hướng dốc lên nhanh nhất</b>. Nên muốn giảm sai số, ta đi ngược lại nó.</p>
  <p><b>Chỗ ví von hỏng:</b> quả bóng thật có quán tính và lăn liên tục; gradient descent thì đứng yên, đo dốc, nhảy một bước rời rạc, rồi đo lại. Nếu bước quá dài, nó nhảy vọt qua đáy sang sườn bên kia — chuyện quả bóng thật không làm.</p>
  <p class="wb-help">Bạn sẽ <b>không bao giờ</b> tự tính đạo hàm khi làm việc thật. PyTorch/TensorFlow tính tự động (autograd). Bạn cần hiểu <i>ý nghĩa</i> để đọc được vì sao loss không giảm.</p>
</template>

<template data-mathdef="chain" data-title="Quy tắc dây chuyền — cỗ máy đằng sau backpropagation">
  <p>Giá bánh mì phụ thuộc giá bột; giá bột phụ thuộc giá lúa mì. Lúa mì tăng 1% thì bánh mì tăng bao nhiêu? Nhân hai tỉ lệ với nhau. Đó là quy tắc dây chuyền.</p>
  <p>$$\frac{dz}{dx} = \frac{dz}{dy}\cdot\frac{dy}{dx}$$</p>
  <h4>Ví dụ có số</h4>
  <p>$y = 3x$ và $z = y^2$. Thì $\frac{dy}{dx} = 3$, $\frac{dz}{dy} = 2y$. Tại $x=2$: $y=6$, nên $\frac{dz}{dx} = 2(6)\times 3 = 36$.</p>
  <p>Kiểm tra thô: $x = 2 \Rightarrow z = 36$; $x = 2{,}01 \Rightarrow z = 36{,}36$. Chênh $0{,}36$ trên $0{,}01$ = 36. Khớp.</p>
  <h4>Vì sao nó là toàn bộ deep learning</h4>
  <p>Một mạng 10 lớp là hàm lồng nhau 10 tầng: $\text{loss}(f_{10}(f_9(\dots f_1(x))))$. Muốn biết trọng số ở lớp 1 ảnh hưởng loss ra sao, bạn nhân 10 đạo hàm dọc theo chuỗi. Đó chính là <b>backpropagation</b> — không có gì hơn thế.</p>
  <p>Hệ quả trực tiếp: nếu mỗi đạo hàm trong chuỗi nhỏ hơn 1, nhân 10 lần lại thì gần bằng 0 → lớp đầu gần như không học được. Đó là <b>vanishing gradient</b>, và là lý do người ta phát minh ra ReLU, batch-norm và residual connection.</p>
</template>

<template data-mathdef="gdupdate" data-title="Công thức cập nhật — dòng lệnh mà máy chạy hàng triệu lần">
  <p>Đây là dòng duy nhất mà “huấn luyện” thực sự làm:</p>
  <p>$$w \leftarrow w - \alpha \nabla J(w)$$</p>
  <table>
    <tr><th>Ký hiệu</th><th>Là gì</th><th>Trong code</th></tr>
    <tr><td>$w$</td><td>bộ tham số hiện tại</td><td><code>model.parameters()</code></td></tr>
    <tr><td>$\nabla J(w)$</td><td>hướng dốc lên nhanh nhất của sai số</td><td><code>loss.backward()</code> tính ra</td></tr>
    <tr><td>$\alpha$</td><td>độ dài bước (learning rate)</td><td><code>lr=0.001</code></td></tr>
    <tr><td>$\leftarrow$</td><td>gán đè giá trị mới</td><td><code>optimizer.step()</code></td></tr>
  </table>
  <h4>Chạy tay một bước</h4>
  <p>$J(w) = w^2$, bắt đầu ở $w = 4$, $\alpha = 0{,}1$. Gradient $= 2w = 8$. Bước mới: $w = 4 - 0{,}1\times 8 = 3{,}2$. Lặp lại: $3{,}2 \to 2{,}56 \to 2{,}05 \dots \to 0$. Mỗi bước rút ngắn khoảng cách 20%.</p>
  <p>Giờ thử $\alpha = 1{,}1$: $w = 4 - 1{,}1 \times 8 = -4{,}8$. Xa hơn lúc đầu. Bước sau còn xa hơn nữa. Đó là lúc bạn thấy <code>loss: nan</code>.</p>
  <div data-viz="gd"></div>
</template>

<template data-mathdef="expvar" data-title="Kỳ vọng, phương sai, độ lệch chuẩn">
  <p>Ba con số này trả lời hai câu hỏi về một cột dữ liệu: <b>“thường là bao nhiêu”</b> và <b>“dao động cỡ nào”</b>.</p>
  <h4>Kỳ vọng = trung bình dài hạn</h4>
  <p>$$\mathbb{E}[X] = \mu = \frac{1}{n}\sum_{i=1}^{n} x_i$$</p>
  <p>Số tiền 5 giao dịch: 100k, 150k, 120k, 3.000k, 130k → $\mu = 700$k. <b>Chú ý:</b> không giao dịch nào gần 700k cả. Trung bình bị một giá trị ngoại lai kéo lệch. Trung vị (median) ở đây là 130k — mô tả “thường là bao nhiêu” tốt hơn nhiều.</p>
  <h4>Phương sai & độ lệch chuẩn = mức dao động</h4>
  <p>$$\sigma^2 = \frac{1}{n}\sum (x_i - \mu)^2, \qquad \sigma = \sqrt{\sigma^2}$$</p>
  <p>Bình phương để chênh lệch âm và dương không triệt tiêu nhau; rồi lấy căn để trở về đúng đơn vị ban đầu (đồng, chứ không phải đồng bình phương). Với dãy trên, $\sigma \approx 1.150$k — to hơn cả trung bình, dấu hiệu rõ ràng của phân phối lệch.</p>
  <h4>Vì sao bạn cần nó mỗi ngày</h4>
  <ul>
    <li><b>StandardScaler</b> chính là $(x - \mu)/\sigma$ — đưa mọi cột về cùng thang “bao nhiêu độ lệch chuẩn so với trung bình”.</li>
    <li><b>Phát hiện ngoại lai</b> thô: $|x - \mu| > 3\sigma$.</li>
    <li><b>Bias–variance</b>: “variance” của mô hình là phương sai của dự đoán khi bạn đổi tập train — cùng ý tưởng, áp lên kết quả mô hình.</li>
  </ul>
  <p class="wb-help">Trong code: <code>df['amount'].describe()</code> in ra count/mean/std/min/25%/50%/75%/max — bốn dòng cuối cho bạn hình dạng phân phối nhanh hơn mọi biểu đồ.</p>
</template>

<template data-mathdef="normal" data-title="Phân phối chuẩn và z-score">
  <p>Đo chiều cao 10.000 người: rất nhiều người quanh mức trung bình, càng ra xa càng ít, và hai bên đối xứng. Hình chuông đó là phân phối chuẩn — nó xuất hiện khắp nơi vì <b>tổng của nhiều yếu tố ngẫu nhiên nhỏ độc lập luôn có xu hướng tiến về hình chuông</b> (định lý giới hạn trung tâm).</p>
  <p>$$X \sim \mathcal{N}(\mu, \sigma^2)$$</p>
  <p>Quy tắc 68–95–99,7: khoảng 68% dữ liệu nằm trong $\mu \pm \sigma$, 95% trong $\mu \pm 2\sigma$, 99,7% trong $\mu \pm 3\sigma$.</p>
  <h4>z-score: dịch mọi thứ về cùng một ngôn ngữ</h4>
  <p>$$z = \frac{x - \mu}{\sigma}$$</p>
  <p>“Giao dịch 5 triệu” không nói lên gì. “Giao dịch này cao hơn trung bình của chính khách đó 4,2 độ lệch chuẩn” thì nói rất nhiều. z-score là một trong những feature mạnh nhất trong bài toán gian lận.</p>
  <div class="wb-alert wb-alert--warning wb-alert--plain"><div class="wb-alert__body">
    <p class="wb-alert__title">Hiểu nhầm phổ biến</p>
    <p class="wb-alert__msg">“Dữ liệu phải chuẩn thì mới train được model.” Sai. Cây quyết định, random forest, XGBoost <b>không cần</b> giả định phân phối nào cả. Giả định chuẩn chỉ cần cho một số <i>kiểm định thống kê</i> (t-test) và cho khoảng tin cậy của hồi quy tuyến tính — tức là chủ yếu ở phần luận văn, không phải phần model.</p>
  </div></div>
</template>

<template data-mathdef="bayes" data-title="Định lý Bayes — vì sao 99% chính xác vẫn có thể vô dụng">
  <p>Bayes trả lời: <b>“biết kết quả xét nghiệm dương tính, xác suất thật sự có bệnh là bao nhiêu?”</b> — khác hẳn với “biết có bệnh, xác suất xét nghiệm dương là bao nhiêu”. Đảo điều kiện, hai con số khác nhau một trời một vực.</p>
  <p>$$P(A\mid B) = \frac{P(B\mid A)\,P(A)}{P(B)}$$</p>
  <h4>Ví dụ chạy hết bằng số — đúng bài toán của bạn</h4>
  <p>Hệ thống chống gian lận: bắt đúng 99% giao dịch gian lận thật, và chỉ báo nhầm 1% giao dịch sạch. Nghe tuyệt vời. Tỉ lệ gian lận thực tế: 0,2%.</p>
  <p>Chạy 100.000 giao dịch:</p>
  <ul>
    <li>Gian lận thật: 200 → bắt đúng <b>198</b></li>
    <li>Sạch: 99.800 → báo nhầm 1% = <b>998</b></li>
  </ul>
  <p>Hệ thống kêu 198 + 998 = 1.196 lần. Trong đó đúng 198.</p>
  <p>$$P(\text{gian lận}\mid \text{báo động}) = \frac{198}{1196} \approx 16{,}6\%$$</p>
  <p><b>Cứ 6 lần báo động thì 5 lần là khách hàng thật bị làm phiền.</b> Không phải mô hình tệ — mà vì bệnh nền hiếm (base rate thấp). Đây là lý do trong bài toán lệch nhãn, bạn phải nhìn <b>precision</b> chứ không phải accuracy.</p>
  <p class="wb-help">Tên gọi: $P(A)$ = tiên nghiệm (prior, niềm tin trước khi thấy bằng chứng) · $P(B\mid A)$ = likelihood · $P(A\mid B)$ = hậu nghiệm (posterior).</p>
</template>

<template data-mathdef="sigmoid" data-title="Sigmoid & log-odds — biến điểm số thành xác suất">
  <p>Hồi quy tuyến tính cho ra con số bất kỳ: $-3$, $0{,}5$, $1042$. Nhưng bạn cần một <b>xác suất</b>, tức là một số nằm giữa 0 và 1. Sigmoid là cái phễu ép mọi số về khoảng đó.</p>
  <p>$$\sigma(z) = \frac{1}{1 + e^{-z}}$$</p>
  <table>
    <tr><th>$z$</th><td>−4</td><td>−2</td><td>0</td><td>2</td><td>4</td></tr>
    <tr><th>$\sigma(z)$</th><td>0,018</td><td>0,12</td><td><b>0,50</b></td><td>0,88</td><td>0,982</td></tr>
  </table>
  <p>Hình chữ S: ở giữa nhạy (đổi $z$ một chút thì xác suất đổi nhiều), hai đầu bão hoà (đổi $z$ cũng gần như không đổi gì).</p>
  <h4>Chiều ngược lại: log-odds</h4>
  <p>Odds = tỉ lệ ăn thua. Xác suất 0,8 → odds = 0,8/0,2 = 4 (ăn 4 thua 1). Logarit của nó là log-odds, và đó chính là $z$:</p>
  <p>$$z = \log\frac{p}{1-p}$$</p>
  <p><b>Vì sao điều này quan trọng khi đọc kết quả:</b> hệ số $w_j$ trong logistic regression không nói “xác suất tăng $w_j$”. Nó nói “log-odds tăng $w_j$”. Nếu $w_j = 0{,}7$ thì $e^{0{,}7} \approx 2$ → biến đó tăng 1 đơn vị làm <b>odds nhân đôi</b>. Câu này viết được vào luận văn; câu “xác suất tăng 0,7” thì sai.</p>
</template>

<template data-mathdef="logloss" data-title="Cross-entropy (log loss) — sai số cho bài toán phân loại">
  <p>Bạn cần một cách chấm điểm sự tự tin. Nếu mô hình nói “chắc chắn 99% là giao dịch sạch” mà hoá ra là gian lận, hình phạt phải <b>nặng hơn nhiều</b> so với khi nó nói “50-50”. Bình phương sai số không làm được điều đó; log loss thì có.</p>
  <p>$$L = -\big[\,y\log(\hat{p}) + (1-y)\log(1-\hat{p})\,\big]$$</p>
  <p>Nhìn thì rối, nhưng $y$ chỉ nhận 0 hoặc 1 nên lúc nào cũng chỉ còn một vế:</p>
  <table>
    <tr><th>Thực tế</th><th>Mô hình đoán</th><th>Phạt</th></tr>
    <tr><td>gian lận (y=1)</td><td>0,99</td><td>$-\log(0{,}99) = 0{,}01$ — gần như không phạt</td></tr>
    <tr><td>gian lận (y=1)</td><td>0,50</td><td>$-\log(0{,}5) = 0{,}69$</td></tr>
    <tr><td>gian lận (y=1)</td><td>0,01</td><td>$-\log(0{,}01) = 4{,}61$ — phạt rất nặng</td></tr>
    <tr><td>gian lận (y=1)</td><td>0,001</td><td>$6{,}91$ — càng tự tin sai càng đau</td></tr>
  </table>
  <p>Hình phạt tiến tới vô cực khi mô hình tự tin tuyệt đối mà sai. Đó chính là tính chất bạn muốn: nó buộc mô hình phải <b>hiệu chỉnh</b> (calibrated), tức là khi nó nói 0,7 thì trong thực tế đúng khoảng 70% số lần.</p>
  <p class="wb-help">Trong code: <code>log_loss(y_true, y_prob)</code> · trong PyTorch <code>nn.BCEWithLogitsLoss()</code> (nhận thẳng $z$, tự làm sigmoid — ổn định số học hơn).</p>
</template>

<template data-mathdef="mse" data-title="MSE, RMSE, MAE — sai số cho bài toán dự đoán số">
  <p>Ba cách trả lời “dự đoán lệch bao nhiêu”, khác nhau ở chỗ <b>phạt sai số lớn nặng đến mức nào</b>.</p>
  <p>$$\text{MAE} = \frac{1}{n}\sum |y_i - \hat{y}_i| \qquad \text{MSE} = \frac{1}{n}\sum (y_i - \hat{y}_i)^2 \qquad \text{RMSE} = \sqrt{\text{MSE}}$$</p>
  <h4>So sánh bằng số</h4>
  <p>Hai mô hình dự đoán 4 giá trị, sai số lần lượt:</p>
  <table>
    <tr><th>Mô hình</th><th>Sai số</th><th>MAE</th><th>RMSE</th></tr>
    <tr><td>A — sai đều</td><td>2, 2, 2, 2</td><td>2,0</td><td>2,0</td></tr>
    <tr><td>B — một cú sai to</td><td>0, 0, 0, 8</td><td>2,0</td><td>4,0</td></tr>
  </table>
  <p>MAE coi hai mô hình như nhau. RMSE nói B tệ gấp đôi. <b>Chọn theo hậu quả thật:</b> nếu một cú sai lớn gây thảm hoạ (dự báo tồn kho, dự báo tải hệ thống) → dùng RMSE. Nếu sai lệch nào cũng tốn như nhau và dữ liệu có ngoại lai → dùng MAE.</p>
  <p>$R^2$ = phần phương sai giải thích được, $1 - \frac{\sum(y-\hat y)^2}{\sum(y-\bar y)^2}$. $R^2 = 0$ nghĩa là mô hình của bạn ngang với việc đoán bừa bằng trung bình. Có thể âm — và điều đó xảy ra thường xuyên hơn người ta tưởng trên tập test.</p>
</template>

<template data-mathdef="entropy" data-title="Entropy & Gini — cây quyết định chọn câu hỏi thế nào">
  <p>Chơi trò “đoán con vật, 20 câu hỏi”. Câu hỏi tốt là câu <b>chia đôi khả năng</b>. Cây quyết định làm đúng vậy: ở mỗi nút, nó thử mọi câu hỏi có thể (“số tiền &gt; 2 triệu?”, “giờ &gt; 22?”) và giữ câu làm giảm độ hỗn loạn nhiều nhất.</p>
  <h4>Đo độ hỗn loạn</h4>
  <p>$$\text{Gini} = 1 - \sum_k p_k^2 \qquad\qquad \text{Entropy} = -\sum_k p_k \log_2 p_k$$</p>
  <table>
    <tr><th>Nút chứa</th><th>Gini</th><th>Ý nghĩa</th></tr>
    <tr><td>100% sạch</td><td>0</td><td>thuần khiết, khỏi hỏi thêm</td></tr>
    <tr><td>50/50</td><td>0,5</td><td>hỗn loạn tối đa</td></tr>
    <tr><td>90/10</td><td>0,18</td><td>khá thuần</td></tr>
  </table>
  <p><b>Information gain</b> = độ hỗn loạn của nút cha − trung bình có trọng số của các nút con. Cây chọn câu hỏi có gain lớn nhất, rồi lặp lại ở từng nhánh cho tới khi hết chia được hoặc chạm giới hạn bạn đặt (<code>max_depth</code>, <code>min_samples_leaf</code>).</p>
  <p>Gini và entropy cho kết quả gần như giống nhau trong thực tế; Gini nhanh hơn nên là mặc định. <b>Đừng tốn thời gian tune cái này.</b></p>
</template>

<template data-mathdef="reg" data-title="Regularization L1/L2 — buộc mô hình khiêm tốn lại">
  <p>Mô hình overfit là mô hình có trọng số cực lớn — nó vặn mình để đi qua đúng từng điểm dữ liệu train. Cách chữa: <b>tính thêm tiền phạt cho trọng số lớn</b>, ngay trong hàm mất mát.</p>
  <p>$$J_{\text{mới}} = \underbrace{J(w)}_{\text{sai số}} + \underbrace{\lambda \sum_j w_j^2}_{\text{L2 — Ridge}} \qquad\text{hoặc}\qquad J(w) + \lambda\sum_j |w_j|$$</p>
  <p>$\lambda$ là mức nghiêm khắc. $\lambda = 0$: không phạt gì. $\lambda$ lớn: mọi trọng số bị ép về gần 0, mô hình thành ra đoán bừa.</p>
  <h4>Khác biệt thực tế giữa L1 và L2</h4>
  <table>
    <tr><th></th><th>L2 (Ridge)</th><th>L1 (Lasso)</th></tr>
    <tr><td>Làm gì với trọng số</td><td>co nhỏ đều, hiếm khi về đúng 0</td><td>đẩy hẳn nhiều trọng số <b>về đúng 0</b></td></tr>
    <tr><td>Dùng khi</td><td>mọi feature đều hơi có ích</td><td>muốn <b>tự động chọn feature</b></td></tr>
    <tr><td>sklearn</td><td><code>penalty='l2'</code> (mặc định)</td><td><code>penalty='l1', solver='liblinear'</code></td></tr>
  </table>
  <p>Trong sklearn, tham số là <code>C = 1/λ</code> — <b>ngược chiều</b>. <code>C</code> nhỏ = phạt mạnh. Đây là chỗ rất nhiều người tune sai chiều mà không biết.</p>
  <p>Ở cây/boosting, “regularization” mang hình dạng khác nhưng cùng ý: <code>max_depth</code> thấp hơn, <code>min_child_weight</code> cao hơn, <code>subsample &lt; 1</code>, và <code>reg_lambda</code> trong XGBoost.</p>
</template>

<template data-mathdef="sincos" data-title="Mã hoá chu kỳ bằng sin/cos — toán đằng sau nó">
  <p>Vấn đề: bạn muốn máy hiểu rằng 23h và 0h <b>gần nhau</b>. Nhưng nếu để nguyên số, khoảng cách $|23 - 0| = 23$ — xa nhất có thể trong thang 24 giờ.</p>
  <h4>Ý tưởng: uốn đường thẳng thành vòng tròn</h4>
  <p>Đặt 24 giờ lên một vòng tròn, mỗi giờ cách nhau $\frac{2\pi}{24} = 15°$. Toạ độ của giờ $h$ trên vòng tròn đó là:</p>
  <p>$$x = \cos\!\left(\frac{2\pi h}{24}\right), \qquad y = \sin\!\left(\frac{2\pi h}{24}\right)$$</p>
  <p>Một cột “giờ” trở thành <b>hai cột</b> — và đó là điều bắt buộc: một số duy nhất không thể mô tả vị trí trên vòng tròn (sin thôi thì 3h và 9h trùng nhau).</p>
  <h4>Kiểm chứng bằng số</h4>
  <table>
    <tr><th>Giờ</th><th>$\cos$</th><th>$\sin$</th></tr>
    <tr><td>23</td><td>0,966</td><td>−0,259</td></tr>
    <tr><td>0</td><td>1,000</td><td>0,000</td></tr>
    <tr><td>12</td><td>−1,000</td><td>0,000</td></tr>
  </table>
  <p>Khoảng cách 23h ↔ 0h: $\sqrt{(1-0{,}966)^2 + (0+0{,}259)^2} = 0{,}261$.<br>
     Khoảng cách 0h ↔ 12h: $\sqrt{(1+1)^2 + 0^2} = 2{,}0$.</p>
  <p>Đúng như trực giác: nửa đêm gần 23h, và xa giữa trưa nhất có thể.</p>
  <h4>Công thức tổng quát</h4>
  <p>Với chu kỳ độ dài $T$ (24 giờ, 7 ngày, 12 tháng, 60 phút):</p>
  <p>$$x = \cos\!\left(\frac{2\pi v}{T}\right),\quad y = \sin\!\left(\frac{2\pi v}{T}\right)$$</p>
  <div class="wb-alert wb-alert--warning wb-alert--plain"><div class="wb-alert__body">
    <p class="wb-alert__title">Khi nào KHÔNG cần làm việc này</p>
    <p class="wb-alert__msg">Cây quyết định / XGBoost <b>không cần</b> sin-cos, vì chúng chia theo ngưỡng chứ không đo khoảng cách: cây có thể học “giờ ≥ 22 HOẶC giờ ≤ 2” bằng hai lần chia. Sin/cos là bắt buộc với các mô hình <b>đo khoảng cách hoặc cộng tuyến tính</b>: hồi quy tuyến tính/logistic, KNN, SVM, k-means, mạng nơ-ron. Trong thực tế người ta vẫn thêm cho XGBoost vì nó rẻ và đôi khi giúp thêm chút — nhưng phải biết đó là tuỳ chọn, không phải luật.</p>
  </div></div>
</template>

<template data-mathdef="softmax" data-title="Softmax — biến điểm số thành phân phối xác suất">
  <p>Sigmoid dùng cho 2 lớp. Với nhiều lớp (10 loại gian lận chẳng hạn), bạn có 10 điểm số thô và cần biến chúng thành 10 xác suất cộng lại bằng 1.</p>
  <p>$$\text{softmax}(z)_i = \frac{e^{z_i}}{\sum_j e^{z_j}}$$</p>
  <h4>Chạy tay</h4>
  <p>Điểm thô $z = [2{,}0,\; 1{,}0,\; 0{,}1]$.</p>
  <ul>
    <li>$e^{2{,}0} = 7{,}39$, $e^{1{,}0} = 2{,}72$, $e^{0{,}1} = 1{,}11$ → tổng $= 11{,}22$</li>
    <li>Chia ra: $[0{,}659,\; 0{,}242,\; 0{,}099]$ — cộng lại đúng bằng 1</li>
  </ul>
  <p>Hàm mũ làm hai việc: ép mọi số thành dương, và <b>khuếch đại khoảng cách</b> — chênh 1 điểm thô thành chênh gần 3 lần xác suất. Đó là lý do có chữ “soft-max”: nó gần giống lấy max, nhưng mượt và có đạo hàm.</p>
  <p><b>Temperature</b> $\tau$: chia $z$ cho $\tau$ trước khi softmax. $\tau$ nhỏ → phân phối nhọn, gần như chọn hẳn một cái. $\tau$ lớn → phẳng, ngẫu nhiên hơn. Đây chính là nút “temperature” khi bạn gọi API của một LLM.</p>
</template>

<template data-mathdef="attention" data-title="Scaled dot-product attention — công thức đầy đủ">
  <p>Đọc trước phần trực giác trong bài <i>Attention</i>; đây là bản ký hiệu.</p>
  <p>$$\text{Attention}(Q,K,V) = \text{softmax}\!\left(\frac{QK^{\top}}{\sqrt{d_k}}\right)V$$</p>
  <table>
    <tr><th>Ký hiệu</th><th>Tên</th><th>Vai trò — theo ẩn dụ thư viện</th></tr>
    <tr><td>$Q$</td><td>Query</td><td>“tôi đang cần thông tin gì” — câu hỏi mỗi token tự đặt ra</td></tr>
    <tr><td>$K$</td><td>Key</td><td>“tôi có thông tin gì” — nhãn dán trên gáy mỗi cuốn sách</td></tr>
    <tr><td>$V$</td><td>Value</td><td>nội dung thật sự bên trong cuốn sách</td></tr>
    <tr><td>$d_k$</td><td>số chiều của key</td><td>chỉ để chuẩn hoá độ lớn</td></tr>
  </table>
  <h4>Đọc công thức từ trong ra ngoài</h4>
  <ol>
    <li>$QK^{\top}$ — mỗi query chấm điểm với mọi key. Kết quả là ma trận $n \times n$: “token $i$ nên quan tâm token $j$ bao nhiêu”.</li>
    <li>$\div\sqrt{d_k}$ — với $d_k = 64$, tích vô hướng của 64 số dễ ra giá trị rất lớn; softmax của số lớn thì bão hoà (gần như 1 và 0 hết), gradient biến mất. Chia cho $\sqrt{64} = 8$ giữ nó ở vùng lành mạnh. <b>Đây là toàn bộ lý do có chữ “scaled”.</b></li>
    <li>$\text{softmax}(\cdot)$ — biến điểm thành trọng số cộng bằng 1: “dồn 60% sự chú ý vào token 5, 20% vào token 2…”.</li>
    <li>$\times V$ — trung bình có trọng số các value. Kết quả là biểu diễn mới của token, <b>đã pha trộn ngữ cảnh</b>.</li>
  </ol>
  <h4>Multi-head: làm 8 lần song song</h4>
  <p>Một bộ $Q,K,V$ chỉ học được một kiểu quan hệ. Transformer chạy 8–16 “đầu” song song với các ma trận chiếu khác nhau, rồi nối kết quả lại. Một đầu có thể học quan hệ ngữ pháp, đầu khác học quan hệ vị trí — không ai gán nhiệm vụ, chúng tự phân công trong lúc train.</p>
  <p>$$\text{MultiHead}(Q,K,V) = \text{Concat}(\text{head}_1,\dots,\text{head}_h)\,W^O$$</p>
  <p><b>Chi phí:</b> ma trận $n \times n$ nghĩa là bộ nhớ tăng theo bình phương độ dài chuỗi. Chuỗi 1.000 token → 1 triệu ô. Đây là lý do context window đắt, và là chủ đề của hàng trăm paper (FlashAttention, Linformer, Performer…) — cũng là một mỏ đề tài luận văn.</p>
</template>

<template data-mathdef="pvalue" data-title="p-value — điều nó nói và điều nó KHÔNG nói">
  <p>Bạn đổi mô hình, AUC tăng từ 0,910 lên 0,921. Câu hỏi sống còn của luận văn: <b>thật sự tốt hơn, hay chỉ là may?</b></p>
  <h4>Hiểu nhầm phải gỡ trước</h4>
  <p>Rất nhiều người nghĩ p-value là “xác suất giả thuyết null đúng”. Nghe hợp lý, vì ta đang kiểm định cái null. Nhưng nó là:</p>
  <p><b>Xác suất quan sát được chênh lệch lớn cỡ này (hoặc lớn hơn), <i>giả sử</i> thực tế không có khác biệt gì.</b></p>
  <p>Điều kiện bị đảo ngược so với cái người ta tưởng — và hai thứ đó khác hẳn nhau, đúng như trong ví dụ Bayes.</p>
  <h4>Quy trình, bằng lời</h4>
  <ol>
    <li>Giả sử hai mô hình <b>ngang nhau</b> (giả thuyết null $H_0$).</li>
    <li>Nếu vậy thì chênh lệch đo được sẽ dao động quanh 0 theo một phân phối nào đó.</li>
    <li>Chênh lệch bạn thực sự đo được nằm ở đâu trong phân phối đó? Nếu nó nằm ở vùng đuôi cực hiếm ($p &lt; 0{,}05$), thì giả sử ban đầu khó tin → <b>bác bỏ</b> nó.</li>
  </ol>
  <p>$p = 0{,}03$ nghĩa là: “nếu hai mô hình thật sự ngang nhau, thì 3% số lần chạy sẽ cho chênh lệch ít nhất bằng cái tôi thấy”.</p>
  <div class="wb-alert wb-alert--danger wb-alert--plain"><div class="wb-alert__body">
    <p class="wb-alert__title">Ba cái bẫy làm hỏng luận văn</p>
    <p class="wb-alert__msg"><b>1. p-hacking:</b> thử 20 cấu hình, báo cáo cấu hình có $p&lt;0{,}05$. Kỳ vọng có 1 cái “có ý nghĩa” hoàn toàn do ngẫu nhiên. Nếu so nhiều lần, phải hiệu chỉnh (Bonferroni: chia mức ý nghĩa cho số phép so).<br>
    <b>2. Nhầm “có ý nghĩa thống kê” với “quan trọng”.</b> Với $n$ đủ lớn, chênh lệch 0,0001 cũng ra $p&lt;0{,}05$. Luôn báo cáo <b>độ lớn hiệu ứng</b> kèm khoảng tin cậy, không chỉ p.<br>
    <b>3. Quên rằng hai mô hình chạy trên cùng tập test</b> → phải dùng kiểm định ghép cặp (paired), không phải t-test hai mẫu độc lập.</p>
  </div></div>
  <p class="wb-help">Cho phân loại, kiểm định chuẩn khi so hai mô hình trên cùng tập test là <b>McNemar</b> (đếm số ca A đúng-B sai và A sai-B đúng). Cho AUC: bootstrap 1.000 lần, lấy phân vị 2,5% và 97,5% của <i>hiệu</i> AUC.</p>
</template>

<template data-mathdef="ci" data-title="Khoảng tin cậy & bootstrap — cách báo cáo kết quả cho tử tế">
  <p>“AUC = 0,921” là một con số trần trụi, và hội đồng sẽ hỏi ngay: chạy lại thì còn 0,921 không? Câu trả lời đúng chuẩn là một <b>khoảng</b>: “0,921 (KTC 95%: 0,908–0,933)”.</p>
  <h4>Ý nghĩa thật của “95%”</h4>
  <p>Không phải “có 95% khả năng giá trị thật nằm trong khoảng này”. Mà là: <b>nếu lặp lại toàn bộ thí nghiệm rất nhiều lần, 95% các khoảng dựng theo cách này sẽ chứa giá trị thật.</b> Sự khác biệt tinh tế nhưng hội đồng chấm luận văn có thể hỏi đúng chỗ đó.</p>
  <h4>Bootstrap — cách dựng khoảng khi bạn không biết công thức nào</h4>
  <p>Đây là kỹ thuật đáng giá nhất bạn có thể học trong một buổi chiều, vì nó dùng được cho <i>mọi</i> chỉ số:</p>
  <ol>
    <li>Từ tập test $n$ mẫu, bốc ngẫu nhiên <b>có hoàn lại</b> $n$ mẫu → một “tập test giả”.</li>
    <li>Tính chỉ số (AUC, F1, tiền tiết kiệm được) trên tập giả đó.</li>
    <li>Lặp 1.000 lần → có 1.000 giá trị.</li>
    <li>Sắp xếp, lấy phân vị 2,5% và 97,5%. Đó là khoảng tin cậy 95%.</li>
  </ol>
  <div class="ds-code">rng = np.random.default_rng(42)
y  = np.asarray(y_test)      <i># ← BẮT BUỘC: Series thì y[idx] là tra theo NHÃN, không phải vị trí</i>
p  = np.asarray(y_prob)
scores = []
<b>for</b> _ <b>in</b> range(1000):
    idx = rng.integers(0, len(y), len(y))   <i># bốc có hoàn lại</i>
    scores.append(roc_auc_score(y[idx], p[idx]))
lo, hi = np.percentile(scores, [2.5, 97.5])
print(f"AUC = {roc_auc_score(y, p):.3f} (95% CI: {lo:.3f}–{hi:.3f})")</div>
  <p class="wb-help">Hai dòng <code>np.asarray</code> ở đầu là chi tiết nhỏ nhưng bắt buộc: nếu <code>y_test</code> là một pandas Series thì <code>y_test[idx]</code> tra theo <b>nhãn hàng</b> chứ không theo vị trí — hoặc nổ, hoặc âm thầm cho kết quả sai. Đây là lỗi rất hay gặp khi làm bootstrap.</p>
  <p>Nếu khoảng tin cậy của mô hình mới <b>chồng lấn</b> khoảng của baseline, bạn chưa chứng minh được gì cả — và thà nói thẳng điều đó trong luận văn còn hơn để phản biện chỉ ra.</p>
</template>

<template data-mathdef="auc" data-title="ROC-AUC và PR-AUC — hai đường cong, hai câu chuyện">
  <p>Cả hai đều trả lời “mô hình xếp hạng tốt cỡ nào”, nhưng chúng nhìn từ hai phía và <b>với dữ liệu lệch, chúng nói hai điều rất khác nhau</b>.</p>
  <h4>ROC-AUC</h4>
  <p>Vẽ TPR (recall) theo FPR khi quét ngưỡng từ 1 về 0. Diện tích dưới đường = xác suất mô hình chấm một ca dương ngẫu nhiên cao điểm hơn một ca âm ngẫu nhiên.</p>
  <p>$$\text{TPR} = \frac{TP}{TP+FN}, \qquad \text{FPR} = \frac{FP}{FP+TN}$$</p>
  <p>0,5 = đoán bừa. 1,0 = hoàn hảo.</p>
  <h4>Vì sao nó đánh lừa khi dữ liệu lệch</h4>
  <p>Mẫu số của FPR là $FP + TN$ — với 99.800 giao dịch sạch, $TN$ khổng lồ. Thêm 998 báo nhầm chỉ làm FPR nhích lên 1%. Đường ROC nhìn vẫn đẹp, AUC vẫn 0,97, trong khi thực tế đội vận hành đang chết ngộp vì 998 cuộc gọi xác minh mỗi ngày.</p>
  <h4>PR-AUC nhìn đúng chỗ đau</h4>
  <p>Vẽ Precision theo Recall. Precision $= \frac{TP}{TP+FP}$ — mẫu số <b>không</b> chứa $TN$, nên nó không bị pha loãng bởi biển giao dịch sạch. 998 báo nhầm kéo precision xuống thấy rõ ngay.</p>
  <p>Đường cơ sở cũng khác: baseline của ROC luôn là 0,5; baseline của PR-AUC là <b>tỉ lệ dương trong dữ liệu</b> — ở đây là 0,002. Nên PR-AUC = 0,35 nghe có vẻ tệ, nhưng thực ra tốt hơn ngẫu nhiên 175 lần.</p>
  <div class="wb-alert wb-alert--info wb-alert--plain"><div class="wb-alert__body">
    <p class="wb-alert__title">Quy tắc chọn</p>
    <p class="wb-alert__msg">Lớp dương hiếm và bạn quan tâm tới nó (gian lận, bệnh hiếm, lỗi thiết bị) → <b>PR-AUC là chỉ số chính</b>, ROC-AUC báo cáo kèm cho dễ so với paper khác. Hai lớp cân bằng → ROC-AUC ổn.</p>
  </div></div>
</template>

<template data-mathdef="standardize" data-title="Standardize hay Min-Max — chọn cái nào">
  <p>Cả hai đều đưa các cột về cùng thang đo để không cột nào bắt nạt cột nào.</p>
  <p>$$\text{Standard (z-score)}:\; x' = \frac{x-\mu}{\sigma} \qquad\qquad \text{Min–Max}:\; x' = \frac{x - x_{\min}}{x_{\max} - x_{\min}}$$</p>
  <table>
    <tr><th></th><th>StandardScaler</th><th>MinMaxScaler</th><th>RobustScaler</th></tr>
    <tr><td>Kết quả</td><td>trung bình 0, độ lệch 1</td><td>nằm gọn trong [0,1]</td><td>trung vị 0, chia theo IQR</td></tr>
    <tr><td>Ngoại lai</td><td>bị ảnh hưởng vừa</td><td><b>bị phá nặng</b> — một giá trị cực đại ép hết phần còn lại về sát 0</td><td>gần như miễn nhiễm</td></tr>
    <tr><td>Dùng khi</td><td>mặc định cho hầu hết mô hình</td><td>cần khoảng cố định (ảnh, một số mạng nơ-ron)</td><td>dữ liệu tiền tệ nhiều ngoại lai</td></tr>
  </table>
  <div class="wb-alert wb-alert--danger wb-alert--plain"><div class="wb-alert__body">
    <p class="wb-alert__title">Lỗi rò rỉ kinh điển</p>
    <p class="wb-alert__msg"><code>scaler.fit(X)</code> trên <b>toàn bộ</b> dữ liệu rồi mới chia train/test. $\mu$ và $\sigma$ lúc đó đã “nhìn thấy” tập test → kết quả đẹp giả tạo. Đúng: <code>fit</code> chỉ trên train, <code>transform</code> cho cả hai — và cách chắc chắn nhất để không bao giờ sai là để scaler nằm trong <code>Pipeline</code>.</p>
  </div></div>
</template>

<template data-mathdef="logtransform" data-title="Vì sao lấy log của số tiền">
  <p>Cột số tiền giao dịch điển hình: 90% dưới 500k, vài giao dịch 500 triệu. Vẽ histogram ra một cột dựng đứng ở bên trái và một cái đuôi dài lê thê. Mô hình tuyến tính và mạng nơ-ron học rất tệ trên hình dạng này.</p>
  <p>$$x' = \log(1 + x)$$</p>
  <table>
    <tr><th>Số tiền</th><th>log1p</th><th>Chênh lệch</th></tr>
    <tr><td>0</td><td>0,00</td><td rowspan="2">10k → 100k: +2,30</td></tr>
    <tr><td>10.000</td><td>9,21</td></tr>
    <tr><td>100.000</td><td>11,51</td><td rowspan="2">1tr → 10tr: +2,30</td></tr>
    <tr><td>1.000.000</td><td>13,82</td></tr>
    <tr><td>10.000.000</td><td>16,12</td><td></td></tr>
  </table>
  <p><b>Điều quan trọng ở bảng trên:</b> mỗi lần nhân 10 thì log tăng đúng 2,30 — bất kể đang ở mức nào. Nghĩa là log biến “gấp bao nhiêu lần” thành “cộng thêm bao nhiêu”. Nếu bạn tin rằng chênh lệch giữa 10k và 100k <i>quan trọng ngang</i> chênh lệch giữa 1tr và 10tr, thì log là đúng thứ bạn cần.</p>
  <p>Dùng <code>log1p</code> (tức $\log(1+x)$) chứ không phải <code>log</code>, vì $\log(0)$ là âm vô cực và cột số tiền luôn có số 0 ở đâu đó. Muốn quay ngược lại: <code>np.expm1</code>.</p>
  <p class="wb-help">Cây và boosting <b>không cần</b> log — chúng chia theo thứ hạng nên phép biến đổi đơn điệu không đổi gì. Log cần cho: hồi quy tuyến tính, mạng nơ-ron, KNN, và cho <i>biểu đồ</i> để mắt bạn nhìn thấy được phân phối.</p>
</template>

<template data-mathdef="mcnemar" data-title="McNemar — so hai mô hình trên cùng tập test">
  <p>Bạn có baseline và mô hình mới, chạy trên <b>cùng</b> 20.000 mẫu test. Đừng dùng t-test hai mẫu độc lập — hai kết quả này không độc lập, chúng cùng gặp đúng những mẫu đó.</p>
  <p>McNemar chỉ nhìn vào những chỗ hai mô hình <b>bất đồng</b>:</p>
  <table>
    <tr><th></th><th>Mới đúng</th><th>Mới sai</th></tr>
    <tr><th>Cũ đúng</th><td>18.900</td><td>$b$ = 120</td></tr>
    <tr><th>Cũ sai</th><td>$c$ = 260</td><td>720</td></tr>
  </table>
  <p>Hai ô cùng đúng / cùng sai <b>không mang thông tin</b> về việc cái nào tốt hơn. Câu hỏi rút gọn thành: trong 380 ca bất đồng, tỉ lệ 260/120 có lệch đủ để không phải may rủi không?</p>
  <p>$$\chi^2 = \frac{(|b-c|-1)^2}{b+c} = \frac{(140-1)^2}{380} \approx 50{,}8$$</p>
  <p>Với 1 bậc tự do, $\chi^2 &gt; 3{,}84$ tương ứng $p &lt; 0{,}05$. Ở đây $p$ cực nhỏ → chênh lệch là thật.</p>
  <div class="ds-code"><b>from</b> statsmodels.stats.contingency_tables <b>import</b> mcnemar
<b>import</b> numpy <b>as</b> np
ok_old = (pred_old == y_test); ok_new = (pred_new == y_test)
tb = np.array([[ (ok_old &amp; ok_new).sum(),  (ok_old &amp; ~ok_new).sum() ],
               [ (~ok_old &amp; ok_new).sum(), (~ok_old &amp; ~ok_new).sum() ]])
print(mcnemar(tb, exact=<b>False</b>, correction=<b>True</b>))</div>
</template>

<template data-aside="cmp-explain" data-title="Giải thích mô hình: SHAP, permutation, LIME"
          data-sub="Bước 8 · ba cách trả lời “vì sao mô hình quyết định như vậy”">
  <p><b>Chọn nhanh:</b> <b>permutation importance</b> cho bức tranh tổng thể (rẻ, dễ giải thích), <b>SHAP</b> cho một ca cụ thể trong buổi bảo vệ. Bỏ qua LIME.</p>
  <table>
    <thead><tr><th>Cách</th><th>Chi phí máy</th><th>Trả lời được gì</th><th>Điểm yếu</th><th>Chọn khi</th></tr></thead>
    <tbody>
      <tr><td><b><code>feature_importances_</code></b></td><td>Miễn phí</td><td>Cột nào được cây dùng nhiều</td><td><b>Thiên vị</b> cột nhiều giá trị khác nhau; đo trên tập train nên dễ đánh lừa</td><td>Liếc nhanh trong lúc làm. Không đưa vào luận văn một mình</td></tr>
      <tr><td><b>Permutation importance</b></td><td>Vừa</td><td>Bỏ cột này đi thì điểm tụt bao nhiêu — đo trên tập test</td><td>Cho kết quả lệch khi hai cột tương quan mạnh với nhau</td><td>Bảng tầm quan trọng chính của luận văn</td></tr>
      <tr><td><b>SHAP</b></td><td>Nặng nhất</td><td>Từng dòng: cột nào đẩy điểm lên, cột nào kéo xuống, bao nhiêu</td><td>Chậm; và hình dễ bị đọc thành quan hệ nhân quả — phải nói rõ nó không phải</td><td>Giải thích một giao dịch cụ thể trước hội đồng</td></tr>
      <tr><td><b>LIME</b></td><td>Vừa</td><td>Gần giống SHAP nhưng xấp xỉ cục bộ</td><td>Kết quả không ổn định giữa các lần chạy; gần như đã bị SHAP thay thế</td><td>Chỉ khi người hướng dẫn yêu cầu đích danh</td></tr>
      <tr><td><b>Partial dependence plot</b></td><td>Vừa</td><td><i>Hình dạng</i> quan hệ giữa một cột và dự đoán — tăng dần hay có ngưỡng gãy</td><td>Sai lệch khi các cột tương quan với nhau</td><td>Muốn một hình dễ đọc cho chương kết quả</td></tr>
      <tr><td><b>Counterfactual</b></td><td>Vừa</td><td>“Cần đổi gì để giao dịch này được duyệt?”</td><td>Ít thư viện chín; dễ sinh ra kịch bản phi thực tế</td><td>Cần giải thích cho chính khách hàng bị chặn</td></tr>
    </tbody>
  </table>
  <p>Một điểm cộng dễ ăn: chạy <b>cả hai</b> permutation và SHAP rồi nói chúng có đồng ý với nhau không. Chúng không đồng ý cũng là một phát hiện đáng viết, không phải một lỗi.</p>
</template>

<template data-aside="x-tree-gradient" data-title="Cây quyết định và XGBoost có dùng gradient không?"
          data-sub="Nhánh phụ — trả lời một thắc mắc hay gặp, không cản đường">
  <p>Có, nhưng khác. Một cây đơn lẻ <b>không</b> dùng gradient descent — nó chọn ngưỡng chia bằng cách thử hết và lấy cái giảm độ hỗn loạn nhiều nhất <button class="ds-math" data-math="entropy">(entropy/Gini)</button>. Nhưng <b>Gradient Boosting</b> thì đúng như tên: mỗi cây mới được huấn luyện để dự đoán <i>phần gradient còn lại</i> của các cây trước. Nên hiểu gradient vẫn cần, kể cả khi bạn chỉ dùng LightGBM.</p>

  <div class="wb-alert wb-alert--info">
    <span class="wb-alert__icon">i</span>
    <div class="wb-alert__body"><p class="wb-alert__title">Bạn sẽ không phải tính đạo hàm bằng tay, một lần nào</p>
      <p class="wb-alert__msg">PyTorch/TensorFlow có <b>autograd</b>: bạn viết phép tính xuôi, thư viện tự dựng đồ thị và tính ngược. Bạn cần hiểu <i>ý nghĩa</i> để đọc được vì sao loss không giảm — không cần kỹ năng đạo hàm.</p></div>
  </div>
</template>

<template data-aside="x-memorize" data-title="Mô hình có phải “học thuộc” không?"
          data-sub="Nhánh phụ — làm rõ một cách nói dễ gây hiểu nhầm">
  <p>Một hiểu nhầm phổ biến cần gỡ: nhiều người nghĩ mô hình <i>ghi nhớ</i> dữ liệu huấn luyện rồi tra cứu lại. Nghe hợp lý vì "học" trong tiếng Việt gợi ý học thuộc, và vì mô hình đúng là hoạt động tốt hơn trên dữ liệu đã thấy.</p>
  <p>Nhưng cái mô hình giữ lại chỉ là <b>một bộ tham số</b> — với logistic regression là 30 con số, dữ liệu gốc bị vứt đi hoàn toàn. Nó nén hàng trăm nghìn dòng thành vài chục tham số, nên nó <b>bắt buộc</b> phải bỏ qua chi tiết và giữ lại quy luật. Khi mô hình <i>overfit</i>, đó chính là lúc nó tiến gần tới học thuộc — và đó là lỗi, không phải mục tiêu.</p>
</template>

<template data-aside="x-tree-learn" data-title="Cây và boosting thì “học” thế nào"
          data-sub="Nhánh phụ — nối lại với gia đình mô hình bạn sẽ dùng">
  <p>Cây đơn lẻ không dùng gradient — nó thử mọi ngưỡng chia và giữ cái làm giảm độ hỗn loạn nhiều nhất <button class="ds-math" data-math="entropy">(Gini/entropy)</button>.</p>
  <p>Nhưng <b>Gradient Boosting</b> đúng như tên gọi: mỗi cây mới được huấn luyện để dự đoán <b>phần gradient còn lại</b> của tổ hợp các cây trước. Nói cách khác, cây thứ $k$ học cách sửa lỗi của $k-1$ cây trước đó. Đó là ý nghĩa của chữ "boosting", và là lý do bạn vẫn cần hiểu gradient dù chỉ dùng LightGBM.</p>
</template>

<template data-node="t-sql">
  <p>Dữ liệu thật gần như không bao giờ nằm sẵn trong một file CSV. Nó nằm trong cơ sở dữ liệu của công ty, và <b>bước 2 của quy trình 10 bước là viết một câu truy vấn để lấy nó ra</b>. Bài này dạy đúng phần SQL bạn cần cho việc đó — không hơn.</p>
  <p>Tin tốt: bạn vừa học pandas xong, nên bạn <b>đã biết SQL rồi</b>, chỉ là chưa biết cú pháp. Lọc, nhóm, tổng hợp, nối bảng — cùng bốn thao tác đó, viết ở một chỗ khác.</p>

  <h2>Sáu mệnh đề là đủ</h2>
  <div class="ds-code">SELECT   card_id, COUNT(*) AS n_tx, SUM(amount) AS tong_tien
FROM     transactions
WHERE    ts &gt;= '2026-01-01' AND status = 'completed'
GROUP BY card_id
HAVING   COUNT(*) &gt; 5
ORDER BY tong_tien DESC
LIMIT    100;</div>
  <p>Đọc thành một câu tiếng Việt: <i>“Từ bảng giao dịch, lấy những giao dịch đã hoàn tất từ đầu năm, gom theo thẻ, chỉ giữ thẻ có hơn 5 giao dịch, sắp theo tổng tiền giảm dần, lấy 100 dòng đầu.”</i></p>

  <h2>Điều gây bối rối nhất: thứ tự viết ≠ thứ tự chạy</h2>
  <p>Đây là chỗ mọi người mới đều vấp, và biết nó thì một loạt lỗi khó hiểu trở nên hiển nhiên:</p>
  <table>
    <tr><th>Bạn viết theo thứ tự</th><th>Máy chạy theo thứ tự</th></tr>
    <tr><td>SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY → LIMIT</td>
        <td><b>FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT</b></td></tr>
  </table>
  <p>Hai hệ quả trực tiếp, giải thích hai lỗi bạn chắc chắn sẽ gặp:</p>
  <ul>
    <li><b>Không dùng được bí danh của <code>SELECT</code> trong <code>WHERE</code>.</b> <code>WHERE tong_tien &gt; 100</code> báo lỗi “column does not exist”, vì lúc <code>WHERE</code> chạy thì <code>SELECT</code> chưa chạy, cái tên đó chưa tồn tại. Nhưng dùng được trong <code>ORDER BY</code>, vì cái đó chạy sau.</li>
    <li><b><code>WHERE</code> lọc trước khi gom, <code>HAVING</code> lọc sau khi gom.</b> Muốn bỏ giao dịch huỷ → <code>WHERE</code>. Muốn bỏ những thẻ có tổng dưới 1 triệu → <code>HAVING</code>. Đặt nhầm chỗ thì hoặc lỗi, hoặc ra số sai một cách im lặng.</li>
  </ul>

  <h2>Từ điển pandas ↔ SQL</h2>
  <table>
    <tr><th>Việc</th><th>pandas</th><th>SQL</th></tr>
    <tr><td>Chọn cột</td><td><code>df[["a","b"]]</code></td><td><code>SELECT a, b</code></td></tr>
    <tr><td>Lọc dòng</td><td><code>df[df.amount &gt; 1000]</code></td><td><code>WHERE amount &gt; 1000</code></td></tr>
    <tr><td>Nhóm &amp; tổng hợp</td><td><code>df.groupby("card_id").amount.sum()</code></td><td><code>GROUP BY card_id</code> + <code>SUM(amount)</code></td></tr>
    <tr><td>Lọc sau khi nhóm</td><td>lọc trên kết quả <code>groupby</code></td><td><code>HAVING</code></td></tr>
    <tr><td>Nối bảng</td><td><code>df.merge(c, on="id", how="left")</code></td><td><code>LEFT JOIN c ON t.id = c.id</code></td></tr>
    <tr><td>Sắp xếp</td><td><code>df.sort_values("x", ascending=False)</code></td><td><code>ORDER BY x DESC</code></td></tr>
    <tr><td>Bỏ trùng</td><td><code>df.drop_duplicates()</code></td><td><code>SELECT DISTINCT</code></td></tr>
    <tr><td>Đếm giá trị khác nhau</td><td><code>df.city.nunique()</code></td><td><code>COUNT(DISTINCT city)</code></td></tr>
  </table>
  <p><code>LEFT JOIN</code> là mặc định đúng trong ~95% trường hợp, cùng lý do như <code>how="left"</code> ở pandas: bạn không muốn âm thầm đánh rơi giao dịch chỉ vì thiếu thông tin khách hàng. Và giống hệt pandas, <b>sau mỗi <code>JOIN</code> hãy đếm lại số dòng</b> — nếu tăng, bảng bên phải có khoá trùng và bạn vừa nhân bản dữ liệu.</p>

  <h2>Window function — phần đáng giá nhất của bài này</h2>
  <p>Đây là lý do bài này là <b>bắt buộc</b> chứ không phải “nên biết”. Ở bài <b>Biến theo thời gian</b>, bạn tính <code>hist_mean</code> và <code>n_tx_1h</code> bằng <code>.shift(1).expanding()</code> và <code>.rolling(closed="left")</code>. SQL làm đúng việc đó, và <b>làm ngay trên máy chủ dữ liệu</b> thay vì kéo 50 triệu dòng về máy bạn.</p>
  <p class="ds-codecap">point-in-time features, viết thẳng bằng SQL</p>
  <div class="ds-code">SELECT
    tx_id, card_id, ts, amount,

    <i>-- trung bình lịch sử, KHÔNG gồm dòng hiện tại</i>
    <i>--    = s.shift(1).expanding().mean()</i>
    AVG(amount) OVER (
        PARTITION BY card_id ORDER BY ts
        ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING
    ) AS hist_mean,

    <i>-- số giao dịch trong 1 giờ ngay trước đó</i>
    <i>--    = .rolling("1h", closed="left").count()</i>
    COUNT(*) OVER (
        PARTITION BY card_id ORDER BY ts
        RANGE BETWEEN INTERVAL '1 hour' PRECEDING AND CURRENT ROW
        EXCLUDE CURRENT ROW
    ) AS n_tx_1h,

    <i>-- khoảng cách tới giao dịch trước</i>
    EXTRACT(EPOCH FROM ts - LAG(ts) OVER (
        PARTITION BY card_id ORDER BY ts)) AS secs_since_last

FROM transactions;</div>
  <p>Bóc ba mảnh của <code>OVER (...)</code> — hiểu ba mảnh này là hiểu toàn bộ window function:</p>
  <table>
    <tr><th>Mảnh</th><th>Nghĩa</th><th>Tương đương pandas</th></tr>
    <tr><td><code>PARTITION BY card_id</code></td><td>tính riêng cho từng thẻ</td><td><code>.groupby("card_id")</code></td></tr>
    <tr><td><code>ORDER BY ts</code></td><td>trong mỗi thẻ, sắp theo thời gian</td><td><code>.sort_values("ts")</code></td></tr>
    <tr><td><code>ROWS/RANGE BETWEEN …</code></td><td>cửa sổ nhìn được bao xa</td><td><code>.expanding()</code> / <code>.rolling()</code></td></tr>
  </table>
  <p><code>ROWS</code> đếm theo <b>số dòng</b>; <code>RANGE</code> đếm theo <b>giá trị của cột <code>ORDER BY</code></b> — nên cửa sổ “1 giờ” phải dùng <code>RANGE</code>. <code>1 PRECEDING</code> và <code>EXCLUDE CURRENT ROW</code> chính là hai cách nói “đừng tính chính nó” — cùng vai trò với <code>.shift(1)</code> và <code>closed="left"</code>.</p>
  <p class="wb-help">Khác biệt phương ngữ: <code>EXCLUDE CURRENT ROW</code> cần PostgreSQL ≥ 11 hoặc DuckDB. MySQL 8 chưa có — thay bằng <code>… AND CURRENT ROW)</code> rồi trừ đi 1. Cú pháp khoảng thời gian cũng khác nhau (<code>INTERVAL '1 hour'</code> ở Postgres/DuckDB, <code>INTERVAL 1 HOUR</code> ở MySQL).</p>

  <div class="wb-alert wb-alert--danger">
    <span class="wb-alert__icon">!</span>
    <div class="wb-alert__body"><p class="wb-alert__title">SQL rò rỉ dữ liệu dễ hơn pandas</p>
      <p class="wb-alert__msg">Bỏ mệnh đề <code>ORDER BY</code> và khung cửa sổ đi, viết gọn thành <code>AVG(amount) OVER (PARTITION BY card_id)</code> — câu này chạy ngon lành, ngắn hơn, và tính trung bình trên <b>toàn bộ lịch sử của thẻ, gồm cả tương lai</b>. Đúng lỗi rò rỉ ở bài <b>Data leakage</b>, chỉ khác là ở đây nó nấp trong một dòng trông vô hại. <b>Quy tắc:</b> mọi window function tạo feature đều phải có <code>ORDER BY ts</code> <i>và</i> một khung cửa sổ loại trừ dòng hiện tại. Không có đủ hai thứ đó thì coi như đang rò rỉ.</p></div>
  </div>

  <h2>Chạy SQL từ Python</h2>
  <h3>Cách 1 · DuckDB — tập SQL ngay trên file CSV, không cần cài máy chủ</h3>
  <div class="ds-code">pip install duckdb</div>
  <div class="ds-code"><b>import</b> duckdb

df = duckdb.sql("""
    SELECT card_id, COUNT(*) AS n, AVG(Amount) AS avg_amt
    FROM 'data/raw/creditcard.csv'      <i>-- đọc thẳng file, không cần nạp trước</i>
    GROUP BY card_id
    ORDER BY n DESC
    LIMIT 10
""").df()                               <i># .df() → trả về DataFrame pandas</i></div>
  <p><b>Đây là cách học SQL nhanh nhất khi bạn chỉ có 2 tuần:</b> không cài Postgres, không tạo user, không import dữ liệu. Trỏ thẳng vào file CSV, gõ truy vấn, nhận DataFrame. DuckDB hỗ trợ đầy đủ window function nên bạn luyện được cả phần quan trọng nhất ở trên.</p>

  <h3>Cách 2 · Kết nối cơ sở dữ liệu thật</h3>
  <div class="ds-code"><b>import</b> os, pandas <b>as</b> pd
<b>from</b> sqlalchemy <b>import</b> create_engine

eng = create_engine(os.environ["DB_URL"])   <i># ← KHÔNG viết mật khẩu vào code</i>
df  = pd.read_sql("SELECT ... FROM transactions WHERE ts &gt;= %(t0)s",
                  eng, params={"t0": "2026-01-01"})</div>
  <p>Hai điều bắt buộc ở đây. Thứ nhất, <b>chuỗi kết nối lấy từ biến môi trường</b>, không gõ vào file rồi push lên GitHub — đây là cách rò rỉ mật khẩu phổ biến nhất. Thứ hai, <b>truyền tham số qua <code>params=</code></b> chứ đừng nối chuỗi; nối chuỗi vừa mở đường cho SQL injection vừa hỏng khi giá trị có dấu nháy.</p>

  <h2>Nguyên tắc chia việc: nặng thì để SQL làm</h2>
  <table>
    <tr><th>Việc</th><th>Làm ở đâu</th><th>Vì sao</th></tr>
    <tr><td>Lọc theo thời gian, theo trạng thái</td><td><b>SQL</b></td><td>Đừng kéo 50 triệu dòng về để rồi bỏ 49 triệu</td></tr>
    <tr><td>Nối bảng, gom nhóm, đếm theo cửa sổ</td><td><b>SQL</b></td><td>Máy chủ có chỉ mục; máy bạn có 16GB RAM</td></tr>
    <tr><td>Thử nghiệm feature, vẽ biểu đồ, train</td><td><b>pandas</b></td><td>Vòng lặp thử–sai nhanh hơn nhiều</td></tr>
  </table>
  <p>Ranh giới thực dụng: dùng SQL để <b>rút bảng xuống cỡ vừa RAM</b>, rồi làm mọi thứ còn lại bằng pandas. Và <b>lưu file <code>.sql</code> đó vào repo</b> (thư mục <code>sql/</code>) — nó là một phần của tính tái lập y như code Python; người phản biện cần biết chính xác dữ liệu của bạn được rút ra bằng câu nào.</p>

  <h2>Bài tập — 30 phút, làm bằng DuckDB trên chính file CSV của bạn</h2>
  <ol>
    <li>Đếm số dòng và tỉ lệ nhãn dương bằng SQL. Đối chiếu với con số pandas đã cho ở bài trước — phải khớp.</li>
    <li>Tính tỉ lệ gian lận theo từng giờ bằng <code>GROUP BY</code>. Cũng phải khớp với kết quả pandas.</li>
    <li>Viết một window function tính <code>hist_mean</code>, rồi kiểm tra: giao dịch <b>đầu tiên</b> của mỗi thẻ phải ra <code>NULL</code>. Nếu không phải <code>NULL</code>, bạn đang rò rỉ.</li>
  </ol>
  <p>Bước 3 là bước quan trọng nhất — nó là bản SQL của đúng phép kiểm tra ở bài <b>Biến theo thời gian</b>, và cùng một logic sẽ cứu bạn ở cả hai nơi.</p>

<template data-node="t-numpy">
  <p>numpy là lớp nền bên dưới pandas. Bạn sẽ dùng nó ít hơn pandas, nhưng khi cần thì không thay thế được: mọi mô hình đều nhận đầu vào là mảng numpy, và mọi phép toán trên vector đều chạy qua đây.</p>

  <h2>Khác biệt cốt lõi: mảng numpy vs list Python</h2>
  <div class="ds-code"><b>import</b> numpy <b>as</b> np

xs = [1, 2, 3]
xs * 2            <i># → [1, 2, 3, 1, 2, 3]   ← nối danh sách!</i>

a = np.array([1, 2, 3])
a * 2             <i># → array([2, 4, 6])      ← nhân từng phần tử</i>
a + a             <i># → array([2, 4, 6])</i>
a @ a             <i># → 14  (tích vô hướng)</i></div>
  <p>Đây là toàn bộ ý tưởng: numpy làm <b>phép toán theo phần tử trên cả mảng cùng lúc</b>, chạy bằng mã C bên dưới. Một vòng lặp Python xử lý 1 triệu số mất khoảng 0,3 giây; numpy mất khoảng 0,003 giây.</p>
  <p><button class="ds-math" data-math="dot">Vector, tích vô hướng và khoảng cách</button> — nếu bạn chưa chắc “tích vô hướng” là gì thì mở cái này trước.</p>

  <h2>Những thứ bạn thật sự dùng</h2>
  <div class="ds-code">np.log1p(x)          <i># log(1+x) — cho cột số tiền lệch</i>
np.expm1(x)          <i># đảo ngược log1p</i>
np.where(cond, a, b) <i># như IF trong Excel, chạy trên cả mảng</i>
np.clip(x, 0, 1e7)   <i># cắt ngoại lai về khoảng cho phép</i>
np.percentile(x, [1, 99])
np.sin(x), np.cos(x), np.pi        <i># ← dùng cho mã hoá chu kỳ</i>
np.random.default_rng(42)          <i># bộ sinh ngẫu nhiên có seed</i>
arr.reshape(-1, 1)   <i># biến (n,) thành (n,1) — sklearn hay đòi</i>
arr.shape, arr.dtype</div>

  <h2>Hai khái niệm gây lỗi nhiều nhất</h2>
  <h3>1 · Shape</h3>
  <p><code>(1000,)</code> và <code>(1000, 1)</code> <b>không giống nhau</b>: cái đầu là một dãy phẳng, cái sau là một cột. sklearn thường đòi cái sau và báo <code>Expected 2D array, got 1D array instead</code>. Sửa bằng <code>.reshape(-1, 1)</code> — dấu <code>-1</code> nghĩa là “tự tính chiều này ra”.</p>
  <p><button class="ds-math" data-math="matmul">Ma trận và luật khớp shape</button></p>
  <h3>2 · Broadcasting</h3>
  <div class="ds-code">X = np.random.rand(1000, 5)   <i># 1000 dòng, 5 cột</i>
mu = X.mean(axis=0)            <i># shape (5,) — trung bình mỗi cột</i>
X_centered = X - mu            <i># numpy tự "nhân bản" mu cho 1000 dòng</i></div>
  <p><code>axis=0</code> nghĩa là “gộp dọc theo hàng” → ra một giá trị cho mỗi cột. <code>axis=1</code> thì ngược lại. Cách nhớ: <b>axis là chiều bị bóp mất</b>.</p>
  <p>Broadcasting rất tiện nhưng cũng lặng lẽ: nếu shape của bạn sai theo một cách "hợp lệ", numpy sẽ tạo ra một mảng khổng lồ thay vì báo lỗi. Khi kết quả ra shape lạ, in <code>.shape</code> ở từng bước.</p>

  <h2>Seed — điều kiện bắt buộc của luận văn</h2>
  <div class="ds-code">rng = np.random.default_rng(42)   <i># cách hiện đại, khuyên dùng</i>
rng.integers(0, 100, size=5)
<i># mọi hàm sklearn có tham số random_state=42</i></div>
  <p>Không cố định seed thì mỗi lần chạy ra một kết quả khác, và bạn không thể trả lời câu hỏi “chênh lệch này là do mô hình tốt hơn hay do may”. Đặt seed ở <b>mọi</b> chỗ có ngẫu nhiên: chia tập, khởi tạo mô hình, subsample.</p>
</template>

<template data-node="t-sklearn">
  <p>scikit-learn có hàng trăm lớp, nhưng tất cả đều tuân theo <b>bốn khái niệm</b>. Nắm được bốn cái này thì bạn dùng được cả thư viện mà không cần đọc tài liệu từng lớp — kể cả những lớp bạn chưa từng thấy.</p>

  <h2>1 · Estimator — mọi thứ đều là một đối tượng có <code>fit</code></h2>
  <div class="ds-code"><b>from</b> sklearn.linear_model <b>import</b> LogisticRegression
model = LogisticRegression(C=1.0, max_iter=1000)   <i># cấu hình ở đây (siêu tham số)</i>
model.fit(X_train, y_train)                        <i># học từ dữ liệu</i>
model.predict(X_test)                              <i># → nhãn 0/1</i>
model.predict_proba(X_test)[:, 1]                  <i># → xác suất lớp 1  ← thường bạn cần cái này</i></div>
  <p>Quy ước tên: thuộc tính <b>học được từ dữ liệu</b> luôn kết thúc bằng dấu gạch dưới — <code>model.coef_</code>, <code>model.classes_</code>, <code>scaler.mean_</code>. Thấy dấu <code>_</code> ở cuối là biết nó chỉ tồn tại sau khi <code>fit</code>.</p>
  <div class="wb-alert wb-alert--warning wb-alert--plain"><div class="wb-alert__body">
    <p class="wb-alert__title">Với bài toán lệch nhãn, đừng dùng <code>predict</code></p>
    <p class="wb-alert__msg"><code>predict</code> mặc định cắt ở ngưỡng 0,5. Với 0,17% gian lận, gần như không giao dịch nào vượt 0,5 → mô hình trả về toàn số 0 và bạn tưởng nó hỏng. Hãy lấy <code>predict_proba</code> rồi <b>tự chọn ngưỡng</b> — xem bài <b>Đo lường &amp; ngưỡng</b>.</p>
  </div></div>

  <h2>2 · Transformer — <code>fit</code> ở train, <code>transform</code> ở mọi nơi</h2>
  <div class="ds-code"><b>from</b> sklearn.preprocessing <b>import</b> StandardScaler
scaler = StandardScaler()
scaler.fit(X_train)                  <i># HỌC μ và σ — chỉ từ train</i>
Xtr = scaler.transform(X_train)      <i># ÁP DỤNG</i>
Xte = scaler.transform(X_test)       <i># ÁP DỤNG cùng μ, σ đó — KHÔNG fit lại</i>

Xtr = scaler.fit_transform(X_train)  <i># viết tắt của hai dòng đầu</i></div>
  <p>Đây là chỗ sinh ra lỗi rò rỉ dữ liệu phổ biến nhất trong ngành. Nếu bạn <code>fit</code> trên toàn bộ dữ liệu, thì $\mu$ và $\sigma$ đã chứa thông tin của tập test → kết quả đẹp giả tạo. <button class="ds-math" data-math="standardize">Chi tiết Standardize vs Min-Max, và cái bẫy này</button></p>

  <h2>3 · Pipeline — nối các bước thành một đối tượng duy nhất</h2>
  <div class="ds-code"><b>from</b> sklearn.pipeline <b>import</b> Pipeline

pipe = Pipeline([
    ("scale", StandardScaler()),
    ("model", LogisticRegression()),
])
pipe.fit(X_train, y_train)         <i># fit_transform cho scale, rồi fit cho model</i>
pipe.predict_proba(X_test)         <i># transform cho scale, rồi predict cho model</i></div>
  <p>Ba lý do khiến đây là khái niệm quan trọng nhất trong sklearn:</p>
  <ul>
    <li><b>Không thể rò rỉ.</b> Trong cross-validation, pipeline tự động <code>fit</code> lại scaler <i>bên trong từng fold</i>. Làm tay thì gần như chắc chắn bạn sẽ sai chỗ này.</li>
    <li><b>Lúc chạy thật không lệch.</b> Bạn lưu <i>một</i> file chứa cả cách tạo feature lẫn mô hình. API chỉ cần <code>pipe.predict_proba(df_1_dòng)</code> — không có cơ hội để code production tính feature khác với lúc train.</li>
    <li><b>Tune được cả hai tầng cùng lúc:</b> <code>{"model__C": [0.1, 1, 10], "scale__with_mean": [True, False]}</code> — hai dấu gạch dưới nối tên bước với tên tham số.</li>
  </ul>

  <h2>4 · ColumnTransformer — mỗi loại cột một cách xử lý</h2>
  <p>Dữ liệu thật không đồng nhất: cột số cần scale, cột chữ cần one-hot, cột giờ cần sin/cos. <code>ColumnTransformer</code> là cái bảng điều phối đó.</p>
  <div class="ds-code"><b>from</b> sklearn.compose <b>import</b> ColumnTransformer
<b>from</b> sklearn.preprocessing <b>import</b> OneHotEncoder

prep = ColumnTransformer([
    ("num", StandardScaler(),                        ["amount", "n_tx_1h"]),
    ("cat", OneHotEncoder(handle_unknown="ignore"),  ["merchant_type", "city"]),
], remainder="drop")

pipe = Pipeline([("prep", prep), ("model", LGBMClassifier())])</div>
  <p><code>handle_unknown="ignore"</code> là thứ cứu bạn khi chạy thật: hôm nay xuất hiện một thành phố chưa từng có trong tập train, không có tham số này thì API sẽ nổ.</p>
  <p>Bài <b>★ Pipeline + ColumnTransformer</b> ở chặng 4 sẽ ráp đầy đủ, bao gồm cả cách nhét biến đổi sin/cos của bạn vào đây.</p>

  <p class="ds-more"><button class="ds-aside" data-aside="x-sklearn-imports">Bản đồ import: cần gì lấy từ đâu</button><button class="ds-aside" data-aside="cmp-gbdt">So sánh thư viện boosting</button></p>

<template data-node="m-vector">
  <p>Bạn không cần học lại đại số tuyến tính. Bạn cần đúng ba ý, vì chúng quyết định bạn <b>đọc được lỗi</b> và <b>hiểu vì sao phải scale dữ liệu</b>.</p>

  <h2>Ý 1 — Một dòng dữ liệu là một điểm trong không gian</h2>
  <p>Giao dịch của bạn có 3 cột: số tiền, giờ, số lần quẹt trong 1 giờ. Vậy nó là một điểm trong không gian 3 chiều, toạ độ <code>(250000, 23, 4)</code>. Với 30 cột thì là một điểm trong không gian 30 chiều — không hình dung nổi, nhưng <b>toán thì y hệt</b>.</p>
  <p>Toàn bộ machine learning là hình học trên đám điểm này: mô hình tuyến tính vẽ một mặt phẳng chia đôi chúng, KNN tìm điểm gần nhất, k-means gom cụm, mạng nơ-ron bẻ cong không gian cho tới khi hai lớp tách rời.</p>
  <p><button class="ds-math" data-math="dot">Vector, tích vô hướng, khoảng cách — giải chi tiết</button></p>

  <h2>Ý 2 — “Gần nhau” phụ thuộc vào đơn vị đo, nên phải scale</h2>
  <p>Hai giao dịch: A = (1.000.000đ, 10h) và B = (1.000.100đ, 22h). Khoảng cách Euclid giữa chúng:</p>
  <p>$$\sqrt{100^2 + 12^2} = \sqrt{10000 + 144} \approx 100{,}7$$</p>
  <p>Con số bị chi phối hoàn toàn bởi 100 đồng chênh lệch, trong khi 12 tiếng chênh lệch gần như vô hình. Máy không biết 100 đồng là không đáng kể còn 12 tiếng là rất đáng kể — nó chỉ thấy hai con số.</p>
  <p>Sau khi chuẩn hoá (mỗi cột trừ trung bình, chia độ lệch chuẩn), cả hai cột nói cùng một ngôn ngữ: “cách trung bình bao nhiêu độ lệch chuẩn”. Đó là lý do <code>StandardScaler</code> tồn tại, và tại sao nó phải nằm trước mọi mô hình đo khoảng cách.</p>
  <p><button class="ds-math" data-math="standardize">Standardize vs Min-Max vs Robust</button></p>

  <h2>Ý 3 — Ma trận là cả bảng, và mọi lỗi shape đều nói cùng một điều</h2>
  <p>Bảng 1.000 giao dịch × 30 cột là ma trận $X$ kích thước $1000\times30$. Mô hình tuyến tính có 30 trọng số. Nhân $Xw$ ra 1.000 điểm số cùng lúc.</p>
  <p><button class="ds-math" data-math="matmul">Nhân ma trận và luật khớp shape</button></p>
  <p>Thói quen nên tạo ngay tuần này: sau mỗi bước biến đổi dữ liệu, in <code>X.shape</code>. 80% lỗi trong tuần đầu là lỗi shape, và <code>.shape</code> chỉ thẳng vào chỗ sai.</p>

  <p>Đây là bài toán quan trọng nhất trong cả chặng 2, vì nó trả lời câu hỏi mà mọi người đều gật đầu mà ít ai nói lại được: <b>“máy học” cụ thể là làm gì?</b></p>

  <h2>Câu trả lời trong một câu</h2>
  <p>Máy có một bộ số (tham số), một cách chấm điểm mức độ sai (hàm mất mát), và nó <b>lặp đi lặp lại việc nhích bộ số theo hướng làm điểm sai giảm xuống</b>. Hết. Không có gì huyền bí hơn.</p>

  <h2>Ba mảnh ghép</h2>
  <h3>1 · Đạo hàm = độ dốc tại một điểm</h3>
  <p>Bạn đứng trên sườn đồi trong sương mù. Không nhìn thấy đáy, nhưng cảm nhận được chân mình đang nghiêng về đâu và dốc cỡ nào. Đạo hàm là con số mô tả đúng cảm giác đó.</p>
  <p><button class="ds-math" data-math="deriv">Đạo hàm &amp; gradient — chi tiết, có ví dụ số</button></p>

  <h3>2 · Gradient = độ dốc khi có nhiều tham số</h3>
  <p>Mô hình không có 1 nút vặn mà có 30 (hoặc 175 tỉ). Gradient là danh sách “vặn nút này thì sai số đổi bao nhiêu” cho từng nút. Gộp lại, nó là một mũi tên chỉ hướng <b>dốc lên nhanh nhất</b>.</p>

  <h3>3 · Bước đi = trừ đi gradient nhân với độ dài bước</h3>
  <p>$$w \leftarrow w - \alpha\,\nabla J(w)$$</p>

<template data-node="m-prob">
  <p>Xác suất trong data science phục vụ hai việc rất cụ thể: <b>mô tả một cột dữ liệu</b> (nó thường bao nhiêu, dao động cỡ nào) và <b>hiểu đầu ra của mô hình</b> (0,73 nghĩa là gì).</p>

  <h2>Ba con số mô tả một cột</h2>
  <p><button class="ds-math" data-math="expvar">Kỳ vọng, phương sai, độ lệch chuẩn — có ví dụ số</button></p>
  <p>Điều quan trọng nhất trong popup đó, nhắc lại ở đây vì bạn sẽ gặp mỗi ngày: với dữ liệu tiền tệ, <b>trung bình gần như luôn gây hiểu nhầm</b>. Một giao dịch 3 tỉ kéo trung bình lên trời trong khi 99% giao dịch quanh 200k. Luôn nhìn cả <code>median</code> và các phân vị — <code>df.describe()</code> đã in sẵn cho bạn.</p>

  <h2>Hình chuông và z-score</h2>
  <p><button class="ds-math" data-math="normal">Phân phối chuẩn, quy tắc 68–95–99,7, z-score</button></p>
  <p>Ứng dụng trực tiếp cho bài toán gian lận: thay vì hỏi “giao dịch này có to không”, hỏi <b>“giao dịch này to bất thường so với chính khách hàng đó không”</b>. Cột đó là z-score cá nhân hoá:</p>
  <div class="ds-code">stats = df.groupby("card_id")["amount"].agg(["mean", "std"])
df = df.merge(stats, on="card_id", how="left")
df["z_amount"] = (df["amount"] - df["mean"]) / (df["std"] + 1e-6)   <i># +ε tránh chia 0</i></div>
  <p>(Bản này còn rò rỉ vì <code>mean</code>/<code>std</code> tính trên cả tương lai — cách sửa nằm ở bài <b>Biến theo thời gian</b>. Nhưng ý tưởng thì đúng.)</p>

  <h2>Phân phối lệch — hình dạng thật của dữ liệu tiền</h2>
  <p>Số tiền giao dịch, thu nhập, lượt xem video, dân số thành phố — tất cả đều <b>lệch phải</b>: đa số nhỏ, vài giá trị khổng lồ. Đó không phải lỗi dữ liệu, đó là bản chất.</p>
  <p><button class="ds-math" data-math="logtransform">Vì sao lấy log của số tiền — bảng đối chiếu</button></p>

  <h2>Đọc đầu ra của mô hình cho đúng</h2>
  <p>Mô hình trả về 0,73. Nghĩa là gì?</p>
  <ul>
    <li><b>Nếu mô hình được hiệu chỉnh tốt (calibrated):</b> trong tất cả các giao dịch mà mô hình chấm 0,73, khoảng 73% thật sự là gian lận. Đây là cách hiểu đúng.</li>
    <li><b>Thực tế thường không như vậy.</b> Cây/boosting hay bị lệch hiệu chỉnh, đặc biệt sau khi bạn cân bằng lại dữ liệu bằng SMOTE hoặc <code>class_weight</code>.</li>
    <li>Kiểm tra bằng <b>calibration curve</b>; sửa bằng <code>CalibratedClassifierCV</code>. Nếu luận văn của bạn dùng con số xác suất để quy ra tiền, phần này <b>phải</b> có.</li>
  </ul>
  <div class="ds-code"><b>from</b> sklearn.calibration <b>import</b> calibration_curve
prob_true, prob_pred = calibration_curve(y_test, y_prob, n_bins=10)
<i># vẽ prob_pred (trục x) vs prob_true (trục y); đường lý tưởng là đường chéo 45°</i></div>

  <h2>Điều thường bị hiểu ngược</h2>
  <div class="wb-alert wb-alert--warning wb-alert--plain"><div class="wb-alert__body">
    <p class="wb-alert__title">“Dữ liệu của tôi không theo phân phối chuẩn, có train được không?”</p>
    <p class="wb-alert__msg">Được, hoàn toàn bình thường. Cây, rừng, boosting <b>không giả định phân phối nào cả</b>. Giả định chuẩn chỉ cần cho một số kiểm định thống kê và cho khoảng tin cậy của hồi quy tuyến tính — tức là ở phần <i>luận văn</i>, không phải phần <i>mô hình</i>. Đây là chỗ nhiều người mới tự làm khó mình.</p>
  </div></div>
</template>

<template data-node="m-bayes">
  <p>Bayes đáng một bài riêng không phải vì bạn sẽ code nó, mà vì nó là <b>công cụ tư duy duy nhất giải thích được vì sao một mô hình “chính xác 99%” vẫn có thể vô dụng</b> — và đó chính là bài toán gian lận của bạn.</p>

  <h2>Ví dụ sẽ đi thẳng vào luận văn của bạn</h2>
  <p><button class="ds-math" data-math="bayes">Bayes — chạy hết bằng số, 100.000 giao dịch</button></p>
  <p>Kết quả trong popup, tóm lại: một hệ thống bắt đúng 99% gian lận và chỉ báo nhầm 1% giao dịch sạch, khi chạy trên dữ liệu có 0,2% gian lận, sẽ cho ra <b>precision chỉ 16,6%</b>. Cứ 6 lần báo động thì 5 lần làm phiền khách hàng thật.</p>
  <p>Đây không phải mô hình tệ. Đây là hệ quả toán học của việc <b>lớp dương quá hiếm</b>. Không kỹ thuật nào xoá được nó — bạn chỉ có thể đánh đổi.</p>

  <h2>Ba cách nói lại cùng một ý, chọn cách hợp với người nghe</h2>
  <table>
    <tr><th>Người nghe</th><th>Cách nói</th></tr>
    <tr><td>Hội đồng luận văn</td><td>“Với base rate 0,2%, precision bị chặn trên bởi tỉ lệ dương thật; do đó chúng tôi báo cáo PR-AUC thay vì ROC-AUC.”</td></tr>
    <tr><td>Trưởng phòng vận hành</td><td>“Muốn bắt thêm 10 vụ gian lận, đội anh phải gọi thêm khoảng 300 cuộc xác minh. Anh chọn con số nào?”</td></tr>
    <tr><td>Chính bạn, lúc debug</td><td>“Precision thấp không có nghĩa model hỏng. Kiểm tra base rate trước khi đi sửa model.”</td></tr>

  <h2>Naive Bayes — mô hình, chứ không phải định lý</h2>
  <p>Có một mô hình tên là Naive Bayes dùng định lý này trực tiếp. “Naive” (ngây thơ) vì nó giả định <b>các feature độc lập với nhau</b> — giả định gần như luôn sai trong thực tế (số tiền và loại cửa hàng rõ ràng liên quan nhau).</p>
  <p>Vậy sao vẫn dùng? Vì nó cực nhanh, cần rất ít dữ liệu, và bất ngờ hiệu quả cho phân loại văn bản (lọc spam). Với dữ liệu bảng của bạn, nó chỉ đáng dùng làm <b>baseline rẻ tiền</b> — có một baseline "ngây thơ" trong bảng so sánh của luận văn là điểm cộng.</p>
  <div class="ds-code"><b>from</b> sklearn.naive_bayes <b>import</b> GaussianNB
nb = GaussianNB().fit(X_train, y_train)</div>

  <h2>Tư duy Bayes ngoài công thức</h2>
  <p>Ý cốt lõi đáng mang theo: <b>bằng chứng mới không thay thế niềm tin cũ, nó cập nhật niềm tin cũ</b>. Nếu bạn tin trước rằng gian lận rất hiếm, thì một tín hiệu yếu không đủ để lật niềm tin đó; cần tín hiệu rất mạnh. Đó chính là lý do trong hệ thống thật, người ta không chặn ngay mà <b>xếp hàng theo điểm rủi ro</b> rồi để người xác minh những ca cao nhất.</p>
</template>

<template data-node="m-infer">
  <p>Đây là phần toán mà <b>hội đồng luận văn thực sự soi</b>. Bạn có thể dùng XGBoost như hộp đen và vẫn qua, nhưng nếu bạn nói “mô hình của tôi tốt hơn” mà không chứng minh được nó không phải may rủi, bạn sẽ bị hỏi tới cùng.</p>

  <h2>Câu hỏi trung tâm</h2>
  <p>Baseline cho AUC 0,910. Mô hình của bạn cho 0,921. Chênh 0,011. <b>Thật hay may?</b></p>
  <p>Nếu bạn chạy lại với seed khác và baseline nhảy lên 0,919 còn của bạn xuống 0,915, thì "cải tiến" ban đầu chỉ là nhiễu. Cách duy nhất để biết là đo mức nhiễu đó.</p>

  <h2>Ba công cụ, theo thứ tự nên dùng</h2>
  <h3>1 · Khoảng tin cậy bằng bootstrap — dùng mặc định</h3>
  <p><button class="ds-math" data-math="ci">Bootstrap — 4 bước + code chạy được</button></p>
  <p>Đây là công cụ mạnh nhất vì nó áp dụng cho <b>mọi</b> chỉ số, kể cả “số tiền tiết kiệm được” — thứ không có công thức phương sai nào sẵn. Báo cáo dạng: <b>AUC = 0,921 (KTC 95%: 0,908–0,933)</b>.</p>
  <p>Quy tắc đọc: nếu khoảng của bạn <b>chồng lấn</b> khoảng của baseline, bạn chưa chứng minh được gì. Nói thẳng điều đó trong luận văn tốt hơn nhiều so với để phản biện chỉ ra.</p>

  <h3>2 · McNemar — khi so hai mô hình trên cùng tập test</h3>

  <div class="ds-code"><b>from</b> sklearn.impute <b>import</b> SimpleImputer

  <p><code>add_indicator=<b>True</b></code> là cách gọn nhất để vừa điền vừa giữ lại thông tin "chỗ này vốn trống". Nếu muốn tách riêng, sklearn còn lớp <code>MissingIndicator</code>. (Bạn có thể gặp <code>AddMissingIndicator</code> trong bài viết trên mạng — đó là của thư viện <code>feature_engine</code>, không phải sklearn, nên đừng ngạc nhiên khi import không được.)</p>
  <p><b>Khi nào xoá thay vì điền:</b> cột thiếu &gt; 60% và không mang thông tin → bỏ cột. Dòng thiếu <i>nhãn</i> → bỏ dòng (không bao giờ đoán nhãn).</p>

  <h2>2 · Ngoại lai</h2>
  <p>Câu hỏi đầu tiên không phải "xoá thế nào" mà <b>"đây là lỗi nhập liệu hay là sự thật hiếm gặp?"</b></p>

    <li>Số tiền âm, tuổi 200, ngày 30/02 → lỗi. Sửa hoặc bỏ.</li>

  <div class="ds-code"><i># cắt ngưỡng (winsorize) — giữ dòng, giới hạn giá trị</i>

df["amount_log"] = np.log1p(df["amount"])

<i># hoặc dùng scaler miễn nhiễm ngoại lai</i>
<b>from</b> sklearn.preprocessing <b>import</b> RobustScaler</div>
  <p><b>Quan trọng:</b> ngưỡng <code>lo</code>/<code>hi</code> phải tính từ <b>tập train</b>, rồi áp cho test. Tính trên toàn bộ dữ liệu là rò rỉ.</p>

  <h2>3 · Trùng lặp và kiểu dữ liệu</h2>

df = df.drop_duplicates(subset=["tx_id"])

<i># kiểu dữ liệu — làm sớm, tiết kiệm hàng giờ debug</i>

df["amount"]  = pd.to_numeric(df["amount"], errors="coerce")

  <p>Chuẩn hoá chuỗi (<code>strip</code>, <code>lower</code>) nghe nhỏ nhặt nhưng thường làm số giá trị khác nhau của một cột giảm 30% — nghĩa là one-hot nhẹ đi 30% và mô hình học tốt hơn.</p>

  <h2>Ranh giới giữa "làm sạch" và "tạo feature"</h2>

<template data-node="d-leak">
  <p>Data leakage là khi mô hình được nhìn thấy thông tin mà lúc dự đoán thật <b>nó sẽ không có</b>. Kết quả: điểm số đẹp rực rỡ trên giấy, vô dụng khi chạy thật.</p>
  <p>Đây là <b>lỗi nghiêm trọng nhất trong toàn bộ trang này</b>. Một mô hình tệ vẫn là một luận văn hợp lệ. Một mô hình bị rò rỉ là một luận văn sai — và phản biện có kinh nghiệm phát hiện nó trong 5 phút.</p>

  <div class="wb-alert wb-alert--danger">
    <span class="wb-alert__icon">!</span>
    <div class="wb-alert__body"><p class="wb-alert__title">Dấu hiệu nhận biết duy nhất bạn cần nhớ</p>
      <p class="wb-alert__msg"><b>Kết quả đẹp hơn mức hợp lý.</b> AUC 0,999 trên bài toán gian lận, accuracy 100%, mô hình đơn giản bỗng thắng mọi thứ. Phản xạ đúng không phải là vui mừng mà là: <i>"tôi vừa rò rỉ ở đâu?"</i></p></div>
  </div>

  <h2>Sáu kiểu rò rỉ, từ phổ biến nhất</h2>

  <h3>1 · Rò rỉ mục tiêu — cột chứa đáp án</h3>
  <p>Cột <code>trang_thai = "đã hoàn tiền"</code> chỉ được điền sau khi xác nhận gian lận. Hay cột <code>so_lan_khieu_nai</code>. Chúng tương quan gần như hoàn hảo với nhãn vì chúng <b>là hệ quả của nhãn</b>, không phải nguyên nhân.</p>
  <p><b>Cách bắt:</b> chạy <code>df.corr()["label"].abs().sort_values(ascending=False)</code>. Mọi cột &gt; 0,8 đều phải bị thẩm vấn: <i>"cột này được ghi vào lúc nào so với thời điểm dự đoán?"</i></p>

  <h3>2 · Rò rỉ thời gian — dùng tương lai đoán quá khứ</h3>
  <p>Chia ngẫu nhiên một tập dữ liệu có thời gian: giao dịch tháng 12 nằm ở train, giao dịch tháng 6 nằm ở test. Mô hình đã "biết" xu hướng cuối năm khi đoán giữa năm.</p>
  <p><b>Cách chữa:</b> chia theo thời gian. Train = 8 tháng đầu, test = 2 tháng cuối. Chi tiết ở bài <b>Chia tập</b>.</p>

  <h3>3 · Rò rỉ tiền xử lý — <code>fit</code> trên toàn bộ dữ liệu</h3>
  <div class="ds-code"><i># ✗ SAI — μ, σ đã nhìn thấy tập test</i>
X = StandardScaler().fit_transform(X_all)
X_train, X_test = train_test_split(X)

<i># ✓ ĐÚNG — chia trước, và để Pipeline lo phần còn lại</i>
X_train, X_test = train_test_split(X_all)
pipe = Pipeline([("scale", StandardScaler()), ("model", LGBMClassifier())])
pipe.fit(X_train, y_train)</div>
  <p>Áp dụng cho <b>mọi</b> thứ học tham số: scaler, imputer, one-hot, PCA, target encoding, chọn feature.</p>

  <h3>4 · Rò rỉ nhóm — cùng một thực thể ở hai bên</h3>
  <p>Một khách hàng có 200 giao dịch. Chia ngẫu nhiên → 160 ở train, 40 ở test. Mô hình học thuộc thói quen của chính khách đó rồi được chấm điểm trên chính khách đó. Điểm cao giả tạo, và sẽ sụp khi gặp khách mới.</p>
  <p><b>Cách chữa:</b> <code>GroupKFold</code> hoặc <code>GroupShuffleSplit</code> với <code>groups=df["card_id"]</code>.</p>

  <h3>5 · Rò rỉ qua feature tổng hợp</h3>
  <p>Đây là kiểu tinh vi nhất, và nó ẩn ngay trong đoạn code "trung bình theo khách" mà bạn thấy ở bài pandas:</p>
  <div class="ds-code"><i># ✗ SAI — trung bình này gồm cả giao dịch TƯƠNG LAI của khách đó</i>
df["avg_amt"] = df.groupby("card_id")["amount"].transform("mean")

<i># ✓ ĐÚNG — chỉ dùng dữ liệu trước thời điểm hiện tại</i>
df = df.sort_values("ts")
df["avg_amt"] = (df.groupby("card_id")["amount"]
                   .transform(<b>lambda</b> s: s.shift(1).expanding().mean()))</div>
  <p><code>.shift(1)</code> là chi tiết sống còn: nó đẩy chuỗi xuống một dòng để giao dịch hiện tại <b>không tự tính vào trung bình của chính nó</b>.</p>

  <h3>6 · Rò rỉ qua chính bạn</h3>
  <p>Bạn thử 30 cấu hình, mỗi lần nhìn điểm trên tập test, giữ cái tốt nhất. Tập test đã hết "chưa từng thấy" — bạn đã dùng nó để chọn mô hình, tức là nó đã thành validation. Con số cuối cùng bị thổi phồng.</p>
  <p><b>Cách chữa:</b> ba tập. Train để học, validation để chọn, test để báo cáo — và <b>chỉ chạm vào test đúng một lần</b>, khi mọi quyết định đã chốt.</p>

  <h2>Quy trình kiểm tra rò rỉ — chạy trước khi tin bất kỳ kết quả nào</h2>

    <li>Với mỗi cột trong top 10, hỏi: <i>"giá trị này có sẵn tại thời điểm dự đoán không?"</i></li>
    <li>Mọi phép <code>fit</code> đều nằm trong Pipeline chứ?</li>
    <li>Chia tập có tôn trọng <b>thời gian</b> và <b>nhóm</b> không?</li>
    <li>Bạn đã nhìn tập test bao nhiêu lần rồi?</li>

<template data-node="d-split">
  <p>Chia tập là nơi bạn <b>tự tạo ra bài thi cho mô hình</b>. Chia sai thì mọi con số về sau đều vô nghĩa — mô hình đang thi một đề dễ hơn thực tế.</p>

  <h2>Ba tập, ba vai trò khác nhau</h2>
  <table>
    <tr><th>Tập</th><th>Dùng để</th><th>Được nhìn bao nhiêu lần</th></tr>
    <tr><td><b>Train</b> (~60–70%)</td><td>Mô hình học tham số</td><td>Vô số</td></tr>
    <tr><td><b>Validation</b> (~15–20%)</td><td>Bạn chọn: mô hình nào, siêu tham số nào, feature nào, ngưỡng nào</td><td>Nhiều lần — đó là việc của nó</td></tr>
    <tr><td><b>Test</b> (~15–20%)</td><td>Báo cáo con số cuối cùng</td><td><b>Đúng một lần</b>, sau khi đã chốt mọi thứ</td></tr>
  </table>
  <p>Nếu bạn chỉ có train/test và dùng test để tune, con số cuối của bạn <b>bị thổi phồng</b> và bạn không biết phồng bao nhiêu. Đây là lỗi phổ biến nhất trong luận văn thạc sĩ.</p>

  <h2>Chọn cách chia — cây quyết định 3 câu hỏi</h2>
  <div class="ds-code">Dữ liệu có yếu tố thời gian, và mô hình sẽ chạy trên dữ liệu tương lai?
├── CÓ  → chia theo THỜI GIAN                (TimeSeriesSplit)
└── KHÔNG
     ├── Có thực thể lặp lại (khách, thiết bị, bệnh nhân)?
     │    ├── CÓ  → chia theo NHÓM           (GroupKFold)
     │    └── KHÔNG
     │         └── Nhãn lệch nặng?
     │              ├── CÓ  → chia PHÂN TẦNG (StratifiedKFold)
     │              └── KHÔNG → chia ngẫu nhiên thường</div>
  <p><b>Với bài toán gian lận của bạn, câu trả lời là "CÓ" ở câu đầu tiên.</b> Kẻ gian đổi chiêu theo thời gian; mô hình phải chứng minh nó dự đoán được tương lai, không phải nội suy quá khứ.</p>

  <h2>Code cho từng trường hợp</h2>
  <h3>Chia theo thời gian — cách bạn sẽ dùng</h3>
  <div class="ds-code">df = df.sort_values("ts")
n = len(df)
train = df.iloc[: int(n*0.70)]
valid = df.iloc[int(n*0.70) : int(n*0.85)]
test  = df.iloc[int(n*0.85) :]

print(f"train: {train.ts.min():%Y-%m-%d} → {train.ts.max():%Y-%m-%d}")
print(f"test : {test.ts.min():%Y-%m-%d} → {test.ts.max():%Y-%m-%d}")</div>
  <p>In ra khoảng thời gian của từng tập và <b>đưa dòng in đó vào luận văn</b>. Nó chứng minh bạn không trộn tương lai vào quá khứ.</p>

  <h3>Cross-validation theo thời gian (walk-forward)</h3>
  <div class="ds-code"><b>from</b> sklearn.model_selection <b>import</b> TimeSeriesSplit
tscv = TimeSeriesSplit(n_splits=5)
<b>for</b> tr_idx, va_idx <b>in</b> tscv.split(X):
    ...   <i># fold 1: train [0:100]   valid [100:200]</i>
          <i># fold 2: train [0:200]   valid [200:300]  ← train lớn dần</i></div>
  <p>Tập train lớn dần theo từng fold, và validation <b>luôn nằm sau</b> train về thời gian. Đây là mô phỏng trung thực cách hệ thống thật hoạt động: bạn train trên mọi thứ đã biết và dự đoán ngày mai.</p>

  <p class="ds-more"><button class="ds-aside" data-aside="x-split-other">Hai cách chia khác: phân tầng &amp; theo nhóm</button></p>
  <h2>Kiểm tra sau khi chia — bốn dòng, làm mỗi lần</h2>
  <div class="ds-code"><b>assert</b> train.ts.max() &lt; test.ts.min(), "rò rỉ thời gian!"
<b>assert</b> <b>not</b> set(train.card_id) &amp; set(test.card_id), "rò rỉ nhóm!"   <i># nếu chia theo nhóm</i>
print(train.Class.mean(), test.Class.mean())   <i># tỉ lệ dương có tương đương không</i>
print(len(train), len(valid), len(test))</div>
  <p>Dùng <code>assert</code> chứ không phải nhìn bằng mắt. Nó sẽ bắt lỗi vào ngày bạn refactor code và vô tình bỏ mất <code>sort_values</code>.</p>

<template data-node="f-what">
  <p>Bạn nói bạn <i>hiểu khái niệm feature engineering nhưng không biết khi làm thật thì thao tác thế nào, trên tool gì</i>. Bài này trả lời đúng câu đó, bằng những thứ cụ thể: file nào, hàm nào, chạy lúc nào.</p>

  <h2>Định nghĩa bằng một câu và một ví dụ</h2>
  <p><b>Feature engineering là viết code biến các cột thô thành các cột số mà mô hình có thể học được — và làm sao để đúng đoạn code đó chạy lại y hệt lúc dự đoán thật.</b></p>
  <p>Ví dụ cụ thể nhất: dữ liệu thô có cột <code>timestamp = "2026-03-14 23:47:12"</code>. Mô hình không hiểu chuỗi này. Feature engineering biến nó thành:</p>
  <table>
    <tr><th>Cột thô</th><th>Cột sinh ra</th><th>Vì sao</th></tr>
    <tr><td rowspan="4"><code>timestamp</code></td><td><code>hour_sin</code>, <code>hour_cos</code></td><td>Để 23h và 0h gần nhau</td></tr>
    <tr><td><code>is_weekend</code></td><td>Hành vi cuối tuần khác ngày thường</td></tr>
    <tr><td><code>secs_since_last_tx</code></td><td>Quẹt liên tiếp 3 giây là tín hiệu mạnh</td></tr>
    <tr><td><code>n_tx_last_1h</code></td><td>Tần suất bất thường</td></tr>
  </table>
  <p>Một cột thành bốn cột có ý nghĩa. Đó là feature engineering. Không có phép màu nào — chỉ là <b>bạn biết điều gì đáng chú ý trong lĩnh vực này, và bạn viết nó ra thành cột</b>.</p>

  <h2>Nó nằm ở đâu trong quy trình, và chạy mấy lần</h2>
  <p>Đây là chỗ hay gây lẫn nhất. Feature engineering <b>chạy hai lần trong đời</b>:</p>
  <ol>
    <li><b>Lúc huấn luyện</b> — trên hàng trăm nghìn dòng, trong notebook hoặc <code>train.py</code>.</li>
    <li><b>Lúc dự đoán thật</b> — trên <b>một</b> dòng, bên trong API, mỗi lần có giao dịch.</li>
  </ol>
  <p>Và đây là điều then chốt: <b>hai lần đó phải cho ra kết quả giống hệt nhau.</b> Nếu lúc train bạn scale bằng $\mu = 250.000$ mà lúc chạy thật API tính lại $\mu$ từ dữ liệu hôm nay ra $310.000$, mô hình nhận đầu vào sai và dự đoán sai — âm thầm, không báo lỗi. Lỗi này có tên: <b>training/serving skew</b>.</p>
  <p>Cách duy nhất chắc chắn tránh được: gói toàn bộ feature engineering vào một <code>Pipeline</code> của sklearn, lưu nó chung với mô hình vào một file, và API nạp đúng file đó. Bài <b>★ Pipeline + ColumnTransformer</b> làm việc này.</p>

  <h2>Ba loại thao tác — và chỗ để chúng</h2>
  <table>
    <tr><th>Loại</th><th>Ví dụ</th><th>Viết ở đâu</th></tr>
    <tr><td><b>A. Không học tham số</b><br>(chỉ phụ thuộc dòng hiện tại)</td><td>sin/cos của giờ, log số tiền, tỉ lệ giữa hai cột</td><td>Hàm thuần trong <code>src/features.py</code>, bọc bằng <code>FunctionTransformer</code></td></tr>
    <tr><td><b>B. Học tham số từ train</b></td><td>StandardScaler (μ, σ), OneHotEncoder (danh sách hạng mục), target encoding</td><td><b>Bắt buộc</b> nằm trong <code>Pipeline</code></td></tr>
    <tr><td><b>C. Cần lịch sử</b></td><td>Số giao dịch trong 1h qua, trung bình của khách tới trước thời điểm này</td><td>Tính trước bằng pandas theo thời gian; lúc chạy thật cần một kho trạng thái (Redis / bảng aggregates)</td></tr>
  </table>
  <p>Loại C là loại khó nhất về mặt kỹ thuật và cũng là loại cho tín hiệu mạnh nhất trong bài toán gian lận. Bài <b>Biến theo thời gian</b> nói riêng về nó.</p>

  <h2>Một buổi làm feature engineering thật diễn ra thế nào</h2>
  <p>Để bạn hình dung nhịp làm việc, không phải lý thuyết:</p>
  <div class="ds-code">1. Mở notebook, load dữ liệu đã sạch, load pipeline hiện tại
2. Chạy baseline → ghi lại: PR-AUC = 0,367
3. Nghĩ MỘT giả thuyết bằng lời:
   "Gian lận hay xảy ra lúc rạng sáng, nhưng mô hình đang
    coi 23h và 0h là hai đầu xa nhau."
4. Viết 5 dòng pandas tạo hour_sin, hour_cos
5. Chạy lại → PR-AUC = 0,384. Ghi vào bảng.
6. Giữ (vì tăng), hoặc bỏ (nếu không tăng) — rồi quay lại bước 3
7. Sau 5–10 vòng, chuyển các feature đã giữ vào src/features.py
   và gắn vào Pipeline</div>
  <p>Chú ý bước 3: <b>một giả thuyết mỗi lần, nói được bằng tiếng Việt</b>. Nếu bạn thêm 20 feature cùng lúc và điểm tăng, bạn không biết cái nào có ích — và luận văn không viết được.</p>
  <p>Bảng ở bước 5 chính là <b>bảng ablation</b> của luận văn. Ghi nó từ ngày đầu, đừng dựng lại từ trí nhớ vào ngày cuối.</p>

  <h2>Vì sao bước này quan trọng hơn chọn mô hình</h2>
  <p>Đổi từ LogisticRegression sang LightGBM có thể cho bạn +0,03 AUC. Thêm một nhóm feature về tần suất giao dịch có thể cho +0,12. Trong dữ liệu bảng, <b>khoảng cách giữa các mô hình nhỏ hơn nhiều so với khoảng cách giữa các bộ feature</b>.</p>
  <p>Đó cũng là lý do trong luận văn, phần đóng góp mới của bạn <b>nên</b> nằm ở feature engineering hoặc cách đánh giá — chứ không phải ở "tôi thử thêm một mô hình nữa".</p>
