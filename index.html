<!doctype html>
<!-- =============================================================================
     TRANG CHỦ — mục lục mọi trang trong repo. Luật: .claude/rules/home.md.

     Tự chứa (REPO-003): <style> riêng, prefix `ix-`, không link web-builder.css,
     không mặt chữ icon. Nội dung ở data/collection.json (REPO-001): khu → section →
     mục. Trang đọc bằng fetch nên phải chạy qua HTTP (`python3 -m http.server`).

     Màu: đen, trắng, một xanh lá. Xanh chỉ dùng cho thứ cần mắt tìm: khu đang học,
     số section, chip phím khi rê, focus.
     ========================================================================== -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" id="theme-color" content="#f5f6f3" />
    <title>vudat081299 · Index</title>
    <meta name="description" content="Keep moving forward: graduate data science, machine learning, science, thinking, books, cooking and a few tools." />

    <script>
      /* Theme trước lần vẽ đầu, để nền tối không chớp trắng. Khoá 'hub-theme' dùng chung
         với các trang khác trong repo. Chưa chọn thì theo hệ điều hành. */
      (function () {
        var v;
        try { v = localStorage.getItem('hub-theme'); } catch (e) {}
        var dark = v ? v === 'dark'
                     : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
        var m = document.getElementById('theme-color');
        if (m) m.setAttribute('content', dark ? '#090b0a' : '#f5f6f3');
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Ba mặt chữ, cả ba có subset vietnamese (U+1EA0-1EF9). Chỉ xin đúng nét dùng:
         Space Grotesk 600 cho tiêu đề, Be Vietnam Pro 400/600 cho chữ, JetBrains Mono 500
         cho chip phím và nhãn. -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Be+Vietnam+Pro:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />

    <style>
      /* ==========================================================================
         TOKEN — đổi màu ở đây, đừng rải vào từng luật.
         Tương phản đo bằng tools/smoke-index.js (≥ 4,5:1 trên nền thật của từng chữ).
         ========================================================================== */
      :root {
        --bg:        #f5f6f3;
        --surface:   #ffffff;
        --surface-2: #eceee9;
        --ink:       #0b0f0c;
        --ink-2:     #464e48;
        --ink-3:     #5b645e;
        --line:      #d6dad4;
        --line-2:    #e6e9e4;
        --green:     #0a7a3c;              /* chữ xanh trên nền sáng */
        --green-hi:  #16a34a;              /* chấm, vạch — không dùng cho chữ */
        --green-soft: rgba(22, 163, 74, .09);
        --green-line: rgba(10, 122, 60, .32);
        --on-green:  #ffffff;
        --scrim:     rgba(11, 15, 12, .38);
        --shadow:    0 24px 60px -18px rgba(11, 15, 12, .35), 0 2px 6px rgba(11, 15, 12, .06);

        --wrap: 1240px;
        --pad: 32px;
        --bar-h: 64px;

        --display: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --sans:    'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --mono:    'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      html.dark {
        --bg:        #090b0a;
        --surface:   #101412;
        --surface-2: #171c19;
        --ink:       #eef2ed;
        --ink-2:     #a9b3ac;
        --ink-3:     #8d9891;
        --line:      #262d29;
        --line-2:    #1a201c;
        --green:     #5be08f;
        --green-hi:  #5be08f;
        --green-soft: rgba(91, 224, 143, .09);
        --green-line: rgba(91, 224, 143, .30);
        --on-green:  #04130a;
        --scrim:     rgba(0, 0, 0, .62);
        --shadow:    0 30px 80px -20px rgba(0, 0, 0, .9), 0 0 0 1px rgba(255, 255, 255, .02);
      }

      /* ==========================================================================
         NỀN
         ========================================================================== */
      *, *::before, *::after { box-sizing: border-box; }
      /* Lọc bằng thuộc tính `hidden`; !important vì nhiều phần tử khai display riêng. */
      [hidden] { display: none !important; }

      html { -webkit-text-size-adjust: 100%; }
      @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
      html.ix-locked { overflow: hidden; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 400 15px/1.55 var(--sans);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      a { color: inherit; }
      ::selection { background: var(--green-hi); color: #fff; }
      :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; border-radius: 4px; }

      .ix-wrap { width: 100%; max-width: var(--wrap); margin: 0 auto; padding: 0 var(--pad); }
      .ix-sr {
        position: absolute; width: 1px; height: 1px; overflow: hidden;
        clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
      }
      kbd {
        font: 500 11px/1 var(--mono); color: var(--ink-2);
        background: var(--surface); border: 1px solid var(--line); border-bottom-width: 2px;
        border-radius: 5px; padding: 2px 5px;
      }

      /* ==========================================================================
         THANH TRÊN — dính ở máy tính; ở điện thoại chỉ thanh chip section dính.
         ========================================================================== */
      .ix-bar {
        position: sticky; top: 0; z-index: 30;
        background: color-mix(in srgb, var(--bg) 84%, transparent);
        backdrop-filter: saturate(160%) blur(12px);
        -webkit-backdrop-filter: saturate(160%) blur(12px);
        border-bottom: 1px solid var(--line);
      }
      @supports not (backdrop-filter: blur(1px)) { .ix-bar { background: var(--bg); } }
      .ix-bar__in { display: flex; align-items: center; gap: 14px; min-height: var(--bar-h); }

      .ix-brand {
        display: inline-flex; align-items: center; gap: 10px; flex: none;
        font: 500 12.5px/1 var(--mono); text-decoration: none; color: var(--ink);
        min-height: 44px;
      }
      .ix-brand__mark {
        position: relative; width: 24px; height: 24px; flex: none;
        border-radius: 7px; background: var(--ink);
      }
      .ix-brand__mark::after {
        content: ''; position: absolute; left: 6px; bottom: 6px; width: 9px; height: 3px;
        border-radius: 1px; background: var(--green-hi);
      }
      @media (prefers-reduced-motion: no-preference) {
        .ix-brand__mark::after { animation: ix-blink 1.1s steps(1) 0s 5; }
      }
      @keyframes ix-blink { 50% { opacity: 0; } }
      .ix-brand span { color: var(--ink-3); }
      .ix-brand b { font-weight: 500; color: var(--ink); }

      .ix-search {
        position: relative; display: flex; align-items: center; gap: 14px;
        flex: 1 1 320px; max-width: 600px; min-width: 0; margin-left: auto;
      }
      .ix-search__box { position: relative; display: flex; flex: 1 1 auto; min-width: 0; }
      .ix-search svg {
        position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
        width: 16px; height: 16px; color: var(--ink-3); pointer-events: none;
      }
      .ix-search input {
        width: 100%; min-width: 0; height: 42px;
        font: 400 14.5px/1.3 var(--sans); color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--line); border-radius: 11px;
        padding: 0 40px 0 38px;
        -webkit-appearance: none; appearance: none;
        transition: border-color .15s ease, box-shadow .15s ease;
      }
      .ix-search input::placeholder { color: var(--ink-3); }
      .ix-search input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
      .ix-search input::-webkit-search-cancel-button { -webkit-appearance: none; }
      .ix-search kbd { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); pointer-events: none; }
      .ix-search input:focus + kbd, .ix-search input:not(:placeholder-shown) + kbd { display: none; }

      .ix-count {
        flex: none; font: 500 11.5px/1 var(--mono); color: var(--ink-3);
        white-space: nowrap; font-variant-numeric: tabular-nums;
      }
      .ix-iconbtn {
        flex: none; display: inline-grid; place-items: center;
        width: 42px; height: 42px; padding: 0;
        color: var(--ink-2); background: var(--surface);
        border: 1px solid var(--line); border-radius: 11px; cursor: pointer;
        transition: color .15s ease, border-color .15s ease;
      }
      .ix-iconbtn:hover { color: var(--ink); border-color: var(--ink-3); }
      .ix-iconbtn svg { width: 18px; height: 18px; }
      html:not(.dark) .ix-icon--moon, html.dark .ix-icon--sun { display: none; }

      /* ==========================================================================
         ĐẦU TRANG — tiêu đề bên trái, mục lục theo khu bên phải (máy tính).
         ========================================================================== */
      .ix-main {
        display: grid; grid-template-columns: minmax(0, 1fr) auto;
        column-gap: 56px; align-items: end;
      }
      .ix-hero { padding: 40px 0 6px; min-width: 0; }
      .ix-eyebrow {
        display: flex; align-items: center; gap: 10px;
        margin: 0 0 16px; font: 500 11.5px/1 var(--mono);
        letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2);
      }
      .ix-eyebrow::before { content: ''; width: 18px; height: 2px; background: var(--green-hi); border-radius: 2px; }
      .ix-hero h1 {
        margin: 0; max-width: 15ch;
        font: 600 clamp(32px, 4.6vw, 54px)/1.02 var(--display);
        letter-spacing: -.035em; overflow-wrap: break-word;
      }
      .ix-hero h1 em { font-style: normal; color: var(--green); }
      .ix-lede { margin: 16px 0 0; max-width: 52ch; font-size: 15px; line-height: 1.6; color: var(--ink-2); }

      /* ---- mục lục --------------------------------------------------------------
         Máy tính: ba cột nhỏ, mỗi khu một cột. Điện thoại: thanh chip dính, cuộn ngang. */
      .ix-toc {
        display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, auto);
        gap: 0 34px; padding-bottom: 6px;
      }
      .ix-toc__z { display: flex; flex-direction: column; min-width: 0; }
      .ix-toc__zl {
        padding-bottom: 8px; margin-bottom: 4px; border-bottom: 1px solid var(--line);
        font: 500 10.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
        color: var(--ink-3); white-space: nowrap;
      }
      div.ix-toc__z:first-of-type .ix-toc__zl { color: var(--green); border-bottom-color: var(--green-line); }
      .ix-toc a {
        display: flex; align-items: baseline; gap: 10px;
        padding: 5px 0; text-decoration: none; white-space: nowrap;
      }
      .ix-toc__n { font: 500 10.5px/1 var(--mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
      .ix-toc__l { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
      .ix-toc__c { margin-left: auto; padding-left: 14px; font: 500 10.5px/1 var(--mono); color: var(--ink-3); }
      .ix-toc a:hover .ix-toc__l { color: var(--green); }
      .ix-toc a.is-active .ix-toc__n { color: var(--green); }
      .ix-jumpq { display: none; }

      /* ==========================================================================
         KHU — nhóm các section. Khu đầu (đang học) được tô nổi.
         ========================================================================== */
      #sections { grid-column: 1 / -1; }
      .ix-zone { margin-top: 44px; scroll-margin-top: calc(var(--bar-h) + 16px); }
      .ix-zone__head { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; min-width: 0; }
      .ix-zone__t {
        margin: 0; flex: none;
        font: 500 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink);
      }
      .ix-zone__d { margin: 0; min-width: 0; font-size: 13px; line-height: 1.4; color: var(--ink-3); }
      .ix-zone__head::after { content: ''; flex: 1 1 24px; height: 1px; background: var(--line); }

      .ix-zone__grid {
        display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 30px 40px; align-items: start;
      }

      /* Khu đầu: khung viền xanh, ánh xanh rất nhẹ ở góc. */
      .ix-zone:first-child {
        margin-top: 36px; padding: 22px 26px 14px;
        border: 1px solid var(--green-line); border-radius: 20px;
        background:
          radial-gradient(120% 90% at 0% 0%, var(--green-soft), transparent 60%),
          var(--surface);
      }
      .ix-zone:first-child .ix-zone__t { color: var(--green); display: inline-flex; align-items: center; gap: 9px; }
      .ix-zone:first-child .ix-zone__t::before {
        content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--green-hi);
        box-shadow: 0 0 0 0 var(--green-line);
      }
      @media (prefers-reduced-motion: no-preference) {
        .ix-zone:first-child .ix-zone__t::before { animation: ix-pulse 2.4s ease-out infinite; }
      }
      @keyframes ix-pulse {
        0% { box-shadow: 0 0 0 0 var(--green-line); }
        70%, 100% { box-shadow: 0 0 0 7px transparent; }
      }
      .ix-zone:first-child .ix-zone__head::after { background: var(--green-line); }

      /* ==========================================================================
         SECTION — không đóng khung: một vạch trên, số, tên, đếm.
         ========================================================================== */
      .ix-sec { min-width: 0; scroll-margin-top: calc(var(--bar-h) + 16px); }
      .ix-sec__head {
        display: flex; align-items: baseline; gap: 10px;
        padding-top: 12px; border-top: 2px solid var(--ink);
      }
      .ix-zone:first-child .ix-sec__head { border-top-color: var(--green-hi); }
      .ix-sec__n { flex: none; font: 500 11px/1 var(--mono); color: var(--green); font-variant-numeric: tabular-nums; }
      .ix-sec__t {
        margin: 0; min-width: 0; overflow-wrap: break-word;
        font: 600 19px/1.2 var(--display); letter-spacing: -.015em;
      }
      .ix-sec__c { margin-left: auto; flex: none; font: 500 11px/1 var(--mono); color: var(--ink-3); }
      .ix-sec__desc { margin: 5px 0 8px; font-size: 12.5px; line-height: 1.45; color: var(--ink-2); }

      /* Section môn học rộng hai cột ở màn rộng, các môn chảy thành hai cột bên trong. */
      @media (min-width: 1100px) {
        .ix-sec[data-kind="subjects"] { grid-column: span 2; }
        .ix-sec[data-kind="subjects"] .ix-sec__body { columns: 2; column-gap: 40px; }
      }

      /* ---- một hàng ------------------------------------------------------------- */
      .ix-row {
        position: relative; isolation: isolate;
        display: grid; grid-template-columns: 24px minmax(0, 1fr);
        column-gap: 12px; align-items: start;
        min-height: 44px; padding: 9px 0;
        border-top: 1px solid var(--line-2);
        text-decoration: none;
      }
      .ix-row::before {
        content: ''; position: absolute; z-index: -1; inset: 0 -10px;
        border-radius: 9px; background: var(--green-soft); opacity: 0;
        transition: opacity .12s ease;
      }
      .ix-row:hover::before, .ix-row:focus-visible::before { opacity: 1; }
      .ix-row:focus-visible { outline-offset: 0; }

      .ix-key {
        grid-row: span 2; margin-top: 1px;
        display: grid; place-items: center; width: 24px; height: 22px;
        font: 500 11px/1 var(--mono); color: var(--ink-2);
        background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px;
        transition: background-color .12s ease, color .12s ease, border-color .12s ease;
      }
      /* Mục không có phím: giữ chỗ để chữ mọi hàng thẳng cột, không vẽ chip rỗng. */
      .ix-key--none { visibility: hidden; }
      .ix-row:hover .ix-key, .ix-row:focus-visible .ix-key {
        background: var(--green); border-color: var(--green); color: var(--on-green);
      }
      .ix-row__t { min-width: 0; font-size: 14px; font-weight: 600; line-height: 1.35; }
      /* Rộng 0: mũi tên ẩn không được đẩy chữ xuống dòng, chỉ tràn ra sau chữ. */
      .ix-row__go {
        display: inline-block; width: 0; padding-left: 6px; white-space: nowrap; color: var(--green);
        opacity: 0; transform: translateX(-4px);
        transition: opacity .12s ease, transform .12s ease;
      }
      .ix-row:hover .ix-row__go, .ix-row:focus-visible .ix-row__go { opacity: 1; transform: none; }
      .ix-row__d { grid-column: 2; min-width: 0; font-size: 12.5px; line-height: 1.45; color: var(--ink-2); }

      /* ---- môn học (kind: subjects) -------------------------------------------- */
      .ix-subj { break-inside: avoid; padding-top: 8px; }
      .ix-subj__head {
        display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
        padding: 4px 0 6px;
      }
      .ix-subj__t {
        font: 500 10.5px/1.3 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink);
      }
      .ix-subj__m { font-size: 12px; line-height: 1.3; color: var(--ink-3); }

      /* ==========================================================================
         DANH SÁCH ẨN — máy tính: bảng nổi ở đáy khung nhìn; điện thoại: bottom sheet.
         Bật/tắt bằng ⇧? hoặc gõ ? vào ô tìm kiếm (xem script).
         ========================================================================== */
      .ix-scrim {
        position: fixed; inset: 0; z-index: 40;
        background: var(--scrim); touch-action: none;
        -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
      }
      .ix-hold {
        position: fixed; z-index: 41; left: 0; right: 0; bottom: 24px; margin: 0 auto;
        width: min(980px, calc(100vw - 2 * var(--pad)));
        max-height: calc(100vh - 48px);
        display: flex; flex-direction: column;
        background: var(--surface); color: var(--ink);
        border: 1px solid var(--line); border-radius: 18px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .ix-hold:focus { outline: none; }
      .ix-hold__bar {
        position: relative; flex: none;
        display: flex; align-items: center; gap: 12px;
        padding: 14px 14px 12px 22px; border-bottom: 1px solid var(--line-2);
      }
      .ix-hold__grab { display: none; }
      .ix-hold__t {
        margin: 0; display: inline-flex; align-items: center; gap: 9px;
        font: 500 11.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink);
      }
      .ix-hold__t::before {
        content: ''; width: 8px; height: 8px; border-radius: 2px;
        border: 1.5px solid var(--green-hi);
      }
      .ix-hold__hint { margin: 0 0 0 auto; font-size: 12px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
      .ix-hold__x {
        flex: none; display: inline-grid; place-items: center;
        width: 44px; height: 44px; padding: 0; margin: -6px 0;
        color: var(--ink-2); background: none; border: 0; border-radius: 12px; cursor: pointer;
      }
      .ix-hold__x:hover { color: var(--ink); background: var(--surface-2); }
      .ix-hold__x svg { width: 18px; height: 18px; }
      .ix-hold__body {
        overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
        display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 6px 32px; padding: 16px 22px 18px;
      }
      .ix-hold__g { min-width: 0; }
      .ix-hold__gl {
        margin: 0 0 4px; padding-bottom: 8px; border-bottom: 2px solid var(--ink);
        font: 600 15px/1.2 var(--display); letter-spacing: -.01em;
      }
      .ix-hold .ix-row { grid-template-columns: minmax(0, 1fr); }
      .ix-hold .ix-row:first-of-type { border-top: 0; }
      .ix-hold .ix-row__d { grid-column: 1; }

      @media (prefers-reduced-motion: no-preference) {
        .ix-scrim:not([hidden]) { animation: ix-fade .18s ease-out; }
        .ix-hold:not([hidden]) { animation: ix-rise .22s cubic-bezier(.2, .8, .2, 1); }
      }
      @keyframes ix-fade { from { opacity: 0; } }
      @keyframes ix-rise { from { opacity: 0; transform: translateY(18px); } }

      /* ==========================================================================
         TRẠNG THÁI RỖNG / LỖI
         ========================================================================== */
      .ix-note {
        grid-column: 1 / -1;
        margin: 40px 0 60px; padding: 30px; text-align: center;
        border: 1px dashed var(--line); border-radius: 18px;
      }
      .ix-note h2 { margin: 0 0 8px; font: 600 22px/1.2 var(--display); letter-spacing: -.01em; }
      .ix-note p { margin: 0 auto; max-width: 48ch; font-size: 14px; color: var(--ink-2); }
      .ix-note code {
        font: 500 12.5px var(--mono); background: var(--surface); border: 1px solid var(--line);
        border-radius: 5px; padding: 1px 5px;
      }
      .ix-note--bad { border-style: solid; border-color: var(--green); text-align: left; }
      .ix-note--bad p { margin: 0; max-width: 70ch; }
      .ix-btn {
        margin-top: 16px; min-height: 44px; padding: 0 18px;
        font: 600 13.5px var(--sans); color: var(--bg); background: var(--ink);
        border: 0; border-radius: 11px; cursor: pointer;
      }
      .ix-btn:hover { background: var(--green); color: var(--on-green); }

      /* ==========================================================================
         CHÂN TRANG — dựng từ chính danh sách khu/section.
         ========================================================================== */
      .ix-foot { margin-top: auto; padding: 56px 0 40px; }
      .ix-foot__in { border-top: 1px solid var(--line); padding-top: 26px; }
      .ix-foot__links { display: flex; flex-wrap: wrap; gap: 14px 48px; margin-bottom: 26px; }

    <!-- Danh sách ẩn: lớp phủ + bảng. Lớp phủ nằm NGOÀI bảng: bấm vào nó là bấm ra ngoài. -->
    <div class="ix-scrim" id="hold-scrim" hidden></div>

            <path d="M6 6l12 12M18 6 6 18" />

    <script>
      (function () {
        'use strict';

        function $(id) { return document.getElementById(id); }
        var host  = $('sections');
        var toc   = $('toc');
        var input = $('q');
        var count = $('count');
        var empty = $('empty');
        var links = $('foot-links');
        var hint  = $('hint');
        var hold  = $('hold');
        var scrim = $('hold-scrim');
        var items = [];        /* mọi hàng mở được — dùng cho phím tắt + tìm kiếm */
        var armed = false;     /* true khi collection.json có danh sách ẩn */

        function esc(t) {
          return String(t == null ? '' : t)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
        }
        function two(n) { return (n < 10 ? '0' : '') + n; }
        function each(sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }

        /* Số mục của một section: đếm từ mảng, không ai phải sửa tay. */
        function countOf(sec) {
          return sec.kind === 'subjects'
            ? sec.items.reduce(function (n, s) { return n + s.files.length; }, 0)
            : sec.items.length;
        }

        /* ------------------------------- hàng ------------------------------- */

        /* `plain`: hàng của danh sách ẩn — không data-item, nên không vào ô đếm,
           tìm kiếm hay phím tắt; không có cột chip phím. */
        function row(o, title, desc, plain) {
          var k = (o.key || '').trim();
          return '<a class="ix-row" href="' + esc(o.href) + '"' +
            (plain ? '' : ' data-item data-key="' + esc(k) + '" data-tags="' + esc(o.tags || '') + '"') + '>' +
            (plain ? '' : '<span class="ix-key' + (k ? '' : ' ix-key--none') + '" aria-hidden="true">' +
              esc(k).toUpperCase() + '</span>') +
            '<span class="ix-row__t">' + esc(title) +
              '<span class="ix-row__go" aria-hidden="true">&rarr;</span></span>' +
            '<span class="ix-row__d" lang="vi">' + esc(desc) + '</span>' +
          '</a>';
        }

        function subject(su) {
          return '<div class="ix-subj" data-subject>' +
            '<div class="ix-subj__head">' +
              '<span class="ix-subj__t">' + esc(su.title) + '</span>' +
              '<span class="ix-subj__m" lang="vi">' + esc(su.meta) + '</span>' +
            '</div>' +
            su.files.map(function (f) { return row(f, f.title, f.sub); }).join('') +
          '</div>';
        }

        function section(sec, n) {
          var body = sec.kind === 'subjects'
            ? sec.items.map(subject).join('')
            : sec.items.map(function (it) { return row(it, it.name, it.desc); }).join('');
          return '<section class="ix-sec" id="' + esc(sec.id) + '" data-section data-kind="' + esc(sec.kind) +
              '" aria-labelledby="h-' + esc(sec.id) + '">' +
            '<div class="ix-sec__head">' +
              '<span class="ix-sec__n">' + two(n) + '</span>' +
              '<h3 class="ix-sec__t" id="h-' + esc(sec.id) + '">' + esc(sec.label) + '</h3>' +
              '<span class="ix-sec__c">' + countOf(sec) + '</span>' +
            '</div>' +
            '<p class="ix-sec__desc" lang="vi">' + esc(sec.desc) + '</p>' +
            '<div class="ix-sec__body">' + body + '</div>' +
          '</section>';
        }

        /* Section đánh số liên tục qua các khu: 01…08, suy ra từ vị trí. */
        function numbered(zones) {
          var n = 0;
          return zones.map(function (z) {
            return { zone: z, secs: z.sections.map(function (s) { return { sec: s, n: ++n }; }) };
          });
        }

        function zone(Z) {
          var z = Z.zone;
          return '<section class="ix-zone" id="' + esc(z.id) + '" data-zone aria-labelledby="z-' + esc(z.id) + '">' +
            '<div class="ix-zone__head">' +
              '<h2 class="ix-zone__t" id="z-' + esc(z.id) + '">' + esc(z.label) + '</h2>' +
              '<p class="ix-zone__d" lang="vi">' + esc(z.desc) + '</p>' +
            '</div>' +
            '<div class="ix-zone__grid">' +
              Z.secs.map(function (S) { return section(S.sec, S.n); }).join('') +
            '</div>' +
          '</section>';
        }

        /* Mục lục và chân trang đọc CÙNG danh sách khu — không có bản thứ hai để quên. */
        function tocZone(Z) {
          return '<div class="ix-toc__z" data-toc-zone>' +
            '<span class="ix-toc__zl">' + esc(Z.zone.label) + '</span>' +
            Z.secs.map(function (S) {
              return '<a href="#' + esc(S.sec.id) + '" data-toc="' + esc(S.sec.id) + '">' +
                '<span class="ix-toc__n">' + two(S.n) + '</span>' +
                '<span class="ix-toc__l">' + esc(S.sec.label) + '</span>' +
                '<span class="ix-toc__c">' + countOf(S.sec) + '</span></a>';
            }).join('') +
          '</div>';
        }

        var SEARCH_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">' +
          '<circle cx="7" cy="7" r="4.6" /><path d="m10.6 10.6 3.2 3.2" stroke-linecap="round" /></svg>';

        function footZone(z) {
          return '<div class="ix-foot__z"><span class="ix-foot__zl">' + esc(z.label) + '</span>' +
            z.sections.map(function (s) {
              return '<a href="#' + esc(s.id) + '">' + esc(s.label) + '</a>';
            }).join('') +
          '</div>';
        }

        function holdGroup(g) {
          return '<div class="ix-hold__g">' +
            '<h3 class="ix-hold__gl">' + esc(g.label) + '</h3>' +
            g.items.map(function (it) { return row(it, it.name, it.desc, true); }).join('') +
          '</div>';
        }

        /* ----------------------------- tìm kiếm ----------------------------- */

        /* Tìm không phân biệt hoa thường và dấu: "hoa hoc" khớp "hoá học". `tags` là từ khoá ẩn của mục. */
        function fold(t) {
          return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd');
        }

        function filter(q) {
          q = fold((q || '').trim());
          var shown = 0;
          items.forEach(function (a) {
            var hit = !q || fold(a.textContent + ' ' + (a.getAttribute('data-tags') || '')).indexOf(q) >= 0;
            a.hidden = !hit;
            if (hit) shown++;
          });
          /* Rỗng thì ẩn cả nhóm, cả section, cả khu — và mục lục đi theo. */
          each('[data-subject]', function (g) {
            g.hidden = !g.querySelector('[data-item]:not([hidden])');
          });
          each('[data-section]', function (sec) {
            var on = !!sec.querySelector('[data-item]:not([hidden])');
            sec.hidden = !on;
            var link = toc.querySelector('[data-toc="' + sec.id + '"]');
            if (link) link.hidden = !on;
          });
          each('[data-zone]', function (z) {
            z.hidden = !z.querySelector('[data-item]:not([hidden])');
          });
          each('[data-toc-zone]', function (g) {
            g.hidden = !g.querySelector('[data-toc]:not([hidden])');
          });
          toc.hidden = !toc.querySelector('[data-toc]:not([hidden])');
          empty.hidden = shown > 0;
          count.innerHTML = q
            ? shown + ' / ' + items.length + ' pages'
            : items.length + ' pages<span class="ix-count__x"> · ' +
              document.querySelectorAll('[data-section]').length + ' sections</span>';
        }

        /* ---------------------------- nạp nội dung ---------------------------- */

        fetch('data/collection.json', { cache: 'no-cache' })
          .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status + ' khi đọc data/collection.json');
            return r.json();
          })
          .then(function (d) {
            var Z = numbered(d.zones);
            host.innerHTML  = Z.map(zone).join('');
            toc.innerHTML   = '<button class="ix-jumpq" type="button" id="jump-q" aria-label="Search">' +
                              SEARCH_ICON + '</button>' + Z.map(tocZone).join('');
            links.innerHTML = d.zones.map(footZone).join('');
            items = Array.prototype.slice.call(document.querySelectorAll('[data-item]'));
            if (d.hold && d.hold.groups && d.hold.groups.length) {
              $('hold-t').textContent = d.hold.label;
              $('hold-rows').innerHTML = d.hold.groups.map(holdGroup).join('');
              armed = true;
            }
            hint.innerHTML = 'Press <kbd>/</kbd> to search, <kbd>&crarr;</kbd> to open the first hit' +
                             ' — or the key shown on any row to open it directly.';
            filter('');
            spy();
          })
          .catch(function (err) {
            toc.hidden = true;
            host.innerHTML =
              '<div class="ix-note ix-note--bad"><h2>Không nạp được nội dung</h2><p>' +
              esc(err.message) + ' — trang này đọc <code>data/collection.json</code> bằng fetch ' +
              'nên phải chạy qua HTTP. Chạy <code>python3 -m http.server</code> ở thư mục gốc ' +
              'rồi mở lại bằng localhost.</p></div>';
            count.textContent = '';
          });

        /* --------------------- mục lục: section đang xem --------------------- */

        function spy() {
          if (!('IntersectionObserver' in window)) return;
          var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (e) {
              var link = toc.querySelector('[data-toc="' + e.target.id + '"]');
              if (!link) return;
              link.classList.toggle('is-active', e.isIntersecting);
              /* Thanh chip cuộn ngang (điện thoại): kéo chip đang xem vào tầm mắt. */
              if (e.isIntersecting && toc.scrollWidth > toc.clientWidth) {
                var left = link.offsetLeft - (toc.clientWidth - link.offsetWidth) / 2;
                toc.scrollTo({ left: Math.max(0, left), behavior: reduced() ? 'auto' : 'smooth' });
              }
            });
          }, { rootMargin: '-30% 0px -65% 0px' });
          each('[data-section]', function (s) { io.observe(s); });
        }
        function reduced() {
          return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        }

        /* ------------------------------ điều khiển ------------------------------ */

        $('theme').addEventListener('click', function () {
          var dark = document.documentElement.classList.toggle('dark');
          try { localStorage.setItem('hub-theme', dark ? 'dark' : 'light'); } catch (e) {}
          $('theme-color').setAttribute('content', dark ? '#090b0a' : '#f5f6f3');
        });

        $('clear').addEventListener('click', function () {
          input.value = ''; filter(''); input.focus();
        });

        /* Nút kính lúp ở đầu thanh chip (điện thoại): đưa về ô tìm kiếm. */
        toc.addEventListener('click', function (e) {
          if (e.target.closest && e.target.closest('#jump-q')) input.focus();
        });

        /* Danh sách ẩn: ⇧? (Shift + phím `/`) bật/tắt, thả phím vẫn hiện. Bấm lớp phủ, nút
           đóng hoặc Esc thì ẩn; blur cửa sổ và đổi tab không đóng. Dò bằng e.code: e.key đổi
           theo bố cục bàn phím. Điện thoại: gõ đúng `?` vào ô tìm kiếm thì bảng hiện, ô được
           xoá, bàn phím ảo đóng. Mở thì khoá cuộn trang phía sau. */
        var back = null;       /* phần tử giữ focus trước khi mở, để trả lại khi đóng */
        /* Khoá cuộn trang; bù bề rộng thanh cuộn để trang không giật sang ngang. */
        function lock(on) {
          var html = document.documentElement;
          var bar = window.innerWidth - html.clientWidth;
          html.classList.toggle('ix-locked', on);
          html.style.paddingRight = on && bar > 0 ? bar + 'px' : '';
        }
        function peek(on) {
          on = !!(on && armed);
          if (on === !hold.hidden) return;
          hold.hidden = !on;
          scrim.hidden = !on;
          lock(on);
          if (on) {
            var a = document.activeElement;
            back = a && a !== document.body && a.tagName !== 'INPUT' ? a : null;
            hold.scrollTop = 0;
            $('hold-rows').scrollTop = 0;
            hold.focus({ preventScroll: true });
          } else {
            if (back && document.contains(back)) back.focus({ preventScroll: true });
            else if (hold.contains(document.activeElement)) document.activeElement.blur();
            back = null;
          }
        }

        input.addEventListener('input', function () {
          if (armed && this.value.trim() === '?') {
            this.value = '';
            filter('');
            this.blur();
            peek(true);
            return;
          }
          filter(this.value);
        });

        scrim.addEventListener('click', function () { peek(false); });
        $('hold-x').addEventListener('click', function () { peek(false); });

        document.addEventListener('keydown', function (e) {
          if (e.code !== 'Slash' || !e.shiftKey || e.metaKey || e.ctrlKey || e.altKey) return;
          var t = (e.target && e.target.tagName) || '';
          if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
          if (armed) e.preventDefault();
          if (!e.repeat) peek(hold.hidden);
        });

        document.addEventListener('keydown', function (e) {
          if (e.metaKey || e.ctrlKey || e.altKey) return;
          var t = (e.target && e.target.tagName) || '';

          if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') {
            if (e.key === 'Escape') { input.value = ''; filter(''); input.blur(); }
            if (e.key === 'Enter') {
              /* ↵ mở kết quả đầu còn hiện. */
              var first = document.querySelector('[data-item]:not([hidden])');
              if (first) { e.preventDefault(); window.location.href = first.getAttribute('href'); }
            }
            return;
          }

          if (e.key === 'Escape' && !hold.hidden) { peek(false); return; }
          if (e.key === '/') { e.preventDefault(); input.focus(); input.select(); return; }

          for (var i = 0; i < items.length; i++) {
            var k = items[i].getAttribute('data-key');
            if (k && !items[i].hidden && k === e.key.toLowerCase()) {
              e.preventDefault();
              window.location.href = items[i].getAttribute('href');
              return;
            }
          }
        });
      })();
    </script>
  </body>
</html>
