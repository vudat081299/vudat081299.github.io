<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>vudat081299 · Collection</title>
    <meta name="description" content="A collection of small web pages: tools, notes and graduate course material." />

    <!-- Web Builder — the minimalist UI kit that styles the rest of the site -->
    <link rel="stylesheet" href="web-builder/web-builder.css" />

    <style>
      /* Page-local layout only — every colour / radius / shadow comes from wb-* tokens. */
      body {
        background: var(--wb-canvas); color: var(--wb-fg); margin: 0;
        font-family: var(--wb-font); -webkit-font-smoothing: antialiased;
      }

      /* crisp selection: black block / white text in light, inverts in dark */
      ::selection { background: var(--wb-fg); color: var(--wb-canvas); }
      ::-moz-selection { background: var(--wb-fg); color: var(--wb-canvas); }

      /* icons: lighter than the kit default (600) — regular weight reads calmer here */
      body { --wb-ico-weight: 400; }

      .hub { max-width: 1000px; margin: 0 auto; padding: 28px 20px 64px; }

      /* page head */
      .hub-head { padding: 10px 0 22px; border-bottom: var(--wb-bw) solid var(--wb-border); }
      .hub-eyebrow {
        font-family: var(--wb-font-mono); font-size: 11px; letter-spacing: .16em;
        text-transform: uppercase; color: var(--wb-fg-subtle); margin: 0 0 8px;
      }
      .hub-title { font-size: clamp(28px, 5vw, 40px); font-weight: 720; letter-spacing: -.02em; margin: 0; }
      .hub-sub { color: var(--wb-fg-muted); margin: 6px 0 0; font-size: 15px; }
      .hub-head__row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
      .hub-search { max-width: 280px; width: 100%; }

      /* section heading */
      .sec { margin-top: 40px; }
      .sec__head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
      .sec__ico {
        display: grid; place-items: center; width: 30px; height: 30px; flex: none;
        border-radius: var(--wb-radius-sm); background: var(--wb-surface-2);
        border: var(--wb-bw) solid var(--wb-border); color: var(--wb-fg);
      }
      .sec__ico .wb-ico { font-size: 19px; }
      .sec__label { font-size: 17px; font-weight: 640; }
      .sec__desc { color: var(--wb-fg-muted); font-size: 13px; margin: 1px 0 0; }

      /* standalone-page tiles */
      .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
      @media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (max-width: 520px) { .tiles { grid-template-columns: 1fr; } }
      .tile {
        display: flex; align-items: flex-start; gap: 12px; padding: 15px;
        text-decoration: none; color: var(--wb-fg);
      }
      .tile__ico {
        display: grid; place-items: center; width: 42px; height: 42px; flex: none;
        border-radius: var(--wb-radius); background: var(--wb-surface-2);
        border: var(--wb-bw) solid var(--wb-border);
      }
      .tile__ico .wb-ico { font-size: 23px; color: var(--wb-fg); }
      .tile__text { flex: 1 1 auto; min-width: 0; }
      /* span, không phải block — phải khai display:block, không thì tên và mô tả chạy chung một dòng */
      .tile__name { display: block; font-size: 14.5px; font-weight: 650; margin: 1px 0 0; }
      .tile__desc { display: block; font-size: 12.5px; color: var(--wb-fg-muted); margin: 3px 0 0; line-height: 1.45; }
      .kbd {
        flex: none; align-self: flex-start; font-family: var(--wb-font-mono); font-size: 11px;
        min-width: 20px; text-align: center; padding: 1px 6px; color: var(--wb-fg-muted);
        background: var(--wb-surface-2); border: var(--wb-bw) solid var(--wb-border);
        border-bottom-width: 2px; border-radius: var(--wb-radius-sm);
      }

      /* master's subject = one full-width row card */
      .subjects { display: flex; flex-direction: column; gap: 14px; }
      .subj__head { display: flex; align-items: center; gap: 12px; }
      .subj__ico {
        display: grid; place-items: center; width: 38px; height: 38px; flex: none;
        border-radius: var(--wb-radius); background: var(--wb-surface-2);
        border: var(--wb-bw) solid var(--wb-border);
      }
      .subj__ico .wb-ico { font-size: 22px; color: var(--wb-fg); }
      .subj__title { font-size: 16px; font-weight: 680; margin: 0; }
      .subj__meta { font-size: 12.5px; color: var(--wb-fg-muted); margin: 1px 0 0; }
      .subj__count { margin-left: auto; }

      .file__ico {
        display: grid; place-items: center; width: 28px; height: 28px; flex: none;
        border-radius: var(--wb-radius-sm); background: var(--wb-surface-2);
        border: var(--wb-bw) solid var(--wb-border); color: var(--wb-fg-muted);
      }
      .file__ico .wb-ico { font-size: 17px; }
      /* rows fill the card edge-to-edge; inset lives on the row so hover bleeds full width */
      .subj__files .wb-list__item { padding: 13px 18px; }
      .wb-list__item--link .wb-list__end .wb-ico { font-size: 20px; transition: transform .12s ease; }
      .wb-list__item--link:hover .wb-list__end .wb-ico { transform: translateX(2px); color: var(--wb-fg); }

      .hub-foot {
        display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
        gap: 10px; margin-top: 44px; padding-top: 18px; border-top: var(--wb-bw) solid var(--wb-border);
        color: var(--wb-fg-muted); font-size: 13px;
      }
      .hub-foot a { color: var(--wb-fg-muted); text-decoration: none; }
      .hub-foot a:hover { color: var(--wb-fg); }
      .is-hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div class="wb-navbar wb-navbar--sticky">
      <a class="wb-navbar__brand" href="index.html">
        <span class="wb-navbar__mark">V</span> vudat081299
      </a>
      <span class="wb-navbar__spacer"></span>
      <div class="wb-navbar__actions">
        <a class="wb-btn wb-btn--ghost wb-btn--sm" href="https://github.com/vudat081299" target="_blank" rel="noopener">GitHub ↗</a>
        <button class="wb-btn wb-btn--ghost wb-btn--icon" id="theme-toggle" aria-label="Toggle light / dark">
          <span class="wb-ico" id="theme-ico">dark_mode</span>
        </button>
      </div>
    </div>

    <main class="hub">
      <!-- page head -->
      <div class="hub-head">
        <div class="hub-head__row">
          <div>
            <p class="hub-eyebrow">vudat081299 / collection</p>
            <h1 class="hub-title">Collection</h1>
            <p class="hub-sub">Small web pages, tools & graduate course notes — all in one place.</p>
          </div>
          <div class="wb-input-group hub-search">
            <span class="wb-input-group__addon"><span class="wb-ico wb-ico--sm">search</span></span>
            <input class="wb-input" type="search" placeholder="Quick search…" aria-label="Search"
                   oninput="filterItems(this.value)" />
          </div>
        </div>
      </div>

      <!-- Nội dung nằm ở data/collection.json; JS dưới đây dựng section + ô từ đó.
           Sửa nội dung thì sửa file JSON, đừng viết thẳng vào đây. -->
      <div id="sections"></div>

      <footer class="hub-foot">
        <span>Press <kbd class="kbd">1</kbd>–<kbd class="kbd">9</kbd>, <kbd class="kbd">B</kbd>, <kbd class="kbd">W</kbd> to open a page.</span>
        <a href="https://github.com/vudat081299" target="_blank" rel="noopener">github.com/vudat081299 ↗</a>
      </footer>
    </main>

    <script>
      (function () {
        /* ---- theme: default light (house style), remember choice ---- */
        var root = document.documentElement;
        var ico = document.getElementById('theme-ico');
        function applyTheme(dark) {
          root.classList.toggle('dark', dark);
          if (ico) ico.textContent = dark ? 'light_mode' : 'dark_mode';
        }
        var saved = null;
        try { saved = localStorage.getItem('hub-theme'); } catch (e) {}
        applyTheme(saved === 'dark');
        var toggle = document.getElementById('theme-toggle');
        if (toggle) toggle.addEventListener('click', function () {
          var dark = !root.classList.contains('dark');
          applyTheme(dark);
          try { localStorage.setItem('hub-theme', dark ? 'dark' : 'light'); } catch (e) {}
        });

        /* ---- render nội dung từ data/collection.json ----
           Mỗi section là một khối lặp nên markup ở đây, chữ ở file JSON. Trang này
           đọc bằng fetch nên phải chạy qua HTTP — mở bằng file:// sẽ rơi vào catch. */
        var host = document.getElementById('sections');
        var items = [];

        function esc(t) {
          return String(t == null ? '' : t)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
        }

        function tile(it) {
          return '<a class="wb-card wb-card--hover tile launch-item" href="' + esc(it.href) +
            '" data-key="' + esc(it.key) + '">' +
            '<span class="tile__ico"><span class="wb-ico">' + esc(it.icon) + '</span></span>' +
            '<span class="tile__text">' +
              '<span class="tile__name">' + esc(it.name) + '</span>' +
              '<span class="tile__desc">' + esc(it.desc) + '</span>' +
            '</span>' +
            '<kbd class="kbd">' + esc(it.key).toUpperCase() + '</kbd>' +
          '</a>';
        }

        function subject(su) {
          var n = su.files.length;
          return '<div class="wb-card subject">' +
            '<div class="wb-card__head subj__head">' +
              '<span class="subj__ico"><span class="wb-ico">' + esc(su.icon) + '</span></span>' +
              '<div><h3 class="subj__title">' + esc(su.title) + '</h3>' +
              '<p class="subj__meta">' + esc(su.meta) + '</p></div>' +
              '<span class="subj__count"><span class="wb-cap wb-cap--sm">' + n +
                ' page' + (n === 1 ? '' : 's') + '</span></span>' +
            '</div>' +
            '<ul class="wb-list wb-list--flush subj__files">' +
              su.files.map(function (f) {
                return '<a class="wb-list__item wb-list__item--link launch-item" href="' +
                  esc(f.href) + '" data-key="' + esc(f.key) + '">' +
                  '<span class="file__ico"><span class="wb-ico">' + esc(f.icon) + '</span></span>' +
                  '<span class="wb-list__title">' + esc(f.title) + ' ' +
                    '<span class="wb-list__sub">' + esc(f.sub) + '</span>' +
                  '</span>' +
                  '<span class="wb-list__end"><span class="wb-ico">chevron_right</span></span>' +
                '</a>';
              }).join('') +
            '</ul>' +
          '</div>';
        }

        function section(sec) {
          var body = sec.kind === 'subjects'
            ? '<div class="subjects" id="' + esc(sec.id) + '">' + sec.items.map(subject).join('') + '</div>'
            : '<div class="tiles" id="' + esc(sec.id) + '">' + sec.items.map(tile).join('') + '</div>';
          return '<section class="sec">' +
            '<div class="sec__head">' +
              '<span class="sec__ico"><span class="wb-ico">' + esc(sec.icon) + '</span></span>' +
              '<div><div class="sec__label">' + esc(sec.label) + '</div>' +
              '<p class="sec__desc">' + esc(sec.desc) + '</p></div>' +
            '</div>' + body +
          '</section>';
        }

        fetch('data/collection.json', { cache: 'no-cache' })
          .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status + ' khi đọc data/collection.json');
            return r.json();
          })
          .then(function (d) {
            host.innerHTML = d.sections.map(section).join('');
            items = Array.prototype.slice.call(document.querySelectorAll('.launch-item[data-key]'));
          })
          .catch(function (err) {
            host.innerHTML =
              '<div class="wb-alert wb-alert--danger"><span class="wb-alert__icon">!</span>' +
              '<div class="wb-alert__body"><p class="wb-alert__title">Không nạp được nội dung</p>' +
              '<p class="wb-alert__msg">' + esc(err.message) +
              ' — trang này đọc data/collection.json bằng fetch nên phải chạy qua HTTP. ' +
              'Chạy <code>python3 -m http.server</code> ở thư mục gốc rồi mở lại.</p></div></div>';
          });

        /* ---- keyboard shortcuts ---- */
        document.addEventListener('keydown', function (e) {
          if (e.metaKey || e.ctrlKey || e.altKey) return;
          var t = (e.target && e.target.tagName) || '';
          if (t === 'INPUT' || t === 'TEXTAREA') return;
          for (var i = 0; i < items.length; i++) {
            if (items[i].getAttribute('data-key') === e.key.toLowerCase()) {
              e.preventDefault();
              window.location.href = items[i].getAttribute('href');
              return;
            }
          }
        });

        /* ---- quick search: filter tiles + subject rows, hide empty subjects ---- */
        window.filterItems = function (q) {
          q = (q || '').trim().toLowerCase();
          items.forEach(function (a) {
            var hit = a.textContent.toLowerCase().indexOf(q) >= 0;
            a.classList.toggle('is-hidden', !hit);
          });
          Array.prototype.forEach.call(document.querySelectorAll('.subject'), function (card) {
            var anyVisible = card.querySelector('.launch-item:not(.is-hidden)');
            card.classList.toggle('is-hidden', !anyVisible);
          });
        };
      })();
    </script>
  </body>
</html>
