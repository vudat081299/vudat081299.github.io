<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Web Builder — Minimalist UI kit</title>
  <!-- Top web fonts, so the Config font picker works site-wide (docs only). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Source+Sans+3:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" />
  <script>
    /* Local docs tool: load our own CSS/JS fresh each visit so edits never show
       stale (the browser otherwise caches web-builder.css / docs.css / app.js). This
       affects only the docs shell — the shipped library is still a plain file. */
    window.__v = Date.now();
    document.write('<link rel="stylesheet" href="web-builder.css?v=' + window.__v + '">');
    document.write('<link rel="stylesheet" href="docs.css?v=' + window.__v + '">');
    /* Set theme before paint to avoid a flash of the wrong mode. Modes: 'system'
       (default — follow the OS), 'light', 'dark'. */
    try {
      var s = localStorage.getItem('wb-theme');
      var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (s === 'dark' || ((s === 'system' || !s) && sysDark)) document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>
</head>
<body class="wb-app">
  <!-- .wb-app is the SHIPPED document baseline (CSS section 53): border-box, the
       font, canvas/ink colours, line-height, links that inherit. The shell, the
       bar, the rail slot and the content column are shipped too (section 52 / 37)
       — the docs dogfood the same ground an app stands on. Only .doc-* hooks
       below are docs-specific chrome. -->
  <div class="wb-shell">

    <!-- ===================== TOPBAR (full-width, on top) ================= -->
    <!-- Brand doubles as the sidebar toggle: click the W to collapse/expand the
         sidebar. The topbar spans the whole width, so the sidebar never eats it. -->
    <header class="wb-navbar wb-navbar--sticky wb-navbar--glass doc-topbar">
      <button class="doc-brand" data-side-toggle aria-label="Web Builder — show/hide the sidebar" aria-expanded="true">
        <span class="doc-brand__mark">W</span>
        <span class="doc-brand__text">
          <span class="doc-brand__name">Web Builder</span>
          <span class="doc-brand__ver">v0.6 · design system</span>
        </span>
      </button>
      <span class="wb-cap wb-cap--outline wb-cap--sm doc-topbar__cap">Minimalist UI kit</span>
      <div class="wb-navbar__spacer"></div>
      <button class="doc-search-trigger" id="searchBtn" aria-label="Search" title="Search — Ctrl/⌘K">
        <span class="wb-ico wb-ico--sm">search</span>
        <span class="doc-search-trigger__label">Search</span>
        <kbd class="doc-search-trigger__kbd">⌘K</kbd>
      </button>
      <button class="doc-icon-btn" id="configBtn" aria-label="Tweak (Config)" title="Tweak">
        <span class="wb-ico">tune</span>
      </button>
      <button class="theme-btn" id="themeBtn" title="Theme: Auto → Light → Dark" aria-label="Change theme">
        <span id="themeIcon">◐</span> <span id="themeLabel">Auto</span>
      </button>
    </header>

    <!-- ================= BODY: sidebar (left) + main (right) ============= -->
    <div class="wb-shell__body">
      <!-- Sidebar: section switcher (dropdown) on top, then the section's tree.
           .wb-shell__side gives it the sticky column + own scroll + the mobile
           off-canvas behaviour; the tree inside is docs chrome. -->
      <aside class="wb-shell__side doc-side">
        <div class="doc-secswitch-wrap" id="secswitch"><!-- section switcher, rendered by app.js --></div>
        <nav class="doc-tree" id="nav"><!-- rendered by app.js per section --></nav>
      </aside>

      <div class="wb-shell__main">
        <!-- Each page (pages/<id>.html) is loaded here by the router. -->
        <main class="wb-container wb-container--pad doc-content" id="view"></main>
        <!-- Site footer (dogfoods .wb-footer), rendered once by app.js. -->
        <div id="docfooter"></div>
      </div>
    </div>

  </div>

  <!-- Config / tweak drawer (docs-only; slides in from the right). -->
  <aside class="doc-config" id="configDrawer" aria-label="Tweak panel">
    <div class="doc-config__head">
      <div>
        <div class="doc-config__title">Tweak</div>
        <div class="doc-config__sub">Live tuning — affects this docs session only</div>
      </div>
      <button class="wb-close" data-config-close aria-label="Close"></button>
    </div>
    <div class="doc-config__body"><!-- rendered by app.js --></div>
    <div class="doc-config__foot">
      <button class="wb-btn wb-btn--outline wb-btn--sm" data-config-reset>Reset</button>
      <button class="wb-btn wb-btn--sm" data-config-export>
        <span class="wb-ico wb-ico--sm">download</span> Export .md
      </button>
    </div>
  </aside>

  <!-- Search dialog (docs-only): full-text search across every page. A command-palette
       shell built on the .wb-overlay + .wb-modal primitives; the rows are doc-* chrome. -->
  <div class="wb-overlay doc-search" id="searchModal" aria-hidden="true">
    <div class="wb-modal doc-search__box" role="dialog" aria-modal="true" aria-label="Search">
      <div class="doc-search__bar">
        <span class="wb-ico doc-search__bar-ico" aria-hidden="true">search</span>
        <input class="doc-search__input" id="searchInput" type="text" role="combobox"
               aria-controls="searchResults" aria-expanded="true" aria-autocomplete="list"
               placeholder="Search every page — title &amp; body…" autocomplete="off" spellcheck="false" />
        <button class="wb-close" data-modal-close aria-label="Close"></button>
      </div>
      <div class="doc-search__results" id="searchResults" role="listbox" aria-label="Results"></div>
      <div class="doc-search__foot">
        <span class="doc-search__legend">
          <kbd>↑</kbd><kbd>↓</kbd> move&nbsp;&nbsp; <kbd>↵</kbd> open&nbsp;&nbsp; <kbd>esc</kbd> close
        </span>
        <span class="doc-search__count" id="searchCount" aria-live="polite"></span>
      </div>
    </div>
  </div>

  <script>document.write('<scr' + 'ipt src="app.js?v=' + window.__v + '"></scr' + 'ipt>');</script>
</body>
</html>
